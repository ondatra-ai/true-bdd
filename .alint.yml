# alint config — the repository-shape gate. `go run ./scripts/cmd/linters` and
# the gate table run it as `alint check`; CI runs it too.
#
# Deliberately no `extends:`. The bundled rulesets carry 22 sets of opinions
# this repository never chose; every rule here is one it did.
#
# `respect_gitignore` defaults to true, which is the semantics the shell
# version had via `git ls-files -co --exclude-standard`: an untracked file
# counts, an ignored one does not. A stray fails before it is ever committed.
version: 1

rules:
  # PR #85 ported the last Python to Go and the same commit shipped a stale
  # __pycache__/merge.cpython-314.pyc — bytecode of the file it deleted.
  # Nothing caught it. This does.
  - id: no-python
    kind: file_absent
    level: error
    paths:
      include:
        - "**/*.py"
        - "**/*.pyi"
        - "**/*.pyc"
        - "**/*.pyo"
      exclude:
        - "tests/true-bdd/fixtures/**"
    message: >-
      Python in a Go and sh repository. Port it to Go under scripts/, or
      delete it. Bytecode: rm -rf the __pycache__.

  - id: no-pycache
    kind: dir_absent
    level: error
    paths:
      include:
        - "**/__pycache__"
      exclude:
        - "tests/true-bdd/fixtures/**"
    message: "rm -rf the __pycache__ — this repository runs no Python."

  # start.sh exports .env before `claude` starts, which nothing inside a
  # session can do. Everything else is Go under scripts/, where the compiler,
  # the tests and golangci-lint can see it — which shell never was.
  - id: no-shell
    kind: file_absent
    level: error
    paths:
      include:
        - "**/*.sh"
        - "**/*.bash"
      exclude:
        - "start.sh"
        - "tests/true-bdd/fixtures/**"
    message: >-
      Shell in a Go repository. Port it to Go under scripts/ and invoke it as
      `go run ./scripts/cmd/<x>`; start.sh is the only exception.

  # Four roots and no fifth: product code, what exercises it, the tooling, and
  # what all three share. pkg/ is the fourth because Go's internal/ rule made a
  # shared package impossible otherwise. A fifth is code adrift.
  - id: go-known-roots
    kind: file_absent
    level: error
    paths:
      include:
        - "**/*.go"
      exclude:
        - "services/**"
        - "tests/**"
        - "scripts/**"
        - "pkg/**"
    message: >-
      Go outside the four roots. Move it into the one that owns it:
      services/<name>/ product code, tests/<name>/ what exercises it,
      scripts/ tooling that drives this repository, pkg/ what they share.

  # A build tag golangci-lint is not told about hides its file from every Go
  # gate. `bdd` is in run.build-tags; the platform pair is analysed on the
  # host. Anything else must be added there before it is added here.
  - id: go-build-tag-allowlist
    kind: for_each_match
    level: error
    paths:
      include:
        - "**/*.go"
    select: '^//go:build (.+)$'
    require:
      matches:
        - '^//go:build (bdd|unix|!unix)$'
    message: >-
      Build tag outside the allowlist: a tag golangci-lint is not configured
      for makes its file invisible to every Go gate. Add it to
      run.build-tags in .golangci.yaml, then to this rule.

  # pkg/ was admitted for three IO channels, then for spawning and its
  # wrappers; enginelog arrived with nothing to announce it. The allowlist IS
  # the decision record, so a fourth root cannot become a parking lot.
  - id: pkg-is-the-declared-channels
    kind: file_absent
    level: error
    paths:
      include:
        - "pkg/**/*.go"
      exclude:
        - "pkg/console/**"
        - "pkg/disk/**"
        - "pkg/logging/**"
        - "pkg/shell/**"
        - "pkg/cli/**"
        - "pkg/enginelog/**"
        - "pkg/claude/**"
        - "pkg/alint/**"
        - "pkg/testkit/**"
    message: >-
      A new package under pkg/. pkg/ is shared by tests and tooling; the engine owns its IO. It is not
      somewhere to park code: it holds the four IO channels, pkg/cli's typed
      wrappers over the fourth, enginelog, and the inbound protocols — what
      spawns US, against pkg/cli's what we spawn. Write the
      ADR and add it here, or put it in the root that owns it.

  # golangci-lint reaches the bdd tree (run.build-tags) but `generated: lax`
  # skips the generated tests; alint is tag-blind and text-level, so this is
  # the backstop for exactly those files.
  - id: go-spawn-through-shell
    kind: import_gate
    level: error
    language: go
    paths:
      include:
        - "**/*.go"
      exclude:
        - "pkg/shell/**"
        - "services/true-bdd/internal/infrastructure/shell/**"
        - "tests/true-bdd/fixtures/**"
        - "**/*_test.go"
    forbid: '^os/exec$'
    message: >-
      spawn: subprocesses go through the owning shell channel — need one? add
      a typed CLI wrapper and call that.

  - id: go-shell-through-cli
    kind: import_gate
    level: error
    language: go
    paths:
      include:
        - "**/*.go"
      exclude:
        - "pkg/shell/**"
        - "pkg/cli/**"
        # Engine shell access is confined to its shell and explicitly named wrappers.
        - "services/true-bdd/internal/infrastructure/shell/**"
        - "services/true-bdd/internal/infrastructure/cli/cli.go"
        - "services/true-bdd/internal/infrastructure/cli/claude/*.go"
        - "services/true-bdd/internal/infrastructure/cli/codex/*.go"
        - "services/true-bdd/internal/infrastructure/cli/git/*.go"
        - "services/true-bdd/internal/infrastructure/cli/gotool/*.go"
        - "services/true-bdd/internal/infrastructure/cli/spec/*.go"
        - "services/true-bdd/internal/infrastructure/cli/truebdd/*.go"
        - "tests/true-bdd/fixtures/**"
        - "**/*_test.go"
    forbid: 'true-bdd/(pkg|services/true-bdd/internal/infrastructure)/shell$'
    message: >-
      spawn: reach a binary through its owning typed CLI wrapper — add one
      if it is missing.

  # Verified: a planted `*_windows.go` calling fmt.Fprintln(os.Stdout, …) drew
  # 0 issues from golangci-lint on this host AND on CI's — a GOOS suffix hides
  # a file with no build tag for go-build-tag-allowlist to catch.
  - id: go-no-platform-filenames
    kind: file_absent
    level: error
    paths:
      include:
        - "**/*_windows.go"
        - "**/*_linux.go"
        - "**/*_darwin.go"
        - "**/*_plan9.go"
        - "**/*_js.go"
        - "**/*_wasm.go"
        - "**/*_android.go"
        - "**/*_ios.go"
        - "**/*_freebsd.go"
        - "**/*_openbsd.go"
        - "**/*_netbsd.go"
        - "**/*_solaris.go"
        - "**/*_aix.go"
        - "**/*_dragonfly.go"
        - "**/*_illumos.go"
        - "**/*_386.go"
        - "**/*_amd64.go"
        - "**/*_arm.go"
        - "**/*_arm64.go"
        - "**/*_riscv64.go"
        - "**/*_ppc64.go"
        - "**/*_s390x.go"
        - "**/*_mips.go"
        - "**/*_mips64.go"
        - "**/*_loong64.go"
      exclude:
        - "tests/true-bdd/fixtures/**"
    message: >-
      A GOOS/GOARCH filename suffix makes this file invisible to golangci-lint
      on every platform this repository builds on, with no build tag for
      go-build-tag-allowlist to catch. Use `//go:build unix` instead, or drop
      the suffix.

  # go-build-tag-allowlist selects `^//go:build`, so the pre-1.17 syntax walks
  # straight past it — and the go command still honours it.
  - id: go-no-legacy-build-tag
    kind: file_content_forbidden
    level: error
    paths:
      include:
        - "**/*.go"
      exclude:
        - "tests/true-bdd/fixtures/**"
    pattern: '^// \+build '
    message: >-
      Pre-1.17 build-tag syntax; go-build-tag-allowlist only reads //go:build.
      Use //go:build and add the tag to run.build-tags plus that rule.

  # JS belongs to the report UI's browser code and the fenced fixture trees.
  # This repository authors no other JavaScript: what it refuses is JS in
  # scripts/, services/true-bdd/ or the true-bdd tests.
  - id: js-fenced
    kind: file_absent
    level: error
    paths:
      include:
        - "**/*.js"
        - "**/*.cjs"
        - "**/*.mjs"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      exclude:
        - "pkg/testkit/reportserver/web/**"
        - "tests/true-bdd/fixtures/**"
    message: >-
      JavaScript where this repo is Go and sh. The report UI's browser code
      is the exception; everything else is Go or sh.

  # The load-bearing half: JS does not spread one file at a time, it spreads
  # through `npm install`. A manifest this repository authors means a second
  # build system has arrived, which is how the fence stops being one.
  - id: no-npm-manifests
    kind: file_absent
    level: error
    paths:
      include:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/yarn.lock"
        - "**/pnpm-lock.yaml"
        - "**/node_modules/**"
      exclude:
        - "tests/true-bdd/fixtures/**"
    message: >-
      A manifest or lockfile means a second build system. This repository
      authors none; only a fixture tree may carry one.

  # The five below fire only under a scope: alint_hook names one file and these
  # paths pick the checks. Unscoped they match nothing — `lint-all` is the
  # whole-tree half, and the gate table has one row, which runs this file.
  - id: go-lint-scoped
    kind: command
    level: error
    when: "env.TRUEBDD_SCOPE"
    timeout: 300
    paths:
      include: ["**/*.go", "go.mod", "**/go.mod", "go.sum", "**/go.sum", "go.work", "go.work.sum"]
      exclude: ["tests/true-bdd/fixtures/**", "**/testdata/**"]
    scope_filter:
      include_manifest_paths:
        source: "{{env.TRUEBDD_SCOPE | default('tmp/no-scope.txt')}}"
        extract: { lines: {} }
        # The manifest resolves before `when:` is read, so an unscoped run hits
        # the default and would warn on every bare `alint check`.
        expect_nonempty: false
    command: ["go", "run", "./scripts/cmd/linters", "golint", "--fix"]

  - id: markdown-scoped
    kind: command
    level: error
    when: "env.TRUEBDD_SCOPE"
    timeout: 120
    paths:
      include: ["**/*.md"]
      exclude: ["tests/true-bdd/fixtures/**", "**/testdata/**"]
    scope_filter:
      include_manifest_paths:
        source: "{{env.TRUEBDD_SCOPE | default('tmp/no-scope.txt')}}"
        extract: { lines: {} }
        # The manifest resolves before `when:` is read, so an unscoped run hits
        # the default and would warn on every bare `alint check`.
        expect_nonempty: false
    command: ["go", "run", "./scripts/cmd/linters", "markdown", "--fix"]

  - id: comments-scoped
    kind: command
    level: error
    when: "env.TRUEBDD_SCOPE"
    timeout: 120
    paths:
      include: ["**/*.go", "**/*.sh", "**/*.yaml", "**/*.yml"]
      exclude: ["tests/true-bdd/fixtures/**", "**/testdata/**"]
    scope_filter:
      include_manifest_paths:
        source: "{{env.TRUEBDD_SCOPE | default('tmp/no-scope.txt')}}"
        extract: { lines: {} }
        # The manifest resolves before `when:` is read, so an unscoped run hits
        # the default and would warn on every bare `alint check`.
        expect_nonempty: false
    command: ["go", "run", "./scripts/cmd/linters", "comments"]

  - id: schemas-scoped
    kind: command
    level: error
    when: "env.TRUEBDD_SCOPE"
    timeout: 120
    paths:
      include: ["**/*.yaml", "**/*.yml"]
      exclude: ["tests/true-bdd/fixtures/**", "**/testdata/**"]
    scope_filter:
      include_manifest_paths:
        source: "{{env.TRUEBDD_SCOPE | default('tmp/no-scope.txt')}}"
        extract: { lines: {} }
        # The manifest resolves before `when:` is read, so an unscoped run hits
        # the default and would warn on every bare `alint check`.
        expect_nonempty: false
    command: ["go", "run", "./scripts/cmd/linters", "schemas"]

  # A command rule fires ONCE PER MATCHING FILE (verified, 0.15.2, three-file
  # probe), so `paths: "**/*.go"` here would spawn one golangci-lint per file.
  # Hence one root sentinel; its leaf checks all three repository modules.
  - id: lint-all
    kind: command
    level: error
    timeout: 900
    paths: "go.mod"
    command: ["go", "run", "./scripts/cmd/linters", "all"]

  # go-conventions.md states this convention and said "enforced through
  # review, not lint". The tree already satisfies it, so the rule costs
  # nothing today and holds the line from here.
  - id: go-filename-snake-case
    kind: filename_case
    level: error
    paths: "**/*.go"
    case: snake
    message: "Go filenames are snake_case: GitHubService -> github_service.go."

  # The three below already pass repo-wide, and alint ships no fixer for any
  # of them (`alint fix` reports them "unfixable"). They are guards: cheap
  # because the tree already satisfies them, and they hold the line from here.
  - id: text-final-newline
    kind: final_newline
    level: error
    paths: ["**/*.go", "**/*.sh", "**/*.yaml", "**/*.yml", "**/*.md"]

  - id: text-no-trailing-whitespace
    kind: no_trailing_whitespace
    level: error
    paths: ["**/*.go", "**/*.sh", "**/*.yaml", "**/*.yml", "**/*.md"]

  - id: text-lf-line-endings
    kind: line_endings
    level: error
    paths: ["**/*.go", "**/*.sh", "**/*.yaml", "**/*.yml", "**/*.md"]
    target: lf
