# Local stack for the TrueBDD web harness: the Next.js relay+UI (`harness`) plus
# its Redis coordination backend (`redis`). `docker compose up` brings up the
# whole stack for manual/dev use — the harness on http://127.0.0.1:4517, backed
# by Redis on redis://127.0.0.1:6379. On Vercel, REDIS_URL is provisioned by the
# platform; locally the harness reaches Redis over the compose network (redis:6379).
#
# The `harness` service here is the MANUAL dev stack only. The e2e suite
# (tests/harness) uses ONLY the `redis` service from this file (`up -d redis`,
# left running across local invocations); it runs each test's harness as a host
# `node server.js` process from a cached Next standalone bundle — no per-test
# container — see tests/harness/helpers/server-controller.ts + harness-build.ts.
#
# Per-test isolation is by REDIS_KEY_PREFIX (every relay key is prefixed), NOT by
# logical-DB selection — see tests/harness/helpers/redis.ts.
services:
  redis:
    image: redis:7-alpine
    container_name: true-bdd-redis
    ports:
      # Loopback-only: this Redis has no password and holds relay coordination
      # state; the harness and e2e suite connect via redis://127.0.0.1:6379, so
      # there is no reason to publish it on every host interface.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    # Best-effort memory cap so a runaway test can't OOM the host; the relay
    # holds only coordination state (session registry, work queue, transient
    # replies) — run output / inventory stay on the host CLI.
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]

  harness:
    # Next.js relay + UI, built from harness/Dockerfile (Next standalone output).
    # Manual dev stack only — the e2e suite does NOT use this service (it runs a
    # host `node server.js` per test); `docker compose up` still exercises the
    # production image end-to-end for manual verification.
    build:
      context: ./harness
    image: true-bdd-harness:e2e
    container_name: true-bdd-harness
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Dev stack reaches Redis over the compose network. (The e2e override sets
      # its own REDIS_URL via env-file, pointing at the host-published Redis.)
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:4517:4517"
    healthcheck:
      # Node 26 ships global fetch; alpine has no curl/wget by default.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4517/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  redis-data:
