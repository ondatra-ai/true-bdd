# Yamale schema for the product document (path from `documents.product`
# in true-bdd.yaml, conventionally docs/product/product.yaml).
#
# The engine never parses the product document — it reaches the checklists
# as prompt text — so this schema is the only thing pinning its shape.
# Validate it in the host project's lint step, outside the engine:
#
#   yamale -s true-bdd/product-schema.yaml docs/product/product.yaml
#
# Every field is required. Only `roles` and the vocabulary's own lists
# must carry an entry; `goals`, `targets`, `not_goals` and `glossary` may
# be empty, but the key must be declared rather than omitted, so an empty
# list reads as a decision on the record instead of an oversight.

title: str()
description: include('description')
roles: list(include('role'), min=1)
vocabulary: include('vocabulary')
glossary: list(include('glossary_entry'))

---
description:
  summary: str()
  problem: str()
  goals: list(str())
  targets: list(str())
  not_goals: list(str())

---
# A role is a responsibility, not a persona: `name` is the closed
# vocabulary a story's `as_a:` clause must match exactly.
role:
  name: str()
  definition: str()
  primary_use_case: str()
  characteristics: list(str(), min=1)

---
# The allowed BDD language `us refine` enforces on steps and AC
# descriptions. Its preferred home is the product document; a host may
# keep the same block in architecture.yaml instead.
vocabulary:
  actions: list(include('action'), min=1)
  forbidden_qualifiers: list(str(), min=1)
  forbidden_actions: list(include('forbidden_action'), min=1)

---
action:
  name: str()
  means: str()

---
forbidden_action:
  name: str()
  reason: str()
  replacement: str()

---
glossary_entry:
  term: str()
  means: str()
