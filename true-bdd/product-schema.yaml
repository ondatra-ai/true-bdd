# Yamale schema for the product document (path from `documents.product`
# in true-bdd.yaml, conventionally docs/product/product.yaml).
#
# The engine reads two parts of it as data: `catalogue` and the role
# names, for the `D: step-phrases` check. The rest reaches the checklists
# only as prompt text, so this schema is the only thing pinning its shape.
# Validate it in the host project's lint step, outside the engine:
#
#   yamale -s true-bdd/product-schema.yaml docs/product/product.yaml
#
# Every field is required but `catalogue`, whose absence is how a host
# declines it. Only `roles` and the vocabulary's own lists must carry an
# entry; `vision` may be an empty string and `goals`, `releases`,
# `not_goals`, `glossary` and `catalogue` empty lists, but the key must be
# declared rather than omitted, so an empty value reads as a decision on
# the record instead of an oversight.

title: str()
description: include('description')
roles: list(include('role'), min=1)
vocabulary: include('vocabulary')
glossary: list(include('glossary_entry'))
catalogue: list(include('phrase'), required=False)

---
# vision: why; goals: where to; releases: the next steps, each target
# showing one arrived; not_goals: where it does not turn. A checklist may
# cite a goal's `outcome` and a not_goal; vision and releases are context.
description:
  summary: str()
  problem: str()
  vision: str()
  goals: list(include('goal'))
  releases: list(include('release'))
  not_goals: list(str())

---
goal:
  id: str()
  outcome: str()
  measure: str()

---
release:
  version: str()
  goal: str()
  due: day()
  targets: list(include('target'))

---
# A number or a yes/no, with how it is measured.
target:
  id: str()
  statement: str()
  measure: str()

---
# A role is a responsibility, not a persona: `name` is the closed
# vocabulary a story's `as_a:` clause must match exactly.
role:
  name: str()
  definition: str()
  primary_use_case: str()
  characteristics: list(str(), min=1)

---
# The words `us refine` rejects in steps and AC descriptions. The allowed
# phrases are no longer listed here: the `catalogue` states them.
vocabulary:
  forbidden_qualifiers: list(str(), min=1)
  forbidden_actions: list(include('forbidden_action'), min=1)

---
forbidden_action:
  name: str()
  reason: str()
  replacement: str()

---
glossary_entry:
  term: str()
  means: str()

---
# One step phrase: the shape a step takes, what it means, and the glossary
# words that meaning relies on. Grammar and matching: the D: checks, not yamale.
phrase:
  template: str()
  block: enum('given', 'when', 'then')
  means: str()
  terms: list(str())
