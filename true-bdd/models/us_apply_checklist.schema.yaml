$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  Question: &id001
    type: string
  Rationale: *id001
  ResultPath: *id001
  FixTemplate: *id001
  Docs:
    type: object
    additionalProperties:
      $ref: '#/$defs/doc'
  Structured:
    type: boolean
  Subject:
    type: object
    properties:
      StoryID: *id001
      StoryPath: *id001
      ACID: *id001
      LineageScenarioID: *id001
      Description: *id001
      RequirementsScratchPath: *id001
      Steps:
        $ref: '#/$defs/merged_steps'
    required:
    - StoryID
    - StoryPath
    - ACID
    - LineageScenarioID
    - Description
    - RequirementsScratchPath
    - Steps
    additionalProperties: false
required:
- Question
- Rationale
- ResultPath
- FixTemplate
- Docs
- Structured
- Subject
additionalProperties: false
$defs:
  doc:
    type: object
    properties:
      FilePath: *id001
    required:
    - FilePath
    additionalProperties: false
  merged_steps:
    type: object
    properties:
      Given:
        type: array
        items: *id001
      When:
        type: array
        items: *id001
      Then:
        type: array
        items: *id001
    required:
    - Given
    - When
    - Then
    additionalProperties: false
