# The shape of every ticket this repository files.
#
# One file because this was stated in four places that could disagree: the
# renderer's Go literals, the two filing prompts, and CLAUDE.md's prose. A
# ticket is written to be picked up cold by someone who was not in the room,
# so the headings are fixed and the wording is prose, kept here rather than
# in Go string literals.
version: 1

# Where a filed ticket lands. Both filing turns are told this, and the filed
# record is checked against it afterwards, because a prompt is an instruction
# and not a guarantee.
status: backlog

# The sentence both turns carry. It names the status above; a test pins that
# it still does, so editing one without the other fails rather than silently
# filing to the wrong queue.
status_rule: |
  Every task is created in `backlog`. Never `to do`: that is the queue
  task-loop works unattended, and a filed proposal waits for a person.

# The four headings, in order, rendered as `### ` under the ticket's `## `
# title. `body` is a Go text/template over one candidate — a deferral's prose
# is raw material for `What to change`, not its own shape (ADR 0004).
headings:

  # `Raiser`, not a hardcoded name: it credited CodeRabbit with 35 postmortem
  # tickets. The story sits here, not under a fifth heading `Headings()` would
  # demand of every Ticket filed before it; guarded, so an old row is unchanged.
  - name: Why
    body: |
      {{.Raiser}} raised this on {{.Origin}}; triage scored it **{{.Score}}/10**.

      > {{.Reason}}
      {{- with .Story}}

      {{.}}
      {{- end}}

  # Guarded: a source naming no file rendered the literal `?:?`, noise where a
  # blank is honest — and a deferral names none now that this holds its prose.
  - name: What to change
    body: |
      {{with .Location}}`{{.}}`

      {{end}}{{.Body}}

  - name: Verification
    body: |
      ```bash
      go run ./scripts/cmd/gates run
      ```

  - name: Context
    body: |
      Reviewer severity `{{.Severity}}`, source `{{.Source}}`.

      `Triage Score`, `Triage Date` and `Triage Commit` say what this was
      judged to be worth, when, and against which commit. `clickup triage`
      re-reads the oldest of those against HEAD and either refreshes this body
      or retires the ticket, so a score here is never older than its stamp.
