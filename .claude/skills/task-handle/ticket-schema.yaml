# Definition of ready for a ClickUp Ticket an agent may take unattended.
#
# Read by task-handle when it grooms a Ticket, and by anything that files one
# (scripts/clickup, the pr-merge triage). It lives here rather than under
# true-bdd/ for two reasons: the schema gate FAILS any true-bdd/*-schema.yaml
# whose key names no documents.<key>, and a Ticket has no document file to
# name; and true-bdd/ is host-facing engine config, which this workflow is not.
#
# Validated by scripts/taskhandle step 1, which reads a Ticket and names every
# requirement it does not meet. The field ids and the headings are held against
# scripts/clickup by schema_conformance_test.go, so this file and the Go cannot
# drift apart in silence.

list_id: "901523097822"

# Both must hold for the queue predicate to see a Ticket at all.
predicate:
  status: TO DO
  Good For Agent: checked

fields:
  Triage Score:
    id: 1d43d9f5-99b1-41f9-8250-cfdde01b76e0
    type: drop_down
    required: true
    range: 1-10
    purpose: orders the queue, highest first
    notes:
      - Written by scripts/triage's one rubric — consequence if left undone,
        read against the tree named by Triage Commit. Never a second scale.
      - ClickUp addresses a drop_down by POSITION, so score 7 is orderindex 6.

  # A score with no stamp cannot be re-checked: it does not say what tree it
  # was true of. The two are written together, by every path that scores.
  Triage Date:
    id: c5e6a521-c13f-4501-846c-6d46991e66a8
    type: date
    required: true
    purpose: when Triage Score was last decided; `clickup triage` walks the oldest first
    format: unix milliseconds to write; ClickUp stores the DAY
    notes:
      - Unset sorts oldest, so a Ticket filed before the field existed is
        swept before any that carries one.
      - Observed 2026-08-29 - 1788002290647 (11:18Z) came back 1787968800000,
        the workspace day start. Two sweeps in one day tie, and break on
        creation date.

  Triage Commit:
    id: 21913797-c413-4a92-bfef-dbae6e556e54
    type: short_text
    required: true
    purpose: the commit Triage Score was decided against
    format: a full 40-character sha

  Expected Changes:
    id: f0c13f08-1762-4c45-8893-6ac4413d3385
    type: text
    required: true
    purpose: the blast radius the Ticket expects, checked against the real diff before the commit
    format: glob list, one per line or comma-separated
    notes:
      - Name a directory or a pattern, never an exact file. An exact file
        forbids adding the test beside it, which is not what the check is for.
      - "./* is legitimate when the change really is repo-wide."

  Good For Agent:
    id: 52d84912-01b1-407f-a001-576ecd9ba322
    type: checkbox
    required: true
    purpose: >-
      "formally ready for automation", not "looks easy". A human's checkbox,
      set and cleared by hand: no skill writes it. task-handle only reads this
      file — an incomplete Ticket halts it, untouched.

# The description, rendered by scripts/clickup and read cold by whoever takes
# the Ticket. All four headings, in this order.
body:
  required_headings:
    - name: "### Why"
      holds: >-
        the reason the change is worth making and, on anything filed since
        triage began writing one, the story: how the code behaves today, what
        goes wrong in which situation, and which file would be rewritten.
        Older Tickets carry only the reason, and are not held to the rest
    - name: "### What to change"
      holds: file:line, concretely enough to start from
    - name: "### Verification"
      holds: a command that can be run — this is what decides DONE
    - name: "### Context"
      holds: what a person who was not in the originating conversation needs
