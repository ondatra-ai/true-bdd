# Definition of ready for a ClickUp Ticket an agent may take unattended.
#
# Read by task-handle when it grooms a Ticket, and by anything that files one
# (scripts/clickup, the pr-merge triage). It lives here rather than under
# true-bdd/ for two reasons: lint-schemas.sh FAILS any true-bdd/*-schema.yaml
# whose key names no documents.<key>, and a Ticket has no document file to
# name; and true-bdd/ is host-facing engine config, which this workflow is not.
#
# Not machine-validated today — nothing reads it but a model. That is the
# point: it is the shared definition two skills would otherwise each carry
# their own drifting copy of.

list_id: "901523097822"

# Both must hold for the queue predicate to see a Ticket at all.
predicate:
  status: TO DO
  Good For Agent: checked

fields:
  Scope:
    id: 0c9b7a64-15cb-4dc4-a0b8-6407d53fb35b
    type: labels
    required: true
    options:
      FILE: one file and whatever sits beside it — its test, its fixture
      SERVICE: one tree, e.g. services/bdd-cli/** or scripts/merge/**
      DOCUMENTATION: prose only — README, docs/for_further/**, docs/adr/**, CONTEXT.md, .claude/**/*.md
      PROJECT: not clear what this touches
    notes:
      - PROJECT is a refusal, not a size. It says the Ticket is not thought
        through, which is the worst candidate for an unattended run. Skip it.
      - DOCUMENTATION is narrower than "lives under docs/". docs/scenarios.yaml
        is the BDD spec and pulls the 62s replay; CLAUDE.md has its own gate;
        docs/architecture/** and docs/product/** are schema-validated.

  Triage Score:
    id: 1d43d9f5-99b1-41f9-8250-cfdde01b76e0
    type: drop_down
    required: true
    range: 1-10
    purpose: orders the queue, highest first

  Expected Changes:
    id: f0c13f08-1762-4c45-8893-6ac4413d3385
    type: text
    required: true
    purpose: the blast radius the Ticket expects, checked against the real diff before the commit
    format: glob list, one per line or comma-separated
    notes:
      - Name a directory or a pattern, never an exact file. An exact file
        forbids adding the test beside it, which is not what the check is for.
      - "./* is legitimate when the change really is repo-wide."

  Good For Agent:
    id: 52d84912-01b1-407f-a001-576ecd9ba322
    type: checkbox
    required: true
    purpose: >-
      "formally ready for automation", not "looks easy". Set by hand today.
      Unchecking it is how task-handle removes a Ticket from the queue without
      touching its status.

# The description, rendered by scripts/clickup and read cold by whoever takes
# the Ticket. All four headings, in this order.
body:
  required_headings:
    - name: "### Why"
      holds: the reason the change is worth making
    - name: "### What to change"
      holds: file:line, concretely enough to start from
    - name: "### Verification"
      holds: a command that can be run — this is what decides DONE
    - name: "### Context"
      holds: what a person who was not in the originating conversation needs
