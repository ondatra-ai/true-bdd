# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Until this file existed, CodeRabbit reviewed this repository on defaults.
# What that cost, measured: PR #70 drew 28 findings of which 12 were nitpicks
# buried in the review body, and PR #76 took four review rounds in two hours
# and then exhausted the hourly review quota. Most of both was noise the
# settings below remove at the source.

language: en

reviews:
  # Fewer nitpick-level comments. The findings that matter here are
  # correctness in Go and shell, not prose taste in a skill document.
  profile: chill

  # Required. `@coderabbitai approve` — the one command that unblocks a
  # merge and is NOT rate-limited — does nothing without this, and it is
  # also what makes the bot flip its own verdict to Approve once every
  # thread is resolved. `main`'s ruleset requires one approving review and
  # CodeRabbit is the only account that can give it, so this setting is
  # what keeps that requirement from being a deadlock.
  request_changes_workflow: true

  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  poem: false

  auto_review:
    # OFF, deliberately — the review is requested at merge time instead.
    #
    # The quota is ~4 PR reviews an hour on the free tier. With auto-review
    # on, every push spends one, so a branch that takes eight commits has
    # spent its whole hour before anyone asks for a verdict — which is
    # exactly how PR #76 ran out. With it off, pushes are free and the
    # single review that matters is bought when the branch is actually
    # ready to land.
    #
    # It also makes `@coderabbitai review` the correct command rather than
    # a wasted one: the docs scope that command to paused auto-review, and
    # this is that state.
    enabled: false
    drafts: false
    base_branches:
      - main

  path_filters:
    # Recorded AI cassettes: machine-written JSON on very long single
    # lines, regenerated wholesale by `-mode=record`. A human wrote none
    # of it. They are swept for secrets by scan-recordings.sh instead —
    # deterministically, exhaustively, and with no per-review file limit.
    - "!tests/bdd-cli/fixtures/*/cassettes/**"
    # Generated by `true-bdd build tests --fix` and verified by
    # regenerate-and-compare. Reviewing the output instead of the
    # generator files findings nobody can act on.
    - "!tests/**/*_test.go"
    - "!services/bdd-web/src/**"
    # Embedded base64 fonts.
    - "!docs/doc-universe.html"
    - "!tests/legacy/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!tmp/**"
    - "!bin/**"

  path_instructions:
    - path: ".claude/skills/**"
      instructions: |
        These are agent workflow scripts and their instructions, not
        product code. Review for:
        - Shell correctness that changes behaviour: unquoted expansions,
          SIGPIPE under `set -o pipefail` (a `cmd | head -n N` whose
          upstream stage dies aborts the script), command substitutions
          whose failure is swallowed, `set -e` interactions.
        - Instructions that contradict OTHER instructions in the same
          file or in a sibling skill. This is the highest-value finding
          class here and the easiest to miss.
        Do NOT report: prose style, wording, heading choices, ordering,
        or the level of detail in an explanatory comment. Long rationale
        comments are deliberate in this repository.

    - path: "services/bdd-cli/**"
      instructions: |
        Go engine code. Prioritise correctness of the checklist engine,
        the loaders, and anything that decides whether a command refuses
        to start. A silent substitution where the code should refuse is
        always a finding. Note that `internal/pkg/console` is exempt from
        forbidigo on purpose.

    - path: "tests/libraries/**"
      instructions: |
        The BDD harness. Correctness of the record/replay proxy, the
        fs-diff, and the golden comparison matters most: a bug here makes
        the whole suite lie about the engine. Cassette contents
        themselves are excluded from review.

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: "off"

chat:
  auto_reply: true
