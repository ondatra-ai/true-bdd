# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Until this file existed, CodeRabbit reviewed this repository on defaults.
# What that cost, measured: PR #70 drew 28 findings of which 12 were nitpicks
# buried in the review body, and PR #76 took four review rounds in two hours
# and then exhausted the hourly review quota. Most of both was noise the
# settings below remove at the source.

language: en

reviews:
  # Fewer nitpick-level comments. The findings that matter here are
  # correctness in Go and shell, not prose taste in a skill document.
  profile: chill

  # Required: `@coderabbitai approve` (unblocks merge, not rate-limited)
  # does nothing without this, and it's what flips the bot to Approve once
  # every thread resolves. main's ruleset needs that review — turning this off deadlocks every PR.
  request_changes_workflow: true

  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  poem: false

  auto_review:
    # OFF, deliberately: auto-review spends one of ~4 hourly reviews per
    # push, so 8 commits exhausts the quota before anyone asks for a verdict
    # (PR #76). Off, pushes are free; the merge-time review is what's bought.
    enabled: false
    drafts: false
    base_branches:
      - main

  path_filters:
    # tests/ ONLY: CodeRabbit has no allowlist mode (a bare pattern just
    # force-includes against defaults), so "tests only" is written as the
    # complement. Also drives sparse checkout — no engine source is fetched.
    - "!.*"
    - "!*"
    - "!.claude/**"
    - "!.github/**"
    - "!aiproxy/**"
    - "!bin/**"
    - "!docs/**"
    - "!scripts/**"
    - "!services/**"
    - "!templates/**"
    - "!tmp/**"
    - "!true-bdd/**"
    # Cassettes: machine-written JSON, regenerated wholesale by -mode=record
    # — no human wrote it. Swept for secrets by scan-recordings.sh instead,
    # deterministically and exhaustively, with no per-review limit.
    - "!tests/bdd-cli/fixtures/*/cassettes/**"
    # Generated by `true-bdd build tests --fix` and verified by
    # regenerate-and-compare. Reviewing the output instead of the
    # generator files findings nobody can act on.
    - "!tests/**/*_test.go"
    - "!tests/legacy/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"

  path_instructions:
    # Instruction blocks for .claude/skills/** and services/bdd-cli/**
    # were removed with the tests-only scope above — those paths are no
    # longer reviewed. Recover them from git history if the scope widens.
    - path: "tests/libraries/**"
      instructions: |
        The BDD harness. Correctness of the record/replay proxy, the
        fs-diff, and the golden comparison matters most: a bug here makes
        the whole suite lie about the engine. Cassette contents
        themselves are excluded from review.

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: "off"

chat:
  auto_reply: true
