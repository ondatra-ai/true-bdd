# Architectural spec living at the NON-default ./docs/arch/ path
# (p4 matrix: architecture path mismatch). Valid content — only the
# location diverges from the canonical ./docs/architecture/.

architecture:
  services:
    - name: mcp-service
      path: services/mcp
      language: go
      frameworks:
        - net/http
      quality_gate:
        tests:
          e2e:
            path: tests/e2e
            framework: playwright
            config: tests/playwright.config.ts
            helpers:
              - name: chatPage
                description: "Playwright fixture that opens the Claude chat UI, submits a prompt, and reads the rendered reply"
      dependencies: []

vocabulary:
  actions:
    - name: "ask Claude"
      means: "write a prompt in Claude chat"

  forbidden_qualifiers:
    - properly
    - correctly

  forbidden_actions:
    - name: "handle"
      reason: "Hides what the system observably does with the input."
      replacement: "Name the observable action: displays, returns, lists, rejects."
