# A6 (plan §4.3): `build code --fix` over a Go module.
#
# architecture.yaml declares service `calculator` (path
# services/calculator) with a unit layer whose framework is `go-test`.
# build-code runs `go test -C services/calculator ./...`, discovers the
# one failing test (TestAdd), and walks it against the single build-code
# prompt. With --fix the applier edits ONLY production source under
# services/* (the applier system prompt forbids touching *_test.go) until
# the test passes; the re-walk converges.
#
# The buggy production file has `Add` returning a-b; the fix is a+b. No
# checklist_prompts — build-code ships a single prompt already.
base: engine
input: input
