# Architectural spec for the AI harness us-refine fixtures.
#
# Read by the us-refine test-sketch / vague-word / forbidden-verb
# prompts (all filtered OUT of these single-check fixtures, but kept so
# the host project is complete and the inventory chip reads `present`).

architecture:
  services:
    - name: mcp-service
      path: services/mcp
      language: go
      frameworks:
        - net/http
      quality_gate:
        tests:
          integration:
            path: tests/integration
            framework: jest
            config: tests/jest.config.ts
            helpers:
              - name: McpClient
                description: "Typed JSON-RPC client that posts requests to the MCP endpoint and returns parsed responses"
          e2e:
            path: tests/e2e
            framework: playwright
            config: tests/playwright.config.ts
            helpers:
              - name: chatPage
                description: "Playwright fixture that opens the Claude chat UI, submits a prompt, and reads the rendered reply"
      dependencies: []

vocabulary:
  actions:
    - name: "ask Claude"
      means: "write a prompt in Claude chat"
  forbidden_qualifiers:
    - properly
    - correctly
    - appropriate
    - user-friendly
    - fast
    - quickly
    - seamless
  forbidden_actions:
    - name: "handle"
      reason: "Hides what the system observably does with the input."
      replacement: "Name the observable action: displays, returns, lists, rejects."
    - name: "process"
      reason: "Does not specify the interaction mechanism or the visible outcome."
      replacement: "Name the observable action: displays, returns, lists, rejects."
