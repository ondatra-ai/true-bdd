# Product document for this repository (TrueBDD itself).
#
# Path resolved from `documents.product` in true-bdd/true-bdd.yaml.

title: "TrueBDD"

description:
  summary: >-
    TrueBDD moves the source of truth from the code to the
    specification, so an agent can rebuild the code from the
    documentation alone. It is a Go console harness that walks a
    project's user stories and scenarios through checklists, turns
    each scenario into an executable test, and drives an agent until
    those tests pass. The harness and the project's files stay on the
    developer's machine and are the only state. It works with any
    technology stack.

  problem: >-
    AI removed the bottleneck on writing code, but not on deciding
    whether the code is right. Deciding is slow because the written
    spec is ambiguous: several different behaviours all satisfy it. So
    the real decision about behaviour is made late, in review and QA,
    through human conversation, and its result lands in code and
    defect tickets instead of going back into the spec. This has two
    consequences. First, nobody can verify anything by reading the
    doc, because the doc does not determine behaviour; the only
    trusted check is to run the application and watch it. Tests do not
    escape this: a test is also code, written to one reviewer's
    interpretation. Second, the decision does not last: the next time
    someone — human or agent — reimplements, they can pick a different
    behaviour that also matches the doc, and the argument happens
    again. Agents make this worse, because they reimplement more
    often. So writing got 10x faster, checking stayed at human speed,
    and delivery caps at around 2x.


    The fix is not a better agent. It is a spec with a guarantee: a
    spec precise enough that any code satisfying it behaves the same
    for the user — the way different compilers produce different
    bytecode but the same behaviour. The guarantee is enforced, not
    promised: every scenario in the spec becomes an executable test
    that runs outside the model, and the test result — not the agent's
    own opinion — decides whether the work is done. Decisions made
    during refinement go back into the scenario registry, so the final
    choice is recorded in the document, not in code and defects.


    Once that guarantee holds, code becomes a disposable artifact:
    delete it, regenerate it from the spec, and the new build must
    pass every behavioural assertion the spec carries. Human attention
    moves to the one place it is still needed — reviewing the
    document. Reading a document is far faster than checking an
    application by hand, so the checking bottleneck goes away and the
    expected speedup becomes reachable.

  # Vision, goals, releases and not_goals are declared empty until the
  # session that settles them; an empty value is a decision on the record.
  vision: ""

  goals: []

  releases: []

  not_goals: []

# The closed list of values for a story's `as_a:` clause. These are roles —
# responsibilities a person holds — not personas: one person often holds
# two of them, and nothing here depends on personality or team size.
roles:
  - name: Product Owner
    definition: >-
      Accountable for the value the product delivers. Owns the product
      document and the user stories, writing each story directly out of
      a discussion of a Feature, and decides which behaviour the system
      must show.
    primary_use_case: "Turning a product goal into registered scenarios — discusses Features, writes stories, runs us refine and us apply"
    characteristics:
      - "Writes acceptance criteria as behaviour the user can observe, never as implementation"
      - "Writes steps in the phrases the product document's catalogue declares"
      - "Answers each failed check in the --fix loop: apply, refine, or exit"
      - "May hand the writing to someone else, but keeps the accountability"

  - name: System Architect
    definition: >-
      Defines the technical shape of the system — its services, their
      dependencies, and the test suite that observes behaviour.
    primary_use_case: "Owning the architecture and running the regeneration loop — runs build tests and build code"
    characteristics:
      - "Owns architecture.yaml: services, their dependencies, and how the test suite runs"
      - "Designs so behaviour can be tested — every scenario must be observable through a declared service"
      - "Fixes the contracts that must survive regeneration and leaves the rest free to change"
      - "Never edits a scenario to make a failing test pass"

  - name: Quality Engineer
    definition: >-
      Accountable for the scenario set being complete and executable:
      the failure cases are written down, and every step can be
      automated.
    primary_use_case: "Verifying the scenarios in the registry — runs scen check"
    characteristics:
      - "Asks what could go wrong: permission denied, not found, timeout, boundary values"
      - "Rejects steps that no test runner could execute"
      - "Reads a build tests failure as a sign that a scenario cannot be observed, not just that a test is missing"
      - "Often the same person as the Product Owner; the accountability stays separate"

# The words `us refine` rejects in stories and scenarios. The phrases a
# step may use are the `catalogue` below. The product document is its only
# home: the architecture document holds no `vocabulary:`.
vocabulary:
  # Vague words that must not appear in AC descriptions or steps.
  forbidden_qualifiers:
    - properly
    - correctly
    - appropriate
    - appropriately
    - user-friendly
    - fast
    - quickly
    - easily
    - seamless
    - intuitive

  # Action verbs too abstract to automate: they hide the interaction
  # mechanism.
  forbidden_actions:
    - name: "handle"
      reason: "Hides what the system observably does with the input."
      replacement: "Name the observable action: displays, returns, lists, rejects."
    - name: "process"
      reason: "Does not specify the interaction mechanism or the visible outcome."
      replacement: "Name the observable action: displays, returns, lists, rejects."
    - name: "parse"
      reason: "Describes internal mechanics, not user-observable behavior."
      replacement: "Describe the visible result of reading the input."

# The product's words: what each word a catalogue entry declares is, and
# why it matters. `D: declared-terms` holds every term a claimed Scenario's
# phrases declare to exactly one entry here.
glossary:
  - term: engine
    means: >-
      TrueBDD's own program, `true-bdd`. It walks a project's documents
      through checklists and sends AI turns to the models; it is neither
      the project's own code nor the AI CLIs it drives, so a Scenario can
      say what TrueBDD itself did.

  - term: command
    means: >-
      One `true-bdd` subcommand with its arguments, as a person types it
      after `true-bdd`, such as `scen check --fix`. It is what a role runs,
      and the unit whose exit code, stdout and file changes a Scenario
      observes. Commands that run AI turns accept model overrides.
      `init` runs without configuration and creates, in the current folder,
      true-bdd/true-bdd.yaml without scripts, every checklist under
      true-bdd/checklists/ and every prompt template under templates/.
      It reports each created or existing file and never overwrites one,
      even an empty or invalid one. It creates no Specification document
      or schema and detects no test framework. `version` also needs none
      of these files. Other commands use only the project files, with no
      embedded runtime fallback. Before their first test run, Item or AI
      turn, they load their configuration and checklist and parse both
      validation prompt templates, plus both fix-generator and both
      fix-applier templates under --fix. A missing file refuses startup,
      naming the file and true-bdd init; an invalid file names the file
      and parse error and asks to fix it, without init advice.
      Checklist commands print their existing upper-case command name followed
      by ` COMPLETE` on stdout only when they succeed, after finalization and
      any post-run validation. A command returning an error prints no COMPLETE
      banner. Success means exit 0, including the reported failing-check
      verdicts of `us refine` and `us apply` described under exit code.

  - term: model override
    means: >-
      A repeatable `--model <tier>=<cli>:<model>` flag on `us refine`,
      `us apply`, `scen check`, `build tests` and `build code`. It replaces
      only that tier's configured binding for one run. The tier must already
      be declared under engine.models; references use the config's first-colon
      split and validation, with claude and codex as the known CLIs.
      An undeclared tier, malformed reference, unknown CLI or duplicate tier
      is a startup refusal with exit 1 before any turn. Each applied override
      logs once at INFO with msg="Model tier overridden" and tier, from and to.
      Apart from logs it writes no file and adds nothing to spawned processes'
      environments, so tests the writer runs still use their own configuration.

  - term: project tree
    means: >-
      The files of the project a command works on (its specification
      documents, the engine's configuration, checklists and prompt templates, its code and
      tests) as a Scenario starts from them. Named, so a Scenario says
      exactly which starting point its behaviour depends on.

  - term: exit code
    means: >-
      The number a finished command reports: anything but 0 when it refused
      to start or could not finish, 0 when it ran to its end. A check still
      failing at the end makes `scen check`, `build tests` and `build code`
      report non-zero too, since they gate a change; `us refine` and `us
      apply` report that check on stdout instead, leave the file they would
      rewrite as it was, and report 0. It is what a script or a CI gate
      reads to decide whether to go on.

  - term: stdout
    means: >-
      Everything a command prints on its standard output: its answer lines
      and its log records. It is what a person watching the terminal, or a
      script reading it, sees.

  - term: stderr
    means: >-
      Everything a command prints on its standard error: the error that
      stopped it, followed by the command's usage when it was given an
      argument it does not take. Startup refusals also name their cause on
      stdout; a configuration read failure precedes installation of the
      engine's JSON log.

  - term: log record
    means: >-
      One line the engine prints about its own run: a level, a message and
      named fields, such as `level=ERROR msg="Refusing to start"
      command="scen check"`. Its message and field names are product
      output that people and tools rely on.

  - term: pattern
    means: >-
      A regular expression a step uses to say what text must or must not
      appear; it matches anywhere in the text unless it anchors itself.

  - term: file change
    means: >-
      A file of the project tree that a run created, modified or deleted,
      compared with the tree as the run found it. What a command leaves
      behind is its lasting effect.

  - term: checklist
    means: >-
      The ordered Prompts a command asks about each Story or Scenario it
      walks, one checklist per command, read from the project tree. It
      decides which questions a run asks.

  - term: Prompt
    means: >-
      One question of a checklist, answered by a model (`Q:`) or by the
      engine's own code (`D:`), with its rationale, the documents it reads
      and an optional fix. A walk's verdicts and its AI turns are counted
      per Prompt.

  - term: AI turn
    means: >-
      One request the engine sends to an AI model and waits on. It is the
      unit of model cost and time: a run that needs none costs nothing.

  - term: AI CLI
    means: >-
      The agent command-line program an AI turn runs through: `claude` or `codex`. The project's configuration binds named model tiers
      to a CLI and model, and a Prompt selects its tier. A run-only model
      override can replace a declared binding. Each CLI enforces a different answer
      shape and write boundary, so which one ran a turn decides what that
      turn could do and what it cost.

  - term: fix loop
    means: >-
      Every command that accepts `--fix` (build code, build tests, us refine,
      us apply and scen check) also accepts `--yes`. With both flags, every
      proposed fix is applied without reading stdin; `--yes` without `--fix`
      is a usage error before startup. A clarifying question under `--yes`,
      or at end of stdin, prints the question and suggested answers and
      stops with a distinct error saying a person must answer; no answer is
      guessed. End of stdin at the fix menu without `--yes` stops with a
      message naming `--yes`, rather than reporting tests still failing.
      These stops exit non-zero and print no command COMPLETE banner.
      Without `--yes`, a final non-empty answer without a newline is accepted,
      and a blank line retains its interactive meaning.
      What a command run with `--fix` does for each check that fails: it
      may first ask clarifying questions, each with numbered suggested
      answers, then shows the fix it proposes and asks whether to apply it,
      refine it with the person's feedback, or exit. It is how a person
      settles a failure in their own words without editing a document by
      hand. For build code, one proposed repair plan covers the whole failing
      set. The person chooses apply, refine or exit as before; the writer
      implements the plan, tests its parts and the set, and reports what
      changed and which members it saw pass. The engine answers the verdict
      itself, with no validation AI turn. After every completed apply it
      reruns the remaining set once, passing tests leave, and fresh discovery
      on the next walk finds regressions. The existing per-Item allowance
      counts applies on the set, including an applied false reply. A successful
      provider response without the result confirmation also counts as a
      completed apply for build code: files stay as written, the engine warns
      once with the result path and reruns the set through the not-applied
      path. A started claude writer that exits non-zero, returns an error result or answers empty also follows this rerun and once-only warning. Its available cost and tokens are logged on failure too.
      A started codex writer that exits non-zero (including a usage limit),
      returns empty or whitespace-only output or leaves no answer file also
      keeps its edits and follows the same warning, allowance and rerun.
      A codex start failure or refusal before spawning stays fatal; codex
      has no response watch.
      Every codex apply turn, including document and test-definition edits, uses a generated home and permission profile:
      reads stay inside the Host project plus explicit runtime and toolchain exceptions, writes stay in that turn's own
      file, directory or configured-glob roots and scratch, and escaping roots are refused. Plan and validation turns
      remain read-only. Configured globs allow creating matching files even when no matches exist before the turn.
      Literal files and terminal recursive subtrees keep exact grants; other globs temporarily grant their narrowest
      literal directory, then enforce the original patterns after every turn. New non-matching files are removed;
      changes, deletions, renames or permission changes to pre-existing non-matching files fail the turn with one
      warning naming the file, preserving changed contents for diagnosis. Overlapping grants authorize their union.
      Non-matching files in that directory can be changed during the turn; this is a post-turn boundary.
      Malformed patterns and grants of the host root, protected generated homes or escaping paths are refused.
      The build-code codex writer receives whole-suite and selected replay
      forms, polling its own process for completion. It reads the host
      project and runtime/toolchain exceptions only, writes the failing set's declared service
      paths, their exact writable entries and host tmp only, and cannot read its generated credential home.
      Its commands have no network. User config, MCP servers, web search,
      history and AGENTS.md are not loaded for this writer. Its JSON events
      are saved for audit; its final message still supplies the confirmation.
      These outcomes consume the same allowance; the terminal apply
      is rerun but still ends at the non-converging bound even if it passes.
      An extracted malformed block or one without applied keeps its existing
      handling. Other commands and other AI roles retain their existing failure handling, including missing confirmations.

  - term: failing set
    means: >-
      All tests failing in one build code discovery, with their latest
      failure evidence and matched Specification context. It is one Item;
      discovery with no failures yields no Item. After an apply, members
      leave only on their own passing result. A member with no result stays
      failing and is reported as not having run. A Go build member's own
      passing result is a package pass or a no-test-files skip with no failure.

  - term: test dependencies
    means: >-
      The packages and tools a project's own tests need before they can
      start, such as the npm packages of a Jest suite, or the browser and
      the npm packages of browser tests.
      They are installed into the project tree from outside it; no command
      writes them, so a Scenario states them as a starting condition.

  - term: glob
    means: >-
      A file path in which `*` stands for any run of characters within one
      directory level, so a Scenario can count files whose exact names a
      command chooses.

  - term: Story
    means: >-
      One user story in its own file: who wants what and why, plus the
      Acceptance Criteria that define it. A person writes it directly, out
      of a discussion of a Feature; it is where a behaviour's reason is
      recorded.

  - term: Feature
    means: >-
      A named group of Stories that together deliver one product
      capability. A label a Story carries, not a document of its own, so
      related Stories can be found together.

  - term: Acceptance Criterion
    means: >-
      One testable condition of a Story: an id the author writes as
      `<NNN>-<slug>`, a description, and its own Given, When and Then
      steps. When the Story is applied it becomes one Scenario of the
      Registry, so it is the same behaviour at an earlier stage.

  - term: step
    means: >-
      One line of a Scenario or an Acceptance Criterion: a Given sets up
      where the behaviour starts, a When is what the role does, a Then is
      what must be observed afterwards. Its text takes one shape the
      catalogue declares, or is a `judge:` clause a model rules on.

  # Every phrase whose template holds a slot or brackets declares it, so
  # whoever writes the phrase's step definition is handed the grammar.
  - term: template
    means: >-
      The shape a catalogue phrase gives the text of its steps, as its
      `template:` writes it: words a step repeats exactly, slots it fills
      in, and brackets offering a choice. A step takes the shape with its
      whole text, never a part of it. A quoted slot, `"{name}"`, is filled
      with at least one character and no double quote, so a step with an
      empty quote does not take the shape; a number slot, `{name:number}`,
      with a whole number in digits or the word `no` for zero; a role slot,
      `{name:role}`, with exactly one of the roles the product document
      declares, spelled as declared, and no other words; a pattern slot,
      `{name:pattern}`, always the last thing in the template, with the rest
      of the step as written, quotes included. Brackets with several
      alternatives, such as `[is|are]`, take exactly one of them, never
      none; brackets with one, such as `[s]`, take it or leave it out. What
      fills a slot is what the phrase's meaning calls the named or given
      thing, that many, or that role, so the template decides which steps a
      meaning speaks of.

  - term: Scenario
    means: >-
      One behaviour the product is held to, written as an entry of the
      Registry with its Given, When and Then steps. Each becomes one
      executable test, and the test's verdict, not anyone's opinion, says
      whether the product behaves.

  - term: Registry
    means: >-
      The one file of a project holding every Scenario, so the whole
      behaviour the product is held to can be read, checked and turned
      into tests in one place.

  - term: lineage
    means: >-
      The record on a Scenario of the Story and the Acceptance Criterion it
      came from, the criterion named by its lineage id
      `<story-id>-<ac-id>`. It is how a behaviour says which role wanted it
      and why.

  - term: Scenario key
    means: >-
      The name a Scenario has in the Registry: its lineage id
      `<story-id>-<ac-id>` once a Story claims it. The Scenario's test is
      named after it, so it is what a reader sees when the test fails.

  - term: step definition
    means: >-
      The test code that carries out one shape of step against the running
      product: it sets up what a Given states or observes what a Then
      states. A step runs through the one definition whose pattern matches
      its whole text. Unlike the tests rendered from the Registry, the
      definitions are written, by a person or by `build tests --fix`.

  - term: test runner
    means: >-
      The program a project runs its own tests with, such as `go test` or
      `npx playwright test`, as the architecture document declares it.
      `build code` starts it to find the failing set and after every completed
      apply to rerun all remaining members in one selection. Go build and
      Playwright startup members make the rerun unfiltered. A member with
      no passing result of its own stays failing; the next outer walk
      discovers the whole suite afresh.

  - term: shell command
    means: >-
      A program with its arguments, as a person would type it in a
      terminal, that a Scenario runs itself in a directory of the project
      tree once the command has ended, apart from the engine: typically the
      project's own tests, to confirm the outcome the command was driving
      at. It reports its own exit status, 0 for success.

  - term: claude
    means: >-
      The Claude Code CLI selected by a model tier. Only build code's apply turn
      has a generated, restricted writer configuration with the engine's hook.
      Its file tools read the host root, the installed Go toolchain and module
      cache (excluding ondatra-ai copies outside the host), and its own spill
      files. Writes stay in scratch and declared service roots, with generated guard configuration protected from modification. The hook grants
      only the canonical foreground replay command; background commands are denied.
      Searches outside the host cannot start above an excluded module-copy
      directory, and Glob checks its pattern's fixed root and denies parent
      traversal. A dependency search chooses a narrower directory instead.
      Both Bash timeouts are 600000 milliseconds. No Claude turn gets a router deadline;
      every turn uses the caller's context, and cancellation stops its process group and descendants.
      Other Claude turns retain safe mode. A started writer's non-zero exit, error result
      (including rate or usage limits) or empty answer warns once, preserves files
      and reruns the set, consuming the same attempt. Start failures stay fatal.

  - term: write guard
    means: The engine's check that the build-code Claude writer runs before each tool call. It answers allow or deny with a
      reason, holding calls to the turn's write policy. File tools reach the host, declared toolchain roots and this session's
      spill directory; writes reach declared service roots and scratch. Unknown tools and malformed policies are denied. Bash
      accepts only the canonical whole or selected replay in the resolved suite directory, in the foreground. No other Claude
      turn receives a replay grant. Codex build-code writers use their own permission profile.

  - term: write policy
    means: 'What one guarded Claude writer may read and change: the project read root, write roots, extra read roots, excluded
      roots and protected configuration. Its replay policy carries the canonical command without machine output, framework selector
      and absolute suite directory. Arguments use one space; only A-Za-z0-9_./:=,@%+- remain unquoted, others are single-quoted.
      A single quote, newline or NUL withholds the grant with one warning. The guard accepts the command alone or followed by
      one selector and a nonempty single-quoted selection with no single quote, newline or NUL. Symlinks and path identity determine
      roots. Tests execute the writer''s code with machine permissions; this restricts shell use, not deliberately written code.
      The generated policy file is protected from writes.'

  - term: tool call
    means: 'One tool Claude wants to run during a writer turn: tool_name, such as Read, Write, Edit, Glob, Grep or Bash, and
      tool_input. File tools name file_path or path; relative targets resolve against cwd and an absent target uses cwd. Bash
      names command; cwd supplies its working directory and run_in_background is denied.'

  - term: hook payload
    means: 'The complete JSON tool call Claude writes to the guard''s standard input: tool_name, cwd and tool_input, including
      file_path, path, command and run_in_background where applicable. A malformed payload or non-absolute policy read root
      is denied.'

  - term: symbolic link
    means: >-
      A file of the project tree that points at another path: reading or
      writing through it reaches the path it points at, which may lie
      outside the directory holding the link.

# The step-phrase catalogue: the shape each Given, When and Then step may
# take, and what it means. `D: step-phrases` holds every step of a Scenario
# a Story claims to exactly one entry; the Scenarios no Story claims wait.
  - term: writable paths
    means: >-
      A service's optional writable list names exact project-relative files or folders, without patterns, in addition to its path. A writer changes those and host tmp only. Existing folders grant their subtree; an absent entry remains exact unless a trailing slash declares a folder. Build code refuses outside paths or grants overlapping tests/ or Registry suite directories and their step definitions at start, before any runner or AI turn. Unknown-service failures use all declared services. Tests and step definitions are read and run only. Codex enforces this fully; Claude's replay command remains unconfined for model trials.

  - term: impossible repair
    means: >-
      The plan or writer concludes no solution exists within the declared files, after seeking one there. A preferred undeclared change alone is insufficient. Both report impossible as a list of path and reason objects. The first nonempty list keeps edits, reruns the remaining failing set once, then fails with a distinct error naming files, reasons, remaining failures and the remedy: change the files by hand or add them to the service's writable. No further plan, writer, attempt or COMPLETE banner follows. An empty list preserves ordinary retries, including applied false.

catalogue:
  - template: 'the "{tree}" project tree'
    block: given
    means: >-
      The run starts from the named project tree: a fresh copy of that
      project's files becomes the directory the command runs in, so
      nothing an earlier run changed is visible in it.
    terms: [project tree, command, template]

  - template: 'the codex writer uses fixture-controlled authentication and CLIs'
    block: given
    means: >-
      The project tree supplies dummy authentication and deterministic external
      CLI stand-ins. The codex writer's preparation and cleanup still run in
      the engine, and its CLI spawn is observed independently of recordings.
    terms: [project tree, AI turn]

  - template: 'the codex writer provisioned and removed its fixture authentication'
    block: then
    means: >-
      Exactly one writer spawn held an exact private copy of the fixture's dummy
      authentication in a private protected generated home, with its edit root
      and shell scratch already created. After the AI turn no authentication
      remains in that home, including when the CLI exited non-zero.
    terms: [project tree, AI turn]

  - template: 'the {actor:role} answers "{answer}" to every question'
    block: given
    means: >-
      Every question the command asks on the terminal during its fix
      loop is answered with the given text, as that role would type it:
      "1" picks the first offered choice, which applies the proposed fix.
      Once the answers run out the command reads end of input, which
      exits the loop.
    terms: [fix loop, template]

  - template: 'the {actor:role} answers "{lines}" line by line'
    block: given
    means: >-
      The quoted text, split at each "/", is what that role types on the
      terminal during the fix loop, one piece per line in that order: the
      first piece answers whatever the command asks first, the next piece
      what it asks next. An empty piece is an empty line, which ends a
      multi-line answer such as the feedback that refines a proposed fix.
      Once the lines run out the command reads end of input, which exits
      the loop.
    terms: [fix loop, template]

  - template: 'the "{checklist}" checklist is narrowed to its "{prompt}" prompt'
    block: given
    means: >-
      The named checklist, as the command reads it from the project tree,
      holds only the one Prompt whose question contains the quoted text,
      so the run asks that Prompt and no other of that checklist.
    terms: [checklist, Prompt, command, project tree, template]

  - template: 'the project tree has no "{file}"'
    block: given
    means: >-
      The project tree the run starts from lacks the named file, even one
      the engine's own configuration and checklists would bring into it,
      such as `true-bdd/true-bdd.yaml`, so the run shows what a command
      does without that file.
    terms: [project tree, template]

  - template: "the project's [browser ]test dependencies are installed"
    block: given
    means: >-
      The test dependencies the project's tests need, or with "browser"
      those its browser tests need, are installed into the project tree
      before the command runs, so those tests can start. The installation
      happens before the run, so the files it adds are no file change of
      the run.
    terms: [test dependencies, project tree, file change, template]

  - template: 'the {actor:role} runs "{command}"'
    block: when
    means: >-
      That role runs the engine with the given command in the project
      tree, once, and the Scenario waits for it to end. The role says who
      wants the behaviour; it changes nothing in what the command does.
    terms: [engine, command, project tree, template]

  - template: 'the command exits with code {code:number}'
    block: then
    means: >-
      The command the role ran ended with this exit code: non-zero when it
      refused to start or could not finish, 0 when it ran to its end. A
      check still failing at the end is non-zero for `scen check`, `build
      tests` and `build code`, and 0 for `us refine` and `us apply`, which
      report it on stdout and leave the Story or the Registry as it was.
    terms: [command, exit code, template]

  - template: 'stdout matches {expected:pattern}'
    block: then
    means: >-
      What the command printed on stdout has a match for the pattern
      somewhere. Stdout carries the command's answer and its log records,
      so a pattern may name a log record's message or fields.
    terms: [stdout, log record, pattern, template]

  - template: 'stdout does not match {unexpected:pattern}'
    block: then
    means: >-
      Nothing the command printed on stdout, neither an answer line nor a
      log record's message or fields, has a match for the pattern: proof
      that a message, a banner or a log record never appeared.
    terms: [command, stdout, log record, pattern, template]

  - template: 'stderr matches {expected:pattern}'
    block: then
    means: >-
      What the command printed on stderr has a match for the pattern
      somewhere. Stderr carries the error that stopped the command, so a
      pattern may name a mistyped argument, the usage printed after it, or
      a missing configuration.
    terms: [stderr, pattern, template]

  - template: 'stderr does not match {unexpected:pattern}'
    block: then
    means: >-
      Nothing the command printed on stderr has a match for the pattern:
      proof that an error never named something, or that the usage a
      mistyped argument earns never followed an error it did not earn.
    terms: [command, stderr, pattern, template]

  - template: 'no file outside "{dir}" changed'
    block: then
    means: >-
      Every file change the run made lies under the named directory of
      the project tree; every file outside it is as the run found it.
    terms: [file change, project tree, template]

  - template: 'no file outside "{dir}" and "{other_dir}" changed'
    block: then
    means: >-
      Every file change the run made lies under one of the two named
      directories of the project tree; every file outside both is as the
      run found it.
    terms: [file change, project tree, template]

  - template: 'the only file changed outside "{dir}" is "{file}"'
    block: then
    means: >-
      Outside the named directory the run made exactly one file change,
      and it is to the named file of the project tree: proof that, beside
      that directory, the command changed that one file and nothing else.
    terms: [file change, project tree, template]

  - template: 'the file "{file}" is created'
    block: then
    means: >-
      The run created the named file: it was not in the project tree when
      the run started and is there when it ends.
    terms: [file change, project tree, template]

  - template: 'the file "{file}" is modified'
    block: then
    means: >-
      The named file was in the project tree when the run started and the
      run changed its content.
    terms: [file change, project tree, template]

  - template: 'the file "{file}" is unchanged'
    block: then
    means: >-
      The named file is in the project tree after the run, and the run did
      not create, modify or delete it. A path naming no file fails, so a
      mistyped path cannot pass.
    terms: [file change, project tree, template]

  - template: 'the file "{file}" has exactly {lines:number} line[s]'
    block: then
    means: >-
      After the run the named file of the project tree holds exactly that
      many lines of text. A newline at its end closes the last line rather
      than opening another, and an empty file has none.
    terms: [project tree, template]

  - template: 'the file "{file}" matches {expected:pattern}'
    block: then
    means: >-
      After the run the content of the named file of the project tree has a
      match for the pattern somewhere: proof that a command wrote a file
      that says the right thing.
    terms: [project tree, pattern, template]

  - template: 'every file matching "{glob}" [matches|does not match] {expected:pattern}'
    block: then
    means: >-
      At least one file in the project tree matches the glob, and every
      matching file's content satisfies the named pattern comparison.
      Scratch files count, so a Scenario can inspect saved rendered prompts.
      In this phrase's pattern, {{CWD}} denotes the symlink-resolved project
      tree root, {{ENGINE}} denotes the engine executable (invoked or symlink-resolved path),
      and {{GOROOT}} and {{GOMODCACHE}} denote the installed Go
      toolchain and module-cache roots from go env. These substitutions are
      literal paths, escaped before compiling the regular expression.
      An invalid glob or pattern, or a failed path lookup, fails the step.
    terms: [glob, project tree, pattern, template]

  - template: 'exactly {count:number} file[s] matching "{glob}" [is|are] created'
    block: then
    means: >-
      The run created exactly that many files whose path in the project
      tree matches the glob; files it modified or deleted do not count. It
      is how a Scenario pins new files whose names the command chooses. A
      glob that is not well formed fails the step whatever the run created,
      a count of none included, so a mistyped glob cannot pass.
    terms: [file change, glob, project tree, template]

  - template: 'no file[s] matching "{glob}" [is|are] created'
    block: then
    means: >-
      The run created no file whose path in the project tree matches the
      glob. A glob that is not well formed fails the step, even when the run
      created no file at all, so a mistyped glob cannot pass.
    terms: [file change, glob, project tree, template]

  - template: 'the story "{story_file}" has id "{id}"'
    block: then
    means: >-
      After the run the Story in the named file of the project tree
      carries that id.
    terms: [Story, project tree, template]

  - template: 'the story "{story_file}" has feature "{feature}"'
    block: then
    means: >-
      After the run the Story in the named file of the project tree carries
      that Feature.
    terms: [Story, Feature, project tree, template]

  - template: 'the story "{story_file}" has {count:number} acceptance criteria'
    block: then
    means: >-
      After the run the Story in the named file of the project tree holds
      exactly that many Acceptance Criteria: none was dropped or added.
    terms: [Story, Acceptance Criterion, project tree, template]

  - template: 'every acceptance criterion in the story "{story_file}" has given, when and then steps'
    block: then
    means: >-
      After the run the Story in the named file of the project tree has at
      least one Acceptance Criterion, and each has at least one Given, one
      When and one Then step.
    terms: [Story, Acceptance Criterion, step, project tree, template]

  - template: 'the description of acceptance criterion "{criterion}" of the story "{story_file}" matches {expected:pattern}'
    block: then
    means: >-
      After the run the Story in the named file of the project tree has an
      Acceptance Criterion with that id, and its description has a match
      for the pattern.
    terms: [Story, Acceptance Criterion, pattern, project tree, template]

  - template: 'the description of acceptance criterion "{criterion}" of the story "{story_file}" does not match {unexpected:pattern}'
    block: then
    means: >-
      After the run the Story in the named file of the project tree has an
      Acceptance Criterion with that id, and its description has no match
      for the pattern: proof that a word or a shape is gone from it.
    terms: [Story, Acceptance Criterion, pattern, project tree, template]

  - template: 'the steps of acceptance criterion "{criterion}" of the story "{story_file}" do not match {unexpected:pattern}'
    block: then
    means: >-
      After the run the Story in the named file of the project tree has an
      Acceptance Criterion with that id, it has steps, and the text of none
      of them has a match for the pattern.
    terms: [Story, Acceptance Criterion, step, pattern, project tree, template]

  - template: 'every step of scenario "{scenario}" in "{registry}" is matched by a step definition under "{steps_dir}"'
    block: then
    means: >-
      After the run every step of the Scenario under that Scenario key in
      the named Registry, model-run steps aside, matches exactly one step
      definition in the named directory of the project tree, so the
      Scenario can run as a test.
    terms: [Scenario, Scenario key, Registry, step, step definition, project tree, template]

  - template: 'exactly {count:number} scenario[s] in "{registry}" come[s] from acceptance criterion "{criterion}"'
    block: then
    means: >-
      After the run exactly that many Scenarios of the named Registry name,
      in their lineage, the Acceptance Criterion with that lineage id.
    terms: [Scenario, Registry, Acceptance Criterion, lineage, template]

  - template: 'the scenario from acceptance criterion "{criterion}" in "{registry}" cites the story "{story_file}"'
    block: then
    means: >-
      After the run exactly one Scenario of the named Registry comes from
      the Acceptance Criterion with that lineage id, and its lineage names
      the Story file at that path.
    terms: [Scenario, Registry, Acceptance Criterion, lineage, Story, template]

  - template: 'the scenario from acceptance criterion "{criterion}" in "{registry}" is keyed "{key}"'
    block: then
    means: >-
      After the run exactly one Scenario of the named Registry comes from
      the Acceptance Criterion with that lineage id, and it sits in the
      Registry under that Scenario key.
    terms: [Scenario, Registry, Acceptance Criterion, lineage, Scenario key, template]

  - template: 'the scenario from acceptance criterion "{criterion}" in "{registry}" matches {expected:pattern}'
    block: then
    means: >-
      After the run exactly one Scenario of the named Registry comes from
      the Acceptance Criterion with that lineage id, and its whole entry,
      written out as YAML, has a match for the pattern: proof that it kept
      the behaviour, not only its name.
    terms: [Scenario, Registry, Acceptance Criterion, lineage, pattern, template]

  - template: 'no two scenarios in "{registry}" share the same steps'
    block: then
    means: >-
      After the run no two Scenarios of the named Registry carry the same
      Given, When and Then steps.
    terms: [Scenario, Registry, step, template]

  - template: 'the engine spawned the test runner "{program}"'
    block: then
    means: >-
      The engine started the project's test runner through the named
      program at least once during the run, even if that start then failed.
    terms: [engine, test runner, template]

  - template: 'the engine spawned a test runner with arguments matching {expected:pattern}'
    block: then
    means: >-
      At least one test runner the engine started during the run carried
      arguments that, joined by single spaces, have a match for the
      pattern: proof of which tests the engine asked it to run.
    terms: [engine, test runner, pattern, template]

  - template: 'the engine spawned exactly {count:number} test runner[s]'
    block: then
    means: >-
      The engine started the project's test runner exactly that many times
      during the run.
    terms: [engine, test runner, template]

  - template: 'the engine spawned no test runner[s]'
    block: then
    means: >-
      The engine never started the project's test runner during the run,
      as when the command refuses to start.
    terms: [engine, test runner, template]

  - template: 'the engine dispatched {turns:number} AI turn[s]'
    block: then
    means: >-
      The engine sent exactly that many AI turns during the run; "no"
      means none, so the run cost no model call.
    terms: [engine, AI turn, template]

  - template: 'the engine dispatched {turns:number} [validation|fix|apply] AI turn[s] to "{cli}"'
    block: then
    means: >-
      Of the AI turns the engine sent during the run, exactly that many of
      the named kind went to the named AI CLI; "no" means none. A
      validation turn answers a Prompt, a fix turn turns a failed Prompt
      into a proposed fix or clarifying questions, and an apply turn writes
      the fix. It is how a Scenario observes which AI CLI the configuration
      routed each kind of turn to.
    terms: [engine, AI turn, AI CLI, Prompt, template]

  - template: 'the shell command "{shell_command}" run in "{dir}" exits with code {code:number}'
    block: then
    means: >-
      Once the command has ended, the shell command run in the named
      directory of the project tree reports that exit status: an outcome
      checked apart from the engine, such as the project's own tests
      passing in the tree the command left.
    terms: [shell command, project tree, template]

  - template: claude's write policy lets the turn write under "{dir}"
    block: given
    means: 'The write policy claude hands the write guard lets the turn write anywhere under the named directory of the project
      tree. Each such step adds one directory: without one the turn may write nowhere, and without the shell step it may not
      run the shell.'
    terms:
    - claude
    - write policy
    - write guard
    - project tree
    - template

  - template: claude hands the guard no write policy
    block: given
    means: claude asks the write guard about a tool call without any write policy,  so the guard has nothing to hold the call
      to.
    terms:
    - claude
    - write guard
    - write policy
    - tool call

  - template: claude hands the guard an unreadable write policy
    block: given
    means: claude hands the write guard a write policy written in a shape the guard cannot read, so the guard cannot tell where
      the turn may write or whether it may run the shell.
    terms:
    - claude
    - write guard
    - write policy

  - template: claude hands the guard a write policy with no read root
    block: given
    means: claude hands the write guard a readable write policy that names no project directory for local reads, so every tool
      call is refused.
    terms:
    - claude
    - write guard
    - write policy
    - tool call

  - template: claude pipes the hook payload naming the tool "{tool}" and the path "{path}"
    block: given
    means: claude writes the hook payload naming the tool and the path exactly as quoted, including a relative path. The write
      guard uses these names where claude did not otherwise name the tool or its target.
    terms:
    - claude
    - hook payload
    - write guard
    - tool call
    - template

  - template: claude names the tool "{tool}"
    block: given
    means: The tool call claude asks about runs the named tool, spelled as claude spells it, such as `Read`, `Write` or `Bash`.
    terms:
    - claude
    - tool call
    - template

  - template: claude names the file "{file}" of the project tree
    block: given
    means: The tool call claude asks about targets the named file of the project tree, which claude names by its absolute path.
      The file need not exist yet, since a write usually creates it.
    terms:
    - claude
    - tool call
    - project tree
    - template

  - template: claude names the path "{path}" as written
    block: given
    means: The tool call claude asks about targets the path exactly as quoted, kept as written rather than made absolute. A
      relative target resolves against an absolute cwd, falling back to the policy's read root; a write is allowed within
      granted write roots unless its target is protected.
    terms:
    - claude
    - tool call
    - template

  - template: claude pipes the hook payload naming the tool "{tool}" and the file "{file}"
    block: given
    means: 'claude writes the hook payload for the tool call to the write guard: the named tool, and the named file of the project
      tree by its absolute path. The guard reads it for whichever of the two claude did not name otherwise.'
    terms:
    - claude
    - hook payload
    - write guard
    - tool call
    - project tree
    - template

  - template: 'the project tree''s "{link}" is a symbolic link to "{target}"'
    block: given
    means: >-
      Before the run, the named path of the project tree is a symbolic link
      pointing at the target, a path relative to the link's own directory,
      so a read or write through the link reaches the target instead. Creating it
      is no file change of the run.
    terms: [symbolic link, project tree, file change, template]

  - template: the guard allows the tool call
    block: then
    means: 'The write guard answered that the caller may run the tool: it ended with status 0, which claude reads as allow.'
    terms:
    - write guard
    - tool call
    - claude
    - claude

  - template: the guard denies the tool call
    block: then
    means: 'The write guard answered that the caller must not run the tool: it ended with status 2, which claude reads as a
      denial and reports with the guard''s reason, rather than as a guard that failed to answer.'
    terms:
    - write guard
    - tool call
    - claude
    - claude

  - template: the guard's reason matches {expected:pattern}
    block: then
    means: The reason the write guard gave for its answer, the one line it prints on its standard error for claude to show beside
      a denied tool, has a match for the pattern somewhere.
    terms:
    - write guard
    - claude
    - pattern
    - template

  - template: 'the engine spawned a test runner with its own prebuilt engine path'
    block: then
    means: >-
      A test runner argument is -engine-bin= followed by the absolute path
      of the engine running the command, with symbolic links resolved.
      The complete argument arrives as one element.
    terms: [engine, test runner, symbolic link, template]

  - template: 'the file matching "{glob}" has exactly {count:number} match[es] for {expected:pattern}'
    block: then
    means: >-
      After the command ends, exactly one file of the project tree must
      match the glob, and its entire content must contain exactly that
      many non-overlapping matches for the pattern. The file may be a
      saved request sent to a model: counting its failure headings and
      matching its whole evidence observes what the model was given.
      A missing file, several matching files or an invalid pattern fails
      the step, even when the expected count is zero.
    terms: [project tree, glob, pattern, template]

  - template: 'claude''s write policy grants the test command "{command}" with selector "{flag}" in "{dir}"'
    block: given
    means: >-
      Claude's writer policy grants the exact canonical replay command and
      selector in the named directory of the project tree, without a general shell.
    terms: [claude, write policy, project tree]

  - template: 'claude pipes a "{mode}" shell call in directory "{dir}" with command {command:pattern}'
    block: given
    means: >-
      Prepare a Claude Bash hook payload with cwd, tool_input.command and
      run_in_background true for background mode and false for foreground mode.
    terms: [claude, hook payload, tool call, project tree]

  - template: 'claude asks the guard about the tool call'
    block: when
    means: >-
      Run the engine's claude-guard with a generated policy file and the prepared
      hook payload on stdin. No AI turn runs. Exit 0 grants the call and exit 2
      denies it with the guard's reason on stderr.
    terms: [claude, write guard, write policy, tool call, hook payload, project tree, AI turn]
