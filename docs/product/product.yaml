# Product document for TrueBDD. Concepts retain their closed meanings.
title: TrueBDD
description:
  summary: 'TrueBDD rebuilds tests and code from the Host project’s Specification through checklists and the pipeline:
    us refine, us apply, build tests, build steps, build code. A glossary means must be one paragraph of at most
    three sentences, each at most 25 words. A sentence ends at a run of . ! or ? followed by Unicode whitespace
    or end of text; a remaining nonempty fragment counts. Words are nonempty Unicode-whitespace-separated fields;
    paths, hyphenated words and decimals remain single words. Blank lines separate paragraphs; ordinary line wrapping
    does not. Every product reader and command startup refuses violations, naming the term, sentence count, longest
    sentence’s word count, paragraph count and rule. Concepts’ means are exempt.'
  problem: Ambiguous specifications let rebuilds choose different behaviour. Executable Scenarios hold each rebuild
    to observable outcomes.
  vision: ''
  goals: []
  releases: []
  not_goals: []
roles:
- name: Product Owner
  definition: Owns product value, the product document and Stories.
  primary_use_case: Runs us refine and us apply.
  characteristics:
  - Approves behaviour and concept changes at the fix menu.
- name: System Architect
  definition: Owns services, Public interfaces, libraries and test execution.
  primary_use_case: Runs build tests, build steps and build code.
  characteristics:
  - Repairs contracts rather than changing a Scenario to fit code.
- name: Quality Engineer
  definition: Owns complete, executable Scenarios.
  primary_use_case: Runs scen check.
  characteristics:
  - Requires observable outcomes and failure cases.
vocabulary:
  forbidden_qualifiers:
  - properly
  - correctly
  - appropriate
  - appropriately
  - user-friendly
  - fast
  - quickly
  - easily
  - seamless
  - intuitive
  forbidden_actions:
  - name: handle
    reason: Hides what the system observably does with the input.
    replacement: 'Name the observable action: displays, returns, lists, rejects.'
  - name: process
    reason: Does not specify the interaction mechanism or the visible outcome.
    replacement: 'Name the observable action: displays, returns, lists, rejects.'
  - name: parse
    reason: Describes internal mechanics, not user-observable behavior.
    replacement: Describe the visible result of reading the input.
glossary:
- term: Public interface
  means: What a service offers across its process boundary, declared in the architecture as CLI commands, HTTP operations
    or UI elements. Named interface documents belong to the Specification.
- term: Concept
  means: One kind of setup, call or observation through one Public interface item, per block. Its closed means states
    every admitted variation using declared terms and plain English. The step wording fixes its use; names are unique
    within a block.
- term: Concept binding
  means: An architecture entry connecting a Concept and service to Public interface references and instructions
    for its step definition. A UI binding may state intent instead.
- term: engine
  means: The true-bdd program that walks the Host project’s Specification through checklists and drives AI CLIs
    to build its tests and code.
- term: build identity
  means: The engine’s build version and source commit, reported by version and logged once when logging starts.
- term: command
  means: One true-bdd subcommand with its arguments, as a role types it after true-bdd. Its exit code, output and
    file changes are observable behaviour.
- term: project tree
  means: 'The Host project’s files at the start of a Scenario: Specification, configuration, checklists, templates,
    code and tests. A name identifies the starting tree.'
- term: exit code
  means: The status a finished command reports to its caller. Zero means it completed; refusals and incomplete runs
    are nonzero. Some completed document walks report failed checks without changing their file.
- term: stdout
  means: The command’s standard output, carrying its answer lines and text log records.
- term: stderr
  means: The command’s standard error, carrying the command-line error and any usage text. Failures before logging
    starts also put their log record here.
- term: log record
  means: One report about the engine’s run, with a level, message and named fields. Its message and field names
    are output contracts.
- term: pattern
  means: A regular expression stating what text must or must not appear. It matches anywhere unless anchored.
- term: file change
  means: A file created, modified or deleted during a command, compared with the prepared project tree before the
    command started.
- term: checklist
  means: The ordered Prompts a command reads from the project tree and asks about the Items it walks. Each command
    selects its own checklist.
- term: Prompt
  means: 'One checklist question, answered by a model for Q: or engine code for D:, with rationale, reference documents
    and optional fix guidance.'
- term: AI turn
  means: One request the engine sends through an AI CLI and waits on. Turns are counted by validation, fix or apply
    role.
- term: AI CLI
  means: 'The agent command-line program an AI turn uses: claude or codex. Configuration binds model tiers to a
    CLI and model.'
- term: fix loop
  means: Under --fix, a failed Prompt leads to clarification if needed, a proposed fix, and an apply, refine or
    exit menu. Every apply requires an answer from stdin. End of input stops an unanswered question or menu.
- term: test dependencies
  means: Packages and tools the Host project’s tests need before starting, installed into the project tree by fixture
    preparation.
- term: glob
  means: A path pattern where * matches characters within one directory level, ? matches one character, and brackets
    match a character set.
- term: Story
  means: 'One user story: who wants what and why, with Acceptance Criteria, written in its own file from discussion
    of a Feature.'
- term: Feature
  means: A named group of Stories delivering one capability, carried as a Story label.
- term: Acceptance Criterion
  means: One testable Story condition with an author-written id, description and Given, When and Then steps. Applying
    the Story turns it into a Registry Scenario.
- term: step
  means: One line of an Acceptance Criterion or Scenario. Given states initial state, When an action or event, and
    Then an observable outcome. Its text instantiates a Concept or uses a model-run prefix.
- term: Scenario
  means: One Registry entry describing behaviour with Given, When and Then steps. It becomes one executable test
    whose verdict decides whether the behaviour holds.
- term: Registry
  means: The Host project’s single YAML file holding all Scenarios.
- term: lineage
  means: A Scenario’s record of its originating Story file and Acceptance Criterion, identified by <story-id>-<ac-id>.
    It records who wanted the behaviour and why.
- term: Scenario key
  means: The name of a Scenario in the Registry, equal to its lineage id once a Story claims it. Its generated test
    is named after it.
- term: step definition
  means: Test code carrying out a step across the service’s Public interface. Exactly one definition’s pattern must
    match the whole step. Its concept record identifies the declared meaning its body implements.
- term: fixture
  means: A suite’s named directory holding the files, tool programs and preparation a Scenario starts from. Inputs
    exclude the recordings under cassettes/.
- term: test runner
  means: The program the architecture declares to execute the Host project’s tests. The engine runs it for discovery,
    reruns and build-steps verification.
- term: shell command
  means: A program and arguments a Scenario runs in the project tree after the engine command, with its own exit
    status.
- term: claude
  means: The Claude Code CLI selected by a model tier. A build-code writer receives restricted tools and a generated
    write guard policy.
- term: codex
  means: The Codex CLI selected by a model tier. Each apply turn receives a generated home and permission profile,
    with private authentication removed when it ends.
- term: write guard
  means: The engine’s hook that allows or denies each Claude writer tool call under its write policy, giving a reason
    for denial.
- term: write policy
  means: The generated declaration of a guarded writer’s readable and writable paths, protected configuration and
    permitted replay command.
- term: tool call
  means: A Claude tool request with its name and inputs. File tools name a target; Bash supplies a command, working
    directory and foreground or background mode.
- term: hook payload
  means: The JSON tool call sent to the write guard on stdin, carrying tool_name, cwd and tool_input.
- term: symbolic link
  means: A project-tree file pointing at another path. Access through it reaches that target, which may be outside
    the containing directory.
- term: Library
  means: Code supplied apart from a service’s source, declared with an exact module and version in its architecture
    or testing libraries. Writers may read its downloaded build graph.
- term: hard link
  means: Another name for the same file. Writes through either affect both; replacing one name by rename leaves
    the other with the old bytes.
- term: hold
  means: A short advisory lock on a file’s parent directory, shared for reading and exclusive for mutation. Conflicting
    access waits up to ten seconds.
- term: staging file
  means: The temporary sibling holding a whole-file replacement before atomic rename. A stale staging file is removed
    without following symbolic links.

concepts:
  given:
    - concept: project tree
      means: >-
        The files of the project tree a command will run in are in a stated
        state before the run: the named fixture's files, copied fresh; with a
        stated file or directory left out; with a stated path made a symbolic
        link to a stated target; with a stated checklist narrowed to the one
        Prompt whose question holds a stated text; or holding, put in place by
        the fixture, the probes of the engine's atomic replacement of a whole
        file through a staging file: a private file the engine will replace
        and the file a stale staging file will point at.
      terms: [project tree, fixture, checklist, Prompt, symbolic link, engine, staging file, command]
    - concept: machine environment
      means: >-
        The machine the engine runs on is in a stated state before the run: the
        project's test dependencies are installed, its browser test
        dependencies too when the step says browser; every Library download
        goes to an empty offline source, so none succeeds; or the variables Git
        sets for its hooks point to a directory outside the project tree.
      terms: [engine, test dependencies, Library, project tree, step]
    - concept: fixture AI CLIs
      means: >-
        Before the run, an AI CLI the engine will reach is a program the
        fixture supplies, so the engine's handling of it can be observed:
        claude, checking how the engine starts it; codex as the writer of a
        command's changes, with the fixture's dummy authentication and programs,
        or answering that the Public interface cannot serve a Concept; claude
        giving malformed answers where a Prompt asks it to link steps to
        a Concept or group them by Concept; or claude controlling which of two
        Scenarios' validation AI turns arrives first.
      terms: [AI CLI, engine, fixture, claude, codex, command, Prompt, step, Concept, Scenario, AI turn, Public interface]
    - concept: scripted answers
      means: >-
        What a role will answer at the command's questions and fix menus is set
        before the run: one stated answer to every question, or stated answers
        given one per line in order, with nothing after them.
      terms: [command, fix loop]
    - concept: write policy
      means: >-
        The write policy claude's AI turn hands the write guard is in a stated
        state before the guard is asked: it lets the turn write under a stated
        directory of the project tree; it grants a stated shell command running
        the project's tests, with a stated flag selecting tests, in a stated
        directory; or it is missing, unreadable, or names no directory to read.
      terms: [write policy, claude, AI turn, write guard, project tree, shell command]
    - concept: tool call
      means: >-
        The tool call claude will ask the write guard about is in a stated
        state, as the tool call or the hook payload names it: the tool it runs;
        its target, a stated file of the project tree or a stated path exactly
        as written; or a shell call with its command, its directory and whether
        it runs in the foreground or the background.
      terms: [tool call, hook payload, claude, write guard, project tree]
  when:
    - concept: a role runs a command
      means: >-
        A role runs one command of the engine once in the project tree and
        waits for it to end, with nothing else acting on the run.
      terms: [command, engine, project tree]
    - concept: a command runs under interference
      means: >-
        A role runs one command of the engine while something outside the
        engine acts on the run: another process takes a stated hold on a stated
        directory of the project tree, one that blocks the engine and is
        released within its wait, one kept beyond its wait limit, or one that
        permits the engine's access; the role plants a stale staging file as a
        symbolic link and then runs the command; the role cancels the run once a
        process an AI CLI started is running; or the role runs build steps
        after scen check and a binding change: scen check, then a change to a
        Concept binding of the architecture document, then build steps with
        fix.
      terms: [command, engine, project tree, hold, staging file, symbolic link, AI CLI, Concept binding]
    - concept: the write guard is asked
      means: >-
        claude asks the write guard once whether the prepared tool call may
        run under the prepared write policy.
      terms: [claude, write guard, tool call, write policy]
  then:
    - concept: exit code
      means: >-
        The command the role ran ended with a stated exit code.
      terms: [command, exit code]
    - concept: console output
      means: >-
        What the command printed on stdout or on stderr, its answer lines and
        log records, has, or has no, match for a stated pattern.
      terms: [command, stdout, stderr, log record, pattern]
    - concept: file changes
      means: >-
        Which files of the project tree the run created, modified or deleted,
        and which it left as they were: no file at all; none outside one or two
        stated directories; a stated file and nothing else outside a stated
        directory; a stated file created, modified or unchanged; or a stated
        number of created files, none included, whose paths match a glob.
      terms: [file change, project tree, glob]
    - concept: file content
      means: >-
        What files of the project tree hold after the run, read by path or glob
        whatever they are, the engine's own log file among them: a stated file
        has, or every file matching a glob has or has no, match for a pattern; a
        stated file holds a stated number of lines; the one file matching a glob
        holds a stated number of matches for a pattern; or a rewritten file
        keeps its private permissions and is a new file, its old hard link
        keeping the previous content.
      terms: [project tree, glob, pattern, file change, engine, hard link]
    - concept: Story content
      means: >-
        The Story in a stated file of the project tree, read as a Story after
        the run: its id or its Feature; how many Acceptance Criteria it holds,
        or that each has given, when and then steps; whether the description
        of a stated Acceptance Criterion has, or has no, match for a pattern;
        or that none of that criterion's steps has a match for a pattern.
      terms: [Story, Feature, Acceptance Criterion, step, pattern, project tree]
    - concept: Registry content
      means: >-
        The Scenarios of a stated Registry, read as Scenarios after the run: how
        many come from a stated Acceptance Criterion by their lineage; whether
        the one from it cites a stated Story, sits under a stated Scenario key,
        or has an entry with a match for a pattern; that no two Scenarios share
        the same steps; or that every step of a stated Scenario is matched by
        exactly one step definition under a stated directory.
      terms: [Registry, Scenario, Scenario key, lineage, Acceptance Criterion, Story, step, step definition, pattern]
    - concept: engine activity
      means: >-
        What the engine did during the run, stated as the engine's own activity
        and never as a file read by path: the test runners it spawned, by
        program, by number, those whose arguments match a pattern, or a stated
        number of those whose arguments match a pattern; the AI turns it
        dispatched, by number, all of them or those of one kind
        (validation, fix or apply) sent to a stated AI CLI; that it logged its
        build identity once at start; or that it validated different Scenarios
        at overlapping times, each Scenario's Prompts the engine answers itself
        before those a model answers, and then showed their fix menus one at a
        time in Scenario order.
      terms: [engine, test runner, pattern, AI turn, AI CLI, log record, build identity, Scenario, Prompt, fix loop]
    - concept: after-run shell check
      means: >-
        Once the command has ended, a stated shell command run in a stated
        directory of the project tree, apart from the engine, ends with a
        stated exit code.
      terms: [command, shell command, project tree, engine, exit code]
    - concept: write guard's answer
      means: >-
        How the write guard answered claude about the tool call: it allowed
        it, it denied it, or the reason it gave has a match for a pattern.
      terms: [write guard, claude, tool call, pattern]
    - concept: AI CLI observations
      means: >-
        What the AI CLIs the fixture supplies observed of the engine's calls,
        after the run: a process an AI CLI started before the run was cancelled
        has stopped; codex, as the writer of a command's changes, held the
        fixture's dummy authentication privately for its AI turn, and it was
        removed afterwards; or, when AI turns are answered from their
        recordings, the AI CLI received the validation AI turn recorded second
        before the one recorded first.
      terms: [AI CLI, fixture, engine, AI turn, codex, command]
