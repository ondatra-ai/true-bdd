# EOF stop fixtures reuse existing requests and empty goldens byte-for-byte.
story:
  id: fix-loop-input
  feature: engine
  title: Stop clearly when nobody answers the fix loop
  as_a: System Architect
  i_want: end of input to stop the fix loop without guessing an answer
  so_that: each fix and each clarification requires a person's answer
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 007-clarification-eof-stops
    description: A clarifying question with stdin at end of input prints the question and suggestions, requires a person and stops without guessing
    steps:
    - given:
      - the "fix-loop-unanswered-eof" project tree
    - when:
      - the Quality Engineer runs "scen check --fix"
    - then:
      - the command exits with code 1
      - stdout matches What does the step "the service answers within 200 milliseconds" mean
      - stdout matches It means its reply arrives no later than that many milliseconds after the message was sent.
      - stdout matches It means the time from sending the message to its reply arriving is at most that many milliseconds.
      - stdout matches a person must answer
      - stderr matches a person must answer
      - stdout does not match User answered clarification question
      - stdout does not match SCEN CHECK COMPLETE
      - the engine dispatched 1 AI turn
      - no file outside "tmp" changed
  - id: 008-menu-eof-stops
    description: End of input at the fix menu stops because a person must choose, without a tests-still-failing error or completion banner
    steps:
    - given:
      - the "fix-loop-menu-eof" project tree
      - the project's test dependencies are installed
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 1
      - stdout matches end of input at fix menu; a person must choose whether to apply the fix
      - stderr matches end of input at fix menu; a person must choose whether to apply the fix
      - stdout does not match tests still failing
      - stderr does not match tests still failing
      - stdout does not match BUILD CODE COMPLETE
      - the engine dispatched 1 AI turn
      - no file outside "tmp" changed
