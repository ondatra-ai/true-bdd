# Story `scen-check`: `scen check` as the verifier of the Registry.
#
# The walk, the id filter and the exit code. The closure checks, the
# checklist's `D:` refusals and `scen check --fix` are Stories of their own:
# scen-check-phrases, scen-check-terms, scen-check-mappings,
# scen-check-step-definitions, checklist-checks and scen-check-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: scen-check
    feature: scen-check
    title: Verify the Registry with scen check and gate a change on its exit code
    as_a: Quality Engineer
    i_want: to walk the Registry's Scenarios through the scen-check checklist, every one of them or only the ones I name by id, and have the command exit non-zero when any Scenario fails
    so_that: a bare scen check can stop a change that leaves a Scenario failing, and the Registry can be reworked one bounded group of Scenarios at a time
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-claimed-scenario-passes
          description: A registry scenario a Story claims that satisfies every prompt of the shipped checklist, its closure checks and its model questions alike, must pass the walk and report success
          steps:
            - given:
                - the "scen-check-happy-path" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - stdout matches SCEN CHECK
                - and: stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass
                - and: stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=2 answer=pass
                - and: stdout matches msg="Check answered" check=term-mappings subjectID=E2E-001 promptIndex=3 answer=pass
                - and: stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=4 answer=pass
                - and: 'stdout matches PASS: 14 '
                - and: stdout matches ALL CHECKS PASSED!
                - and: stdout matches SCEN CHECK COMPLETE
                - and: the engine dispatched 10 AI turns
                - and: no file outside "tmp" changed
        - id: 002-failed-scenario-exits-1
          description: A registry scenario that fails a walked prompt of the shipped checklist, a model question or a closure check, must be reported as failed and make the command exit 1, so a bare `scen check` can gate a change
          steps:
            - given:
                - the "scen-check-validation-fails" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches SCEN CHECK
                - and: stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass
                - and: 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-002 promptIndex=1 answer=fail context="\[E2E-002: then step \\"the greeter prints \\"Hello Ada\\" on one line\\" matches no template\]"'
                - and: stdout matches msg="Prompt skipped after a failed check" subjectID=E2E-002 promptIndex=14
                - and: 'stdout matches SKIP: 10\n'
                - and: stdout matches Validation failed
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched 10 AI turns
                - and: no file outside "tmp" changed
        - id: 003-unknown-id-refused
          description: An id naming no scenario in the registry must be refused before the first prompt, never walked as an empty selection
          steps:
            - given:
                - the "scen-check-unknown-id" project tree
            - when:
                - the Quality Engineer runs "scen check E2E-999"
            - then:
                - the command exits with code 1
                - stdout matches SCEN CHECK
                - and: stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-empty-registry-refused
          description: A registry that parses but holds no scenarios must be refused, so the walk never reports success over nothing
          steps:
            - given:
                - the "scen-check-empty-registry" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches SCEN CHECK
                - and: stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-ids-narrow-the-walk
          description: Ids given on the command line must narrow the walk to exactly those scenarios, in ascending id order whatever order they were typed
          steps:
            - given:
                - the "scen-check-id-filter" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario's description follows the rule-based format" prompt
            - when:
                - the Quality Engineer runs "scen check E2E-002 E2E-001"
            - then:
                - the command exits with code 0
                - stdout matches SCEN CHECK
                - and: stdout matches ALL CHECKS PASSED!
                - and: the engine dispatched 2 AI turns
                - but: stdout does not match E2E-003
                - and: no file outside "tmp" changed
