story:
    id: build-tests-files
    feature: build-tests
    title: Keep generated files equal to the Registry without overwriting hand-written tests
    as_a: System Architect
    i_want: build tests to refuse stale generated files without --fix, rewrite them with --fix, and refuse hand-written files or foreign packages
    so_that: the rendered tests remain faithful and hand-written files remain intact
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-stale-test-refused
          description: Without `--fix`, a generated test file that is missing or differs from what the Registry renders must refuse `build tests`, naming each such file and the command that regenerates it, and must leave every file as it was
          steps:
            - given:
                - the "build-tests-stale-generated-test" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: 'stdout matches tests/mcp/session_test\.go: no generated test file'
                - and: 'stdout matches tests/mcp/ticket_test\.go: the generated test file is not what the registry renders'
                - and: 'stdout matches regenerate with: true-bdd build tests --fix'
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 002-stale-test-regenerated
          description: Under `--fix`, a generated test file that differs from what the Registry renders must be rewritten to match it, while a generated test file that already matches must be left untouched
          steps:
            - given:
                - the "build-tests-regenerate-stale-test" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - stdout matches msg="Generated test files from the registry" count=1 files=tests/mcp/ticket_test\.go
                - and: the file "tests/mcp/ticket_test.go" is modified
                - and: the file "tests/mcp/ticket_test.go" matches the session is granted a ticket within 5 seconds
                - but: the file "tests/mcp/session_test.go" is unchanged
                - and: stdout matches BUILD TESTS COMPLETE
                - and: the engine logged its build identity once at start
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" and "tests" changed
        - id: 003-hand-written-test-kept
          description: Under `--fix`, a Registry `path:` naming a hand-written test file, one without the `// Code generated` header, must refuse `build tests`, naming that file, before any generated test file is rewritten
          steps:
            - given:
                - the "build-tests-hand-written-test-kept" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: 'stdout matches tests/mcp/ticket_test\.go: refusing to overwrite a file that is not marked generated'
                - but: the file "tests/mcp/ticket_test.go" is unchanged
                - and: the file "tests/mcp/session_test.go" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-foreign-package-refused
          description: A hand-written test file in a generated test's directory that declares a package other than the one the directory's name derives must refuse `build tests`, naming the file and both package names
          steps:
            - given:
                - the "build-tests-foreign-test-package" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: 'stdout matches tests/mcp/support_test\.go: the target directory declares a different package'
                - and: stdout matches the directory declares \\"mcpserver_test\\", the suite name derives \\"mcp_test\\"
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
