story:
  id: scen-check-speed
  feature: scen-check
  title: Validate Scenarios concurrently with faithful replay
  as_a: Quality Engineer
  i_want: concurrent Scenario validation with ordered fixes, each binding and each linked concept's words judged once per walk, and replay by request
  so_that: a large Registry can be checked promptly and replayed offline
  status: IMPLEMENTED
  acceptance_criteria:
    - id: 001-overlapping-validation
      description: Concurrent validation preserves each Scenario gate and Prompt order and serializes fixes in Scenario order
      steps:
        - given:
            - "the \"scen-check-concurrent\" project tree"
            - "the validation CLIs are controlled for concurrent arrival"
            - "the Quality Engineer's answers are \"1/1/3\" line by line"
        - when:
            - "the Quality Engineer runs \"scen check --fix\""
        - then:
            - "the command exits with code 1"
            - "Scenario validation overlaps with ordered gates and fix menus"
            - 'stdout matches Exiting\.'
            - 'stdout does not match Walk stopped'
    - id: 002-reverse-request-replay
      description: A concurrent walk replays when its validation requests arrive in reverse recorded order
      steps:
        - given:
            - "the \"scen-check-reverse\" project tree"
            - "the validation CLIs are controlled for concurrent arrival"
            - "the Quality Engineer's answers are \"1/1/3\" line by line"
        - when:
            - "the Quality Engineer runs \"scen check --fix\""
        - then:
            - "the command exits with code 1"
            - "Scenario validation overlaps with ordered gates and fix menus"
            - 'stdout matches Exiting\.'
            - 'stdout does not match Walk stopped'
            - "replay consumes the recorded validation requests in reverse order"
    - id: 003-shared-judgements
      description: A walk judges each binding and each linked concept's words once, and every Scenario using them answers from those verdicts
      steps:
        - given:
            - "the \"scen-check-shared-judgements\" project tree"
        - when:
            - "the Quality Engineer runs \"scen check\""
        - then:
            - "the command exits with code 0"
            - "the engine dispatched 8 AI turns"
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Shared concept judgement answered","promptIndex":2,"judgement":"bindings","concept":"when:halve"'
            - 'every file matching "tmp/*/02-shared-02-bindings-when-halve-*-user.txt" matches the number is halved'
            - 'every file matching "tmp/*/02-shared-02-bindings-when-halve-*-user.txt" matches halve the number'
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-001","promptIndex":2,"judgement":"bindings","answer":"pass"'
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-002","promptIndex":2,"judgement":"bindings","answer":"pass"'
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Shared concept judgement answered","promptIndex":3,"judgement":"words","concept":"when:halve"'
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-001","promptIndex":3,"judgement":"words","answer":"pass"'
            - 'the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-002","promptIndex":3,"judgement":"words","answer":"pass"'
            - 'no file outside "tmp" changed'
