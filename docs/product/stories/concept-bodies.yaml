story:
  id: concept-bodies
  feature: build-steps
  title: Write and verify concept definitions from referenced Specification evidence
  as_a: System Architect
  i_want: each definition verified against its Concept and binding with complete referenced evidence
  so_that: its pattern captures the step meaning and its body relies only on declared contracts
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-three-cases
    description: A suite whose steps include matches and does not match, a set of operations and an optional
      word with meaning under their concepts gets patterns capturing each alternative and bodies that
      tell them apart
    steps:
    - given:
      - the "concept-bodies-cases" project tree
      - the System Architect's answer to every question is "1"
    - when: &id001
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches Concept pattern binds.*step="the calculator's output does not match .*captures="does
        not
      - stdout matches Concept pattern binds.*step="the Owner doubles 6" captures=.*doubl
      - stdout matches Concept pattern binds.*step="the Owner exactly halves 7" captures=.*exactly
      - stdout matches BUILD STEPS COMPLETE
      - no file outside "tmp" and "tests" changed
      - the shell command "go test -tags bdd -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 002-fixture-prompt
    description: The body turns' saved prompts should name the Registry, Scenario keys and fixture paths
    steps:
    - given:
      - the "concept-bodies-prompt" project tree
      - the System Architect's answer to every question is "1"
    - when: *id001
    - then:
      - the command exits with code 0
      - 'every file matching "tmp/*/*fix-iter1-user.txt" matches registry: ./docs/scenarios.yaml'
      - 'every file matching "tmp/*/*fix-iter1-user.txt" matches fixture_root: tests/calc/fixtures'
      - 'every file matching "tmp/*/*fix-iter1-user.txt" matches fixture: offline'
      - every file matching "tmp/*/*fix-iter1-user.txt" matches calc-001-halve
      - every file matching "tmp/*/*fix-iter1-user.txt" does not match CALC_REAL_GO must name the real go
      - 'every file matching "tmp/*/apply-*-user.txt" matches fixture_root: tests/calc/fixtures'
      - 'every file matching "tmp/*/apply-*-user.txt" matches fixture: offline'
      - every file matching "tmp/*/apply-*-user.txt" matches calc-001-halve
      - stdout matches BUILD STEPS COMPLETE
      - no file outside "tmp" and "tests" changed
  - id: 003-fixture-contract
    description: The step-verification Checklist item passes a body that supplies CALC_REAL_GO as the host's toolchain binding declares
    steps:
    - given:
      - the "concept-bodies-contract" project tree
      - the System Architect's answer to every question is "1"
    - when: *id001
    - then:
      - the command exits with code 0
      - stdout matches Step definition verified.*findings=\[\]
      - some file matching "tests/calc/steps/*.go" or "tests/calc/helpers/*.go" matches CALC_REAL_GO
      - every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches CALC_REAL_GO
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match fixture_inputs:'
      - stdout matches BUILD STEPS COMPLETE
      - no file outside "tmp" and "tests" changed
      - the shell command "go test -tags bdd -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 004-extra-requirement
    description: The verification Checklist item fails a body requiring an undeclared prerequisite, and its F rewrites that body
    steps:
    - given:
      - the "concept-bodies-extra" project tree
      - the System Architect's answer to every question is "1"
    - when: *id001
    - then:
      - the command exits with code 0
      - stdout matches Step definition verified.*concept_binding
      - stdout matches Step definition verified.*findings=\[\]
      - stdout does not match Verification sent the patterns back
      - every file matching "tests/calc/steps/concept*.go" does not match CALC_LICENCE|state\.Halve\(
      - stdout matches BUILD STEPS COMPLETE
      - no file outside "tmp" and "tests" changed
      - the shell command "go test -tags bdd -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 005-wrong-capture
    description: The verification Checklist item finds a wrong capture; its F proposes the pattern and writes the body, then its Q and the restarted pattern-bindings Q judge it
    steps:
    - given:
      - the "concept-bodies-capture" project tree
      - the System Architect's answer to every question is "1"
    - when: *id001
    - then:
      - the command exits with code 0
      - stdout matches Step definition verified.*pattern_captures
      - stdout matches Verification sent the patterns back to the proposal
      - stdout matches Check answered.*check=pattern-bindings.*answer=pass
      - stdout matches Concept skeletons rewritten.*removed=1
      - stdout matches Concept pattern binds.*step="the Owner halves 64" captures=64
      - stdout matches BUILD STEPS COMPLETE
      - no file outside "tmp" and "tests" changed
      - the shell command "go test -tags bdd -count=1 ./tests/calc/..." run in "." exits with code 0
