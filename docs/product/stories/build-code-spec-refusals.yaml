# Story `build-code-spec`: `build code` reads the Specification and refuses an unusable architecture.
#
# The architecture document is undecodable, declares no services, never
# says how its tests run, or omits the command the suite runs in replay:
# each is refused at startup, before a test runner is spawned or an AI
# turn dispatched. A suite command that is declared but cannot be run as
# written is the Story build-code-commands; running the declared suite and
# the fix loop is build-code-run.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `build-code-spec-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: build-code-spec
    feature: build-code
    title: Read the Specification and refuse an unusable architecture
    as_a: System Architect
    i_want: build code to refuse an unusable architecture and hand each fix the declared Specification of its failing Scenario, warning when optional documents cannot be read
    so_that: repairs follow the Specification and an unavailable optional document never prevents a repair
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-malformed-spec-refused
          description: A spec the loader cannot decode must be refused with the file named
          steps:
            - given:
                - the "build-code-malformed-spec" project tree
            - when:
                - the System Architect runs "build code"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches failed to parse architecture file
                - stdout matches docs/architecture/architecture\.yaml
                - but: no file outside "tmp" changed
                - and: the file "docs/architecture/architecture.yaml" is unchanged
                - and: the engine spawned no test runner
                - and: the engine dispatched no AI turns
        - id: 002-no-services-refused
          description: An architectural spec that declares no services at all must be refused, not walked to a trivial success
          steps:
            - given:
                - the "build-code-no-services" project tree
            - when:
                - the System Architect runs "build code"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches no services to walk
                - but: no file outside "tmp" changed
                - and: the engine spawned no test runner
                - and: the engine dispatched no AI turns
        - id: 003-no-test-suite-refused
          description: An architectural spec that never says how its tests run must be refused, not walked to a trivial success
          steps:
            - given:
                - the "build-code-no-suites" project tree
            - when:
                - the System Architect runs "build code"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches declares no testing framework
                - but: no file outside "tmp" changed
                - and: the engine spawned no test runner
                - and: the engine dispatched no AI turns
        - id: 004-no-replay-command-refused
          description: A test suite that does not say how to run itself must be refused, not run some other way
          steps:
            - given:
                - the "build-code-missing-suite-command" project tree
            - when:
                - the System Architect runs "build code"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches commands\.replay
                - stdout matches architecture\.testing\[go-test\]
                - but: no file outside "tmp" changed
                - and: the engine spawned no test runner
                - and: the engine dispatched no AI turns

        - id: 005-matched-scenario-embedded
          description: A failing generated Go test must hand both fix turns its Scenario and the concept meanings of its steps
          steps:
          - given:
            - the "build-code-spec-scenario" project tree
            - the System Architect answers "1" to every question
          - when:
            - the System Architect runs "build code --fix"
          - then:
            - the command exits with code 0
            - stdout matches BUILD CODE COMPLETE
            - every file matching "tmp/*/*fix-iter*-user.txt" matches \*\*Scenario ID:\*\* calc-001-double
            - every file matching "tmp/*/*fix-iter*-user.txt" matches \*\*Service:\*\* calc
            - every file matching "tmp/*/*fix-iter*-user.txt" matches tests/calc/calc_test.go
            - every file matching "tmp/*/*fix-iter*-user.txt" matches the Owner doubles 3
            - every file matching "tmp/*/*fix-iter*-user.txt" matches The Owner doubles a whole number with the calculator.
            - every file matching "tmp/*/*fix-iter*-user.txt" matches An integer operand whose double is its sum with itself.
            - every file matching "tmp/*/*fix-iter*-user.txt" matches The integer argument and stdout of the calculator double command.
            - every file matching "tmp/*/*fix-iter*-user.txt" matches The step runs double as a process and compares its integer stdout
            - every file matching "tmp/*/apply-*-user.txt" matches \*\*Scenario ID:\*\* calc-001-double
            - every file matching "tmp/*/apply-*-user.txt" matches \*\*Service:\*\* calc
            - every file matching "tmp/*/apply-*-user.txt" matches tests/calc/calc_test.go
            - every file matching "tmp/*/apply-*-user.txt" matches the Owner doubles 3
            - every file matching "tmp/*/apply-*-user.txt" matches The Owner doubles a whole number with the calculator.
            - every file matching "tmp/*/apply-*-user.txt" matches An integer operand whose double is its sum with itself.
            - every file matching "tmp/*/apply-*-user.txt" matches The integer argument and stdout of the calculator double command.
            - every file matching "tmp/*/apply-*-user.txt" matches The step runs double as a process and compares its integer stdout
            - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0

        - id: 006-unreadable-product-warned
          description: A declared product document that cannot be read must be warned about while the fix still repairs the failing
            test
          steps:
          - given:
            - the "build-code-spec-missing-product" project tree
            - the System Architect answers "1" to every question
          - when:
            - the System Architect runs "build code --fix"
          - then:
            - the command exits with code 0
            - stdout matches BUILD CODE COMPLETE
            - stdout matches level=WARN.*document=product.*error=.*docs/product/missing.yaml
            - every file matching "tmp/*/*fix-iter*-user.txt" matches \*\*Scenario ID:\*\* calc-001-double
            - every file matching "tmp/*/*fix-iter*-user.txt" does not match What the spec says
            - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0

        - id: 007-unreadable-registry-warned
          description: A declared Registry that cannot be read must be warned about while the fix uses the only declared service
          steps:
          - given:
            - the "build-code-spec-missing-registry" project tree
            - the System Architect answers "1" to every question
          - when:
            - the System Architect runs "build code --fix"
          - then:
            - the command exits with code 0
            - stdout matches BUILD CODE COMPLETE
            - stdout matches level=WARN.*document=scenarios_yaml.*error=.*docs/missing.yaml
            - every file matching "tmp/*/*fix-iter*-user.txt" matches \*\*Service:\*\* calc
            - 'every file matching "tmp/*/*fix-iter*-user.txt" does not match Scenario ID:'
            - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0

        - id: 008-linked-concepts-embedded
          description: On a concept host both fix turns must embed each concept the failing Scenarios link to, with its meaning, its words and its binding, and no concept they do not link
          steps:
          - given:
            - the "build-code-spec-concepts" project tree
            - the System Architect answers "1" to every question
          - when:
            - the System Architect runs "build code --fix"
          - then:
            - the command exits with code 0
            - stdout matches BUILD CODE COMPLETE
            - every file matching "tmp/*/*fix-iter*-user.txt" matches \*\*Scenario ID:\*\* calc-002-halve
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches `installation` \(given concept\): The calculator program is built from its source and ready for the Owner to run\.'
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches `doubling` \(when concept\): The Owner doubles a whole number with the calculator\.'
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches `halving` \(when concept\): The Owner halves an even whole number with the calculator\.'
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches `result` \(then concept\): The calculator prints the whole number the operation produced\.'
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches Bound for calc through command: double, command: halve: Build the declared calculator commands'
            - 'every file matching "tmp/*/*fix-iter*-user.txt" matches Bound for calc through command: halve: Run the kept calculator program''s halve command'
            - every file matching "tmp/*/*fix-iter*-user.txt" matches An integer operand whose double is its sum with itself\.
            - every file matching "tmp/*/*fix-iter*-user.txt" matches The integer argument and stdout of the calculator's double and halve commands\.
            - every file matching "tmp/*/*fix-iter*-user.txt" does not match The Owner squares a whole number
            - 'every file matching "tmp/*/*fix-iter*-user.txt" does not match \#\#\# Phrases'
            - every file matching "tmp/*/apply-*-user.txt" matches \*\*Scenario ID:\*\* calc-002-halve
            - 'every file matching "tmp/*/apply-*-user.txt" matches `installation` \(given concept\): The calculator program is built from its source and ready for the Owner to run\.'
            - 'every file matching "tmp/*/apply-*-user.txt" matches `doubling` \(when concept\): The Owner doubles a whole number with the calculator\.'
            - 'every file matching "tmp/*/apply-*-user.txt" matches `halving` \(when concept\): The Owner halves an even whole number with the calculator\.'
            - 'every file matching "tmp/*/apply-*-user.txt" matches `result` \(then concept\): The calculator prints the whole number the operation produced\.'
            - 'every file matching "tmp/*/apply-*-user.txt" matches Bound for calc through command: double, command: halve: Build the declared calculator commands'
            - 'every file matching "tmp/*/apply-*-user.txt" matches Bound for calc through command: halve: Run the kept calculator program''s halve command'
            - every file matching "tmp/*/apply-*-user.txt" matches An integer operand whose double is its sum with itself\.
            - every file matching "tmp/*/apply-*-user.txt" matches The integer argument and stdout of the calculator's double and halve commands\.
            - every file matching "tmp/*/apply-*-user.txt" does not match The Owner squares a whole number
            - 'every file matching "tmp/*/apply-*-user.txt" does not match \#\#\# Phrases'
            - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
            - the engine dispatched no validation AI turns to "claude"
