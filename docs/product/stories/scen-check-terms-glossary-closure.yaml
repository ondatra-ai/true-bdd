# Story `scen-check-terms`: `scen check` holds the words a host's concepts
# declare to the product glossary.
#
# The `declared-terms` verdicts: a term defined twice, and a product
# document with no concepts. Feature `scen-check`, beside the Stories
# scen-check (the walk), scen-check-mappings, scen-check-step-definitions
# and scen-check-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-terms-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: scen-check-terms
    feature: scen-check
    title: Hold every word a host's concepts declare to one glossary definition
    as_a: Quality Engineer
    i_want: scen check to fail every Scenario when a term a concept declares is missing from the product glossary or defined there more than once, naming the concept and the term, and to leave every Scenario unchecked when the product document declares no concepts
    so_that: every word a step's meaning relies on has exactly one definition a reader and a step definition can follow, and the gap is reported before any AI turn is spent
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 003-term-defined-twice-fails
          description: A term a concept declares, which the glossary defines more than once, must fail every Scenario, naming the concept, the term and how many times it is defined, because a word with two meanings has none a reader can rely on
          steps:
            - given:
                - the "scen-check-term-defined-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: then concept ''answer'': the glossary defines \\"reply\\" 2 times\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 004-no-catalogue-unchecked
          description: A product document that declares no concepts must leave every Scenario unchecked by the declared-term check, saying so, whatever its glossary holds
          steps:
            - given:
                - the "scen-check-terms-no-catalogue" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: not checked: the product document declares no concepts\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
