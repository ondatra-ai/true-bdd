# Story `scen-check-terms`: `scen check` holds a claimed Scenario's words to
# the product glossary.
#
# The `declared-terms` verdicts: an undefined term, every term defined, a
# term defined twice, and a product document with no catalogue. Feature
# `scen-check`, beside the Stories scen-check (the walk), scen-check-phrases,
# scen-check-mappings, scen-check-step-definitions and scen-check-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-terms-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: scen-check-terms
    feature: scen-check
    title: Hold every word a claimed Scenario's phrases declare to one glossary definition
    as_a: Quality Engineer
    i_want: scen check to fail a Scenario a Story claims when a term that the catalogue templates its steps match declare is missing from the product glossary or defined there more than once, naming the term, and to pass it naming the terms it found defined once
    so_that: every word a step's meaning relies on has exactly one definition a reader and a step definition can follow, and the gap is reported before any AI turn is spent
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-undefined-term-fails
          description: A term that the catalogue template a step matches declares, and that the product glossary does not define, must fail the Scenario a Story claims, naming the template and the term, while a term only an unmatched template declares is no failure of that Scenario
          steps:
            - given:
                - the "scen-check-term-undefined" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: \\"the service answers \\"\{reply\}\\"\\" declares \\"reply\\", which the glossary does not define\]"'
                - but: stdout does not match the service restarts
                - and: 'stdout matches scen-check/term_closure +D: declared-terms +fail +FAIL'
                - and: stdout matches Validation failed
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 002-defined-terms-pass
          description: A Scenario a Story claims must pass the declared-term check when the glossary defines every term the templates its steps match declare, naming those terms, while a Scenario no Story claims passes unchecked and one whose templates declare no term passes saying so
          steps:
            - given:
                - the "scen-check-terms-defined" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: every declared term is defined: mcp service, message, reply\]"'
                - and: 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-002 promptIndex=1 answer=pass context="\[E2E-002: not checked: no Story claims this Scenario yet\]"'
                - and: 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-003 promptIndex=1 answer=pass context="\[E2E-003: no matched template declares a term\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 003-term-defined-twice-fails
          description: A term the glossary defines more than once must fail every Scenario a Story claims that relies on it, naming the term and how many times it is defined, because a word with two meanings has none a reader can rely on
          steps:
            - given:
                - the "scen-check-term-defined-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: the glossary defines \\"reply\\" 2 times\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 004-no-catalogue-unchecked
          description: A product document that declares no catalogue must leave every Scenario unchecked by the declared-term check, saying so, whatever its glossary holds
          steps:
            - given:
                - the "scen-check-terms-no-catalogue" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: not checked: the product document declares no catalogue\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
