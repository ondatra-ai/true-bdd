story:
    id: build-tests-steps
    feature: build-tests
    title: Render tests named after their Scenario keys and refuse unreadable concepts
    as_a: System Architect
    i_want: build tests to render named tests and refuse product concepts it cannot decode
    so_that: rendering is deterministic and cannot bypass the concepts the product declares
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 002-test-named-after-key
          description: A Scenario keyed by its lower-case lineage must get a CamelCase test name that `go test` runs, while a legacy `E2E-NNN` key keeps the name it always had
          steps:
            - given:
                - the "build-tests-lineage-key-test-names" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - and: the file "tests/mcp/mcp_test.go" is created
                - and: the file "tests/mcp/mcp_test.go" matches func TestMcpEndpoint001InitializeOk\(t \*testing\.T\)
                - and: the file "tests/mcp/mcp_test.go" matches scenarios\.New\(t, "mcp-endpoint-001-initialize-ok"\)
                - and: the file "tests/mcp/mcp_test.go" matches func TestE2E900\(t \*testing\.T\)
                - and: the engine dispatched no AI turns
                - but: no file outside "tmp" and "tests" changed
        - id: 007-unreadable-catalogue-refused
          description: '`build tests --fix` must refuse a product document whose concepts it cannot read, before it writes a generated test and before any AI turn, rather than author steps blind to the spec the host declared'
          steps:
            - given:
                - the "build-tests-fix-unreadable-catalogue" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: 'stdout matches product document \./docs/product/product\.yaml: concepts: requires given, when or then lists with concept, means and terms'
                - and: the engine dispatched no AI turns
                - but: no file outside "tmp" changed
