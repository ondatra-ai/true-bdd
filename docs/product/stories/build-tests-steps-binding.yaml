# Story `build-tests-steps`: `build tests` binding a Scenario's steps to
# step definitions, and authoring the definitions it lacks.
#
# The generated test and its name, step coverage the engine resolves
# itself (no coverage command to declare, a pattern it cannot read, a step
# two definitions match) and step definitions authored from the spec. The
# refusals of a Registry or a checklist `build tests` cannot walk are the
# Story build-tests-refusals; `build code` has Stories of its own.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `build-tests-steps-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: build-tests-steps
    feature: build-tests
    title: Generate a test for every Scenario and bind each of its steps to one step definition, written from the spec when missing
    as_a: System Architect
    i_want: build tests to render one test per Scenario named after its key, to find for itself the steps no step definition binds while refusing a pattern it cannot read or a step two definitions match, and with --fix to author each missing definition from the catalogue, the glossary and the word mapping
    so_that: every Scenario runs as a test whose steps observe what the spec says, with no coverage command to declare and no step definition to write by hand
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-unbound-scenario-gets-test-and-steps
          description: A registry scenario with no test must get a generated test file and a step definition for every step it declares
          steps:
            - given:
                - the "build-tests-fix-happy-path" project tree
                - the System Architect answers "1" to every question
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - and: the file "tests/mcp/mcp_test.go" is created
                - and: the file "tests/mcp/mcp_test.go" matches // Code generated by `true-bdd build tests`\. DO NOT EDIT\.
                - and: the file "tests/mcp/mcp_test.go" matches scenarios\.New\(t, "INT-900"\)
                - and: exactly 1 file matching "tests/mcp/steps/*.go" is created
                - and: every step of scenario "INT-900" in "docs/scenarios.yaml" is matched by a step definition under "tests/mcp/steps"
                - but: the file "docs/scenarios.yaml" is unchanged
                - and: no file outside "tmp" and "tests" changed
        - id: 002-test-named-after-key
          description: A Scenario keyed by its lower-case lineage must get a CamelCase test name that `go test` runs, while a legacy `E2E-NNN` key keeps the name it always had
          steps:
            - given:
                - the "build-tests-lineage-key-test-names" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - and: the file "tests/mcp/mcp_test.go" is created
                - and: the file "tests/mcp/mcp_test.go" matches func TestMcpEndpoint001InitializeOk\(t \*testing\.T\)
                - and: the file "tests/mcp/mcp_test.go" matches scenarios\.New\(t, "mcp-endpoint-001-initialize-ok"\)
                - and: the file "tests/mcp/mcp_test.go" matches func TestE2E900\(t \*testing\.T\)
                - and: the engine dispatched no AI turns
                - but: no file outside "tmp" and "tests" changed
        - id: 003-only-unbound-scenarios-walked
          description: A host that declares no coverage command must still walk only the scenarios with an unbound step, because the engine resolves step coverage itself
          steps:
            - given:
                - the "build-tests-coverage-in-process" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - and: stdout matches 2 of 2 scenario\(s\) already bind every step; walking 0\.
                - and: the engine dispatched no AI turns
                - and: the engine spawned no test runners
                - and: the file "tests/mcp/mcp_test.go" is created
                - but: no file outside "tmp" and "tests" changed
        - id: 004-unfoldable-pattern-refused
          description: A step pattern the engine cannot resolve to a constant must be refused by name, never skipped, because a skipped pattern reports a bound step as unbound
          steps:
            - given:
                - the "build-tests-coverage-computed-pattern" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: stdout matches step pattern is not a constant expression
                - and: stdout matches tests/mcp/steps/steps\.go
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-double-bound-step-refused
          description: A step matched by two definitions must be refused rather than reported as a gap, because which one runs depends on registration order and a third would paper over it
          steps:
            - given:
                - the "build-tests-coverage-ambiguous-step" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: stdout matches step matches more than one definition
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 006-steps-authored-from-spec
          description: '`build tests --fix` must author an unbound step from the spec: its step-authoring prompt carries the catalogue phrase the step matches, the glossary meaning of each word that phrase relies on and the architecture''s mapping of that word, so the step definition observes what the mapping says'
          steps:
            - given:
                - the "build-tests-fix-from-spec" project tree
                - the System Architect answers "1" to every question
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - and: stdout matches msg="Unbound steps specified" subjectID=INT-901 steps=3 phrases=4 terms=4
                - and: stdout matches msg="Unbound steps specified" subjectID=INT-902 steps=3 phrases=4 terms=4
                - and: the file "tests/mcp/mcp_test.go" is created
                - and: every step of scenario "INT-901" in "docs/scenarios.yaml" is matched by a step definition under "tests/mcp/steps"
                - and: every step of scenario "INT-902" in "docs/scenarios.yaml" is matched by a step definition under "tests/mcp/steps"
                - and: 'judge: the step definitions created under tests/mcp/steps observe each word the way the word mapping says: the server''s address comes from the MCP_PORT environment variable, 7411 when it is unset, and the server counts as running once GET /healthz answers 200; a session is opened by POSTing a JSON-RPC request whose method is initialize to /mcp; the ticket is the reply''s X-Session-Ticket header, which must be 32 lowercase hexadecimal characters; and the protocol version is the reply''s X-MCP-Protocol header, a date in YYYY-MM-DD form'
                - but: no file outside "tmp" and "tests" changed
        - id: 007-unreadable-catalogue-refused
          description: '`build tests --fix` must refuse a product document whose catalogue it cannot read, before it writes a generated test and before any AI turn, rather than author steps blind to the spec the host declared'
          steps:
            - given:
                - the "build-tests-fix-unreadable-catalogue" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: 'stdout matches read the catalogue: product document \./docs/product/product\.yaml: catalogue: must hold a list of phrases'
                - and: the engine dispatched no AI turns
                - but: no file outside "tmp" changed
