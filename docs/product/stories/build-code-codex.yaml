story:
  id: build-code-codex
  feature: build-code
  title: Repair a failing set with a confined codex writer
  as_a: System Architect
  i_want: a codex writer confined to the host project and runtime exceptions
  so_that: replay tests judge its repairs without access to neighbouring implementations
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-selection
    description: A confined codex writer runs a granted selection and converges the failing set
    steps:
    - given:
      - the "build-code-codex-selection" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout does not match msg="Writer turn failed"
      - the engine dispatched no validation AI turns to "claude"
      - the engine dispatched 1 fix AI turn to "claude"
      - the engine dispatched 1 apply AI turn to "codex"
      - the engine spawned exactly 3 test runners
      - the file "services/calc/calc.go" is modified
      - the file "tests/suite/calc_test.go" is unchanged
      - every file matching "tmp/*/*codex-events.jsonl" matches "command":.*go test .* -run
      - every file matching "tmp/*/*codex-events.jsonl" matches "exit_code":0
      - stdout matches BUILD CODE COMPLETE
      - stdout does not match msg="Walk stopped"
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 002-nonzero
    description: A started codex writer exiting non-zero preserves edits and converges after one warning
    steps:
    - given:
      - the "build-code-codex-nonzero" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches level=WARN msg="Writer turn failed" outcome="non-zero exit"
      - the file matching "tmp/true-bdd.log.json" has exactly 1 match for "level":"WARN","msg":"Writer turn failed"
      - the engine dispatched no validation AI turns to "claude"
      - the engine dispatched 1 fix AI turn to "claude"
      - the engine dispatched 1 apply AI turn to "codex"
      - the engine spawned exactly 3 test runners
      - the file "services/calc/calc.go" is modified
      - the file "tests/suite/calc_test.go" is unchanged
      - every file matching "tmp/*/*codex-events.jsonl" matches "command":.*go test .* -run
      - every file matching "tmp/*/*codex-events.jsonl" matches "exit_code":0
      - stdout matches BUILD CODE COMPLETE
      - stdout does not match msg="Walk stopped"
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
