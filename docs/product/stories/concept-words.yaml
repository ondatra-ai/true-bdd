story:
  id: concept-words
  feature: scen-check
  title: Judge linked concepts in declared words
  as_a: Product Owner
  i_want: linked meanings to rely on declared terms and plain English
  so_that: their steps have one readable meaning before code is written
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-declare
    description: A word repair must declare a glossary term and concept term through the refinement menu
    steps:
    - given:
      - the "concept-words-declare" project tree
      - the Product Owner answers "1" to every question
    - when:
      - the Product Owner runs "us refine host --fix"
    - then:
      - the command exits with code 0
      - stdout matches undeclared domain word idempotency key
      - stdout matches action=apply
      - stdout matches judgement=words answer=pass
      - the file "docs/product/product.yaml" matches (?s)("terms":\s*\[\s*"idempotency key"|terms:\s*\n\s*- idempotency key)
      - 'the file "docs/product/product.yaml" matches (?s)("term":\s*"idempotency key",\s*"means":\s*"[^\"]+"|term: idempotency key\s+means:)'
      - the only file changed outside "tmp" is "docs/product/product.yaml"
  - id: 002-reword
    description: A word repair must reword means in product words without a new term
    steps:
    - given:
      - the "concept-words-reword" project tree
      - the Product Owner answers "1" to every question
    - when:
      - the Product Owner runs "us refine host --fix"
    - then:
      - the command exits with code 0
      - stdout matches undeclared domain word idempotency key
      - stdout matches action=apply
      - stdout matches judgement=words answer=pass
      - every file matching "docs/product/product.yaml" does not match idempotency key
      - the file "docs/product/product.yaml" matches ("glossary":\s*\[\]|glossary:\s*\[\])
      - the only file changed outside "tmp" is "docs/product/product.yaml"
  - id: 003-plain
    description: Declared terms and contextually plain English must pass for claimed and unclaimed Scenarios
    steps:
    - given:
      - the "concept-words-plain" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 0
      - the engine dispatched 4 AI turns
      - stdout matches judgement=words answer=pass
      - stdout does not match undeclared domain word
      - stdout does not match then:unused
      - no file outside "tmp" changed
      - the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-001","promptIndex":2,"judgement":"words"
      - the file matching "tmp/true-bdd.log.json" has exactly 1 matches for "msg":"Concept judgement answered","subjectID":"host-002","promptIndex":2,"judgement":"words"
  - id: 004-scenario-fail
    description: An unclaimed Scenario must fail a fresh word judgement naming the undeclared word
    steps:
    - given:
      - the "concept-words-scenario-fail" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches judgement=words answer=fail
      - stdout matches undeclared domain word idempotency key
      - no file outside "tmp" changed
  - id: 005-mapping
    description: A newly declared concept term must fail term mappings until its menu fix adds a Word mapping
    steps:
    - given:
      - the "concept-words-mapping" project tree
      - the Product Owner answers "1" to every question
    - when:
      - the Product Owner runs "scen check --fix"
    - then:
      - the command exits with code 0
      - stdout matches check=term-mappings.*answer=fail
      - stdout matches idempotency key.*has no mapping
      - stdout matches action=apply
      - stdout matches check=term-mappings.*answer=pass
      - stdout matches judgement=words answer=pass
      - the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
  - id: 006-scenario-fix
    description: A Scenario word repair must update the product through its menu before a separate Word mapping repair
    steps:
    - given:
      - the "concept-words-scenario-fix" project tree
      - the Product Owner answers "1" to every question
    - when:
      - the Product Owner runs "scen check --fix"
    - then:
      - the command exits with code 0
      - stdout matches judgement=words answer=fail
      - stdout matches undeclared domain word idempotency key
      - stdout matches check=term-mappings.*answer=fail
      - stdout matches check=term-mappings.*answer=pass
      - stdout matches judgement=words answer=pass
      - the file matching "tmp/true-bdd.log.json" has exactly 2 matches for "action":"apply"
      - the file "docs/product/product.yaml" is modified
      - the file "docs/architecture/architecture.yaml" is modified
      - the file "docs/scenarios.yaml" is unchanged
      - the file "docs/product/stories/host-story.yaml" is unchanged
