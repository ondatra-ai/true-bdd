# Story `scen-check-quality-fix`: `scen check --fix` rewriting a Scenario
# that fails a quality question.
#
# One criterion per scenario_quality Prompt of the shipped checklist, each
# run narrowed to that Prompt, each fix writing only the Scenario's own
# Registry entry. The eighth Prompt's fix (a description that states no
# rule) is criterion 007 of the Story scen-check-fix, which runs the whole
# checklist.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-quality-fix-<id>` (ADR 0014), and its steps are that
# Scenario's steps.

story:
    id: scen-check-quality-fix
    feature: scen-check
    title: Rewrite a Scenario that fails a quality question with scen check --fix, in that Scenario's Registry entry
    as_a: Quality Engineer
    i_want: scen check --fix to rewrite a Scenario that lacks a given, when or then step, carries a forbidden qualifier or action verb, names an implementation detail, asserts no measurable criterion or has an outcome that is a matter of taste, in that Scenario's own Registry entry, asking me first what the Scenario does not already say
    so_that: every Scenario reads as one testable behaviour in the product's vocabulary without my editing the Registry by hand, and a fix changes nothing beyond the Scenario it was asked about
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-missing-step-added
          description: '`scen check --fix` must add the given, when or then step a Scenario lacks to that Scenario''s entry in the Registry, saying what its description pins, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-adds-missing-step" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario's steps carry all three" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)^      then:$'
                - and: the engine dispatched 5 AI turns
        - id: 002-description-qualifier-replaced
          description: '`scen check --fix` must replace a forbidden qualifier in a Scenario''s description with the measurable criterion its steps state, in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-description-qualifier" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario's description contains a vague word" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)^    description: [^\n]*\b100\b'
                - and: the engine dispatched 5 AI turns
        - id: 003-step-qualifier-replaced
          description: '`scen check --fix` must replace a forbidden qualifier in a Scenario''s step with the measurable criterion its description states, in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-step-qualifier" project tree
                - and: the "scen-check" checklist is narrowed to its "whether any of this scenario's steps contains a vague" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)^ +- [^\n]*exits with code 0[^\n]*\b100\b'
                - and: the engine dispatched 5 AI turns
        - id: 004-forbidden-verb-replaced
          description: '`scen check --fix` must rewrite a Scenario''s step that uses a forbidden action verb with the observable action the product document gives in its place, in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-forbidden-verb" project tree
                - and: the "scen-check" checklist is narrowed to its "whether any of this scenario's steps uses an action verb" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: the engine dispatched 5 AI turns
        - id: 005-implementation-step-rewritten
          description: '`scen check --fix` must rewrite a Scenario''s step that names an implementation detail as the output a user observes, in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-implementation" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario describes observable behaviour" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: the engine dispatched 5 AI turns
        - id: 006-measurable-criterion-added
          description: '`scen check --fix` must ask which measurable criterion a Scenario lacking one asserts, add the criterion the user picks to that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-adds-measurable-criterion" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario includes at least one specific" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: the engine dispatched 6 AI turns
        - id: 007-subjective-outcome-rewritten
          description: '`scen check --fix` must ask what counts as correct for a Scenario whose outcome is a matter of taste, rewrite the outcome as one a reviewer decides without judgement in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-subjective-outcome" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario has a binary pass/fail outcome" prompt
                - the Quality Engineer answers "1" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: the engine dispatched 6 AI turns
