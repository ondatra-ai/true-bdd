story:
  id: concept-link
  feature: scen-check
  title: Link free text to concepts and judge service bindings
  as_a: Product Owner
  i_want: Story and Scenario steps to link to one closed concept and Scenarios to have usable service bindings
  so_that: the Specification determines each step before code is written
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-add-concept
    description: An unlinked Story step must offer a new concept through the menu
    steps:
    - given:
      - the "concept-link-add-concept" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "us refine host --fix"
    - then:
      - the command exits with code 0
      - stdout matches no concept of when
      - stdout matches action=apply
      - the file "docs/product/product.yaml" matches square
      - the file "docs/product/stories/host-story.yaml" is unchanged
  - id: 002-refine-before-binding
    description: A Story must pass refinement sketches before its concept has a binding
    steps:
    - given:
      - the "concept-link-refine-before-binding" project tree
    - when:
      - the Product Owner runs "us refine host"
    - then:
      - the command exits with code 0
      - every file matching "tmp/*/01-host-*-result.yaml" matches answer.*pass
      - stdout matches linked to halve
      - the file "docs/architecture/architecture.yaml" is unchanged
  - id: 003-missing-binding
    description: An unclaimed Scenario must fail when its linked concept has no service binding
    steps:
    - given:
      - the "concept-link-missing-binding" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches when concept.*halve.*service calc has 0 Concept bindings
      - no file outside "tmp" changed
  - id: 004-fix-binding
    description: A missing linked binding must be added only after menu apply
    steps:
    - given:
      - the "concept-link-fix-binding" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "scen check --fix"
    - then:
      - the command exits with code 0
      - stdout matches action=apply
      - stdout matches judgement=bindings answer=pass
      - the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
      - the file "docs/scenarios.yaml" is unchanged
  - id: 005-wrong-block
    description: An action written as Then must fail naming its When concept
    steps:
    - given:
      - the "concept-link-wrong-block" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - 'stdout matches then step.*other block: when concept.*halve'
      - no file outside "tmp" changed
  - id: 006-malformed
    description: A malformed link answer must fail its cell
    steps:
    - given:
      - the "concept-link-malformed" project tree
      - the link answer CLI is controlled for invalid replies
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches link answer malformed or incomplete
      - no file outside "tmp" changed
  - id: 007-incomplete
    description: A link answer leaving one concept unscored must fail its cell
    steps:
    - given:
      - the "concept-link-incomplete" project tree
      - the link answer CLI is controlled for invalid replies
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches cut.*unscored or invalid
      - no file outside "tmp" changed
  - id: 008-shared-fix
    description: A shared concept fix must cause every linked Scenario to be judged afresh
    steps:
    - given:
      - the "concept-link-shared-fix" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "scen check --fix"
    - then:
      - the command exits with code 0
      - stdout matches action=apply
      - the file "docs/product/product.yaml" matches means.*(pointer.*keyboard|keyboard.*pointer)
      - the file matching "tmp/true-bdd.log.json" has exactly 3 matches for "msg":"Cell validation started","subjectID":"alpha","promptIndex":1
      - the file matching "tmp/true-bdd.log.json" has exactly 3 matches for "msg":"Cell validation started","subjectID":"beta","promptIndex":1
  - id: 009-threshold-nine
    description: A real-model near miss scored seven fails at threshold nine; the engine threshold test pins the same-answer boundary
    steps:
    - given:
      - the "concept-link-threshold-nine" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches threshold 9
      - stdout matches no concept of when
  - id: 010-threshold-eight
    description: A real-model borderline score of eight links at threshold eight; the engine threshold test pins rejection of that same score at nine and the default
    steps:
    - given:
      - the "concept-link-threshold-eight" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 0
      - stdout matches threshold 8
      - stdout matches linked to halve
  - id: 011-ambiguous
    description: An ambiguous step must fail naming both fitting concepts
    steps:
    - given:
      - the "concept-link-ambiguous" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - 'stdout matches ambiguous: halve, cut'
      - no file outside "tmp" changed
  - id: 012-widen
    description: An unstated variation must fail and widen its concept only through the menu
    steps:
    - given:
      - the "concept-link-widen" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "us refine host --fix"
    - then:
      - the command exits with code 0
      - stdout matches no concept of when
      - stdout matches action=apply
      - the file "docs/product/product.yaml" is modified
      - the file "docs/product/stories/host-story.yaml" is unchanged
      - 'judge: the product document widens the existing halve concept to admit exactly one or two halvings and preserves the other concept meanings'
  - id: 013-rewrite
    description: A rewritten step must change the Story and preserve the concepts
    steps:
    - given:
      - the "concept-link-rewrite" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "us refine host --fix"
    - then:
      - the command exits with code 0
      - stdout matches action=apply
      - the file "docs/product/stories/host-story.yaml" is modified
      - the file "docs/product/product.yaml" is unchanged
      - the steps of acceptance criterion "AC-1" of the story "docs/product/stories/host-story.yaml" do not match square
  - id: 014-judge-intent
    description: A judge clause must pass unlinked and an llm step must link to an intent binding
    steps:
    - given:
      - the "concept-link-judge-intent" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 0
      - 'stdout matches judge: unlinked'
      - stdout matches linked to halve
      - stdout matches judgement=bindings answer=pass
  - id: 015-ambiguous-binding
    description: An ambiguous binding must fail and be repaired only through the menu
    steps:
    - given:
      - the "concept-link-ambiguous-binding" project tree
      - the Product Owner's answer to every question is "1"
    - when:
      - the Product Owner runs "scen check --fix"
    - then:
      - the command exits with code 0
      - stdout matches binding is ambiguous
      - stdout matches action=apply
      - the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
  - id: 016-missing-answer
    description: A missing link answer must fail its cell
    steps:
    - given:
      - the "concept-link-missing-answer" project tree
      - the link answer CLI is controlled for invalid replies
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - stdout matches link answer malformed or incomplete
  - id: 017-llm-needs-intent
    description: An llm step must fail when its binding does not state intent
    steps:
    - given:
      - the "concept-link-llm-needs-intent" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 1
      - 'stdout matches llm: step requires a binding stated by intent'
  - id: 018-unrelated-unbound
    description: An unbound concept no step links to must not fail the Scenario
    steps:
    - given:
      - the "concept-link-unrelated-unbound" project tree
    - when:
      - the Product Owner runs "scen check"
    - then:
      - the command exits with code 0
      - stdout matches linked to halve
      - stdout does not match square.*has 0 Concept bindings
  - id: 019-unfixed
    description: An unlinked Story step must fail refinement and leave its Story unsaved
    steps:
    - given:
      - the "concept-link-unfixed" project tree
    - when:
      - the Product Owner runs "us refine host"
    - then:
      - the command exits with code 0
      - stdout matches no concept of when
      - stdout matches Validation failed
      - the file "docs/product/stories/host-story.yaml" is unchanged
