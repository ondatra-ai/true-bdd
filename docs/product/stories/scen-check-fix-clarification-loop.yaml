# Story `scen-check-fix`: `scen check --fix` closing a Scenario's words.
#
# The fixes of the checklist's term_closure group. Its six `D:` checks
# write the product or the architecture document, its two model-judged
# `Q:` Prompts a catalogue meaning or the Scenario's own step, and the
# last criterion runs `--fix` over the whole shipped checklist. The fixes
# of the scenario_quality group are the Story scen-check-quality-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-fix-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: scen-check-fix
    feature: scen-check
    title: Close a Scenario's words with scen check --fix, recording each answer where the word is defined
    as_a: Quality Engineer
    i_want: scen check --fix to answer each failed term-closure check of a Scenario a Story claims with me, asking first what a step, a word or a phrase means, and to write the catalogue entry, glossary definition, word mapping or phrase meaning I apply to the product or the architecture document and a step that misuses its phrase to that Scenario's Registry entry, the whole shipped checklist fixing in turn every Prompt the Scenario fails, until the re-walk passes
    so_that: a word is clarified once, in the document that defines it, and serves every Scenario that uses it, so the step definitions follow from the documents rather than from one Scenario's wording
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-unmatched-step-gets-phrase
          description: '`scen check --fix` must propose a catalogue entry for a step that matches none, record the entry the user applies in the product document and never in the Scenario, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-phrase" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: then step "the service answers within 200 milliseconds" matches no template'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: stdout matches check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: the file "docs/product/product.yaml" matches the service answers within
                - and: the engine dispatched 3 AI turns
        - id: 002-undefined-term-gets-definition
          description: '`scen check --fix` must propose a definition for a declared term the glossary lacks, asking what it means first, record the definition the user applies in the product glossary and never in the Scenario, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-term" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: "the service answers "\{reply\}"" declares "reply", which the glossary does not define'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: every declared term is defined: mcp service, message, reply\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: 'the file "docs/product/product.yaml" matches (?m)^ +- term: .?reply.?$'
                - and: the engine dispatched 3 AI turns
        - id: 003-unmapped-term-gets-mapping
          description: '`scen check --fix` must propose a mapping for a declared term the architecture does not map, asking how it is built and observed first, record the mapping the user applies in the architecture document and never in the Scenario or the product document, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-mapping" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: "reply" has no mapping in the architecture'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=architecture_yaml
                - and: 'stdout matches msg="Check answered" check=term-mappings subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: every declared term is mapped: mcp service, message, reply\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
                - and: 'the file "docs/architecture/architecture.yaml" matches (?m)^ +- term: .?reply.?$'
                - and: the engine dispatched 3 AI turns
        - id: 004-shared-definition-merges-phrases
          description: '`scen check --fix` must merge two catalogue entries whose steps one step definition binds into one entry, in the product document and never in a Scenario or a step definition, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-merges-phrases" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: step definition \^the service \(\?:answers\|replies\) \\"\(\[\^\\"\]\+\)\\"\$ \(mcp_steps\.go:24\) is reached by 2 templates'
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=pass
                - and: stdout matches msg="Check answered" check=step-definitions subjectID=E2E-002 promptIndex=1 answer=pass
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: the engine dispatched 2 AI turns
        - id: 005-restated-meaning-rewritten
          description: '`scen check --fix` must rewrite the meaning of a catalogue phrase that only restates its template, a model having judged it, in the product document and never in the Scenario, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-phrase-meaning" project tree
                - and: the "scen-check" checklist is narrowed to its "whether each catalogue phrase this scenario's steps use" prompt
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: the engine dispatched 5 AI turns
        - id: 006-misused-phrase-step-rewritten
          description: '`scen check --fix` must rewrite a Scenario''s step whose pattern a model judged to name no observable output, as the output its description pins, in that Scenario''s entry in the Registry, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-rewrites-phrase-use" project tree
                - and: the "scen-check" checklist is narrowed to its "whether this scenario uses each catalogue phrase" prompt
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)stdout matches [^\n]*Hello Ada'
                - and: the engine dispatched 5 AI turns
        - id: 007-whole-checklist-fixes-description
          description: '`scen check --fix` over the shipped checklist, every prompt of which carries a fix, must rewrite a description that states no rule in that Scenario''s entry in the Registry, and pass the re-walk of every prompt about the Scenario as it now reads'
          steps:
            - given:
                - the "scen-check-fix-rewrites-description" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches SCEN CHECK
                - but: stdout does not match level=ERROR msg="Refusing to start"
                - and: stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=4 answer=pass
                - and: 'stdout matches PASS: 16 '
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)^    description: [^\n]*\b(must|should)\b'
                - and: the engine dispatched 25 AI turns
