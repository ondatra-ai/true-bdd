# Story `scen-check-fix`: `scen check --fix` closing a Scenario's words.
#
# The fixes of the checklist's term_closure group: its `D:` checks write
# the product or the architecture document, and the last criterion runs
# `--fix` over the whole shipped checklist. The fixes of the
# scenario_quality group are the Story scen-check-quality-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-fix-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: scen-check-fix
    feature: scen-check
    title: Close a Scenario's words with scen check --fix, recording each answer where the word is defined
    as_a: Quality Engineer
    i_want: scen check --fix to answer each failed term-closure check of a Scenario with me, asking first what a word or a step means, and to write the glossary definition, word mapping or concept I apply to the product or the architecture document, the whole shipped checklist fixing in turn every Prompt the Scenario fails, until the re-walk passes
    so_that: a word is clarified once, in the document that defines it, and serves every Scenario that uses it, so the step definitions follow from the documents rather than from one Scenario's wording
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 002-undefined-term-gets-definition
          description: '`scen check --fix` must propose a definition for a declared term the glossary lacks, asking what it means first, record the definition the user applies in the product glossary and never in the Scenario, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-term" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: then concept ''answer'' declares "reply", which the glossary does not define'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: 'stdout matches msg="Check answered" check=declared-terms subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: every concept''s declared terms are defined\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: 'the file "docs/product/product.yaml" matches (?m)^ +- term: .?reply.?$'
                - and: the engine dispatched 3 AI turns
        - id: 003-unmapped-term-gets-mapping
          description: '`scen check --fix` must propose a mapping for a declared term the architecture does not map, asking how it is built and observed first, record the mapping the user applies in the architecture document and never in the Scenario or the product document, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-mapping" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: then concept ''answer'': "reply" has no mapping in the architecture'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=architecture_yaml
                - and: 'stdout matches msg="Check answered" check=term-mappings subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: every concept''s declared terms are mapped\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
                - and: 'the file "docs/architecture/architecture.yaml" matches (?m)^ +- term: .?reply.?$'
                - and: the engine dispatched 3 AI turns
        - id: 004-recorded-concept-declared
          description: '`scen check --fix` must propose declaring the concept a step''s one step definition records when the product document does not declare it under the step''s block, asking what the step means first, record the concept the user applies in the product document and never in the Scenario or a step definition, and pass the re-walk'
          steps:
            - given:
                - the "scen-check-fix-records-concept" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches CHECK FAILED
                - and: 'stdout matches E2E-001: then step .*the service logs .*which records then concept .*log line.*, which is not a declared then concept'
                - and: stdout matches msg="AI needs clarification"
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=pass'
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: 'the file "docs/product/product.yaml" matches (?m)^ +- concept: .?log line.?$'
        - id: 007-whole-checklist-fixes-description
          description: '`scen check --fix` over the shipped checklist, every prompt of which carries a fix, must rewrite a description that states no rule in that Scenario''s entry in the Registry, and pass the re-walk of every prompt about the Scenario as it now reads'
          steps:
            - given:
                - the "scen-check-fix-rewrites-description" project tree
                - the Quality Engineer's answer to every question is "1"
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches SCEN CHECK
                - but: stdout does not match level=ERROR msg="Refusing to start"
                - and: stdout matches CHECK FAILED
                - and: stdout matches FIX PROMPT GENERATED
                - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
                - and: stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=3 answer=pass
                - and: 'stdout matches PASS: 16 '
                - and: stdout matches ALL CHECKS PASSED
                - but: stdout does not match Hit max apply attempts
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'the file "docs/scenarios.yaml" matches (?m)^    description: [^\n]*\b(must|should)\b'
