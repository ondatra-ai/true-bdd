story:
  id: writer-lifecycle
  feature: build-code
  title: Preserve live codex writer provisioning across engine rebuilds
  as_a: System Architect
  i_want: writer provisioning observed before the CLI runs and cleanup afterward
  so_that: replay rejects an engine that cannot start a real authenticated writer
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-success
    description: A successful writer receives private copied fixture authentication and provisioned roots and removes authentication afterward
    steps:
    - given:
      - the "writer-lifecycle-success" project tree
      - the codex writer uses fixture-controlled authentication and CLIs
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - the codex writer provisioned and removed its fixture authentication
      - every file matching "tmp/*/*codex-events.jsonl" matches ^\{"type":"item.completed","item":\{"type":"command_execution","command":"fixture writer sentinel","exit_code":0\}\}\n$
      - every file matching "tmp/*/*codex.log" matches fixture writer stderr sentinel
      - the file "services/calc/calc.go" is created
      - the file "tests/suite/calc_test.go" is unchanged
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 002-failure
    description: A failed writer removes authentication while preserving edits and archiving events
    steps:
    - given:
      - the "writer-lifecycle-failure" project tree
      - the codex writer uses fixture-controlled authentication and CLIs
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches level=WARN msg="Writer turn failed" outcome="non-zero exit"
      - the engine dispatched 1 apply AI turn to "codex"
      - the codex writer provisioned and removed its fixture authentication
      - every file matching "tmp/*/*codex-events.jsonl" matches ^\{"type":"item.completed","item":\{"type":"command_execution","command":"fixture writer sentinel","exit_code":0\}\}\n$
      - every file matching "tmp/*/*codex.log" matches fixture writer stderr sentinel
      - the file "services/calc/calc.go" is created
      - the file "tests/suite/calc_test.go" is unchanged
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
