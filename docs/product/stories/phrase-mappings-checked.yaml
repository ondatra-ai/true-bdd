# Story `phrase-mappings`: the architecture maps every Catalogue phrase a
# claimed Scenario uses to what its step does through the Public interface.
#
# The `D: phrase-mappings` built-in check (a missing, duplicate, undeclared
# or intent entry), a fully mapped Scenario, and the check's fix and its
# exit (#240; ADR-0032). The Public interface is the Story public-interface.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `phrase-mappings-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: phrase-mappings
    feature: scen-check
    title: Map every Catalogue phrase to its Public interface operation
    as_a: System Architect
    i_want: scen check to fail a claimed Scenario whose phrase has no Phrase mapping entry for its service, more than one,
        or one referencing an operation the Public interface does not declare, naming the phrase and the reference without
        an AI turn, and the fix to ask me what the step does and write the entry only after apply
    so_that: build steps writes each step definition from what the Specification says its phrase does, never inventing the
        operation
    status: IMPLEMENTED
    acceptance_criteria:
    -   id: 001-missing
        description: A claimed Scenario with a missing Phrase mapping must fail naming its phrase without an AI turn
        steps:
        -   given:
            - the "phrase-mappings-missing" project tree
        -   when:
            - the System Architect runs "scen check"
        -   then:
            - the command exits with code 1
            - the engine dispatched 0 AI turns
            - stdout matches phrase.*the greeting is requested
            - no file outside "tmp" changed
    -   id: 002-undeclared
        description: A Phrase mapping referencing an undeclared operation must fail naming the phrase and reference without
            AI
        steps:
        -   given:
            - the "phrase-mappings-undeclared" project tree
        -   when:
            - the System Architect runs "scen check"
        -   then:
            - the command exits with code 1
            - the engine dispatched 0 AI turns
            - stdout matches phrase.*the greeting is requested
            - stdout matches invented-halve
            - no file outside "tmp" changed
    -   id: 003-valid
        description: A fully mapped Scenario must pass with declared file and log references as well as a command
        steps:
        -   given:
            - the "phrase-mappings-valid" project tree
        -   when:
            - the System Architect runs "scen check"
        -   then:
            - the command exits with code 0
            - the engine dispatched 0 AI turns
            - stdout matches every matched phrase has one valid Phrase mapping
            - no file outside "tmp" changed
    -   id: 004-duplicate
        description: Two Phrase mapping entries for one phrase and service must fail naming the phrase and count
        steps:
        -   given:
            - the "phrase-mappings-duplicate" project tree
        -   when:
            - the System Architect runs "scen check"
        -   then:
            - the command exits with code 1
            - the engine dispatched 0 AI turns
            - stdout matches phrase.*the greeting is requested
            - stdout matches has 2 Phrase mapping entries
            - no file outside "tmp" changed
    -   id: 005-intent
        description: A non-UI phrase stated by intent must fail until llm steps are supported
        steps:
        -   given:
            - the "phrase-mappings-intent" project tree
        -   when:
            - the System Architect runs "scen check"
        -   then:
            - the command exits with code 1
            - the engine dispatched 0 AI turns
            - stdout matches phrase.*the greeting is requested
            - stdout matches intent is not supported for a non-UI service
            - no file outside "tmp" changed
    -   id: 006-fix
        description: A missing Phrase mapping fix must ask the System Architect and propose at the menu before apply changes
            only the architecture
        steps:
        -   given:
            - the "phrase-mappings-fix" project tree
            - the System Architect answers "1" to every question
        -   when:
            - the System Architect runs "scen check --fix"
        -   then:
            - the command exits with code 0
            - stdout matches msg="AI needs clarification"
            - stdout matches FIX PROMPT GENERATED
            - stdout matches msg="User chose fix action".*action=apply
            - stdout matches every matched phrase has one valid Phrase mapping
            - the only file changed outside "tmp" is "docs/architecture/architecture.yaml"
            - the file "docs/scenarios.yaml" is unchanged
    -   id: 007-exit
        description: Exiting the Phrase mapping fix menu must leave the architecture and Scenario unchanged
        steps:
        -   given:
            - the "phrase-mappings-exit" project tree
            - the System Architect answers "Call greet once with the literal person Ada, without the loud flag or any outgoing
                call." to every question
        -   when:
            - the System Architect runs "scen check --fix"
        -   then:
            - the command exits with code 1
            - stdout matches msg="AI needs clarification"
            - stdout matches FIX PROMPT GENERATED
            - stdout matches msg="User chose fix action".*action=exit
            - stdout matches Exiting.
            - no file outside "tmp" changed
            - the file "docs/scenarios.yaml" is unchanged
