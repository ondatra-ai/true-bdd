# Story `scen-check-step-definitions`: `scen check` holding the catalogue and
# the step definitions one to one.
#
# The `step-definitions` closure check of the scen-check checklist: across the
# Scenarios a Story claims that share one suite, each catalogue template their
# steps match binds to one step definition, and each step definition is
# reached by one template. The walk and the exit code are the Story
# `scen-check`; the other closure checks are scen-check-phrases,
# scen-check-terms and scen-check-mappings.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-step-definitions-<id>` (ADR 0014), and its steps are that
# Scenario's steps.

story:
    id: scen-check-step-definitions
    feature: scen-check
    title: Hold the catalogue and the step definitions one to one with scen check
    as_a: Quality Engineer
    i_want: scen check to verify, with no AI turn, that across the Scenarios a Story claims that share one suite each catalogue template binds to one step definition and each step definition is reached by one template, naming every template, step and definition that breaks it and the file and line where that definition is written
    so_that: the catalogue and the step definitions never drift apart, and each step definition follows from the one catalogue entry whose steps it binds
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-template-binds-twice-fails
          description: A catalogue template whose steps, across every Scenario a Story claims that shares one suite, bind to two different step definitions must fail each of those Scenarios using it, naming the template and both definitions with where each is written, while a Scenario no Story claims neither counts nor is checked
          steps:
            - given:
                - the "scen-check-template-binds-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: template \\"the service answers \\"\{reply\}\\"\\" binds to 2 step definitions in tests/mcp/steps: \^the service answers \\"pong\\"\$ \(mcp_steps\.go:24\); \^the service answers \\"hello\\"\$ \(mcp_steps\.go:25\)\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-002 promptIndex=1 answer=fail context="\[E2E-002: template \\"the service answers \\"\{reply\}\\"\\" binds to 2 step definitions in tests/mcp/steps: \^the service answers \\"pong\\"\$ \(mcp_steps\.go:24\); \^the service answers \\"hello\\"\$ \(mcp_steps\.go:25\)\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-003 promptIndex=1 answer=pass context="\[E2E-003: not checked: no Story claims this Scenario yet\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 002-definition-reached-twice-fails
          description: A step definition that the steps of two catalogue templates bind, across the Scenarios a Story claims that share one suite, must fail each of those Scenarios, naming the definition with where it is written and both templates
          steps:
            - given:
                - the "scen-check-definition-reached-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: step definition \^the service \(\?:answers\|replies\) \\"\(\[\^\\"\]\+\)\\"\$ \(mcp_steps\.go:24\) is reached by 2 templates: \\"the service answers \\"\{reply\}\\"\\"; \\"the service replies \\"\{reply\}\\"\\"\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-002 promptIndex=1 answer=fail context="\[E2E-002: step definition \^the service \(\?:answers\|replies\) \\"\(\[\^\\"\]\+\)\\"\$ \(mcp_steps\.go:24\) is reached by 2 templates: \\"the service answers \\"\{reply\}\\"\\"; \\"the service replies \\"\{reply\}\\"\\"\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 003-step-binds-twice-fails
          description: A step of a Scenario a Story claims that two step definitions of its suite bind must fail that Scenario, naming the step and both definitions with where each is written, because which one runs depends on the order they were registered in
          steps:
            - given:
                - the "scen-check-step-binds-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: when step \\"the Operator sends \\"ping\\"\\" binds to 2 step definitions: \^the \(Operator\|Client Developer\) sends \\"\(\[\^\\"\]\+\)\\"\$ \(mcp_steps\.go:23\); \^the Operator sends \\"ping\\"\$ \(mcp_steps\.go:24\)\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 004-one-to-one-passes
          description: A Scenario a Story claims must pass the step-definition check when each template its steps match binds to one step definition of its suite that no other template reaches, naming the suite, while a step no definition binds yet is reported as a gap rather than a failure, a step a model runs is exempt, and a Scenario no Story claims passes unchecked
          steps:
            - given:
                - the "scen-check-definitions-correspond" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: each template binds to one step definition in tests/mcp/steps\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-002 promptIndex=1 answer=pass context="\[E2E-002: each template binds to one step definition in tests/mcp/steps; 1 step unbound yet E2E-002: then step \\"the service logs \\"greeted\\"\\" binds to no step definition yet\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-003 promptIndex=1 answer=pass context="\[E2E-003: not checked: no Story claims this Scenario yet\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 005-unreadable-pattern-exits-1
          description: A suite whose step definitions register a pattern that does not fold to a constant must stop the step-definition check at the first Scenario a Story claims, naming the check, the file and line of the pattern, and exit 1, because a definition the check cannot read would leave the steps it binds unchecked
          steps:
            - given:
                - the "scen-check-definitions-unreadable" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Check could not answer" check=step-definitions subjectID=E2E-001 promptIndex=1
                - and: stdout matches step pattern is not a constant expression
                - and: stdout matches tests/mcp/steps/mcp_steps\.go:26
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
