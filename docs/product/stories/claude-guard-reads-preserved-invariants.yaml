story:
  id: claude-guard-reads
  feature: engine
  title: Keep writer guard and replay invariants under Claude
  as_a: System Architect
  i_want: the writer guard to confine files and accept only canonical replay commands
  so_that: a writer cannot exceed its file and command grants
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-outside-project-denied
    description: A Read of an absolute path outside the project must be denied, naming the path and the read root
    steps:
    - given:
      - the "claude-guard-read-outside" project tree
      - claude's write policy lets the turn write under "tests"
      - claude names the tool "Read"
      - claude names the path "/true-bdd-neighbour/secrets.txt" as written
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - and: the guard's reason matches (read target is outside the claude writer roots|search target is outside|glob)
  - id: 002-relative-escape-denied
    description: A glob whose path leaves the project through ../ must be denied
    steps:
    - given:
      - the "claude-guard-read-relative-escape" project tree
      - claude's write policy lets the turn write under "tests"
      - claude pipes the hook payload naming the tool "Glob" and the path "../neighbour"
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - and: the guard's reason matches (read target is outside the claude writer roots|search target is outside|glob)
  - id: 003-symlink-escape-denied
    description: A read through a symbolic link inside the project pointing outside it must be denied
    steps:
    - given:
      - the "claude-guard-read-symlink-escape" project tree
      - claude's write policy lets the turn write under "tests"
      - the project tree's "node_modules/shared" is a symbolic link to "../../"
      - claude names the tool "Grep"
      - claude names the file "node_modules/shared/notes.md" of the project tree
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - and: the guard's reason matches (read target is outside the claude writer roots|search target is outside|glob)
  - id: 004-unnamed-path-allowed
    description: A Read call naming no path must be allowed to read the project
    steps:
    - given:
      - the "claude-guard-read-unnamed-path" project tree
      - claude's write policy lets the turn write under "tests"
      - claude names the tool "Read"
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard allows the tool call
  - id: 005-missing-read-root-denied
    description: A tool call must be denied when claude hands the guard a write policy with no read root, naming what is missing
    steps:
    - given:
      - the "claude-guard-read-missing-root" project tree
      - claude's write policy lets the turn write under "tests"
      - claude hands the guard a write policy with no read root
      - claude names the tool "Read"
      - claude names the file "docs/README.md" of the project tree
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - and: the guard's reason matches invalid claude guard
  - id: 006-relative-path-allowed
    description: A relative read path inside the project must be allowed outside every write root
    steps:
    - given:
      - the "claude-guard-read-relative-path" project tree
      - claude's write policy lets the turn write under "tests"
      - claude names the tool "Read"
      - claude names the path "docs/README.md" as written
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard allows the tool call
