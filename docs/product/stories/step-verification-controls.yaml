story:
  id: verification-controls
  feature: build-steps
  title: Preserve and judge the known-answer verification controls
  as_a: System Architect
  i_want: the real step-verification Q to judge preserved definitions with known answers
  so_that: a changed verdict is reported with its saved prompt rather than hidden by a regenerated body
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-assertion-original
    description: The step-verification Q returns the preserved verdicts for build-steps-critique-assertion-claude-005
    steps:
    - given:
      - the "verification-controls-assertion-original" project tree
      - the verification controls in "verification-controls-assertion-original" use preserved pattern proposals
        and bodies
      - the System Architect's answers are "1/1/3" line by line
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - every preserved control has its expected step-verification verdict
      - the command exits with code 1
      - no file outside "tmp" and "tests" changed
  - id: 002-assertion-repair
    description: The step-verification Q returns the preserved verdicts for build-steps-critique-assertion-claude-007,
      build-steps-critique-correct-claude-006
    steps:
    - given:
      - the "verification-controls-assertion-repair" project tree
      - the verification controls in "verification-controls-assertion-repair" use preserved pattern proposals and
        bodies
      - the System Architect's answers are "1/1/1/1" line by line
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - every preserved control has its expected step-verification verdict
      - the command exits with code 0
      - no file outside "tmp" and "tests" changed
