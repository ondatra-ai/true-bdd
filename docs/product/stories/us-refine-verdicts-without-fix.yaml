# Story `us-refine-verdicts`: what `us refine` reports on a Story's
# Acceptance Criteria when it runs without `--fix`.
#
# A Story passing every check is saved in place; one failing a check is
# reported and left as it was written. The refusals of a Story `us refine`
# cannot walk and its `--fix` loop are Stories of their own:
# us-refine-refusals and us-refine-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `us-refine-verdicts-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: us-refine-verdicts
    feature: us-refine
    title: Read the us refine verdict on a Story's Acceptance Criteria before any fix
    as_a: Product Owner
    i_want: to run us refine without --fix on a Story I wrote and read which checks of the us-refine checklist its Acceptance Criteria pass and which they fail, with the Story saved in place when every check passes and left as I wrote it when any check fails
    so_that: I learn what my Acceptance Criteria still lack before I spend a fix loop on them, and a failed check never rewrites my Story
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-passing-story-saved-in-place
          description: A story whose acceptance criteria already pass every check must converge on the first walk and be rewritten in place
          steps:
            - given:
                - the "us-refine-happy-path" project tree
            - when:
                - the Product Owner runs "us refine 96.1"
            - then:
                - the command exits with code 0
                - stdout matches ALL CHECKS PASSED!
                - 'stdout matches msg="Story saved"'
                - stdout matches REFINE COMPLETE
                - and: the only file changed outside "tmp" is "docs/product/stories/96.1-document-summary-refined.yaml"
                - and: the story "docs/product/stories/96.1-document-summary-refined.yaml" has id "96.1"
                - and: the story "docs/product/stories/96.1-document-summary-refined.yaml" has 4 acceptance criteria
                - and: every acceptance criterion in the story "docs/product/stories/96.1-document-summary-refined.yaml" has given, when and then steps
                - and: 'judge: the four acceptance criteria still cover the substance of the seed — a summary of 150 words or fewer for a shared document, the "This document is not shared with your account" message, the "The summary timed out - please try again" message at 30 seconds, and summarising only the first 10000 words — with every exact message and number intact'
                - and: 'judge: the as_a, i_want and so_that clauses keep their meaning — a Claude User wanting a short summary of a shared Google Doc on request, so as to decide whether it needs attention without reading it in full'
        - id: 002-no-happy-path-fails
          description: A story whose acceptance criteria are all error scenarios must fail the happy-path check and pass the rest
          steps:
            - given:
                - the "us-refine-no-happy-path" project tree
            - when:
                - the Product Owner runs "us refine 96.4"
            - then:
                - the command exits with code 0
                - stdout matches Validation failed. Use --fix flag to enter interactive fix mode.
                - stdout matches REFINE COMPLETE
                - but: no file outside "tmp" changed
                - and: the file "docs/product/stories/96.4-summary-error-messages.yaml" is unchanged
                - and: stdout does not match ALL CHECKS PASSED!
                - and: 'stdout does not match msg="Story saved"'
        - id: 003-implementation-and-subjective-fail
          description: A story with implementation-level and subjective acceptance criteria must report each failure and leave the story unchanged
          steps:
            - given:
                - the "us-refine-validation-fails" project tree
            - when:
                - the Product Owner runs "us refine 96.3"
            - then:
                - the command exits with code 0
                - stdout matches Validation failed. Use --fix flag to enter interactive fix mode.
                - stdout matches REFINE COMPLETE
                - but: no file outside "tmp" changed
                - and: the file "docs/product/stories/96.3-summary-service-internals.yaml" is unchanged
                - and: stdout does not match ALL CHECKS PASSED!
                - and: 'stdout does not match msg="Story saved"'
