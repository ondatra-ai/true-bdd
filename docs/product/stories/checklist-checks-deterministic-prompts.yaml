# Story `checklist-checks`: a checklist's built-in checks, run ahead of
# the model's questions and refused at startup when misdeclared.
#
# A checklist Prompt is `D: <check>`, answered by one of the engine's
# built-in checks, or `Q: <question>`, answered by a model (ADR 0015).
# These criteria hold the order a walk takes and the startup refusals of
# a misdeclared `D:` Prompt. Each Scenario drives them through
# `scen check`, the command whose checklist has built-in checks. The
# `--fix` refusal of a `D:` Prompt without `F:` belongs to the `engine`
# Story, beside the same refusal for a `Q:` Prompt.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `checklist-checks-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: checklist-checks
    feature: engine
    title: Run a checklist's built-in checks ahead of its model questions, and refuse a misdeclared check before the walk
    as_a: Quality Engineer
    i_want: every `D:` Prompt of a checklist answered by the engine's own check before any `Q:` Prompt of the same Scenario, and a checklist Prompt that misdeclares its check refused at startup, naming the Prompt
    so_that: a misdeclared checklist costs no AI turn, and no AI turn is spent on a Scenario that a built-in check has already failed
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-checks-run-before-questions
          description: Within a Scenario every `D:` Prompt must run before any `Q:` Prompt, whatever the file order, and a Scenario failing one must be reported failed with its `Q:` Prompts skipped and no AI turn spent on it, while a Scenario passing it walks its `Q:` Prompts
          steps:
            - given:
                - the "scen-check-failed-check-skips-questions" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches SCEN CHECK
                - and: stdout matches msg="Check answered" check=given-when-then subjectID=E2E-001 promptIndex=2 answer=pass
                - and: 'stdout matches msg="Check answered" check=given-when-then subjectID=E2E-002 promptIndex=2 answer=fail context="\[E2E-002: missing then step\]"'
                - and: stdout matches msg="Prompt skipped after a failed check" subjectID=E2E-002 promptIndex=1
                - and: 'stdout matches scen-check/scenario_quality +D: given-when-then +fail +FAIL'
                - and: 'stdout matches SKIP: 1\n'
                - and: stdout matches Validation failed
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched 1 AI turn
                - and: no file outside "tmp" changed
        - id: 002-check-and-question-refused
          description: A checklist Prompt carrying both `D:` and `Q:` must be refused at startup, naming the Prompt, because a built-in check or a model answers a Prompt and never both
          steps:
            - given:
                - the "scen-check-prompt-with-both-kinds" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #2 carries both D: and Q:'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 003-neither-check-nor-question-refused
          description: A checklist Prompt carrying neither `D:` nor `Q:` must be refused at startup, naming the Prompt, because nothing would answer it
          steps:
            - given:
                - the "scen-check-prompt-with-no-kind" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 carries neither D: nor Q:'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-unknown-check-refused
          description: A `D:` Prompt naming a check the engine does not hold must be refused at startup, naming the Prompt and the checks the command has
          steps:
            - given:
                - the "scen-check-unknown-check" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 D: steps-are-present names no built-in check of scen check, which has declared-terms, given-when-then, phrase-mappings, public-interface, step-definitions, step-phrases, term-mappings'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-model-on-check-refused
          description: A `D:` Prompt carrying `model:` must be refused at startup, naming the Prompt, because no model answers a built-in check
          steps:
            - given:
                - the "scen-check-model-on-check" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 D: given-when-then carries model:, but no model answers a built-in check'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 006-unread-parameter-refused
          description: A `D:` Prompt passing its check a `with:` parameter the check does not read must be refused at startup, naming the parameter, rather than run the check as though it were honoured
          steps:
            - given:
                - the "scen-check-unknown-check-parameter" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 D: given-when-then has no with: parameter min_steps; it takes none'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 007-unlisted-document-refused
          description: A `D:` Prompt naming a check that reads a document must be refused at startup when its `docs:` does not list that document, because the check would otherwise read no product document and pass every Scenario unchecked
          steps:
            - given:
                - the "scen-check-phrase-docs-unlisted" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/term_closure #1 D: declared-terms reads the product document, so its docs: must list product'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
