# Story `checklist-checks`: written checklist order and startup format refusals (ADR-0042).

story:
    id: checklist-checks
    feature: engine
    title: Walk checklist items in written order and refuse malformed Q options before the walk
    as_a: Quality Engineer
    i_want: each checklist item to have one Q by prompt or code and its optional F, walked in written order without skipping after a failure
    so_that: the checklist shows what the command verifies and fixes, and malformed questions cost no AI turn
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-checks-run-before-questions
          description: Checklist items must run in their written order without skipping a prompt Q after a failed code Q
          steps:
            - given:
                - the "scen-check-failed-check-skips-questions" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches SCEN CHECK
                - 'stdout matches (?s)Cell validation started.*subjectID=E2E-001 promptIndex=1.*Check answered.*subjectID=E2E-001 promptIndex=2'
                - 'stdout matches (?s)Check answered.*subjectID=E2E-002 promptIndex=2 answer=fail.*Cell validation started.*subjectID=E2E-002 promptIndex=3'
                - stdout does not match Prompt skipped after a failed check
                - stdout matches Validation failed
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched 4 AI turns
                - and: no file outside "tmp" changed
        - id: 002-check-and-question-refused
          description: A checklist item carrying both Q options, prompt and code must be refused at startup, naming the checklist item, because a Q has only one answering option
          steps:
            - given:
                - the "scen-check-prompt-with-both-kinds" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #2 carries both Q options'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 003-neither-check-nor-question-refused
          description: A checklist item carrying neither Q option, prompt nor code must be refused at startup, naming the checklist item, because nothing would answer it
          steps:
            - given:
                - the "scen-check-prompt-with-no-kind" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 carries neither Q option'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-unknown-check-refused
          description: A code Q naming a check the engine does not hold must be refused at startup, naming the checklist item and the checks the command has
          steps:
            - given:
                - the "scen-check-unknown-check" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 Q code: steps-are-present names no built-in check of scen check, which has concept-bindings, declared-terms, given-when-then, public-interface, step-definitions, term-mappings'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-model-on-check-refused
          description: A code Q carrying `model:` must be refused at startup, naming the checklist item, because no model answers a built-in check
          steps:
            - given:
                - the "scen-check-model-on-check" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 Q code: given-when-then carries model:, but no model answers a built-in check'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 006-unread-parameter-refused
          description: A code Q passing its check a `with:` parameter the check does not read must be refused at startup, naming the parameter, rather than run the check as though it were honoured
          steps:
            - given:
                - the "scen-check-unknown-check-parameter" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 Q code: given-when-then has no with: parameter min_steps; it takes none'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 007-unlisted-document-refused
          description: A code Q naming a check that reads a document must be refused at startup when its `docs:` does not list that document, because the check would otherwise read no product document and pass every Scenario unchecked
          steps:
            - given:
                - the "scen-check-phrase-docs-unlisted" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/term_closure #1 Q code: declared-terms reads the product document, so its docs: must list product'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 008-legacy-d-refused
          description: A checklist still declaring D must be refused at startup with both replacement Q forms before any AI turn
          steps:
            - given:
                - the "scen-check-legacy-d-refused" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #1 retired D:'
                - 'stdout matches Q: .prompt: .* or Q: .code:'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
