# Story `crush-guard`: the engine's write guard decides each tool call crush
# asks about, and denies what it cannot decide.
#
# crush has no permission check of its own, so before every tool of a turn
# it runs the guard the engine wired into the turn's config. This Story
# holds which tools the guard lets through, the shell grant, the refusal of
# a missing or unreadable write policy, and the hook payload crush pipes.
# Where a write may land is the Story crush-guard-writes; local reads
# and a policy naming no read root belong to crush-guard-reads.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `crush-guard-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: crush-guard
    feature: engine
    title: Let crush run a tool only when the engine's write guard allows it, and deny whatever the guard cannot decide
    as_a: System Architect
    i_want: every tool crush wants to run during a turn to be decided by the engine's write guard, which allows a local read only inside the project, allows the shell only when the turn's write policy lets the turn run it, denies a tool it does not know as a writer, denies everything when the write policy is missing or unreadable, and reads from the hook payload what crush named nowhere else
    so_that: a crush turn, whose CLI has no permission check of its own, never reads outside the project or changes it beyond what its command allowed, even when crush is started outside the engine or its policy is damaged
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-read-only-tool-allowed
          description: A tool call to a tool that only reads must be allowed for any file inside the project, inside the turn's write roots or not
          steps:
            - given:
                - the "crush-guard-read-only-tool" project tree
                - crush's write policy lets the turn write under "tests"
                - crush names the tool "view"
                - crush names the file "docs/README.md" of the project tree
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard allows the tool call
        - id: 002-shell-denied-without-grant
          description: A tool call to the shell must be denied when the turn's write policy does not let the turn run it, since a shell command can write anywhere
          steps:
            - given:
                - the "crush-guard-shell-denied" project tree
                - crush's write policy lets the turn write under "tests"
                - crush names the tool "bash"
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard denies the tool call
                - and: the guard's reason matches shell is denied in this mode
        - id: 003-shell-allowed-with-grant
          description: A tool call to the shell must be allowed when the turn's write policy lets the turn run it
          steps:
            - given:
                - the "crush-guard-shell-allowed" project tree
                - crush's write policy lets the turn write under "tests"
                - and: crush's write policy lets the turn run the shell
                - crush names the tool "bash"
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard allows the tool call
        - id: 004-unknown-tool-denied
          description: A tool call to a tool the guard does not know must be denied as a writer, even when it targets a file inside a write root
          steps:
            - given:
                - the "crush-guard-unknown-tool" project tree
                - crush's write policy lets the turn write under "tests"
                - crush names the tool "rename"
                - crush names the file "tests/notes.md" of the project tree
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard denies the tool call
                - and: the guard's reason matches tool rename is not on the allowlist \(unknown tools are treated as writers\)
        - id: 005-missing-policy-denied
          description: A tool call must be denied when crush hands the guard no write policy, even one to a tool that only reads
          steps:
            - given:
                - the "crush-guard-missing-policy" project tree
                - crush hands the guard no write policy
                - crush names the tool "view"
                - crush names the file "docs/README.md" of the project tree
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard denies the tool call
                - and: the guard's reason matches crush guard policy is not set
        - id: 006-unreadable-policy-denied
          description: A tool call must be denied when the guard cannot read the write policy crush hands it, even one to a tool that only reads
          steps:
            - given:
                - the "crush-guard-unreadable-policy" project tree
                - crush hands the guard an unreadable write policy
                - crush names the tool "view"
                - crush names the file "docs/README.md" of the project tree
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard denies the tool call
                - and: the guard's reason matches crush guard policy is malformed
        - id: 007-payload-names-the-call
          description: When crush names neither the tool nor its file but in the hook payload, the guard must judge the tool call the payload names
          steps:
            - given:
                - the "crush-guard-hook-payload" project tree
                - crush's write policy lets the turn write under "tests"
                - crush pipes the hook payload naming the tool "write" and the file "tests/notes.md"
            - when:
                - crush asks the guard about the tool call
            - then:
                - the guard allows the tool call
