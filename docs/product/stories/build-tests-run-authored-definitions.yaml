story:
  id: build-tests-run
  feature: build-tests
  title: Run authored step definitions before completing build tests
  as_a: System Architect
  i_want: build tests --fix to run the Scenarios using authored definitions through the declared replay command, repair runtime failures within the attempt bound, and include Scenarios sharing a changed definition
  so_that: a generated definition is complete only when the Scenarios that use it pass
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-failed-definition-repaired
    description: After writing a step definition, build tests --fix must run its Scenarios through the declared replay command and repair a definition that fails before reporting COMPLETE
    steps:
    - given:
      - the "build-tests-run-recovery" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches BUILD TESTS COMPLETE
      - and: stdout matches calc-001-double
      - and: stdout matches expected 4, got 6
      - and: the engine spawned a test runner with arguments matching -run
      - and: the shell command "go test -tags bdd ./tests/calc/" run in "." exits with code 0
  - id: 002-attempt-bound-reports-failing-step
    description: A definition still failing after the configured fix attempt bound must end build tests --fix with a nonzero exit naming the Scenario and its failing step
    steps:
    - given:
      - the "build-tests-run-bound" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 1
      - and: stdout matches authored step definitions still fail after 1 fixes for Scenario calc-001-double
      - and: stdout matches the result is 4
      - and: stdout matches expected 4, got 6
      - but: stdout does not match BUILD TESTS COMPLETE
      - and: the engine spawned exactly 1 test runner
  - id: 003-shared-definition-scenarios-run
    description: A changed step definition must also run a Scenario that already bound every step, using the declared suite with a name filter
    steps:
    - given:
      - the "build-tests-run-shared" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches calc-002-shared
      - and: stdout matches expected 3, got 4
      - and: the engine spawned a test runner with arguments matching TestCalc002Shared
      - and: the shell command "go test -tags bdd ./tests/calc/" run in "." exits with code 0
  - id: 004-selected-package-must-pass
    description: A selected Scenario skipped in its owning package must fail build tests --fix even when a same-named test passes in another package
    steps:
    - given:
      - the "build-tests-run-package" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 1
      - and: stdout matches declared suite did not pass the selected Scenario
      - and: stdout matches fixture/stepsrun/tests/calc::TestCalc001Double
      - but: stdout does not match BUILD TESTS COMPLETE
      - and: the engine spawned exactly 1 test runner
  - id: 005-prebuilt-engine-without-source
    description: With a prebuilt engine argument declared and service source absent, build tests --fix must verify its authored definition against the running engine and pass its absolute symlink-resolved path as one runner argument
    steps:
    - given:
      - the "build-tests-run-prebuilt" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches BUILD TESTS COMPLETE
      - but: stdout does not match bring the suite up|authored step definitions still fail
      - and: the engine spawned a test runner with its own prebuilt engine path
      - and: the file "tests/calc/steps/steps.go" is modified
      - and: the shell command "test ! -d services/calc" run in "." exits with code 0
      - and: the shell command "test ! -f tmp/service-build-attempted" run in "." exits with code 0
  - id: 006-identical-failures-grouped
    description: Two bound Scenarios failing with the same runtime output must give one whole failure block naming both in the next fix prompt and one selection list
    steps:
    - given:
      - the "build-tests-run-grouped" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches BUILD TESTS COMPLETE
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Selection Scenarios: calc-001-double, calc-002-peer$'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Failure affecting Scenarios:'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)EVIDENCE-BEGIN\n(?:[ \t]*full runtime evidence\n){600}[ \t]*EVIDENCE-END'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 0 matches for truncated'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for expected 4, got 6'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Failure affecting Scenarios: calc-001-double, calc-002-peer$'
      - and: the shell command "go test -tags bdd ./tests/calc/" run in "." exits with code 0
  - id: 007-distinct-failures-whole
    description: Two different runtime failures in one selection must give two whole failure blocks in the next fix prompt, each naming only the Scenario it hit
    steps:
    - given:
      - the "build-tests-run-distinct" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches BUILD TESTS COMPLETE
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Selection Scenarios: calc-001-double, calc-002-peer$'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 2 matches for (?m)^Failure affecting Scenarios:'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 2 matches for (?m)EVIDENCE-BEGIN\n(?:[ \t]*full runtime evidence\n){600}[ \t]*EVIDENCE-END'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 0 matches for truncated'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for expected 4, got 6'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Failure affecting Scenarios: calc-001-double$'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for (?m)^Failure affecting Scenarios: calc-002-peer$'
      - and: 'the file matching "tmp/*/01-calc-001-double-fix-iter1-user.txt" has exactly 1 match for expected 8, got 12'
      - and: the shell command "go test -tags bdd ./tests/calc/" run in "." exits with code 0
