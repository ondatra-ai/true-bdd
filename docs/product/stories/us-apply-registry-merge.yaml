# Story `us-apply`: `us apply` merging a Story into the Registry.
#
# The merge: criteria missing from the Registry added, duplicate entries
# collapsed, keys kept across a reorder, each new Scenario naming a service the
# architecture declares, and no Registry written whose Scenario for a criterion is
# keyed apart from its lineage id or names no declared service. The startup refusals of a Story
# the command cannot merge are the Story `us-apply-refusals`; where the
# Registry lives comes from `true-bdd.yaml` for every command alike, so
# that Scenario is the `engine` Story's.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `us-apply-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: us-apply
    feature: us-apply
    title: Merge a refined Story into the Registry with us apply, one Scenario per criterion keyed by its id
    as_a: Product Owner
    i_want: to merge each Acceptance Criterion of a refined Story into the Registry as one Scenario keyed by the Story's id and the criterion's id, with duplicate entries collapsed and the walk repeated until nothing is left to add
    so_that: the Registry holds exactly one Scenario per criterion, under a key that survives reordering the Story's criteria and that no model chooses
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-missing-criteria-added
          description: A story whose acceptance criteria are all missing from the registry must re-walk after the merge and end at a fixpoint
          steps:
            - given:
                - the "us-apply-rewalk-converges" project tree
                - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
                - the Product Owner's answer to every question is "1"
            - when:
                - the Product Owner runs "us apply 99.3 --fix"
            - then:
                - the command exits with code 0
                - 'stdout matches msg=AC index=1 total=2'
                - 'stdout matches msg=AC index=2 total=2'
                - 'stdout matches msg="RE-WALK \(fixes applied, verifying\)" attempt=2'
                - stdout matches ALL CHECKS PASSED!
                - stdout matches APPLY COMPLETE
                - and: the file "docs/scenarios.yaml" is modified
                - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "99.3-001-mcp-initialize"
                - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "99.3-002-mcp-get-refused"
                - and: the scenario from acceptance criterion "99.3-001-mcp-initialize" in "docs/scenarios.yaml" is keyed "99.3-001-mcp-initialize"
                - and: the scenario from acceptance criterion "99.3-002-mcp-get-refused" in "docs/scenarios.yaml" is keyed "99.3-002-mcp-get-refused"
                - and: no two scenarios in "docs/scenarios.yaml" share the same steps
                - but: the file "docs/product/stories/99.3-rewalk-fixture.yaml" is unchanged
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: 'stdout does not match msg="RE-WALK \(fixes applied, verifying\)" attempt=3'
                - and: stdout does not match One or more scenarios did not pass
                - and: 'judge: each scenario added to the registry carries the given, when and then steps of the acceptance criterion it came from in docs/product/stories/99.3-rewalk-fixture.yaml'
        - id: 002-duplicates-collapse
          description: Two registry entries claiming the same acceptance criterion must collapse into one, leaving every other entry untouched
          steps:
            - given:
                - the "us-apply-duplicate-collapse" project tree
                - the Product Owner's answer to every question is "1"
            - when:
                - the Product Owner runs "us apply 95.1 --fix"
            - then:
                - and: 'every file matching "tmp/*/01-95.1-001-mcp-initialize-checklist-*-user.txt" matches ### Steps\nGiven:\n  - the MCP server is running on its configured port\n  - the server accepts JSON-RPC over HTTP POST at /mcp\nWhen:\n  - the Claude User posts a valid JSON-RPC initialize request to /mcp\nThen:\n  - the server returns HTTP 200\n  - and the response body is a well-formed JSON-RPC envelope referencing the request id\n\n\n---'
                - the command exits with code 0
                - 'stdout matches msg=AC index=1 total=1'
                - 'stdout matches msg="RE-WALK \(fixes applied, verifying\)" attempt=2'
                - stdout matches ALL CHECKS PASSED!
                - stdout matches APPLY COMPLETE
                - and: the file "docs/scenarios.yaml" is modified
                - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "95.1-001-mcp-initialize"
                - and: the scenario from acceptance criterion "95.1-001-mcp-initialize" in "docs/scenarios.yaml" is keyed "95.1-001-mcp-initialize"
                - and: the scenario from acceptance criterion "95.1-001-mcp-initialize" in "docs/scenarios.yaml" cites the story "docs/product/stories/95.1-duplicate-collapse.yaml"
                - and: the scenario from acceptance criterion "95.1-001-mcp-initialize" in "docs/scenarios.yaml" matches HTTP 200
                - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "90.1-001"
                - but: the file "docs/product/stories/95.1-duplicate-collapse.yaml" is unchanged
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: stdout does not match One or more scenarios did not pass
                - and: 'judge: the scenario from acceptance criterion 90.1-001 — the unrelated home-page welcome banner — still says what the seed registry said it did'
        - id: 003-reorder-keeps-keys
          description: Reordering a Story's acceptance criteria and applying it again must leave every Scenario key unchanged, because a key comes from the criterion's id and never from its position
          steps:
            - given:
                - the "us-apply-reordered-criteria" project tree
                - the Product Owner's answer to every question is "1"
            - when:
                - the Product Owner runs "us apply mcp-endpoint --fix"
            - then:
                - and: 'every file matching "tmp/*/01-mcp-endpoint-002-get-refused-checklist-*-user.txt" matches \*\*Story ID:\*\* mcp-endpoint\n\*\*Story Path:\*\* docs/product/stories/mcp-endpoint-requests\.yaml\n\*\*AC ID:\*\* 002-get-refused\n\*\*Lineage Scenario ID:\*\* mcp-endpoint-002-get-refused\n\*\*Description:\*\* The MCP server must respond with HTTP 405 Method Not Allowed when a Claude User sends a GET request to the /mcp endpoint\.\n'
                - and: 'every file matching "tmp/*/01-mcp-endpoint-002-get-refused-checklist-*-user.txt" matches ## Validation Question\n\nDoes this acceptance criterion already appear as a scenario in the\nregistry\?\n\nThe registry is the requirements YAML referenced by the subject\n\(the scratch copy for this run\)\. An AC "appears" when there is an\nentry under `scenarios:` whose `user_stories\[\]` list contains the\nsubject''s story path AND the subject''s lineage scenario id\.\n\nPass when at least one such entry exists\.\nFail otherwise\.\n\nContext: emit one line\.\n  - "AC <ac id> \(lineage <lineage id>\): present in <matched scenario id>"\n  - "AC <ac id> \(lineage <lineage id>\): not present"\n SO THAT WE ENSURE [^\n]*\n\n## If Validation Fails\n(?s:.*?)\n\nAdd this AC as a new scenario in the registry\.\n\nUse the Edit tool against the registry file referenced by the\nsubject\. Steps:\n  1\. Key the new entry by the subject''s lineage scenario id,\n     verbatim \(`<story id>-<ac id>`\)\. That id is the scenario''s\n     registry key and names its generated test, so never pick a\n     number or invent another id\.\n  2\. Insert a new entry under `scenarios:` with:\n        description: <short summary derived from the AC description>\n        service: <see step 3>\n        path: <see step 4>\n        last_updated: "<today, YYYY-MM-DD>"\n        user_stories:\n          - story: <story file path from subject>\n            scenario_id: <lineage id from subject>\n            merge_date: "<today, YYYY-MM-DD>"\n        merged_steps:\n          given: <verbatim from the AC''s steps\.given>\n          when:  <verbatim from the AC''s steps\.when>\n          then:  <verbatim from the AC''s steps\.then>\n  3\. `service:` names one service the architecture document\n     declares, by its `services\[\]\.name`: never empty, and never\n     a name the architecture does not declare\. When it declares\n     one service, it is that one\. When it declares several, it\n     is the `service:` of the existing scenarios whose `path:`\n     step 4 reuses, the suite under `tests/<service>/`\. When\n     neither settles it, ask which declared service the\n     scenario belongs to, offering each declared name, before\n     giving the fix\.\n  4\. `path:` names the generated test file this scenario''s Go\n     test is written into\. REUSE an existing `path:` from a\n     scenario of the same command or feature family — several\n     scenarios share one file on purpose, so related\n     behaviours are read together\. Invent a new one only when\n     no existing file fits, and then make it\n     `tests/<service>/<family>_test\.go`, the suite of the\n     service step 3 names\.\n  5\. Preserve existing file ordering and indentation\. Do not\n     touch any other entry\.\n\n\n## Answer Format'
                - and: 'every file matching "tmp/*/01-mcp-endpoint-001-initialize-ok-checklist-*-user.txt" matches \*\*AC ID:\*\* 001-initialize-ok\n\*\*Lineage Scenario ID:\*\* mcp-endpoint-001-initialize-ok\n\*\*Description:\*\* The MCP server must respond with a 200 status'
                - the command exits with code 0
                - 'stdout matches msg=AC index=1 total=2 description="The MCP server must respond with HTTP 405'
                - stdout matches ALL CHECKS PASSED!
                - stdout matches APPLY COMPLETE
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: the scenario from acceptance criterion "mcp-endpoint-001-initialize-ok" in "docs/scenarios.yaml" is keyed "mcp-endpoint-001-initialize-ok"
                - and: the scenario from acceptance criterion "mcp-endpoint-002-get-refused" in "docs/scenarios.yaml" is keyed "mcp-endpoint-002-get-refused"
                - and: the engine dispatched 4 AI turns
                - but: no file outside "tmp" changed
                - and: stdout does not match RE-WALK
        - id: 004-key-apart-from-lineage-refused
          description: '`us apply` must refuse to write the Registry, exiting 1 and leaving it unchanged, when a Scenario claiming one of the Story''s criteria is keyed apart from that criterion''s lineage id, even though every Prompt passed, naming that Scenario and the lineage it claims'
          steps:
            - given:
                - the "us-apply-key-apart-from-lineage" project tree
                - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
            - when:
                - the Product Owner runs "us apply mcp-endpoint"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Scenario keyed apart from its lineage" scenario=mcp-endpoint-get-refused lineage=mcp-endpoint-002-get-refused
                - but: stdout does not match ALL CHECKS PASSED
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched 2 AI turns
        - id: 005-merge-names-declared-service
          description: A criterion merged into a Registry whose architecture declares several services must name the service whose suite holds the test file it reuses, never an empty service
          steps:
            - given:
                - the "us-apply-names-service" project tree
                - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
                - the Product Owner's answer to every question is "1"
            - when:
                - the Product Owner runs "us apply calc-halve --fix"
            - then:
                - the command exits with code 0
                - 'stdout matches msg=AC index=1 total=1'
                - stdout matches ALL CHECKS PASSED!
                - stdout matches APPLY COMPLETE
                - and: the file "docs/scenarios.yaml" is modified
                - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "calc-halve-001-even"
                - and: the scenario from acceptance criterion "calc-halve-001-even" in "docs/scenarios.yaml" is keyed "calc-halve-001-even"
                - and: 'the scenario from acceptance criterion "calc-halve-001-even" in "docs/scenarios.yaml" matches (?m)^service: "?calc"?$'
                - and: 'the scenario from acceptance criterion "calc-halve-001-even" in "docs/scenarios.yaml" matches (?m)^path: "?tests/calc/calc_test\.go"?$'
                - but: the file "docs/product/stories/calc-halve-a-number.yaml" is unchanged
                - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
                - and: stdout does not match One or more scenarios did not pass
        - id: 006-undeclared-service-refused
          description: '`us apply` must refuse to write the Registry, exiting 1 and leaving it unchanged, when a Scenario claiming one of the Story''s criteria leaves its `service` empty or names one the architecture does not declare, even though every Prompt passed, naming each such Scenario and its `service`'
          steps:
            - given:
                - the "us-apply-undeclared-service" project tree
                - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
            - when:
                - the Product Owner runs "us apply calc-halve"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Scenario names no declared service" scenario=calc-halve-001-even service="" declared=calc,neighbour'
                - 'stdout matches level=ERROR msg="Scenario names no declared service" scenario=calc-halve-002-odd service=abacus declared=calc,neighbour'
                - but: stdout does not match ALL CHECKS PASSED
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched 2 AI turns
        - id: 007-prompt-step-order
          description: The apply checklist prompt must group steps as Given, When, Then, preserving
            every block's order and every and or but modifier from the selected Acceptance
            Criterion
          steps:
          - given:
            - the "us-apply-prompt-order" project tree
          - when:
            - the Product Owner runs "us apply mcp-endpoint"
          - then:
            - and: 'every file matching "tmp/*/*-mcp-endpoint-007-ordered-checklist-*-user.txt"
                matches ### Steps\nGiven:\n  - the MCP server is running on its configured
                port\n  - and the greeting is "Hello"\n  - but no request has been sent\nWhen:\n  -
                the Claude User opens a connection\n  - and the Claude User sends an HTTP
                GET request to /mcp\nThen:\n  - the server returns HTTP 405\n  - and the greeting
                is still "Hello"\n  - but no response body is printed\n\n\n---'
            - the command exits with code 0
            - the engine dispatched 2 AI turns
            - no file outside "tmp" changed
