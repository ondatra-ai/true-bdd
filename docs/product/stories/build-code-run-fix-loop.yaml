story:
  id: build-code-run
  feature: build-code
  title: Run the declared test suite with build code and drive the fix loop until it passes
  as_a: System Architect
  i_want: build code to run the replay command the architecture declares for the suite, exit 1 when that command's program
    cannot start or a test is still failing when the walk ends, and under --fix refresh each verdict after an apply turn and
    run the suite again at each outer walk until it has no failures, a browser suite included
  so_that: the services can be rebuilt from the specification, with the suite's own exit status rather than a person's reading
    deciding when they behave
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 002-unstartable-runner-exits-1
    description: A suite command the architecture declares whose program the machine cannot start must end the run with exit
      code 1 and name that program on stdout
    steps:
    - given:
      - the "build-code-command-not-executable" project tree
    - when:
      - the System Architect runs "build code"
    - then:
      - the command exits with code 1
      - stdout matches msg="Cannot run suite" framework=go-test
      - stdout matches true-bdd-no-such-runner
      - stdout matches discovery failed
      - but: no file outside "tmp" changed
      - and: the engine spawned the test runner "true-bdd-no-such-runner"
      - and: the engine spawned exactly 1 test runner
      - and: the engine dispatched no AI turns
  - id: 001-runs-declared-replay-command
    description: '`build code` must run the command its architectural spec declares — and specifically the `replay` one'
    steps:
    - given:
      - the "build-code-commands-from-spec" project tree
    - when:
      - the System Architect runs "build code"
    - then:
      - the command exits with code 0
      - stdout matches msg="Running tests" framework=go-test
      - stdout matches msg="Suite failures" failures=0 framework=go-test
      - stdout matches msg="Total failing tests across architecture" failures=0
      - stdout matches BUILD CODE COMPLETE
      - stdout matches msg="Loaded prompts" command="build code" items=0
      - but: no file outside "tmp" changed
      - and: the engine spawned a test runner with arguments matching -run \^TestGreen\$
      - and: the engine spawned exactly 1 test runner
      - and: the engine dispatched no AI turns
  - id: 004-fix-reruns-fixed-test
    description: After a fix is applied, build code reruns the failing set in one selection before fresh outer discovery
    steps:
    - given:
      - the "build-code-fix-named-test" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches msg="Running tests" framework=go-test
      - stdout matches msg="Suite failures" failures=1 framework=go-test
      - stdout matches msg="Total failing tests across architecture" failures=1
      - stdout matches msg="Fix applied; re-running the failing set"
      - stdout matches BUILD CODE COMPLETE
      - and: the file "services/calc/calc.go" is modified
      - and: the engine spawned a test runner with arguments matching TestAddSumsItsArguments
      - and: the engine spawned exactly 3 test runners
      - and: the engine dispatched 2 AI turns
      - but: the file "tests/suite/add_test.go" is unchanged
      - and: the file "tests/suite/canary_test.go" is unchanged
      - and: the file "docs/architecture/architecture.yaml" is unchanged
      - and: the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 003-failing-test-exits-1
    description: A walk that ends with a test still failing must exit non-zero
    steps:
    - given:
      - the "build-code-nonconvergence" project tree
    - when:
      - the System Architect runs "build code"
    - then:
      - the command exits with code 1
      - stdout matches msg="Running tests" framework=go-test
      - stdout matches msg="Suite failures" failures=1 framework=go-test
      - stdout matches msg="Total failing tests across architecture" failures=1
      - stdout does not match BUILD CODE COMPLETE
      - stdout matches msg="Check answered" check=tests-pass.*answer=fail
      - but: no file outside "tmp" changed
      - and: the engine spawned the test runner "go"
      - and: the engine dispatched no AI turns
  - id: 005-playwright-fix-loop-converges
    description: A Playwright suite whose app does not exist yet must drive the fix loop until the browser assertion passes
    steps:
    - given:
      - the "build-code-playwright-nextjs" project tree
      - and: the project's browser test dependencies are installed
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches msg="Running tests" framework=playwright
      - stdout matches BUILD CODE COMPLETE
      - and: the file "services/frontend/Dockerfile" is created
      - and: the file "services/frontend/package.json" is created
      - but: the file "docker-compose.yaml" is unchanged
      - and: the file "tests/integration/frontend-home.spec.ts" is unchanged
      - and: the file "docs/architecture/architecture.yaml" is unchanged
      - and: no file outside "tmp" and "services/frontend" changed
      - and: the shell command "npx playwright test --reporter=json --config playwright.config.ts integration" run in "tests"
          exits with code 0
      - and: 'judge: services/frontend/package.json declares Next.js and React, and defines whichever of the dev or start
          scripts the created Dockerfile invokes to launch the server'
      - and: 'judge: services/frontend/Dockerfile defines a runnable Next.js build — it installs the declared dependencies,
          exposes the port docker-compose.yaml maps, and starts the server'
  - id: 006-shared-fix-skips-green-peer
    description: Two failing tests receive one plan and one writer for both, with one selected rerun and no validation turn
    steps:
    - given:
      - the "build-code-shared-fix" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD CODE COMPLETE
      - stdout matches msg="Loaded prompts" command="build code" items=1
      - stdout matches msg="Check answered" check=tests-pass.*answer=pass
      - and: stdout matches msg="Suite failures" failures=2 framework=go-test
      - and: the engine dispatched no validation AI turns to "claude"
      - and: the engine dispatched 1 fix AI turn to "claude"
      - and: the engine dispatched 1 apply AI turn to "codex"
      - and: the engine dispatched 2 AI turns
      - and: the engine spawned exactly 3 test runners
      - and: the engine spawned a test runner with arguments matching -run \^TestAAdd\$\|\^TestBAdd\$
      - 'every file matching "tmp/*/apply-*-user.txt" matches Whole suite:'
      - 'every file matching "tmp/*/apply-*-user.txt" matches Selection:'
      - every file matching "tmp/*/apply-*-user.txt" matches TestAAdd
      - every file matching "tmp/*/apply-*-user.txt" matches TestBAdd
      - but: the file "tests/suite/calc_test.go" is unchanged
      - and: the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 007-next-walk-finds-regression
    description: A repair that breaks a test passing at discovery must cause the next suite run to discover and repair that
      regression before the command exits successfully
    steps:
    - given:
      - the "build-code-cross-walk" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD CODE COMPLETE
      - and: stdout matches msg="Suite failures" failures=0 framework=go-test
      - and: stdout matches msg=test index=1 total=1 id=.*TestBCompatibility
      - and: the engine dispatched no validation AI turns to "claude"
      - and: the engine dispatched 2 fix AI turns to "claude"
      - and: the engine dispatched 2 apply AI turns to "codex"
      - and: the engine dispatched 4 AI turns
      - and: the engine spawned exactly 5 test runners
      - but: the file "tests/suite/calc_test.go" is unchanged
      - and: the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
