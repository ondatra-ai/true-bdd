story:
    id: engine-term-documents
    feature: engine
    title: Refuse unreadable term documents
    as_a: Quality Engineer
    i_want: scen check to refuse unreadable glossary and Word mapping documents
    so_that: checks never invent missing specification context
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-glossary-not-a-list-stops-scen-check
          description: '`scen check` must stop at its declared-term check when the product document''s `glossary:` is not a list, naming the document and that the glossary must hold a list of terms, before any later check or AI turn'
          steps:
            - given:
                - the "scen-check-glossary-not-a-list" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Check could not answer" check=declared-terms subjectID=E2E-001
                - and: 'stdout matches read the glossary: product document \./docs/product/product\.yaml: glossary: must hold a list of terms'
                - but: stdout does not match check=term-mappings
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 002-mapping-not-a-list-stops-scen-check
          description: '`scen check` must stop at its term-mapping check when the architecture document''s `architecture.terms:` is not a list, naming the document and that the word mapping must hold a list of mappings, before any later check or AI turn'
          steps:
            - given:
                - the "scen-check-mapping-not-a-list" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Check could not answer" check=term-mappings subjectID=E2E-001
                - and: 'stdout matches read the word mapping: architecture document \./docs/architecture/architecture\.yaml: architecture\.terms: must hold a list of mappings'
                - but: stdout does not match check=step-definitions
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 003-product-not-yaml-stops-scen-check
          description: '`scen check` must stop at its first check that reads the product document when that document is not valid YAML, naming the document and the line its reader stopped at, before any later check or AI turn'
          steps:
            - given:
                - the "scen-check-product-not-yaml" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Check could not answer" check=declared-terms subjectID=E2E-001
                - and: 'stdout matches read the concepts: .*product document \./docs/product/product\.yaml: yaml: line \d+: did not find expected'
                - but: stdout does not match check=term-mappings
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-architecture-not-yaml-stops-scen-check
          description: '`scen check` must refuse startup when the architecture document is not valid YAML, naming the document and the line its reader stopped at, before any later check or AI turn'
          steps:
            - given:
                - the "scen-check-architecture-not-yaml" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start: checklist documents unsatisfiable"'
                - and: 'stdout matches failed to parse architecture file \./docs/architecture/architecture\.yaml: yaml: line \d+: did not find expected'
                - but: stdout does not match check=step-definitions
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-glossary-not-a-list-refuses-build-steps-fix
          description: The body writer refuses a malformed term list before skeletons, runners or AI
          steps:
          - given:
            - the "build-steps-glossary" project tree
          - when:
            - the System Architect runs "build steps --fix"
          - then:
            - the command exits with code 1
            - 'stdout matches glossary: must hold a list of terms'
            - the engine dispatched no AI turns
            - the engine spawned no test runners
            - no file outside "tmp" changed
        - id: 006-mapping-not-a-list-refuses-build-steps-fix
          description: The body writer refuses a malformed term list before skeletons, runners or AI
          steps:
          - given:
            - the "build-steps-mapping" project tree
          - when:
            - the System Architect runs "build steps --fix"
          - then:
            - the command exits with code 1
            - 'stdout matches architecture.terms: must hold a list of mappings'
            - the engine dispatched no AI turns
            - the engine spawned no test runners
            - no file outside "tmp" changed
