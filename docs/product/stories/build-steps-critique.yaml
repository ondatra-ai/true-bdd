story:
  id: build-steps-critique
  feature: build-steps
  title: Verify step definitions as one Checklist item
  as_a: System Architect
  i_want: one Checklist item asking whether each definition matches its steps under its Concept and binding
  so_that: a wrong operation or assertion returns to the Fix loop before the Item passes
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-operation
    description: A when omitting its bound operation fails step-verification and returns to the Fix loop
    steps:
    - given:
      - the "build-steps-critique-operation" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step definition verified
      - stdout matches concept_binding.*does not call the bound double operation
      - the engine dispatched 11 AI turns
      - the engine dispatched 7 validation AI turns to "claude"
      - no file outside "tmp" and "tests" changed
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches binding:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches interface_document:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match (?m)^fixture_inputs:'
      - every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match calc-002-double
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 002-assertion
    description: An assertion contradicting the step's concept fails step-verification and returns to the Fix loop
    steps:
    - given:
      - the "build-steps-critique-assertion" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step definition verified
      - stdout matches concept_meaning.*assertion contradicts the step
      - the engine dispatched 11 AI turns
      - the engine dispatched 7 validation AI turns to "claude"
      - no file outside "tmp" and "tests" changed
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches binding:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches interface_document:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match (?m)^fixture_inputs:'
      - every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match calc-002-double
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 003-correct
    description: A correct given that puts its state in place passes step-verification and completes
    steps:
    - given:
      - the "build-steps-critique-correct" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step definition verified
      - the engine dispatched 7 AI turns
      - the engine dispatched 5 validation AI turns to "claude"
      - stdout matches role=prompt cli=claude model=claude-sonnet-5
      - no file outside "tmp" and "tests" changed
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches binding:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" matches interface_document:'
      - 'every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match (?m)^fixture_inputs:'
      - every file matching "tmp/*/*checklist-build-steps-step-verification-user.txt" does not match calc-002-double
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
