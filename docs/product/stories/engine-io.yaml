story:
  id: engine-io
  feature: engine
  title: Preserve the engine IO behaviour across a complete engine rebuild
  as_a: System Architect
  i_want: the engine to regenerate all its own IO code from observed behaviour
  so_that: a rebuild needs no repository implementation outside its folder
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-read-hold
    description: The engine waits for a conflicting exclusive parent-directory hold before accessing a file, then completes
      after release
    steps:
    - given:
      - the "engine-io-read-hold" project tree
    - when:
      - the System Architect runs "build tests" while a "exclusive" hold blocks "docs"
    - then:
      - the command exits with code 1
      - stdout matches no scenarios
      - no file outside "tmp" changed
  - id: 002-write-hold
    description: The engine waits for a conflicting shared parent-directory hold before accessing a file, then completes after
      release
    steps:
    - given:
      - the "engine-io-write-hold" project tree
      - the project tree has no "true-bdd/true-bdd.yaml"
    - when:
      - the System Architect runs "init" while a "shared" hold blocks "true-bdd"
    - then:
      - the command exits with code 0
      - the file "true-bdd/true-bdd.yaml" is created
      - 'the file "true-bdd/true-bdd.yaml" matches (?m)^  scen_check_concurrency: 1$'
  - id: 003-events
    description: Engine IO preserves stream events, usage and refusal targets with stable log keys and scrubs Git hook variables
      for Go tools
    steps:
    - given:
      - the "engine-io-events" project tree
      - the codex writer uses fixture-controlled authentication and CLIs
      - the engine uses an observed fixture Claude CLI
      - Git hook variables point outside the project
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - the codex writer provisioned and removed its fixture authentication
      - the file matching "tmp/true-bdd.log.json" has exactly 2 matches for "msg":"AssistantMessage received"
      - every file matching "tmp/true-bdd.log.json" matches "msg":"AssistantMessage received","content_blocks":1
      - every file matching "tmp/true-bdd.log.json" matches "msg":"ToolUseBlock details","content":"\{\\"name\\":\\"Read\\",\\"input\\":\{\\"file_path\\":\\"docs/sentinel.yaml\\"\}\}"
      - every file matching "tmp/true-bdd.log.json" matches "msg":"ResultMessage received"
      - every file matching "tmp/true-bdd.log.json" matches "msg":"AI turn usage","cli":"claude","cost_usd":0,"input_tokens":17,"output_tokens":9,"cache_read_input_tokens":3,"cache_creation_input_tokens":2
      - stdout matches role=fix denied="Read /outside/secret.txt; Glob /outside/\*.go; Grep /outside/search; Read /outside/я{191}…"
      - stdout matches role=apply denied="command_execution /outside/command.txt; file_change /outside/edit.go; Read /outside/mcp.txt"
      - stdout does not match query-must-stay-private|ordinary/failure.txt
      - 'every file matching "tmp/true-bdd.log.json" does not match "tool":|"run":'
      - every file matching "tmp/*/*codex.log" matches fixture writer stderr sentinel
      - every file matching "tmp/*/*codex-events.jsonl" does not match fixture writer stderr sentinel
      - every file matching "tmp/true-bdd.log.json" matches "msg":"Dispatching AI turn","turn":1,"label":"claude-turn001","role":"fix","cli":"claude","model":"claude-opus-5","system_length":[0-9]+,"user_length":[0-9]+
      - every file matching "tmp/true-bdd.log.json" matches "msg":"AI turn returned","turn":1,"label":"claude-turn001","role":"fix","cli":"claude","model":"claude-opus-5","duration_ms":[0-9]+,"length":125
      - every file matching "tmp/true-bdd.log.json" matches "msg":"CLI transcript saved","file":"tmp/[^"\n]+/codex-turn002-codex-events.jsonl"
      - the file "services/calc/calc.go" is created
  - id: 004-cancellation
    description: Cancelling the engine stops an active Claude turn and its descendants and ends the run as a failure
    steps:
    - given:
      - the "engine-io-cancel" project tree
    - when:
      - the System Architect cancels "build code --fix" after a CLI descendant starts
    - then:
      - the command exits with code 1
      - the CLI descendant has stopped
      - stdout matches context canceled
  - id: 005-stream-bytes
    description: The engine captures the declared suite's stdout and stderr byte for byte, retaining whitespace and an absent
      final newline
    steps:
    - given:
      - the "engine-io-streams" project tree
    - when:
      - the System Architect runs "build code"
    - then:
      - the command exits with code 0
      - every file matching "tmp/*/testrun-*-stdout.jsonl" matches ^\{"Action":"run","Package":"fixture/tests/suite","Test":"TestBytes"\}\n\{"Action":"pass","Package":"fixture/tests/suite","Test":"TestBytes"\}$
      - every file matching "tmp/*/testrun-*-stderr.txt" matches ^  stderr\tbytes  $
      - every file matching "tmp/true-bdd.log.json" matches "msg":"Subprocess returned","binary":"sh","args":\["tests/suite/run.sh","-json"\],"exit_code":0,"signal":"signal
        0","elapsed_ms":[0-9]+,"stdout_bytes":136,"stderr_bytes":16
      - the engine dispatched no AI turns
  - id: 006-codex-cancellation
    description: Cancelling the engine stops an active codex turn and its descendants and ends the run as a failure
    steps:
    - given:
      - the "engine-io-cancel-codex" project tree
    - when:
      - the System Architect cancels "build code --fix" after a CLI descendant starts
    - then:
      - the command exits with code 1
      - the CLI descendant has stopped
      - stdout matches context canceled
  - id: 007-atomic-write
    description: Rewriting a generated file replaces its inode atomically, preserves existing permissions and does not follow
      a stale staging symlink
    steps:
    - given:
      - the "engine-io-atomic" project tree
      - the project prepares atomic replacement probes
    - when:
      - the System Architect runs "build tests --fix" after planting a stale staging symlink
    - then:
      - the command exits with code 0
      - the rewritten file "tests/mcp/ticket_test.go" keeps private permissions and replaces its old hard link "tmp/original.go"
      - the file "tests/mcp/ticket_test.go" matches the session is granted a ticket within 5 seconds
      - the file "tmp/staging-target.txt" matches ^sentinel\n$
      - the engine dispatched no AI turns
  - id: 008-shared-read
    description: Reading the Registry document coexists with another shared parent-directory hold
    steps:
    - given:
      - the "engine-io-shared-read" project tree
    - when:
      - the System Architect runs "build tests" while a "shared" hold permits "docs"
    - then:
      - the command exits with code 1
      - stdout matches no scenarios
  - id: 009-claude-writer-environment
    description: The Claude CLI receives its role and isolation environment at spawn in every mode, including replay
    steps:
    - given:
      - the "engine-io-claude-writer" project tree
      - the engine uses an observed fixture Claude CLI
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - the file "tmp/claude-environment.txt" matches ^writer environment verified at spawn\n$
      - the engine dispatched 1 apply AI turn to "claude"
      - the file "services/calc/calc.go" is created
      - the file "tests/suite/calc_test.go" is unchanged
  - id: 010-hold-timeout
    description: An unreleased parent-directory hold stops Registry reading after its ten-second wait, naming the held parent
    steps:
    - given:
      - the "engine-io-hold-timeout" project tree
    - when:
      - the System Architect runs "build tests" while a "exclusive" hold blocks "docs" beyond its wait limit
    - then:
      - the command exits with code 1
      - stderr matches directory lock not released
      - stderr matches docs held for 10s
      - no file outside "tmp" changed
