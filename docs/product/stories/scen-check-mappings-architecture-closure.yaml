# Story `scen-check-mappings`: `scen check` holding the words a host's
# concepts declare to the architecture's word mapping.
#
# The `term-mappings` verdicts: a term mapped twice, and a product document
# with no concepts, which also leaves the step-definition check idle. The
# walk and its exit code are the Story `scen-check`; the glossary closure,
# the step definition check and the fixes of `scen check --fix` are
# scen-check-terms, scen-check-step-definitions and scen-check-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-mappings-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: scen-check-mappings
    feature: scen-check
    title: Hold every word a host's concepts rely on to one architecture mapping
    as_a: Quality Engineer
    i_want: scen check to fail every Scenario when a term a concept declares has no mapping in the architecture or more than one, naming the concept, and to leave every Scenario unchecked when the product document declares no concepts
    so_that: every word a step relies on says how one step definition builds and observes it, so that definition follows from the spec rather than from a guess
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 003-term-mapped-twice-fails
          description: A term a concept declares, which the architecture maps more than once, must fail every Scenario, naming the concept, the term and how many times it is mapped, because a word built two ways has no one way a step definition can follow
          steps:
            - given:
                - the "scen-check-term-mapped-twice" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=term-mappings subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: then concept ''answer'': the architecture maps \\"reply\\" 2 times\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 004-no-catalogue-unchecked
          description: A product document that declares no concepts must leave every Scenario unchecked by the term-mapping and step-definition checks, saying so, whatever the architecture maps
          steps:
            - given:
                - the "scen-check-closure-no-catalogue" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=term-mappings subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: not checked: the product document declares no concepts\]"'
                - and: 'stdout matches msg="Check answered" check=step-definitions subjectID=E2E-001 promptIndex=2 answer=pass context="\[E2E-001: not checked: the product document declares no concepts\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
