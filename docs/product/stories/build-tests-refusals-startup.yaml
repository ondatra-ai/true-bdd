story:
    id: build-tests-refusals
    feature: build-tests
    title: Refuse an invalid Registry or a step outside the Catalogue
    as_a: System Architect
    i_want: build tests to refuse an absent, empty or malformed Registry and steps outside the declared Catalogue
    so_that: rendering cannot silently omit behaviour
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-empty-registry-refused
          description: A registry file that declares no scenarios must be refused, never walked to a trivial success
          steps:
            - given:
                - the "build-tests-empty-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches BUILD TESTS
                - 'stdout matches docs/scenarios\.yaml: requirements registry has no scenarios to walk'
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 002-misshapen-registry-refused
          description: A registry that is valid YAML but the wrong SHAPE must be refused with the decoder's own complaint, not a generic parse failure
          steps:
            - given:
                - the "build-tests-malformed-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches BUILD TESTS
                - stdout matches cannot unmarshal !!seq into map\[string\]
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - but: no file outside "tmp" changed
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: the engine dispatched no AI turns
        - id: 003-undeclared-registry-refused
          description: A host that never declared where its scenario registry lives must be refused, never quietly served the conventional path
          steps:
            - given:
                - the "build-tests-unconfigured-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches documents\.scenarios_yaml
                - but: stdout does not match Loaded requirements registry
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
