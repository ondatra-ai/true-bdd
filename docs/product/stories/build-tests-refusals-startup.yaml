# Story `build-tests-refusals`: `build tests` refuses at startup a Registry
# or a checklist it cannot walk.
#
# What `build tests` holds its inputs to before the first Cell, the
# catalogue the product document declares among them. Binding steps
# to definitions and authoring them from the spec is the Story
# build-tests-steps; model routing, which every command shares, is the Story
# engine.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `build-tests-refusals-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: build-tests-refusals
    feature: build-tests
    title: Refuse a build tests run whose Registry or checklist it cannot walk
    as_a: System Architect
    i_want: build tests to refuse at startup, naming what is wrong, a Registry the host never declared, a Registry whose YAML is not a Registry's shape, a Registry that declares no scenarios, a checklist that declares no prompts, and a Registry step outside the catalogue the product document declares, while a host that declares no catalogue walks unrefused
    so_that: a misconfigured host never sees its generated tests reported complete over nothing, a hand edit to the Registry cannot bypass the closure scen check holds Stories to, and the refusal costs no AI turn and changes no file
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-empty-registry-refused
          description: A registry file that declares no scenarios must be refused, never walked to a trivial success
          steps:
            - given:
                - the "build-tests-empty-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches BUILD TESTS
                - 'stdout matches docs/scenarios\.yaml: requirements registry has no scenarios to walk'
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - but: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 002-misshapen-registry-refused
          description: A registry that is valid YAML but the wrong SHAPE must be refused with the decoder's own complaint, not a generic parse failure
          steps:
            - given:
                - the "build-tests-malformed-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches BUILD TESTS
                - stdout matches cannot unmarshal !!seq into map\[string\]
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - but: no file outside "tmp" changed
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: the engine dispatched no AI turns
        - id: 003-undeclared-registry-refused
          description: A host that never declared where its scenario registry lives must be refused, never quietly served the conventional path
          steps:
            - given:
                - the "build-tests-unconfigured-registry" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - 'stdout matches level=ERROR msg="Refusing to start'
                - stdout matches documents\.scenarios_yaml
                - but: stdout does not match Loaded requirements registry
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 004-empty-checklist-refused
          description: A checklist file that declares no prompts must be refused before the walk, never converge on an item nothing checked
          steps:
            - given:
                - the "build-tests-empty-checklist" project tree
            - when:
                - the System Architect runs "build tests"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - but: stdout does not match BUILD TESTS
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 005-step-outside-catalogue-refused
          description: When the product document declares a catalogue, a Registry step that does not match exactly one catalogue template of its own block must refuse `build tests` at startup, naming each such Scenario and step whether or not a Story claims that Scenario, before a generated test is written or an AI turn is spent
          steps:
            - given:
                - the "build-tests-step-outside-catalogue" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="build tests"
                - and: stdout matches registry steps outside the catalogue in \./docs/product/product\.yaml
                - and: 'stdout matches INT-902: then step \\"the session is granted a ticket within 2 seconds\\" matches no template'
                - and: 'stdout matches INT-903: then step \\"the server answers 200\\" matches 2 templates: \\"the server answers \{code:number\}\\"; \\"the server answers 200\\"'
                - and: 'stdout matches INT-904: then step \\"the MCP server is running\\" matches \\"the MCP server is running\\", declared for given'
                - but: 'stdout does not match INT-901:'
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 006-no-catalogue-walks-unrefused
          description: When the product document declares no catalogue, `build tests` must say that it checks no step phrase and must walk the Registry without refusing any step for its wording, so a host adopts the catalogue only by writing one
          steps:
            - given:
                - the "build-tests-no-catalogue" project tree
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 0
                - stdout matches msg="Step phrases not checked" reason="the product document declares no catalogue"
                - and: stdout matches 1 of 1 scenario\(s\) already bind every step; walking 0\.
                - and: stdout matches BUILD TESTS COMPLETE
                - but: stdout does not match Refusing to start
                - and: the engine dispatched no AI turns
                - and: the file "tests/mcp/mcp_test.go" is created
                - and: no file outside "tmp" and "tests" changed
