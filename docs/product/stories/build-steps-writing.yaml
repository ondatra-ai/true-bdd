story:
  id: build-steps-writing
  feature: build-steps
  title: Write step definitions through the declared Public interface
  as_a: System Architect
  i_want: build steps --fix to write the engine skeleton and the AI body
  so_that: the tests reach the declared interface before building the service
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-new-body
    description: "A missing concept gets its Steps package before any generated test or main file exists"
    steps:
    - given:
      - "the \"build-steps-new\" project tree"
      - "the System Architect's answer to every question is \"1\""
    - when:
      - "the System Architect runs \"build steps --fix\""
    - then:
      - "the command exits with code 0"
      - "stdout matches BUILD STEPS COMPLETE"
      - "stdout matches Step coverage passed"
      - "the engine spawned exactly 0 test runners with arguments matching -list"
      - "the engine spawned exactly 0 test runners with arguments matching ^test\\b"
      - "exactly 0 files matching \"tests/calc/*_test.go\" are created"
      - "exactly 0 files matching \"tests/calc/scenarios/*.go\" are created"
      - "no file outside \"tmp\" and \"tests/calc\" changed"
      - "the engine dispatched 5 validation AI turns to \"claude\""
      - "every file matching \"tmp/*/*fix-iter*-user.txt\" matches binding:"
      - "every file matching \"tmp/*/apply-*-user.txt\" matches interface_document:"
      - "every file matching \"tmp/*/apply-*-user.txt\" matches calc-001-double"
  - id: 002-all-skeletons-first
    description: Each concept Item's pattern F writes its skeletons before its body F, and a completed fix walk rechecks every Item
    steps:
    - given:
      - the "build-steps-many" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step coverage passed
      - no file outside "tmp" and "tests" changed
      - stdout matches Concept skeletons rewritten
      - the engine dispatched 15 validation AI turns to "claude"
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 003-slot-order
    description: The quoted command and the number are passed to the written definition in the proposed pattern's capture order
    steps:
    - given:
      - the "build-steps-slots" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step coverage passed
      - no file outside "tmp" and "tests" changed
      - the engine dispatched 5 validation AI turns to "claude"
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 004-interface-cannot-serve
    description: A writer's verdict that the Public interface cannot serve its concept stops the walk distinctly after that one writer turn, naming the concept and what the interface lacks
    steps:
    - given:
      - the "build-steps-cannot-serve" project tree
      - the codex writer is controlled to answer that the interface cannot serve
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 1
      - stdout matches msg="Walk stopped".*public interface cannot serve
      - 'stderr matches public interface cannot serve when concept "halving": a halve command that reads its value from standard input; extend the Public interface declaration'
      - stdout does not match BUILD STEPS COMPLETE
      - the engine dispatched 1 apply AI turn to "codex"
      - no file outside "tmp" and "tests" changed
  - id: 005-outside-tests-refused
    description: The confined body writer refuses writes to the service and Specification while completing the test body
    steps:
    - given:
      - the "build-steps-outside" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step coverage passed
      - no file outside "tmp" and "tests" changed
      - stdout matches msg="Tool calls were denied; this turn did less than it was asked to".*role=apply
      - the engine dispatched 5 validation AI turns to "claude"
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
  - id: 006-bringup-is-not-red
    description: "build code refuses a bring-up failure as Red without the target"
    steps:
    - given:
      - "the \"build-steps-bringup\" project tree"
    - when:
      - "the System Architect runs \"build code\""
    - then:
      - "the command exits with code 1"
      - "stdout matches Red without target check failed"
      - "stderr matches red without target check failed.*calc-001-double"
      - "stdout does not match BUILD CODE COMPLETE"
      - "the engine dispatched no AI turns"
      - "no file outside \"tmp\" changed"
  - id: 007-green-body-repaired
    description: "build code stops on a green Scenario without service code and offers no fix"
    steps:
    - given:
      - "the \"build-steps-green\" project tree"
    - when:
      - "the System Architect runs \"build code\""
    - then:
      - "the command exits with code 1"
      - "stdout matches Scenario list passed"
      - "stdout matches Scenario green without target.*calc-001-double"
      - "stderr matches scenario green without target.*calc-001-double"
      - "stdout does not match BUILD CODE COMPLETE"
      - "the engine dispatched no AI turns"
      - "the engine spawned exactly 1 test runner with arguments matching -list \\."
      - "no file outside \"tmp\" changed"
  - id: 008-suite-wiring
    description: "build tests writes the plain bddgo main file beside the Scenario tests"
    steps:
    - given:
      - "the \"build-steps-wiring\" project tree"
    - when:
      - "the System Architect runs \"build tests --fix\""
    - then:
      - "the command exits with code 0"
      - "the file \"tests/calc/main_test.go\" is created"
      - "the file \"tests/calc/main_test.go\" matches // Code generated by `true-bdd build tests`\\. DO NOT EDIT\\."
      - "the file \"tests/calc/main_test.go\" matches func New\\(t \\*testing.T"
      - "exactly 0 files matching \"tests/calc/scenarios/*.go\" are created"
      - "stdout matches BUILD TESTS COMPLETE"
      - "the engine dispatched no AI turns"
      - "the engine spawned no test runners"
      - "no file outside \"tmp\" and \"tests\" changed"
      - "the shell command \"go test -tags bdd -json -count=1 ./tests/calc/...\" run in \".\" exits with code 0"
  - id: 009-harness-wiring
    description: "build tests writes the testkit main file beside the Scenario tests"
    steps:
    - given:
      - "the \"build-steps-harness-wiring\" project tree"
    - when:
      - "the System Architect runs \"build tests --fix\""
    - then:
      - "the command exits with code 0"
      - "the file \"tests/calc/main_test.go\" is created"
      - "the file \"tests/calc/main_test.go\" matches // Code generated by `true-bdd build tests`\\. DO NOT EDIT\\."
      - "the file \"tests/calc/main_test.go\" matches func New\\(t \\*testing.T"
      - "exactly 0 files matching \"tests/calc/scenarios/*.go\" are created"
      - "stdout matches BUILD TESTS COMPLETE"
      - "the engine dispatched no AI turns"
      - "the engine spawned no test runners"
      - "no file outside \"tmp\" and \"tests\" changed"
      - "the file \"tests/calc/main_test.go\" matches testkit.NewSuite"
      - "the file \"tests/calc/steps/state.go\" matches \\*testkit.ScenarioRun"
      - "the shell command \"go test -tags bdd -json -count=1 ./tests/calc/... -mode=services:replay,tests:replay\" run in \".\" exits with code 0"
  - id: 010-scenario-run-fix
    description: A suite Item adds the Scenario run without rewriting complete definitions or dispatching AI
    steps:
    - given:
      - "the \"build-steps-scenario-run-fix\" project tree"
      - "the System Architect's answer to every question is \"1\""
    - when:
      - "the System Architect runs \"build steps --fix\""
    - then:
      - "the command exits with code 0"
      - "the engine dispatched no AI turns"
      - "stdout matches BUILD STEPS COMPLETE"
      - "the file \"tests/calc/steps/state.go\" matches \\*testkit.ScenarioRun"
      - "the file \"tests/calc/steps/state.go\" matches Program string"
      - "the file \"tests/calc/steps/state.go\" matches Value\\s+int"
      - "the file \"tests/calc/steps/state.go\" matches func \\(state \\*State\\) Reset\\(\\)"
      - "the file \"tests/calc/steps/register.go\" is unchanged"
      - "no file outside \"tmp\" and \"tests/calc/steps\" changed"
  - id: 011-scenario-run-bare
    description: A bare run reports a missing Scenario run by suite without changing definitions
    steps:
    - given:
      - "the \"build-steps-scenario-run-bare\" project tree"
    - when:
      - "the System Architect runs \"build steps\""
    - then:
      - "the command exits with code 1"
      - "the engine dispatched no AI turns"
      - "stdout matches level=ERROR.*Concept build steps stopped"
      - "stdout matches level=ERROR.*tests/calc"
      - "stdout does not match BUILD STEPS COMPLETE"
      - "no file outside \"tmp\" changed"
  - id: 012-scenario-run-present
    description: A suite Item with its Scenario run passes without changing files
    steps:
    - given:
      - "the \"build-steps-scenario-run-present\" project tree"
    - when:
      - "the System Architect runs \"build steps\""
    - then:
      - "the command exits with code 0"
      - "the engine dispatched no AI turns"
      - "stdout matches BUILD STEPS COMPLETE"
      - "no file outside \"tmp\" changed"
