story:
  id: engine-claude-minimal
  feature: engine
  title: Isolate engine claude turns from host customizations
  as_a: System Architect
  i_want: every engine claude validation, fix and apply turn to receive only the context the engine supplies, without user, project or local settings, discovered
    CLAUDE.md memory or MCP servers
  so_that: host instructions cannot steer checklist verdicts or generated fixes
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-host-memory-excluded
    description: 'A host CLAUDE.md instructing every validation to fail must not reach an engine claude turn: a Scenario satisfying the selected Prompt still passes'
    steps:
    - given:
      - the "engine-claude-minimal" project tree
      - and: the "scen-check" checklist is narrowed to its "whether this scenario's description follows the rule-based format" prompt
    - when:
      - the Quality Engineer runs "scen check E2E-001"
    - then:
      - the command exits with code 0
      - stdout matches ALL CHECKS PASSED
      - and: 'the file "tmp/true-bdd.log.json" matches context\\":\[\\"E2E-001: ok\\"\]'
      - but: stdout does not match CHECK FAILED|HOST_MEMORY_CANARY_174
      - and: the engine dispatched 1 validation AI turn to "claude"
      - and: no file outside "tmp" changed
