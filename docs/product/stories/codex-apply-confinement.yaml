story:
  id: codex-apply
  feature: engine
  title: Confine every codex apply turn
  as_a: System Architect
  i_want: every codex apply turn to read only the Host project and runtime files and write only its own roots and scratch
  so_that: a build cannot retrieve deleted implementation from another project or a historical session
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-us-refine-writes-scratch
    description: A codex apply turn of us refine writes its scratch product document through the confined profile and the
      engine commits the converged change
    steps:
    - given:
      - the "codex-apply-us-refine" project tree
      - the Product Owner answers "1" to every question
    - when:
      - the Product Owner runs "us refine doc-outline --fix"
    - then:
      - the command exits with code 0
      - and: stdout matches msg="Codex turn sandboxed" label=codex-turn[0-9]+ sandbox=writer
      - but: stdout does not match sandbox=workspace-write
      - stdout matches msg="Check answered" check=step-phrases subjectID=doc-outline promptIndex=1 answer=fail
      - and: 'stdout matches AC-2: then step \\"Claude offers to summarise the document instead\\" matches no template'
      - and: stdout matches FIX PROMPT GENERATED
      - and: stdout matches msg="Fix recorded in the document" document=product
      - and: stdout matches check=step-phrases subjectID=doc-outline promptIndex=1 answer=pass
      - and: stdout matches ALL CHECKS PASSED!
      - and: stdout matches msg="Story saved"
      - and: no file outside "tmp" and "docs/product" changed
      - and: the file "docs/product/product.yaml" is modified
      - and: the file "docs/product/product.yaml" matches Claude offers to
      - and: the story "docs/product/stories/doc-outline-catalogued.yaml" has 3 acceptance criteria
      - and: the file "docs/product/stories/doc-outline-catalogued.yaml" matches Claude offers to summarise the document instead
  - id: 002-build-steps-writes-protected-tests
    description: The codex step writer receives the protected test paths and writes its body while preserving service and Specification
    steps:
    - given:
      - the "codex-apply-build-steps" project tree
      - the System Architect answers "1" to every question
    - when:
      - the System Architect runs "build steps --fix"
    - then:
      - the command exits with code 0
      - stdout matches BUILD STEPS COMPLETE
      - stdout matches Step coverage passed
      - stdout matches Scenario list passed
      - the engine spawned exactly 1 test runner with arguments matching -list \.
      - no file outside "tmp" and "tests" changed
      - stdout matches msg="Codex turn sandboxed" label=codex-turn[0-9]+ sandbox=writer
      - the engine dispatched no validation AI turns to "claude"
      - the shell command "go test -tags bdd -json -count=1 ./tests/calc/..." run in "." exits with code 0
