story:
  id: build-code-claude
  feature: build-code
  title: Repair the failing set with a confined Claude writer
  as_a: System Architect
  i_want: the Claude writer to run granted tests and preserve repairs after a started failure
  so_that: the engine can judge each repair without granting a general shell
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-selection
    description: Claude hook allows selection
    steps:
    - given:
      - the "claude-guard-selection" project tree
      - claude's write policy grants the test command "go test ./..." with selector "-run" in "."
      - the tool call is a "foreground" shell call in directory "." with command go test ./... -run '^TestOne$'
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard allows the tool call
  - id: 002-noncanonical
    description: Claude hook denies noncanonical
    steps:
    - given:
      - the "claude-guard-noncanonical" project tree
      - claude's write policy grants the test command "go test ./..." with selector "-run" in "."
      - the tool call is a "foreground" shell call in directory "." with command go test ./...; pwd
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - 'the guard''s reason matches allowed forms:'
  - id: 003-background
    description: Claude hook denies background
    steps:
    - given:
      - the "claude-guard-background" project tree
      - claude's write policy grants the test command "go test ./..." with selector "-run" in "."
      - the tool call is a "background" shell call in directory "." with command go test ./...
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - the guard's reason matches background commands are denied
  - id: 004-directory
    description: Claude hook denies directory
    steps:
    - given:
      - the "claude-guard-directory" project tree
      - claude's write policy grants the test command "go test ./..." with selector "-run" in "."
      - the tool call is a "foreground" shell call in directory "../other" with command go test ./...
    - when:
      - claude asks the guard about the tool call
    - then:
      - the guard denies the tool call
      - 'the guard''s reason matches allowed forms:'
  - id: 005-replay
    description: A Claude writer runs a granted selection and the engine reruns the set to convergence
    steps:
    - given:
      - the "build-code-claude-replay" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - the engine dispatched 1 fix AI turn to "claude"
      - the engine dispatched 1 apply AI turn to "claude"
      - the engine spawned exactly 3 test runners
      - the file "services/calc/calc.go" is modified
      - the file "tests/suite/calc_test.go" is unchanged
      - stdout matches BUILD CODE COMPLETE
      - every file matching "tmp/*/*apply*user.txt" matches go test -count=1 ./tests/suite/\.\.\. -run
      - the file "tmp/true-bdd.log.json" matches Bash
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 006-failure
    description: A Claude writer keeps its repair after a started failure and the engine reruns the set to convergence
    steps:
    - given:
      - the "build-code-claude-failure" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - the engine dispatched 1 fix AI turn to "claude"
      - the engine dispatched 1 apply AI turn to "claude"
      - the engine spawned exactly 3 test runners
      - the file "services/calc/calc.go" is modified
      - the file "tests/suite/calc_test.go" is unchanged
      - stdout matches BUILD CODE COMPLETE
      - every file matching "tmp/*/*apply*user.txt" matches go test -count=1 ./tests/suite/\.\.\. -run
      - the file "tmp/true-bdd.log.json" matches Bash
      - stdout matches level=WARN msg="Writer turn failed" outcome="non-zero exit"
      - the file matching "tmp/true-bdd.log.json" has exactly 1 match for "level":"WARN","msg":"Writer turn failed"
      - the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
  - id: 007-unrepresentable
    description: A replay argument containing a single quote withholds the writer grant with one warning
    steps:
    - given:
      - the "build-code-unrepresentable-replay" project tree
      - the System Architect's answer to every question is "1"
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 0
      - stdout matches level=WARN msg="Replay command grant unavailable"
      - stdout matches argument contains a single quote, newline or NUL
      - the file matching "tmp/true-bdd.log.json" has exactly 1 match for Replay command grant unavailable
      - every file matching "tmp/*/*-claude-config/policy.json" does not match "test_command"
