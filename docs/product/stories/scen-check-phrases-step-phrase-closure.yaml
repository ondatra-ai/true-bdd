# Story `scen-check-phrases`: `scen check` holds every step to one phrase.
#
# The `step-phrases` verdicts: the first level of term closure, answered by
# the engine's own check with no AI turn. The other closure checks are
# Stories of their own: scen-check-terms, scen-check-mappings and
# scen-check-step-definitions; their fixes are scen-check-fix.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `scen-check-phrases-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: scen-check-phrases
    feature: scen-check
    title: Hold every step of a claimed Scenario to exactly one catalogue phrase with scen check
    as_a: Quality Engineer
    i_want: scen check to fail a Scenario a Story claims when one of its steps matches no catalogue phrase, matches two, or matches one declared for another block, and to fail every claimed Scenario while the catalogue holds a template its grammar refuses, all without an AI turn
    so_that: no claimed Scenario rests on a step whose meaning the product document does not fix, and the check that says so costs nothing to run, while Scenarios no Story claims yet and hosts with no catalogue are told they were not checked
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-matched-steps-pass
          description: A Scenario a Story claims must pass the step-phrase check when each of its steps matches exactly one catalogue template declared for its block, whatever slots the templates use, and the `llm:` and `judge:` steps a model runs must be exempt
          steps:
            - given:
                - the "scen-check-phrase-closed" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: 7 steps match one template each, 2 model-run steps exempt\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 002-unmatched-step-fails
          description: A step of a Scenario a Story claims that matches no catalogue phrase must fail that Scenario, naming the step and its block, with the Scenario's `Q:` Prompts skipped and no AI turn spent on them
          steps:
            - given:
                - the "scen-check-phrase-unmatched" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: then step \\"the service answers within 200 milliseconds\\" matches no template\]"'
                - and: stdout matches msg="Prompt skipped after a failed check" subjectID=E2E-001 promptIndex=2
                - and: 'stdout matches scen-check/term_closure +D: step-phrases +fail +FAIL'
                - and: 'stdout matches SKIP: 1\n'
                - and: stdout matches Validation failed
                - but: stdout does not match ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 003-ambiguous-step-fails
          description: A step of a Scenario a Story claims that two catalogue templates match must fail that Scenario, naming both templates, because a step means one thing or nothing
          steps:
            - given:
                - the "scen-check-phrase-ambiguous" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: then step \\"the service answers 200\\" matches 2 templates: \\"the service answers \{code:number\}\\"; \\"the service answers 200\\"\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 004-wrong-block-step-fails
          description: A step of a Scenario a Story claims must fail that Scenario when the one template it matches is declared for another block, naming that block
          steps:
            - given:
                - the "scen-check-phrase-wrong-block" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=fail context="\[E2E-001: then step \\"the mcp service is running\\" matches \\"the mcp service is running\\", declared for given\]"'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 005-malformed-template-fails-every-scenario
          description: A catalogue template the grammar refuses must fail every Scenario a Story claims, naming the template and the rule it breaks, because no step can be held to it
          steps:
            - given:
                - the "scen-check-phrase-malformed" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=fail
                - and: 'stdout matches E2E-001: catalogue template \\"the mcp service is running\\" is malformed: another entry declares the same template'
                - and: 'stdout matches E2E-001: catalogue template \\"the service answers \{reply\}\\" is malformed: text slot \{reply\} is not between double quotes'
                - and: 'stdout matches E2E-001: catalogue template \\"the service waits \{delay:seconds\}\\" is malformed: slot \{delay:seconds\} has an unknown kind; a slot is text, number, role or pattern'
                - and: 'stdout matches E2E-001: catalogue template \\"the reply matches \{expected:pattern\} exactly\\" is malformed: pattern slot \{expected:pattern\} is not the last token'
                - and: 'stdout matches E2E-001: catalogue template \\"the reply matches\{expected:pattern\}\\" is malformed: pattern slot \{expected:pattern\} does not follow a space'
                - and: 'stdout matches is malformed: slot name \\"name\\" is used twice'
                - and: 'stdout matches E2E-001: catalogue template \\"the \{actor:role\} sends \\"\{message\}\\"\\" is malformed: role slot \{actor:role\}, but the product document declares no roles'
                - and: 'stdout matches is malformed: brackets \[answers\|\\"replies\\"\] hold a slot, a quote or another bracket'
                - and: 'stdout matches E2E-001: catalogue template \\"the service is \{up\\" is malformed: a \{ is never closed'
                - and: 'stdout matches E2E-001: catalogue template \\"the service \[answers\\" is malformed: a \[ is never closed'
                - and: 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-002 promptIndex=1 answer=fail context="\[E2E-002: catalogue template \\"the mcp service is running\\" is malformed: another entry declares the same template'
                - and: stdout matches Validation failed
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 006-unclaimed-scenario-unchecked
          description: A Scenario no Story claims must pass the step-phrase check unchecked, saying so, while a Scenario a Story claims is checked beside it
          steps:
            - given:
                - the "scen-check-phrase-unclaimed" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: 3 steps match one template each\]"'
                - and: 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-002 promptIndex=1 answer=pass context="\[E2E-002: not checked: no Story claims this Scenario yet\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
        - id: 007-no-catalogue-unchecked
          description: A product document that declares no catalogue must leave every Scenario unchecked by the step-phrase check, saying so, because a host adopts the catalogue by writing one
          steps:
            - given:
                - the "scen-check-phrase-no-catalogue" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - 'stdout matches msg="Check answered" check=step-phrases subjectID=E2E-001 promptIndex=1 answer=pass context="\[E2E-001: not checked: the product document declares no catalogue\]"'
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched no AI turns
                - and: no file outside "tmp" changed
