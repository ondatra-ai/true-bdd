# Story `checklist-skip`: a checklist Prompt parked with `skip: true`, and
# a `skip:` that is not a boolean refused at startup.
#
# A Prompt carrying `skip: true` is left out of the walk; `skip: false`,
# or no `skip:`, walks it as before. YAML reads `"false"` and `yes` as
# strings, so a `skip:` that is not a boolean is refused rather than read
# as one. Each Scenario drives it through `scen check`, whose built-in
# checks let a Prompt be walked beside the parked one without an AI turn.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `checklist-skip-<id>` (ADR 0014), and its steps are that Scenario's
# steps.

story:
    id: checklist-skip
    feature: engine
    title: 'Park a checklist Prompt with `skip: true`, and refuse at startup a `skip:` that is not a boolean'
    as_a: Quality Engineer
    i_want: 'a checklist Prompt carrying `skip: true` left out of the walk, every other Prompt walked as before, and a Prompt whose `skip:` is not a boolean refused at startup, naming the Prompt'
    so_that: a parked Prompt costs no AI turn, and a `skip:` the engine would have to guess at, such as the string "false", stops the run before it spends anything instead of silently skipping the Prompt
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-skipped-prompt-not-walked
          description: 'A checklist Prompt carrying `skip: true` must not be walked and must cost no AI turn, while the checklist''s other Prompts, with `skip: false` or no `skip:`, are walked as before'
          steps:
            - given:
                - the "scen-check-skipped-prompt" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - stdout matches SCEN CHECK
                - and: stdout matches msg="Check answered" check=given-when-then subjectID=E2E-001 promptIndex=2 answer=pass
                - and: stdout matches scen-check/scenario_quality +Decide whether this scenario has a binary pass/fail.* +pass +PASS
                - but: stdout does not match description follows the
                - and: stdout matches ALL CHECKS PASSED
                - and: the engine dispatched 1 AI turn
                - and: no file outside "tmp" changed
        - id: 002-non-boolean-skip-refused
          description: A checklist Prompt whose `skip:` is not a boolean, such as the string "false", must be refused at startup, naming the Prompt, with no AI turn, rather than skipped or walked on a guess at what it meant
          steps:
            - given:
                - the "scen-check-skip-not-boolean" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - 'stdout matches scen-check/scenario_quality #2 Decide whether this scenario includes at least one specific carries skip: \\"false\\", but skip: takes true or false'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
        - id: 003-every-prompt-skipped-refused
          description: 'A checklist whose every Prompt carries `skip: true` must be refused at startup as one with no Prompts, with no AI turn, never walked to a trivial success'
          steps:
            - given:
                - the "scen-check-every-prompt-skipped" project tree
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 1
                - stdout matches level=ERROR msg="Refusing to start" command="scen check"
                - and: 'stdout matches scen-check: checklist has no prompts, so every item would pass without being checked'
                - but: stdout does not match SCEN CHECK
                - and: no file outside "tmp" changed
                - and: the engine dispatched no AI turns
