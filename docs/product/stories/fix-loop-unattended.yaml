# Each Scenario owns its fixture tree. Happy-path services recordings are copied
# byte-for-byte from the corresponding original fixtures; no AI requests change.
# Unanswered-question fixtures reuse fix-loop-own-words/claude-001; menu EOF reuses
# build-code-spec-scenario/claude-001. Their empty goldens reuse fix-loop-exit-terms.
story:
  id: fix-loop-unattended
  feature: engine
  title: Apply proposed fixes unattended and stop when a person must answer
  as_a: System Architect
  i_want: --yes with --fix to apply each proposed fix without stdin and unanswered clarifying questions to stop clearly
  so_that: scripts can fix a host project without guessing the meaning of its Specification
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-build-code-applies
    description: With --fix --yes, build code --fix --yes applies every proposed fix without stdin and completes successfully
    steps:
    - given:
      - the "fix-loop-yes-build-code" project tree
    - when:
      - the System Architect runs "build code --fix --yes"
    - then:
      - the command exits with code 0
      - stdout matches msg="Running tests" framework=go-test
      - stdout matches msg="Suite failures" failures=1 framework=go-test
      - stdout matches msg="Total failing tests across architecture" failures=1
      - stdout matches msg="Fix applied; re-running the failing set"
      - stdout matches BUILD CODE COMPLETE
      - and: the file "services/calc/calc.go" is modified
      - and: the engine spawned a test runner with arguments matching TestAddSumsItsArguments
      - and: the engine spawned exactly 3 test runners
      - and: the engine dispatched 2 AI turns
      - but: the file "tests/suite/add_test.go" is unchanged
      - and: the file "tests/suite/canary_test.go" is unchanged
      - and: the file "docs/architecture/architecture.yaml" is unchanged
      - and: the shell command "go test -json -count=1 ./tests/suite/..." run in "." exits with code 0
      - stdout matches Automatically applying fix
  - id: 002-build-tests-applies
    description: With --fix --yes, build tests --fix --yes applies every proposed fix without stdin and completes successfully
    steps:
    - given:
      - the "fix-loop-yes-build-tests" project tree
    - when:
      - the System Architect runs "build tests --fix --yes"
    - then:
      - the command exits with code 0
      - and: the file "tests/mcp/mcp_test.go" is created
      - and: the file "tests/mcp/mcp_test.go" matches // Code generated by `true-bdd build tests`\. DO NOT EDIT\.
      - and: the file "tests/mcp/mcp_test.go" matches scenarios\.New\(t, "INT-900"\)
      - and: exactly 1 file matching "tests/mcp/steps/*.go" is created
      - and: every step of scenario "INT-900" in "docs/scenarios.yaml" is matched by a step definition under "tests/mcp/steps"
      - but: the file "docs/scenarios.yaml" is unchanged
      - and: no file outside "tmp" and "tests" changed
      - stdout matches Automatically applying fix
  - id: 003-refine-applies
    description: With --fix --yes, us refine 96.6 --fix --yes applies every proposed fix without stdin and completes successfully
    steps:
    - given:
      - the "fix-loop-yes-us-refine" project tree
      - and: the "us-refine" checklist is narrowed to its "whether its description field contains a vague word" prompt
    - when:
      - the Product Owner runs "us refine 96.6 --fix --yes"
    - then:
      - the command exits with code 0
      - stdout matches ALL CHECKS PASSED!
      - stdout matches msg="Story saved"
      - stdout matches REFINE COMPLETE
      - and: the only file changed outside "tmp" is "docs/product/stories/96.6-document-summary-desc-qualifier.yaml"
      - and: the story "docs/product/stories/96.6-document-summary-desc-qualifier.yaml" has id "96.6"
      - and: the story "docs/product/stories/96.6-document-summary-desc-qualifier.yaml" has 4 acceptance criteria
      - and: every acceptance criterion in the story "docs/product/stories/96.6-document-summary-desc-qualifier.yaml" has given, when and then
          steps
      - and: the description of acceptance criterion "AC-3" of the story "docs/product/stories/96.6-document-summary-desc-qualifier.yaml" does
          not match (?i)\b(properly|correctly|appropriate|user-friendly|fast|quickly|easily|seamless|intuitive)\b
      - and: stdout does not match Hit max apply attempts
      - stdout matches Automatically applying fix
  - id: 004-apply-applies
    description: With --fix --yes, us apply 99.3 --fix --yes applies every proposed fix without stdin and completes successfully
    steps:
    - given:
      - the "fix-loop-yes-us-apply" project tree
      - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
    - when:
      - the Product Owner runs "us apply 99.3 --fix --yes"
    - then:
      - the command exits with code 0
      - stdout matches msg=AC index=1 total=2
      - stdout matches msg=AC index=2 total=2
      - stdout matches msg="RE-WALK \(fixes applied, verifying\)" attempt=2
      - stdout matches ALL CHECKS PASSED!
      - stdout matches APPLY COMPLETE
      - and: the file "docs/scenarios.yaml" is modified
      - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "99.3-001-mcp-initialize"
      - and: exactly 1 scenario in "docs/scenarios.yaml" comes from acceptance criterion "99.3-002-mcp-get-refused"
      - and: the scenario from acceptance criterion "99.3-001-mcp-initialize" in "docs/scenarios.yaml" is keyed "99.3-001-mcp-initialize"
      - and: the scenario from acceptance criterion "99.3-002-mcp-get-refused" in "docs/scenarios.yaml" is keyed "99.3-002-mcp-get-refused"
      - and: no two scenarios in "docs/scenarios.yaml" share the same steps
      - but: the file "docs/product/stories/99.3-rewalk-fixture.yaml" is unchanged
      - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
      - and: stdout does not match msg="RE-WALK \(fixes applied, verifying\)" attempt=3
      - and: stdout does not match One or more scenarios did not pass
      - stdout matches Automatically applying fix
  - id: 005-scen-check-applies
    description: With --fix --yes, scen check --fix --yes applies every proposed fix without stdin and completes successfully
    steps:
    - given:
      - the "fix-loop-yes-scen-check" project tree
      - and: the "scen-check" checklist is narrowed to its "whether this scenario uses each catalogue phrase" prompt
    - when:
      - the Quality Engineer runs "scen check --fix --yes"
    - then:
      - the command exits with code 0
      - stdout matches CHECK FAILED
      - and: stdout matches FIX PROMPT GENERATED
      - and: stdout matches msg="Fix recorded in the document" document=scenarios_yaml
      - and: stdout matches ALL CHECKS PASSED
      - but: stdout does not match Hit max apply attempts
      - and: the only file changed outside "tmp" is "docs/scenarios.yaml"
      - and: the file "docs/scenarios.yaml" matches (?m)stdout matches [^\n]*Hello Ada
      - and: the engine dispatched 5 AI turns
      - stdout matches Automatically applying fix
  - id: 006-clarification-yes-stops
    description: A clarifying question under --yes prints the question and suggestions, requires a person and stops without guessing
    steps:
    - given:
      - the "fix-loop-unanswered" project tree
      - the Quality Engineer answers "1" to every question
    - when:
      - the Quality Engineer runs "scen check --fix --yes"
    - then:
      - the command exits with code 1
      - stdout matches What does the step "the service answers within 200 milliseconds" mean
      - stdout matches It means its reply arrives no later than that many milliseconds after the message was sent.
      - stdout matches It means the time from sending the message to its reply arriving is at most that many milliseconds.
      - stdout matches a person must answer
      - stderr matches a person must answer
      - stdout does not match User answered clarification question
      - stdout does not match SCEN CHECK COMPLETE
      - the engine dispatched 1 AI turn
      - no file outside "tmp" changed
  - id: 007-clarification-eof-stops
    description: A clarifying question with stdin at end of input prints the question and suggestions, requires a person and stops without guessing
    steps:
    - given:
      - the "fix-loop-unanswered-eof" project tree
    - when:
      - the Quality Engineer runs "scen check --fix"
    - then:
      - the command exits with code 1
      - stdout matches What does the step "the service answers within 200 milliseconds" mean
      - stdout matches It means its reply arrives no later than that many milliseconds after the message was sent.
      - stdout matches It means the time from sending the message to its reply arriving is at most that many milliseconds.
      - stdout matches a person must answer
      - stderr matches a person must answer
      - stdout does not match User answered clarification question
      - stdout does not match SCEN CHECK COMPLETE
      - the engine dispatched 1 AI turn
      - no file outside "tmp" changed
  - id: 008-menu-eof-stops
    description: End of input at the fix menu stops with guidance to use --yes, without a tests-still-failing error or completion banner
    steps:
    - given:
      - the "fix-loop-menu-eof" project tree
      - the project's test dependencies are installed
    - when:
      - the System Architect runs "build code --fix"
    - then:
      - the command exits with code 1
      - stdout matches end of input at fix menu; use --yes with --fix
      - stderr matches end of input at fix menu; use --yes with --fix
      - stdout does not match tests still failing
      - stderr does not match tests still failing
      - stdout does not match BUILD CODE COMPLETE
      - the engine dispatched 1 AI turn
      - no file outside "tmp" changed
  - id: 009-build-code-requires-fix
    description: The command build code refuses --yes without --fix as a usage error before any AI turn
    steps:
    - given:
      - the "fix-loop-yes-without-fix-build-code" project tree
    - when:
      - the System Architect runs "build code --yes"
    - then:
      - the command exits with code 1
      - stderr matches --yes requires --fix
      - 'stderr matches Usage:'
      - stdout does not match COMPLETE
      - stdout does not match AI turn starting
      - no file outside "tmp" changed
  - id: 010-build-tests-requires-fix
    description: The command build tests refuses --yes without --fix as a usage error before any AI turn
    steps:
    - given:
      - the "fix-loop-yes-without-fix-build-tests" project tree
    - when:
      - the System Architect runs "build tests --yes"
    - then:
      - the command exits with code 1
      - stderr matches --yes requires --fix
      - 'stderr matches Usage:'
      - stdout does not match COMPLETE
      - stdout does not match AI turn starting
      - no file outside "tmp" changed
  - id: 011-us-refine-requires-fix
    description: The command us refine 96.6 refuses --yes without --fix as a usage error before any AI turn
    steps:
    - given:
      - the "fix-loop-yes-without-fix-us-refine" project tree
    - when:
      - the System Architect runs "us refine 96.6 --yes"
    - then:
      - the command exits with code 1
      - stderr matches --yes requires --fix
      - 'stderr matches Usage:'
      - stdout does not match COMPLETE
      - stdout does not match AI turn starting
      - no file outside "tmp" changed
  - id: 012-us-apply-requires-fix
    description: The command us apply 99.3 refuses --yes without --fix as a usage error before any AI turn
    steps:
    - given:
      - the "fix-loop-yes-without-fix-us-apply" project tree
    - when:
