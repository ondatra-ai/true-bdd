story:
  id: build-tests-render
  feature: build-tests
  title: Render test files deterministically
  as_a: System Architect
  i_want: build tests to render tests without authoring definitions or running tests
  so_that: rendering works before the service and step definitions exist
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-renders-only
    description: build tests --fix renders the Registry tests without definitions, AI turns or test runs
    steps:
    - given:
      - the "build-tests-render-only" project tree
    - when:
      - the System Architect runs "build tests --fix"
    - then:
      - the command exits with code 0
      - and: the file "tests/mcp/mcp_test.go" is created
      - and: the file "tests/mcp/mcp_test.go" matches // Code generated by `true-bdd build tests`\. DO NOT EDIT\.
      - and: exactly 0 files matching "tests/mcp/steps/*.go" are created
      - and: stdout matches BUILD TESTS COMPLETE
      - and: the engine dispatched no AI turns
      - and: the engine spawned no test runners
      - and: no file outside "tmp" and "tests" changed
