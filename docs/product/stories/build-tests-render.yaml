story:
  id: build-tests-render
  feature: build-tests
  title: Render test files deterministically
  as_a: System Architect
  i_want: build tests to render tests without authoring definitions or running tests
  so_that: rendering defines the tests before the service exists
  status: IMPLEMENTED
  acceptance_criteria:
  - id: 001-renders-only
    description: "build tests renders the tests and main file over the existing Steps package without AI or a test runner"
    steps:
    - given:
      - "the \"build-tests-render-only\" project tree"
    - when:
      - "the System Architect runs \"build tests --fix\""
    - then:
      - "the command exits with code 0"
      - "the file \"tests/mcp/mcp_test.go\" is created"
      - "the file \"tests/mcp/main_test.go\" is created"
      - "the file \"tests/mcp/mcp_test.go\" matches New\\(t, \"INT-900\"\\)"
      - "exactly 0 files matching \"tests/mcp/steps/*.go\" are created"
      - "stdout matches BUILD TESTS COMPLETE"
      - "the engine dispatched no AI turns"
      - "the engine spawned no test runners"
      - "no file outside \"tmp\" and \"tests\" changed"
  - id: 002-no-steps
    description: "build tests refuses before rendering when the Steps package is missing"
    steps:
    - given:
      - "the \"build-tests-no-steps\" project tree"
    - when:
      - "the System Architect runs \"build tests --fix\""
    - then:
      - "the command exits with code 1"
      - "stdout matches steps package is missing.*build steps --fix"
      - "exactly 0 files matching \"tests/mcp/*_test.go\" are created"
      - "the engine dispatched no AI turns"
      - "the engine spawned no test runners"
      - "no file outside \"tmp\" changed"
  - id: 003-orphan-fixture
    description: "build tests refuses a fixture tree no Scenario names"
    steps:
    - given:
      - "the \"build-tests-orphan-fixture\" project tree"
    - when:
      - "the System Architect runs \"build tests --fix\""
    - then:
      - "the command exits with code 1"
      - "stdout matches fixture tree .*unused has no Scenario"
      - "the engine dispatched no AI turns"
      - "the engine spawned no test runners"
      - "stdout does not match BUILD TESTS COMPLETE"
  - id: 004-record-exclude
    description: 'build tests passes the record command exclusions into the tests main file alongside dependency recording rules'
    steps:
    - given:
      - 'the "build-tests-record-exclude" project tree'
    - when:
      - 'the System Architect runs "build tests --fix"'
    - then:
      - 'the command exits with code 0'
      - 'the file "tests/mcp/main_test.go" is created'
      - 'the file "tests/mcp/main_test.go" matches RecordExclude: \[\]string\{"cache/\*\*", "\*\*/private/\*\*"\}'
      - 'the file "tests/mcp/main_test.go" matches Unread: \[\]string\{"vendor-private/\*\*"\}'
      - 'stdout matches BUILD TESTS COMPLETE'
      - 'the engine dispatched no AI turns'
      - 'the engine spawned no test runners'
      - 'no file outside "tmp" and "tests" changed'
  - id: 005-record-malformed
    description: 'build tests refuses a malformed record command before rendering'
    steps:
    - given:
      - 'the "build-tests-record-malformed" project tree'
    - when:
      - 'the System Architect runs "build tests --fix"'
    - then:
      - 'the command exits with code 1'
      - 'stdout matches testing.commands.record must be a string or'
      - 'exactly 0 files matching "tests/mcp/*_test.go" are created'
      - 'the engine dispatched no AI turns'
      - 'the engine spawned no test runners'
      - 'stdout does not match BUILD TESTS COMPLETE'
      - 'no file outside "tmp" changed'
