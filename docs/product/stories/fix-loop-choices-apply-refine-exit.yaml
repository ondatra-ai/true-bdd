# Story `fix-loop-choices`: what each answer to the fix loop does, whichever
# command runs it.
#
# Every `--fix` run offers, for a failed check, to apply the proposed fix,
# refine it with feedback, or exit, and may first ask clarifying questions.
# Applying is what every other `--fix` Scenario does; this Story holds the
# refine choice, a question answered in the person's own words, and the
# exit of each command whose fix loop writes a document. The bounds on the
# loop are the Story fix-loop-bounds.
#
# Its criteria run `scen check` (three), `us refine`, `us apply` and
# `build tests`; a Story's role is the one that runs its command (Q25), so
# with mixed commands it is the role that runs most of them.
#
# Each criterion's id is the second half of its Scenario's Registry key,
# `fix-loop-choices-<id>` (ADR 0014), and its steps are that Scenario's steps.

story:
    id: fix-loop-choices
    feature: engine
    title: Settle each failed check in the --fix loop by applying, refining or exiting, in my own words
    as_a: Quality Engineer
    i_want: every --fix run to let me apply the fix it proposes, refine it with feedback I type, or exit without applying, to keep a clarifying answer I type in my own words exactly as I typed it, and on exit to leave every document it would write as it was
    so_that: a fix lands only once I approve it, worded as I meant it, and walking away from a fix never leaves a half-fixed Story, Registry or term document behind
    status: IMPLEMENTED
    acceptance_criteria:
        - id: 001-refine-reshapes-fix
          description: Choosing to refine a proposed fix must read the person's feedback up to an empty line, propose the fix again shaped by that feedback, and apply the refined fix once the person picks apply
          steps:
            - given:
                - the "fix-loop-refine-feedback" project tree
                - the Quality Engineer answers "2 / Call the number slot of the new template budget / / 1" line by line
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches msg="User chose fix action" rawInput=2 action=refine
                - and: stdout matches msg="User provided refinement feedback" feedbackLength=47 feedback="Call the number slot of the new template budget"
                - and: stdout matches (?s)FIX PROMPT GENERATED.*REFINE FIX PROMPT.*FIX PROMPT GENERATED
                - and: stdout matches msg="User chose fix action" rawInput=1 action=apply
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: the file "docs/product/product.yaml" matches \{budget:number\}
                - and: the engine dispatched 3 AI turns
        - id: 002-own-words-answer-kept
          description: A clarifying question answered in the person's own words rather than by an option's number must reach the fix as typed, so the fix applied carries those words
          steps:
            - given:
                - the "fix-loop-own-words" project tree
                - the Quality Engineer answers "It means the round trip from sending the message to receiving its reply takes at most that many milliseconds / 1" line by line
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 0
                - stdout matches msg="AI needs clarification" questionCount=1
                - and: stdout matches msg="User answered clarification question" questionID=q1 question=.* answer="It means the round trip from sending the message to receiving its reply takes at most that many milliseconds"
                - and: stdout matches msg="User chose fix action" rawInput=1 action=apply
                - and: stdout matches msg="Fix recorded in the document" document=product
                - and: stdout matches ALL CHECKS PASSED
                - and: the only file changed outside "tmp" is "docs/product/product.yaml"
                - and: the file "docs/product/product.yaml" matches round trip from sending the message to receiving its reply takes\s+at most
                - and: the engine dispatched 3 AI turns
        - id: 003-exit-keeps-story
          description: Choosing to exit a `us refine --fix` run's fix loop must leave the Story file exactly as it was, saying where the latest version of the Story was kept
          steps:
            - given:
                - the "fix-loop-exit-story" project tree
                - and: the "us-refine" checklist is narrowed to its "whether its description field contains a vague word" prompt
                - the Product Owner answers "3" to every question
            - when:
                - the Product Owner runs "us refine 97.1 --fix"
            - then:
                - the command exits with code 0
                - stdout matches msg="User chose fix action" rawInput=3 action=exit
                - and: stdout matches REFINE COMPLETE
                - and: stdout matches msg=Exiting latest_version=tmp/[^ ]+/story-97\.1-v01\.yaml
                - but: 'stdout does not match msg="Story saved"'
                - and: the file "docs/product/stories/97.1-document-summary-exit.yaml" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched 2 AI turns
        - id: 004-exit-keeps-registry
          description: Choosing to exit a `us apply --fix` run's fix loop must leave the Registry exactly as it was and walk no further acceptance criterion, reporting the failed Prompt with the fix it carries
          steps:
            - given:
                - the "fix-loop-exit-registry" project tree
                - and: the "us-apply" checklist is narrowed to its "already appear as a scenario in the registry" prompt
                - the Product Owner answers "3" to every question
            - when:
                - the Product Owner runs "us apply 98.1 --fix"
            - then:
                - the command exits with code 0
                - 'stdout matches msg=AC index=1 total=2'
                - and: stdout matches msg="User chose fix action" rawInput=3 action=exit
                - and: 'stdout matches (?s)FIX PROMPTS.*### Fix 1: us-apply/merge'
                - and: stdout matches APPLY COMPLETE
                - and: stdout matches One or more scenarios did not pass; the canonical file is unchanged
                - but: 'stdout does not match msg=AC index=2'
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched 2 AI turns
        - id: 005-exit-keeps-term-documents
          description: Choosing to exit a `scen check --fix` run's fix loop must leave the term documents and the Registry exactly as they were, report the failed Prompt with its fix, and exit 1
          steps:
            - given:
                - the "fix-loop-exit-terms" project tree
                - the Quality Engineer answers "3" to every question
            - when:
                - the Quality Engineer runs "scen check --fix"
            - then:
                - the command exits with code 1
                - stdout matches msg="User chose fix action" rawInput=3 action=exit
                - and: stdout matches msg=Exiting\.
                - and: 'stdout matches (?s)FIX PROMPTS.*### Fix 1: scen-check/term_closure.*Propose one catalogue entry'
                - but: stdout does not match msg="Fix recorded in the document"
                - and: the file "docs/product/product.yaml" is unchanged
                - and: no file outside "tmp" changed
                - and: the engine dispatched 1 AI turn
        - id: 006-exit-fails-build-tests
          description: Choosing to exit a `build tests --fix` run's fix loop must write no step definition, leave the Registry as it was, exit 1 and never report BUILD TESTS COMPLETE, since the Scenario's steps still bind to nothing
          steps:
            - given:
                - the "fix-loop-exit-steps" project tree
                - the System Architect answers "3" to every question
            - when:
                - the System Architect runs "build tests --fix"
            - then:
                - the command exits with code 1
                - stdout matches msg="User chose fix action" rawInput=3 action=exit
                - and: 'stdout matches (?s)FIX PROMPTS.*### Fix 1: build-tests/implementation'
                - but: stdout does not match BUILD TESTS COMPLETE
                - and: the file "tests/mcp/mcp_test.go" is created
                - but: no file matching "tests/mcp/steps/*.go" is created
                - and: the file "docs/scenarios.yaml" is unchanged
                - and: no file outside "tmp" and "tests" changed
                - and: the engine dispatched 2 AI turns
