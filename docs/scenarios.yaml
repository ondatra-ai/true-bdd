  E2E-116:
    description: A claimed dispatch that outran the browser's deadline accepts one late reply and refuses the second, because the relay forwards rather than stores
    service: bdd-web
    path: tests/bdd-web/protocol_test.go
    user_stories: []
    merged_steps:
      given:
        - the "bare-host" project tree
        - and: relays "A" and "B" share one Redis
        - and: an agent "S1" is registered on relay "A"
        - and: the Product Owner dispatches "version" on session "S1" through relay "A" as request "Q1"
      when:
        - agent "S1" polls relay "B" as work "W1"
      then:
        - request "Q1" completes with status 504
        - and: replying to work "W1" on relay "B" returns status 200
        - and: replying to work "W1" on relay "B" again returns status 409
        - and: the Redis key "reply:W1" does not hold the late reply

  E2E-117:
    description: A run the CLI committed while the browser gave up is recovered by re-dispatching its token, and the project still holds exactly one run
    service: bdd-web
    path: tests/bdd-web/protocol_test.go
    user_stories: []
    merged_steps:
      given:
        - the "bare-host" project tree
        - and: relays "A" and "B" share one Redis
        - and: a remote is running against relay "B"
        - and: the Product Owner dispatches "version" on the session through relay "A" as run "R1"
        - and: run "R1" reaches a terminal state
      when:
        - the Product Owner dispatches "version" on the session reusing the token of run "R1"
      then:
        - dispatching the same token returns run "R1" with status 200
        - and: the project has exactly 1 run
        - and: the project's only run is run "R1"

  E2E-118:
    description: Sweeping a session that stopped answering reclaims the capacity its abandoned work held, so dead sessions cannot exhaust the relay over time
    service: bdd-web
    path: tests/bdd-web/protocol_test.go
    user_stories: []
    merged_steps:
      given:
        - the "bare-host" project tree
        - and: the relay is running with "HARNESS_MAX_GLOBAL_QUEUE" set to "1"
        - and: an agent "S1" is registered and never polls
        - and: the Product Owner reads the session detail of "S1" as request "Q1"
      when:
        - session "S1" is swept out of the registry
      then:
        - a further session detail read of "S1" returned status 503 before the sweep
        - and: request "Q1" completes with status 404
        - and: a read for a freshly registered session is enqueued and served

  E2E-119:
    description: A late reply arriving after the orphan window is refused as unknown work, because the record it would correlate to was reclaimed
    service: bdd-web
    path: tests/bdd-web/protocol_test.go
    user_stories: []
    merged_steps:
      given:
        - the "bare-host" project tree
        - and: the relay is running with "HARNESS_ORPHAN_TTL_SEC" set to "5"
        - and: an agent "S1" is registered and never polls
        - and: the Product Owner dispatches "version" on session "S1" as request "Q1"
      when:
        - agent "S1" polls as work "W1"
      then:
        - request "Q1" completes with status 504
        - and: work "W1" is in state "orphaned"
        - and: work "W1" has a positive TTL of at most 5 seconds
        - and: the Redis key "work:W1" is gone
        - and: replying to work "W1" returns status 409
        - and: the response names error "unknown_work"
        - and: the Redis key "reply:W1" is gone
