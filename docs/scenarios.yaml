    service: bdd-cli
    path: tests/bdd-cli/build_tests_run_test.go
    user_stories:
    - story: docs/product/stories/build-tests-prebuilt-argument-validation.yaml
      scenario_id: build-tests-prebuilt-003-empty-declaration-refused
      merge_date: '2026-10-23'
    merged_steps:
      given:
      - the "build-tests-prebuilt-empty" project tree
      when:
      - the System Architect runs "build tests --fix"
      then:
      - the command exits with code 1
      - and: stdout matches prebuilt_engine_arg must contain \{engine_bin\} exactly once
      - and: the engine spawned no test runner
      - and: the engine dispatched no AI turns
      - but: stdout does not match BUILD TESTS COMPLETE
