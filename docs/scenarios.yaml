# The scenario registry: every behaviour this repository is held to.
#
# Path from `documents.scenarios_yaml` in true-bdd/true-bdd.yaml.
#
# `build tests` walks it and asks whether each scenario's steps resolve to
# a step definition in the suite that owns it — the entry in
# the tests/<service>/ tree its `service:` names.
# pkg/testkit/bddgo then RUNS it: one Go subtest per scenario, steps
# bound by regexp to the definitions under that suite's path.
#
# Derived once from the tests/bdd-cli fixtures, which already were these
# scenarios in every respect but name. Hand-owned since; `us apply` is
# the writer for anything new.
#
# A scenario's key is its lineage id, `<story-id>-<ac-id>` (ADR 0014), and
# its generated test is the key in CamelCase. The `E2E-NNN` keys below
# predate that and are renamed as each Story of this repository is written.

metadata:
  title: Scenario registry
  version: '1.0'
  last_updated: '2026-08-16'
  description: Every behaviour the TrueBDD engine is held to, one entry per scenario. Derived once from the tests/bdd-cli fixtures; hand-owned since, with `us apply` as the writer for new entries.
scenarios:
  build-code-run-002-unstartable-runner-exits-1:
    description: A suite command the architecture declares whose program the machine cannot start must end the run with exit code 1 and name that program on stdout
    service: bdd-cli
    path: tests/bdd-cli/build_code_test.go
    user_stories:
      - story: docs/product/stories/build-code-run-fix-loop.yaml
        scenario_id: build-code-run-002-unstartable-runner-exits-1
        merge_date: '2026-10-21'
    merged_steps:
      given:
        - the "build-code-command-not-executable" project tree
      when:
        - the System Architect runs "build code"
      then:
        - the command exits with code 1
        - 'stdout matches msg="Cannot run suite" framework=go-test'
        - stdout matches true-bdd-no-such-runner
        - stdout matches discovery failed
        - but: no file outside "tmp" changed
        - and: the engine spawned the test runner "true-bdd-no-such-runner"
        - and: the engine spawned exactly 1 test runner
        - and: the engine dispatched no AI turns
  build-code-commands-004-not-machine-readable-refused:
