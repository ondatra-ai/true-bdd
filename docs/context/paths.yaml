# Skill paths — single source of truth for every folder/file path used by the
# repo's skills (.claude/skills/*/SKILL.md) and their agents
# (.claude/agents/*.md). Skills and agents read paths from this file; do not
# hardcode paths in skill or agent instructions.
#
# The only path literals permitted in the skills/agents are (1) this file —
# docs/context/paths.yaml, the config entry point — and (2) the PreToolUse hook
# path in the test-fixer agents' frontmatter (static agent wiring). Every other
# folder/file location is read from here.
#
# Schema: every entry is {path (or paths), description: how to use it}.
# All paths are repo-relative. <slug> is the task brief's filename stem,
# produced by identify-task.

task_brief:
  path: docs/tasks/<slug>.md
  description: >-
    The scoped task from identify-task — the orchestrator's input. Never passed
    to the test-fixer (task-blind).

requirements_context:
  paths:
    - docs/context/requirements.md
    - docs/context/requirements-guide.md
    - docs/context/terms.md
  description: >-
    Durable conversational requirements + the allowed subject terms. Read for
    goal/constraints when planning and authoring tests.

project_guidance:
  path: CLAUDE.md
  description: Project conventions and architecture principles.

plan_file:
  path: docs/tasks/plans/<slug>.md
  description: >-
    Created by the planner (tests-ONLY: e2e test cases + startup scaffolding,
    never production changes); the orchestrator records implementation
    challenges here. Tracked alongside task briefs; create the folder if absent.

codex_ledger:
  path: docs/tasks/plans/<slug>.codex.md
  description: >-
    Codex rounds ledger, written by each agent's Codex loop. Lives beside the
    plan. The orchestrator passes this path to the test-fixer (one of the only
    two things in its prompt).

phase_state:
  paths:
    - .claude/hooks/phase_state.py
    - tmp/implement-task/active.json
    - docs/context/skill-metrics.jsonl
    - docs/context/retro/<slug>.md
  description: >-
    Enforcement: phase_state.py (wired in .claude/settings.json) records agent
    spawns/completions, denies out-of-order phases, blocks turn-end and commits
    while the reviewer is pending, and appends task metrics on close. Active
    state + archives + audit log under tmp/implement-task/; metrics one line
    per closed task; retro output written by the task-retro skill (analyst
    proposes, orchestrator auto-applies — user-mandated 2026-08-04).

e2e_tests:
  path: tests/harness/
  description: >-
    The e2e/BDD tests that DRIVE the coding (red → green) — the task's entire
    specification from the test-fixer's point of view. Written and hardened by
    the test-author (off-limits to the test-fixer — see off_limits_test_fixer).
    Self-contained Playwright suite (own package.json + node_modules); binding
    UI/API contract: tests/harness/helpers/README-testids.md. Design-conformance
    specs (screenshot-judge mockup vs prod, design-token checks) are part of
    this suite; their baseline is the design_system entry, not a committed
    screenshot.

bdd_cli_fixtures:
  paths:
    - tests/bdd-cli/
    - tests/materializer/
  description: >-
    BDD-CLI fixture harness + coverage/materializer — everything else under
    tests/.

harness_code_root:
  path: harness/src/
  description: >-
    THE single folder for ALL generated harness code: the Next.js app
    (harness/src/app/ — pages, components, lib, api routes) AND its unit tests
    (harness/src/tests/unit/). Gitignored, never tracked (a build artifact
    regenerated from e2e_tests).

unit_tests:
  paths:
    - harness/src/tests/unit/
    - harness/vitest.config.ts
  description: >-
    The test-fixer's responsibility (NOT the test-author's), written alongside
    the production code they exercise inside harness_code_root (Go unit tests:
    *_test.go beside the production package under src/). The test-fixer's own
    quality net; never gate the task — only the e2e/BDD suite does.

startup_scaffolding:
  paths:
    - docker-compose*.yml
    - harness/Dockerfile
    - harness/.dockerignore
  description: >-
    Architectural startup scaffolding (repo-root compose files incl. the e2e
    override docker-compose.test.yml, the harness image, new service
    directories). The test-author may create these so services start, but
    leaves them EMPTY for the test-fixer to implement (no production logic).

production_code:
  paths:
    - src/
    - templates/
    - true-bdd/
    - harness/src/
  description: >-
    What the test-fixer and reviewer may edit: the Go engine (src/), prompt
    templates, the engine config seed, and the generated harness root
    (harness_code_root — all test-fixer-generated harness app code goes under
    harness/src/; the design prototype and config elsewhere under harness/ are
    owned separately).

design_system:
  paths:
    - harness/design/system/
    - harness/design/SPEC.md
    - harness/design/proto-workspace/
  description: >-
    The visual source of truth for all harness UI. Agents that write harness UI
    style it from these deliverables — tokens and components, never ad-hoc
    colors/spacing/typography. Token values: harness/design/system/tokens.css.
    The runnable PROTOTYPE (harness/design/proto-workspace/app — bootable via
    tests/harness/helpers/proto-baseline.ts) is the per-screen design baseline
    that design-conformance judges screenshot production against; design changes
    land in the prototype first — the prototype is the spec artifact.

change_surface_exclusions:
  paths:
    - node_modules/
    - .git/
    - .next/
    - tmp/
  description: >-
    Directories omitted from the baseline change-surface content copy and the
    Phase 3 reviewer's diff -r (build + VCS noise, never part of the reviewed
    change).

package_manifest:
  path: harness/package.json
  description: >-
    The test-fixer may add runtime DEPENDENCIES here, but NEVER its scripts
    (the test scripts). The orchestrator snapshots the scripts object
    before/after the test-fixer and rejects any change to it. Deliberately not
    in off_limits_test_fixer.

off_limits_test_fixer:
  paths:
    - tests/
  description: >-
    The e2e/BDD tree the test-fixer must never modify. crush's write-guard
    keeps crush out of it, and the test-fixer's own post-crush marker-diff
    guard (against the orchestrator's fixer-before snapshot) fails the run if
    anything under it changed; the test-fixer escalates to the test-author via
    the orchestrator instead of editing tests. codex also reads this list to
    confirm the writer left the specs untouched. Scope is deliberately the
    e2e/BDD tree only; the unit-test trees are the test-fixer's own territory
    and are NOT listed.

codex_wrapper:
  path: .claude/scripts/codex.sh
  description: "Codex invocation wrapper. Usage: <ro|auto> <prompt-file> [label]."

codex_mechanics:
  path: .claude/references/codex.md
  description: Codex mechanics + prompt guide (sandbox flags, setup).

codex_artifacts:
  path: tmp/
  description: >-
    Codex artifacts: answers at tmp/codex-<label>.md (+ .trace.log), prompts at
    tmp/codex-<label>-rN.md.

crush_mechanics:
  path: .claude/references/crush.md
  description: Crush mechanics + gotchas.

crush_wrapper:
  path: .claude/scripts/crush-run.sh
  description: >-
    Crush invocation wrapper for the test-author + fixer agents. Usage:
    <author|fixer> <prompt-file|-> [label] [--continue]; '-' reads the prompt
    from stdin, --continue resumes crush's most recent session. The role's write
    sandbox, stall/timeout behavior, and exit codes are documented in
    crush_mechanics.

crush_artifacts:
  path: tmp/crush/
  description: >-
    Crush artifacts: prompts at tmp/crush/<label>.prompt.md, transcripts at
    <label>.out, the write-guard log at hook.log. Also the only sanctioned
    bash-redirect target for chatty test output inside a crush run.

crush_prompts:
  test_author_write_tests: .claude/references/templates/test-author-crush-write-tests.md
  test_author_apply_review: .claude/references/templates/test-author-crush-apply-review.md
  test_fixer_fix_code: .claude/references/templates/test-fixer-crush-fix-code.md
  test_fixer_apply_review: .claude/references/templates/test-fixer-crush-apply-review.md
  description: >-
    Fill-in crush prompt templates the driver agents populate each run. Naming:
    .claude/references/templates/<agent>-<tool>-<purpose>.md; keys are
    <agent>_<purpose>. *_write_tests / *_fix_code = the WRITE round (Step 1);
    *_apply_review = the codex→crush review-cycle follow-up (Step 2, wrapper
    --continue). The driver resolves every {{...}} to a concrete value before
    piping (crush is repo-blind — see crush_mechanics).

codex_prompts:
  test_author_review: .claude/references/templates/test-author-codex-review.md
  test_fixer_review: .claude/references/templates/test-fixer-codex-review.md
  description: >-
    Fill-in codex prompt templates (same naming + fill rule as crush_prompts).
    *_review = the read-only codex review of crush's current diff (Step 2). The
    driver fills every {{...}}, writes the result to a prompt file under
    codex_artifacts (DISTINCT from the wrapper's answer file), and runs
    <codex_wrapper> ro <prompt-file> <label>. codex returns findings only; the
    driver scores them (see codex_mechanics).

run_commands:
  - command: cd tests/harness && npx playwright test --project=protocol
    description: >-
      E2E (Playwright); use --project=ai for the real-Claude suite. For
      specific specs (preferred for tight iteration) pass the spec file(s) —
      Playwright routes by filename (p*→protocol, w*→workspace, a*→ai).
  - command: cd harness && npm run test:unit
    description: Unit tests (Vitest).
  - command: cd harness && npm run typecheck && npm run lint
    description: Harness typecheck + lint.
  - command: go test ./...
    description: Go unit tests.
  - command: golangci-lint run
    description: Go lint.
