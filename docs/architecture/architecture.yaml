# Architectural spec for this repository (the TrueBDD engine itself).
#
# Two sections read by the build pipeline, and two by `scen check`:
#   testing:  — the suites `build code` walks and `build tests` writes
#               into. One section for the whole repository, because how
#               a project runs its tests is a property of the project,
#               not of any one service.
#   services: — source paths and exact additional writable paths for build code.
#   terms:    — the word mapping: how each product glossary word is built
#               and how a step definition observes it (`D: term-mappings`).
#   concepts: — the Concept bindings: what a step definition of each product
#               concept does through the Public interface (`D: phrase-mappings`).
#
# Path resolved from `documents.architecture_yaml` in true-bdd/true-bdd.yaml.
#
# This repository tests in Go and only in Go: `go-test` for everything. The
# engine still supports `jest` and `playwright` for host projects that
# want them; this repo declares neither.

# Three Go modules: github.com/ondatra-ai/true-bdd (tests/scripts),
# github.com/ondatra-ai/true-bdd/pkg (shared/test libraries), and
# github.com/ondatra-ai/true-bdd/services/true-bdd (engine, no repository dependencies).
# Development uses only the root module's replace to ./pkg; release engine builds
# run in services/true-bdd with GOWORK=off and no replaces. Gates/lint check all
# three modules independently, excluding fixture sentinels. Fixtures force GOWORK=off.
# Only the engine is released: a release is the engine module's tag
# services/true-bdd/vX.Y.Z, the form Go needs for go install …/services/true-bdd@vX.Y.Z.
# No pkg/ or root tag is pushed; a Go host takes the test library at the release's
# commit. No tag is created by the drill or release rehearsal.
# Before cuts, the drill caches the engine libraries below and their complete graph.
# A scratch export loses the engine go.mod/go.sum, recreates them from those pins
# with GOPROXY=off and GOSUMDB=off, then builds with a fresh build cache.
# record.json records deleted paths, offline result, cache and diagnostic log.
# Cut A removes services/true-bdd in full, including both manifests.
#
# Repository tooling: scripts/cmd/release builds git-archive binary artifacts, each
# stamped with its version and commit through -ldflags -X, and rehearses the README's
# install guide, command for command, outside the checkout: the archive and go install
# channels, init and sample hosts. scripts/gates runs its zero-cost pass in CI, and
# .github/workflows/release.yml runs build, rehearse and notes on a pushed release tag
# to open a draft release. This is tooling, not an engine command; a person publishes.
# That gate covers the init-host-first-AI-turn criterion: an installed binary
# initializes a fresh host with its own Specification and tests and reaches fake CLIs.
# The default proxy is a local file module proxy serving the test library and the
# engine from the artifact export at its commit-time pseudo-version, resolving the
# guide's @<commit> and go install's latest query. go get, go install and the engine use it, with
# the public Go proxy for transitive modules. The copied testing.libraries is pinned
# to go get's resolved version. --harness-revision uses the real proxy and records
# its resolved exact version instead. No source replace is installed.
# Install and engine module caches are separate fresh private directories. The
# calculator must log Libraries downloaded before its first AI turn; the report
# retains declared module versions and exact cache read roots. A second fresh host
# naming example.invalid/true-bdd-missing@v0.0.0 must stop with that library's name
# before any AI turn. An empty file proxy makes this refusal deterministic.

architecture:
  # Template inputs are a byte contract beside the CLI invocation contract.
  # fields keys are Go template access paths; [] means a range element.
  # A whole-object read describes its serialised shape, not a wildcard.
  prompt_data:
    checklist:
      rendering: &prompt-rendering >-
        Render the configured template file verbatim through Go text/template with Sprig FuncMap and the engine toYaml override (yaml.v3 Marshal). Template literal bytes, leading/trailing newlines, trim markers, field order and conditional branches are authoritative; no final trim or YAML/Markdown escaping is applied to rendered prompts. Lists retain their input order; map ranges sort string keys. Dot paths below are reads, including methods and collection tests/ranges; [] denotes one ranged value. All strings are YAML-decoded values rather than their source spelling. The same role data reaches system and user templates. Structured concept Q protocols bypass these templates: the Q text plus a JSON-only instruction is the system prompt, and indented JSON is the user prompt. Link embeds the Item id/title, steps with numeric keys and optional criterion ids, and the whole product including roles/glossary. Its schema requires every non-judge step and every own-block concept score (integer 0..10), reason and nullable other_block_concept. with.threshold defaults to 9 and accepts integers 1..10. Binding embeds the product, Scenario steps, linked means, bindings and full Public interface; its schema requires every block:name key, an unambiguous boolean and reason. Raw model answers are saved as model-answer.txt, and the engine-derived canonical answer/context JSON is saved in both response.txt and result.yaml for the coverage census. Links live only in the current walk Item. Walking orders D prompts, then concept links, then other Q prompts, preserving file-position indices; template hosts omit the concept cells and keep their old order.
      fields:
        Docs: &docs >-
          Checklist effective docs: a nonempty Prompt docs list replaces the checklist defaults; even an explicitly empty list falls back. Keys resolve through config documents.<key>; duplicate keys collapse in a map, unsatisfiable keys warn and are skipped after preflight. Template map range sorts string keys lexically, not checklist order; empty emits no documentation section.
        Docs[].FilePath: &document-file-path >-
          Config document path as configured, with no cleaning, absolutising or content loading (./ is retained); paired with the map key in each Read line. Only checklist (Story validation) applies Sprig title to the displayed key; other validators print it unchanged.
        FixTemplate: &fixtemplate >-
          Checklist F scalar, YAML-decoded unchanged, including its block chomping and trailing newline; empty omits the failure guidance. This input is NOT the trimmed failed-check fix text.
        Question: &question >-
          Checklist Q scalar, YAML-decoded without trimming; a literal block retains its trailing newline. For with.concepts: sketch on a concept host only, replace it with instructions to sketch against closed means and service interface kinds, embed the complete product and the service-name-to-kind JSON map, and omit reference Read paths; no architecture binding is read. Inserted immediately before the conditional rationale, so that newline remains before the literal space in " SO THAT WE ENSURE ".
        Rationale: &rationale >-
          Checklist rationale scalar, YAML-decoded unchanged; empty omits the suffix, otherwise the template appends " SO THAT WE ENSURE " and this value without trimming.
        ResultPath: &validation-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Format is <run_dir>/<index zero-padded to at least 2 digits>-<safe subject id>-checklist-<safe checklist-stem[/section-id]>-result.yaml. Index counts non-skipped Prompts from 1 in file section/Prompt order, before D Prompts are moved ahead of Q Prompts for walking. Subject id is Story id for us refine, lineage id for us apply, Registry key for scen check, registry for build steps whole-Registry coverage and a stable phrase hash (suite-prefixed if needed) for its body-writing Items, the stable failing-set Item id for build code (discovery BuildID for a singleton, failing-set otherwise). A build-code id begins with / and sanitises to a leading hyphen, producing 01--go-test-...; an empty id likewise leaves two hyphens.
        Structured: &structured >-
          Run boolean from the resolved role model CLI: true for both supported CLIs, claude and codex. Validation and generation pass the same populated data to both templates; appliers never receive this field.
        Subject: >-
          Subject is StoryRefineData with the loaded Story inlined and TermDocuments, ConceptLinks and ConceptLinkPassed excluded from YAML. toYaml is yaml.v3 Marshal, returning its string including the final newline, not TrimSpace and not wrapped in story:. Serialised field order is id, feature (omitted when empty), title, as_a, i_want, so_that, status, acceptance_criteria. Each criterion is id, description, steps (omitted when empty); each step emits given, when, then in that order, omitting empty blocks. A statement is a scalar when its Type is empty, else a one-key and/but map. Strings and block chomping follow yaml.v3; default indentation is four spaces. Empty acceptance_criteria is retained (as []); TermDocuments and per-walk link evidence never serialise. Marshal failure becomes "# Error marshaling to YAML: <error>".
    checklist_system:
      rendering: *prompt-rendering
      fields: &checklist-system-fields
        Structured: *structured
    fix_generator:
      rendering: *prompt-rendering
      fields:
        Subject: >-
          Complete StoryRefineData serialized with the same Story fields and exclusions as checklist.Subject, only for a structured concept repair.
        SubjectID: >-
          Selected Story id, unchanged.
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        DocPaths: &docpaths >-
          Failed check effective docs resolved to config path strings by the same resolver as Docs. Duplicate keys collapse; resolution errors warn and skip; template ranges lexically by key, displaying keys unchanged. Empty map renders no Read lines; paths retain configured ./ and are not made absolute.
        FailedCheck.ActualAnswer: &failedcheck-actualanswer >-
          Model JSON answer is copied unchanged; YAML scalar answer is TrimSpace, YAML mapping or sequence is yaml.Marshal with trailing newline bytes removed. Status classification alone lowercases and trims. Built-in or runtime failures supply literal fail.
        FailedCheck.Check: &failedcheck-check >-
          TrimSpace of the checklist D name; empty for a model Q. Selects model-fix versus closure-fix wording, including the declared-terms, term-mappings, step-definitions, public-interface and phrase-mappings branches.
        FailedCheck.Context: &failedcheck-context >-
          Failed result observation strings in original list order, without trimming or joining; built-in checks supply their finding lines. Template prefixes each with "- "; an empty list produces no findings.
        FailedCheck.FixPrompt: &failedcheck-fixprompt >-
          Failed model result fix_prompt is TrimSpace after JSON/YAML decoding; pass discards it. Built-in and structured concept failures use TrimSpace of F; the template inserts it unchanged, even if empty.
        FailedCheck.Question: &failedcheck-question >-
          Evaluated Q text, including the concept-sketch replacement and embedded context when active; otherwise unchanged, including a trailing YAML block newline. For a built-in check, "D: " plus the trimmed D name.
        FailedCheck.Rationale: &failedcheck-rationale >-
          Checklist rationale scalar copied unchanged to the failed result, including YAML block newlines; printed without trimming.
        FailedCheck.SectionPath: &failedcheck-sectionpath >-
          Checklist command stem (us-refine, us-apply, build-steps, build-code or scen-check), with "/" plus the checklist sections[].id only when nonempty. The runner calls these SectionID and CriterionID respectively; display is unsanitised, while artifact filenames sanitise the entire combined path.
        ResultPath: &generation-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/<failed Prompt index zero-padded to at least 2 digits>-<safe subject id>-fix-prompts.md. Reused across clarification/refinement iterations; iteration appears only in saved debug filenames, not this rendered path.
        Structured: *structured
        Subject.AcceptanceCriteria: &subject-acceptancecriteria >-
          Subject Story criteria in file list order, never sorted; generator numbers them index+1, applier lists ids and descriptions without numbering. Empty emits no entries.
        Subject.AcceptanceCriteria[].Description: &subject-acceptancecriteriaitem-description >-
          Subject criterion description scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].ID: &subject-acceptancecriteriaitem-id >-
          Subject criterion id scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].Steps: >-
          Subject criterion steps in file list order; missing/empty selects NONE in generation. Applier reads only criterion ids/descriptions, not these steps.
        Subject.AcceptanceCriteria[].Steps[].Given: >-
          Subject given statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Given[].Statement: &subject-acceptancecriteriaitem-stepsitem-givenitem-statement >-
          Subject statement text, YAML-decoded unchanged. Template interpolates it without YAML escaping; Q-fix quotes it, closure-fix prints raw text.
        Subject.AcceptanceCriteria[].Steps[].Given[].Type: &subject-acceptancecriteriaitem-stepsitem-givenitem-type >-
          Subject modifier: empty for scalar, literal and or but for a one-key mapping. Q-fix prints it in parentheses when nonempty; closure-fix omits it.
        Subject.AcceptanceCriteria[].Steps[].Then: >-
          Subject then statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Then[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].Then[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AcceptanceCriteria[].Steps[].When: >-
          Subject when statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].When[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].When[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AsA: &subject-asa >-
          Subject Story as_a scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.ID: &story-id >-
          Subject Story id scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.IWant: &subject-iwant >-
          Subject Story i_want scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.SoThat: &subject-sothat >-
          Subject Story so_that scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.Title: &subject-title >-
          Subject Story title scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        UserAnswers: &useranswers >-
          Run map of question id to answer, initially empty; later answers overwrite matching ids across clarification rounds. UI trims each answer, substitutes a valid positive numbered option (option text is not trimmed), and free text or an out-of-range number is retained after trimming; an interactive blank line stays empty; EOF at a clarification stops before another AI request. Refinement stores feedback lines (each trimmed, joined by newline) at _user_refinement. Map range is lexical by id, excludes that reserved key from bullets, and prints it separately as feedback; empty values are false in template conditionals.
    fix_generator_system:
      rendering: *prompt-rendering
      fields:
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        <<: &fix-generator-system-fields
          FailedCheck.Check: *failedcheck-check
          Structured: *structured
    fix_applier:
      rendering: *prompt-rendering
      fields:
        Subject: >-
          StoryRefineData serialised with the same Story shape and exclusions as checklist.Subject; used for an approved concept-link step rewrite.
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        Check: &check >-
          Failed result D name carried unchanged into the applier; empty for a model Q. Selects Story/Scenario rewrite versus term-document fix; public-interface and phrase-mappings select application to the architecture and the Public interface documents it names.
        FixPrompt: &fixprompt >-
          Run-selected generated fix, unchanged at applier construction. JSON generation TrimSpace; marker generation extracts between matching FILE markers, TrimSpace, strips a whole wrapping backtick/tilde code fence and TrimSpace again. Clarification/refinement replaces the fix only when a nonempty new fix is returned; no further applier trim.
        ResultPath: &application-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/apply-<safe subject id>-iter<n>-result.yaml, where n counts applies from 1 across every Item and Cell in this runner. No checklist section or Prompt index here.
        Subject.AcceptanceCriteria: *subject-acceptancecriteria
        Subject.AcceptanceCriteria[].Description: *subject-acceptancecriteriaitem-description
        Subject.AcceptanceCriteria[].ID: *subject-acceptancecriteriaitem-id
        Subject.AsA: *subject-asa
        Subject.ID: *story-id
        Subject.IWant: *subject-iwant
        Subject.SoThat: *subject-sothat
        Subject.Status: >-
          Subject Story status scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.TermDocuments: &subject-termdocuments >-
          Run working copies seeded under --fix, product then architecture_yaml, skipping absent/unresolvable documents. Empty outside fix mode. Template retains this list order, without sorting; word judgements expose only the product working copy.
        Subject.TermDocuments[].Key: &subject-termdocumentsitem-key >-
          Config document key, product or architecture_yaml, unchanged.
        Subject.TermDocuments[].Path: &subject-termdocumentsitem-path >-
          Config documents.<key> path unchanged, including ./; it names the canonical document.
        Subject.TermDocuments[].Scratch: &subject-termdocumentsitem-scratch >-
          Run path: filepath.Join(run_dir, key+".yaml"), cleaned (./tmp becomes tmp), relative when run_dir is relative; seeded by copying the canonical document.
        Subject.Title: *subject-title
    fix_applier_system:
      rendering: *prompt-rendering
      fields:
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        Check: *check
        ResultPath: *application-result-path
    apply_checklist:
      rendering: *prompt-rendering
      fields:
        Docs: *docs
        Docs[].FilePath: *document-file-path
        FixTemplate: *fixtemplate
        Question: *question
        Rationale: *rationale
        ResultPath: *validation-result-path
        Structured: *structured
        Subject.ACID: &subject-acid >-
          Subject criterion id as written (<NNN>-<slug>), not its position.
        Subject.Description: &criterion-description >-
          Subject criterion description, YAML-decoded unchanged, no trimming.
        Subject.FormatSteps: &criterion-steps >-
          Subject criterion steps flattened by block in file list order. A scalar statement is unchanged; a mapping becomes its first key + " " + value (the parser accepts at least one pair). Method emits nonempty blocks in Given, When, Then order, each "<Block>:\n" followed by "  - <text>\n" per step. Empty blocks are omitted; entirely empty returns "". No trimming, quoting or escaping.
        Subject.LineageScenarioID: &subject-lineagescenarioid >-
          Requested Story id + "-" + criterion id, unchanged; never derived from criterion position.
        Subject.RequirementsScratchPath: &subject-requirementsscratchpath >-
          Run filepath.Join(run_dir, "scenarios.yaml"), a cleaned relative path for relative tmp_dir; copied from config documents.scenarios_yaml before parsing the Story.
        Subject.StoryID: &subject-storyid >-
          Requested Story id, validated against the declaring file, unchanged.
        Subject.StoryPath: &subject-storypath >-
          Subject file path found among <id>-*.yaml files declaring the requested id under config paths.stories_dir; filepath.Join cleans it and retains relative/absolute form.
    apply_checklist_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    apply_fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: *docpaths
        FailedCheck.ActualAnswer: *failedcheck-actualanswer
        FailedCheck.FixPrompt: *failedcheck-fixprompt
        FailedCheck.Question: *failedcheck-question
        FailedCheck.SectionPath: *failedcheck-sectionpath
        ResultPath: *generation-result-path
        Structured: *structured
        Subject.ACID: *subject-acid
        Subject.Description: *criterion-description
        Subject.FormatSteps: *criterion-steps
        Subject.LineageScenarioID: *subject-lineagescenarioid
        Subject.RequirementsScratchPath: *subject-requirementsscratchpath
        Subject.StoryID: *subject-storyid
        Subject.StoryPath: *subject-storypath
        SubjectID: >-
          Run subject identifier, unchanged for display: Story id + "-" + criterion id (the lineage id). Only artifact filenames sanitise it.
        UserAnswers: *useranswers
    apply_fix_generator_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    apply_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: *fixprompt
        ResultPath: *application-result-path
        Subject.ACID: *subject-acid
        Subject.Description: *criterion-description
        Subject.FormatSteps: *criterion-steps
        Subject.LineageScenarioID: *subject-lineagescenarioid
        Subject.RequirementsScratchPath: *subject-requirementsscratchpath
        Subject.StoryID: *subject-storyid
        Subject.StoryPath: *subject-storypath
    apply_fix_applier_system:
      rendering: *prompt-rendering
      fields: &apply-fix-applier-system-fields
        ResultPath: *application-result-path
    build_steps_checklist:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Subject.Suite: Suite steps directory, relative to the Host root.
        Subject.Phrase.Template: Verbatim Catalogue template.
        Subject.Phrase.Means: Verbatim Catalogue meaning.
        Question: Validation question.
        Rationale: Validation rationale.
        FixTemplate: Fix guidance.
        ResultPath: Result artifact path.
    build_steps_checklist_system:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields: {}
    build_steps_fix_generator:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Subject.Context: Whole YAML context with phrase, service Phrase mapping, term glossary entries and Word mappings, Public interface declaration and complete named document, and every suite Scenario using the phrase. No truncation. On a concept host the whole YAML context holds instead the concept (name, block, means, terms), its binding for the service, term glossary entries and Word mappings, Public interface declaration and complete named document, each definition (function, file, pattern, the proposal's captures and served clause, and every bound step with the engine's captures), every suite Scenario using the concept's steps, and under fixture_inputs, when any, each fixture those Scenarios name (a directory under the suite's fixtures/ equal to a quoted value of one of their steps) with the Scenarios naming it and every file of it, cassettes/ left out, in lexical path order, whole, a file that is not valid UTF-8 replaced by its size. No truncation.
        Subject.Concept: A concept Item's concept, nil on a template host; it selects the concept wording.
        Subject.Concept.Name: Verbatim concept name.
        Subject.Concept.Block: Concept block.
        Subject.Concept.Means: Verbatim concept meaning.
        Subject.Label: The concept Item's label, its block and quoted concept name.
        FailedCheck.Context: Every finding from the last per-Item compile, binding, body and critique check.
        DocPaths: Configured document paths.
        FailedCheck.ActualAnswer: Latest answer.
        FailedCheck.FixPrompt: Failed Prompt fix guidance.
        FailedCheck.Question: Failed Prompt.
        FailedCheck.SectionPath: Checklist section.
        ResultPath: Result artifact path.
        Structured: Provider structured answer selection.
        Subject.Suite: Suite steps directory.
        Subject.Service: Service name.
        Subject.Phrase.Template: Verbatim Catalogue template.
        Subject.Phrase.Block: Catalogue block.
        Subject.Phrase.Means: Verbatim meaning.
        SubjectID: Stable phrase and suite Item id.
        UserAnswers: Prior clarification answers.
    build_steps_fix_generator_system:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Structured: Provider structured answer selection.
        Subject.Concept: A concept Item's concept, nil on a template host; it selects the concept wording.
    build_steps_fix_applier:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Subject.Context: Whole phrase context, identical to the proposal turn.
        FixPrompt: Approved proposal.
        ResultPath: Confirmation artifact path.
        Subject.Suite: Suite steps directory.
        Subject.Service: Service name.
        Subject.Phrase.Template: Verbatim Catalogue template.
        Subject.Phrase.Means: Verbatim meaning.
        Subject.Concept: A concept Item's concept, nil on a template host; it selects the concept wording.
        Subject.Concept.Name: Verbatim concept name.
        Subject.Concept.Block: Concept block.
        Subject.Concept.Means: Verbatim concept meaning.
        Subject.Label: The concept an interface_cannot_serve verdict names, its block and quoted name.
    build_steps_fix_applier_system:
      rendering: >-
        Build steps uses the shared Fix loop. On a template host, phrase and suite are loaded from the Catalogue and Registry; on a concept host, an Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        ResultPath: Confirmation artifact path.
        Subject.Phrase.Template: The phrase an interface_cannot_serve verdict names.
        Subject.Concept: A concept Item's concept, nil on a template host; it selects the concept wording.
        Subject.Label: The concept an interface_cannot_serve verdict names, its block and quoted name.
    build_steps_critique:
      rendering: >-
        After a completed apply whose compilation, binding and body checks pass, before the Item can pass, a separate read-only prompt-role turn reads the selected definition; an apply those checks fail goes back to the Fix loop without it. Claude's file and shell tools are disabled; Codex uses the standard read-only validation sandbox. Only that definition, imports and shared State may change; the existing suite shape check rejects other definition edits. All suite steps-package Go files are embedded in lexical path order, whole, with path headings, so shared State and helper context are visible even when compilation fails. The complete phrase context is identical to the writer's. Findings append to the Item's existing compile, binding and body findings and return through D: step-coverage to the same bounded Fix loop. On a concept Item a pattern_captures or pattern_scope finding first sends the Item back to the concept-patterns Prompt, its refusal the Item's current patterns and every such finding prefixed critique:, within max_apply_attempts proposals of the engine's check; the engine then removes each skeleton whose pattern the proposal dropped with its registration, keeps an unchanged one, writes the new ones, compiles, renders the Item's context again and adds a pending-body finding. A malformed verdict stops the walk. The build-steps checklist engine.critique_model tier overrides engine.default_prompt_model; templates and tier validate before any skeleton or runner. No prompt budget is stated. Each apply saves critique-<Item id>-<apply count>-{system,user,response}.txt under the run directory.
      fields:
        Definition: >-
          Engine definition file path joined with :: and its function name; for a concept Item, every definition of the Item so, joined with commas.
        Context: Whole YAML phrase meaning, Phrase mapping, term glossary entries and Word mappings, Public interface declaration and complete document, and every suite Scenario using the phrase. No summarising or truncation. For a concept Item, the concept context the writer reads, its fixture inputs included; it carries no Catalogue, Phrase mapping or template Word mapping.
        Concept: True for a concept Item; it selects the concept wording.
        Sources: Whole suite steps-package Go files in lexical path order with path headings, including the definition, imports, registrations and shared State.
    build_steps_critique_system:
      rendering: >-
        Static semantic review policy and JSON verdict contract. Answer pass with no findings, or fail with at least one finding. Each finding requires a nonempty definition, category (phrase_mapping, phrase_meaning or computes_assertion) and finding. The mapping criterion follows the phrase block: when calls its operation, given sets up state, then observes and compares; not every definition must itself call a command. Assertion meaning and computing the asserted result are the other two criteria. The registration, pattern and signature are the engine's, derived from the template (a number slot also accepts no), and are never judged. For a concept Item the patterns are an AI's proposal, checked by the engine only for binding, and are judged too: the categories are pattern_captures and pattern_scope against a pattern, and concept_binding, concept_meaning and computes_assertion against a body, judged against the binding, each pattern's bound steps and the bound Scenarios' fixture inputs; a body requiring anything beyond its binding and those fixture inputs is a concept_binding finding. Unusable replies are errors, never passes.
      fields:
        Concept: True for a concept Item; it selects the concept policy and categories.
