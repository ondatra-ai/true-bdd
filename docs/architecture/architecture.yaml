        Subject.RegistryDocument.Path: *subject-termdocumentsitem-path
        Subject.RegistryDocument.Scratch: *subject-termdocumentsitem-scratch
        Subject.TermDocuments: *subject-termdocuments
        Subject.TermDocuments[].Key: *subject-termdocumentsitem-key
