# Architectural spec for this repository (the TrueBDD engine itself).
#
# Two sections read by the build pipeline, and one by `scen check`:
#   testing:  — the suites `build code` walks and `build tests` writes
#               into. One section for the whole repository, because how
#               a project runs its tests is a property of the project,
#               not of any one service.
#   services: — the production source roots `build code --fix` may edit.
#   terms:    — the word mapping: how each product glossary word is built
#               and how a step definition observes it (`D: term-mappings`).
#
# Path resolved from `documents.architecture_yaml` in true-bdd/true-bdd.yaml.
#
# This repository tests in Go and only in Go: `go-test` for everything. The
# engine still supports `jest` and `playwright` for host projects that
# want them; this repo declares neither.

architecture:
  # Template inputs are a byte contract beside the CLI invocation contract.
  # fields keys are Go template access paths; [] means a range element.
  # A whole-object read describes its serialised shape, not a wildcard.
  prompt_data:
    checklist:
      rendering: &prompt-rendering >-
        Render the configured template file verbatim through Go text/template with Sprig FuncMap and the engine toYaml override (yaml.v3 Marshal). Template literal bytes, leading/trailing newlines, trim markers, field order and conditional branches are authoritative; no final trim or YAML/Markdown escaping is applied to rendered prompts. Lists retain their input order; map ranges sort string keys. Dot paths below are reads, including methods and collection tests/ranges; [] denotes one ranged value. All strings are YAML-decoded values rather than their source spelling. The same role data reaches system and user templates.
      fields:
        Docs: &docs >-
          Checklist effective docs: a nonempty Prompt docs list replaces the checklist defaults; even an explicitly empty list falls back. Keys resolve through config documents.<key>; duplicate keys collapse in a map, unsatisfiable keys warn and are skipped after preflight. Template map range sorts string keys lexically, not checklist order; empty emits no documentation section.
        Docs[].FilePath: &document-file-path >-
          Config document path as configured, with no cleaning, absolutising or content loading (./ is retained); paired with the map key in each Read line. Only checklist (Story validation) applies Sprig title to the displayed key; other validators print it unchanged.
        FixTemplate: &fixtemplate >-
          Checklist F scalar, YAML-decoded unchanged, including its block chomping and trailing newline; empty omits the failure guidance. This input is NOT the trimmed failed-check fix text.
        Question: &question >-
          Checklist Q scalar, YAML-decoded without trimming; a literal block retains its trailing newline. Inserted immediately before the conditional rationale, so that newline remains before the literal space in " SO THAT WE ENSURE ".
        Rationale: &rationale >-
          Checklist rationale scalar, YAML-decoded unchanged; empty omits the suffix, otherwise the template appends " SO THAT WE ENSURE " and this value without trimming.
        ResultPath: &validation-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Format is <run_dir>/<index zero-padded to at least 2 digits>-<safe subject id>-checklist-<safe checklist-stem[/section-id]>-result.yaml. Index counts non-skipped Prompts from 1 in file section/Prompt order, before D Prompts are moved ahead of Q Prompts for walking. Subject id is Story id for us refine, lineage id for us apply, Registry key for build tests/scen check, the stable failing-set Item id for build code (discovery BuildID for a singleton, failing-set otherwise). A build-code id begins with / and sanitises to a leading hyphen, producing 01--go-test-...; an empty id likewise leaves two hyphens.
        Structured: &structured >-
          Run boolean from the resolved role model CLI: true for both supported CLIs, claude and codex. Validation and generation pass the same populated data to both templates; appliers never receive this field.
        Subject: >-
          Subject is StoryRefineData with the loaded Story inlined and TermDocuments excluded from YAML. toYaml is yaml.v3 Marshal, returning its string including the final newline, not TrimSpace and not wrapped in story:. Serialised field order is id, feature (omitted when empty), title, as_a, i_want, so_that, status, acceptance_criteria. Each criterion is id, description, steps (omitted when empty); each step emits given, when, then in that order, omitting empty blocks. A statement is a scalar when its Type is empty, else a one-key and/but map. Strings and block chomping follow yaml.v3; default indentation is four spaces. Empty acceptance_criteria is retained (as []); TermDocuments never serialises. Marshal failure becomes "# Error marshaling to YAML: <error>".
    checklist_system:
      rendering: *prompt-rendering
      fields: &checklist-system-fields
        Structured: *structured
    fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: &docpaths >-
          Failed check effective docs resolved to config path strings by the same resolver as Docs. Duplicate keys collapse; resolution errors warn and skip; template ranges lexically by key, displaying keys unchanged. Empty map renders no Read lines; paths retain configured ./ and are not made absolute.
        FailedCheck.ActualAnswer: &failedcheck-actualanswer >-
          Model JSON answer is copied unchanged; YAML scalar answer is TrimSpace, YAML mapping or sequence is yaml.Marshal with trailing newline bytes removed. Status classification alone lowercases and trims. Built-in or build-tests runtime failures supply literal fail.
        FailedCheck.Check: &failedcheck-check >-
          TrimSpace of the checklist D name; empty for a model Q. Selects model-fix versus closure-fix wording, and the declared-terms, term-mappings and step-definitions branches.
        FailedCheck.Context: &failedcheck-context >-
          Failed result observation strings in original list order, without trimming or joining; built-in checks supply their finding lines. Template prefixes each with "- "; an empty list produces no findings.
        FailedCheck.FixPrompt: &failedcheck-fixprompt >-
          Failed model result fix_prompt is TrimSpace after JSON/YAML decoding; pass discards it. Built-in failure uses TrimSpace of F. Build-tests runtime review overrides it with the literal "Repair the failing step definitions from the runtime evidence. Do not change the Registry, generated tests, suite command or scenario shim." (not failure output); template inserts it unchanged, even if empty.
        FailedCheck.Question: &failedcheck-question >-
          Failed Q text unchanged, including a trailing YAML block newline; for a built-in check, "D: " plus the trimmed D name.
        FailedCheck.Rationale: &failedcheck-rationale >-
          Checklist rationale scalar copied unchanged to the failed result, including YAML block newlines; printed without trimming.
        FailedCheck.SectionPath: &failedcheck-sectionpath >-
          Checklist command stem (us-refine, us-apply, build-tests, build-code or scen-check), with "/" plus the checklist sections[].id only when nonempty. The runner calls these SectionID and CriterionID respectively; display is unsanitised, while artifact filenames sanitise the entire combined path.
        ResultPath: &generation-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/<failed Prompt index zero-padded to at least 2 digits>-<safe subject id>-fix-prompts.md. Reused across clarification/refinement iterations; iteration appears only in saved debug filenames, not this rendered path.
        Structured: *structured
        Subject.AcceptanceCriteria: &subject-acceptancecriteria >-
          Subject Story criteria in file list order, never sorted; generator numbers them index+1, applier lists ids and descriptions without numbering. Empty emits no entries.
        Subject.AcceptanceCriteria[].Description: &subject-acceptancecriteriaitem-description >-
          Subject criterion description scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].ID: &subject-acceptancecriteriaitem-id >-
          Subject criterion id scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].Steps: >-
          Subject criterion steps in file list order; missing/empty selects NONE in generation. Applier reads only criterion ids/descriptions, not these steps.
        Subject.AcceptanceCriteria[].Steps[].Given: >-
          Subject given statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Given[].Statement: &subject-acceptancecriteriaitem-stepsitem-givenitem-statement >-
          Subject statement text, YAML-decoded unchanged. Template interpolates it without YAML escaping; Q-fix quotes it, closure-fix prints raw text.
        Subject.AcceptanceCriteria[].Steps[].Given[].Type: &subject-acceptancecriteriaitem-stepsitem-givenitem-type >-
          Subject modifier: empty for scalar, literal and or but for a one-key mapping. Q-fix prints it in parentheses when nonempty; closure-fix omits it.
        Subject.AcceptanceCriteria[].Steps[].Then: >-
          Subject then statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Then[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].Then[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AcceptanceCriteria[].Steps[].When: >-
          Subject when statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].When[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].When[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AsA: &subject-asa >-
          Subject Story as_a scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.ID: &story-id >-
          Subject Story id scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.IWant: &subject-iwant >-
          Subject Story i_want scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.SoThat: &subject-sothat >-
          Subject Story so_that scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.Title: &subject-title >-
          Subject Story title scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        UserAnswers: &useranswers >-
          Run map of question id to answer, initially empty; later answers overwrite matching ids across clarification rounds. UI trims each answer, substitutes a valid positive numbered option (option text is not trimmed), and free text or an out-of-range number is retained after trimming; empty input stays empty. Refinement stores feedback lines (each trimmed, joined by newline) at _user_refinement. Map range is lexical by id, excludes that reserved key from bullets, and prints it separately as feedback; empty values are false in template conditionals.
    fix_generator_system:
      rendering: *prompt-rendering
      fields: &fix-generator-system-fields
        FailedCheck.Check: *failedcheck-check
        Structured: *structured
    fix_applier:
      rendering: *prompt-rendering
      fields:
        Check: &check >-
          Failed result D name carried unchanged into the applier; empty for a model Q. Selects Story/Scenario rewrite versus term-document fix.
        FixPrompt: &fixprompt >-
          Run-selected generated fix, unchanged at applier construction. JSON generation TrimSpace; marker generation extracts between matching FILE markers, TrimSpace, strips a whole wrapping backtick/tilde code fence and TrimSpace again. Clarification/refinement replaces the fix only when a nonempty new fix is returned; no further applier trim.
        ResultPath: &application-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/apply-<safe subject id>-iter<n>-result.yaml, where n counts applies from 1 across every Item and Cell in this runner. No checklist section or Prompt index here.
        Subject.AcceptanceCriteria: *subject-acceptancecriteria
        Subject.AcceptanceCriteria[].Description: *subject-acceptancecriteriaitem-description
        Subject.AcceptanceCriteria[].ID: *subject-acceptancecriteriaitem-id
        Subject.AsA: *subject-asa
        Subject.ID: *story-id
        Subject.IWant: *subject-iwant
        Subject.SoThat: *subject-sothat
        Subject.Status: >-
          Subject Story status scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.TermDocuments: &subject-termdocuments >-
          Run working copies seeded under --fix, product then architecture_yaml, skipping absent/unresolvable documents. Empty outside fix mode. Template retains this list order, without sorting.
        Subject.TermDocuments[].Key: &subject-termdocumentsitem-key >-
          Config document key, product or architecture_yaml, unchanged.
        Subject.TermDocuments[].Path: &subject-termdocumentsitem-path >-
          Config documents.<key> path unchanged, including ./; it names the canonical document.
        Subject.TermDocuments[].Scratch: &subject-termdocumentsitem-scratch >-
          Run path: filepath.Join(run_dir, key+".yaml"), cleaned (./tmp becomes tmp), relative when run_dir is relative; seeded by copying the canonical document.
        Subject.Title: *subject-title
    fix_applier_system:
      rendering: *prompt-rendering
      fields:
        Check: *check
        ResultPath: *application-result-path
    apply_checklist:
      rendering: *prompt-rendering
      fields:
        Docs: *docs
        Docs[].FilePath: *document-file-path
        FixTemplate: *fixtemplate
        Question: *question
        Rationale: *rationale
        ResultPath: *validation-result-path
        Structured: *structured
        Subject.ACID: &subject-acid >-
          Subject criterion id as written (<NNN>-<slug>), not its position.
        Subject.Description: &criterion-description >-
          Subject criterion description, YAML-decoded unchanged, no trimming.
        Subject.FormatSteps: &criterion-steps >-
          Subject criterion steps flattened by block in file list order. A scalar statement is unchanged; a mapping becomes its first key + " " + value (the parser accepts at least one pair). Method emits nonempty blocks in Given, When, Then order, each "<Block>:\n" followed by "  - <text>\n" per step. Empty blocks are omitted; entirely empty returns "". No trimming, quoting or escaping.
        Subject.LineageScenarioID: &subject-lineagescenarioid >-
          Requested Story id + "-" + criterion id, unchanged; never derived from criterion position.
        Subject.RequirementsScratchPath: &subject-requirementsscratchpath >-
          Run filepath.Join(run_dir, "scenarios.yaml"), a cleaned relative path for relative tmp_dir; copied from config documents.scenarios_yaml before parsing the Story.
        Subject.StoryID: &subject-storyid >-
          Requested Story id, validated against the declaring file, unchanged.
        Subject.StoryPath: &subject-storypath >-
          Subject file path found among <id>-*.yaml files declaring the requested id under config paths.stories_dir; filepath.Join cleans it and retains relative/absolute form.
    apply_checklist_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    apply_fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: *docpaths
        FailedCheck.ActualAnswer: *failedcheck-actualanswer
        FailedCheck.FixPrompt: *failedcheck-fixprompt
        FailedCheck.Question: *failedcheck-question
        FailedCheck.SectionPath: *failedcheck-sectionpath
        ResultPath: *generation-result-path
        Structured: *structured
        Subject.ACID: *subject-acid
        Subject.Description: *criterion-description
        Subject.FormatSteps: *criterion-steps
        Subject.LineageScenarioID: *subject-lineagescenarioid
        Subject.RequirementsScratchPath: *subject-requirementsscratchpath
        Subject.StoryID: *subject-storyid
        Subject.StoryPath: *subject-storypath
        SubjectID: >-
          Run subject identifier, unchanged for display: Story id + "-" + criterion id (the lineage id). Only artifact filenames sanitise it.
        UserAnswers: *useranswers
    apply_fix_generator_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    apply_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: *fixprompt
        ResultPath: *application-result-path
        Subject.ACID: *subject-acid
        Subject.Description: *criterion-description
        Subject.FormatSteps: *criterion-steps
        Subject.LineageScenarioID: *subject-lineagescenarioid
        Subject.RequirementsScratchPath: *subject-requirementsscratchpath
        Subject.StoryID: *subject-storyid
        Subject.StoryPath: *subject-storypath
    apply_fix_applier_system:
      rendering: *prompt-rendering
      fields: &apply-fix-applier-system-fields
        ResultPath: *application-result-path
    build_tests_checklist:
      rendering: *prompt-rendering
      fields:
        Docs: *docs
        Docs[].FilePath: *document-file-path
        FixTemplate: *fixtemplate
        Question: *question
        Rationale: *rationale
        ResultPath: *validation-result-path
        Structured: *structured
        Subject.Description: &registry-description >-
          Subject description from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items walk in ascending id order.
        Subject.FormatSteps: &registry-steps >-
          Subject Registry merged_steps: scalar strings unchanged; and/but mappings display their original key + " " + value. Keep within-block order, group Given then When then Then, omit empty blocks; method returns "<Block>:\n" and "  - <text>\n" per line, including a final newline, or "" for no steps. No trimming, escaping or quoting.
        Subject.ID: &registry-id >-
          Subject Registry map key from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items walk in ascending id order.
        Subject.Requirement: &subject-requirement >-
          Subject optional requirement from the Registry, YAML-decoded unchanged; displayed only when nonempty, otherwise its whole line is omitted. Registry Items walk in ascending id order.
        Subject.Service: &registry-service >-
          Subject service from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items walk in ascending id order.
    build_tests_checklist_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    build_tests_fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: *docpaths
        FailedCheck.ActualAnswer: *failedcheck-actualanswer
        FailedCheck.FixPrompt: *failedcheck-fixprompt
        FailedCheck.Question: *failedcheck-question
        FailedCheck.SectionPath: *failedcheck-sectionpath
        ResultPath: *generation-result-path
        Structured: *structured
        Subject.Description: *registry-description
        Subject.Failures: >-
          Run evidence after verification, initially nil. Scan errors become "Scenario <id>: step definitions cannot run: <error>". For changed packages, plan-file order then Scenario order yields "Scenario <id>: step definitions were not examined" for an unexamined Scenario, or "Scenario <id>: unbound <block> step: <text>" per unbound step in scan order. Runner lookup errors contribute the error text unchanged; runner discovery errors contribute "Scenarios <ids joined by comma-space>: <error>". These lines come first; failing selections follow as "Selection Scenarios: <ids joined by comma-space>" once per selection. Then groups in first-seen order: "Failure affecting Scenarios: <unique affected ids joined by comma-space>\n<whole first output>". Failure identity matches selection test exactly or a /subtest, else affects all selected ids. Comparison only normalises qualified and short test ids to <test>, source file:line[:column] prefixes away retaining indentation, a singleton Scenario heading to <scenario>, and FAIL/PASS/SKIP elapsed seconds away. Distinct remaining text stays separate. Representative output retains EVERY original byte; no truncation. Empty removes the section. Runtime review sets FailedCheck.FixPrompt to the repair instruction, keeping this evidence only here.
        Subject.FormatSteps: *registry-steps
        Subject.ID: *registry-id
        Subject.Requirement: *subject-requirement
        Subject.Service: *registry-service
        Subject.Spec.Declared: &subject-spec-declared >-
          Subject specification comes from config documents.product catalogue and glossary, and documents.architecture_yaml word mappings. An absent/null catalogue is undeclared; an empty list is declared. Build-tests reads it under --fix for own unbound steps (and suite peers); decoding failure refuses before AI. Build-code reads it for Registry Scenarios during discovery, warns and omits invalid optional spec, uses all Scenario steps and no peer sweep. An unavailable or unreadable product document, an absent/null catalogue or invalid optional spec leaves build-code Subject.Spec empty while retaining any matched Subject.Scenario and its steps. False hides all spec text; build-code additionally requires a matched Scenario.
        Subject.Spec.Phrases: &subject-spec-phrases >-
          Subject catalogue entries reached by exactly one match, excluding model-run steps, unique by template string in first-reached order: own steps first, then build-tests suite gaps in ascending Registry id and step order; build-code has no sweep. No sorting by term or phrase.
        Subject.Spec.Phrases[].Block: &subject-spec-phrasesitem-block >-
          Subject catalogue block unchanged (given, when or then).
        Subject.Spec.Phrases[].Means: &subject-spec-phrasesitem-means >-
          Subject catalogue means text unchanged, including YAML block newlines.
        Subject.Spec.Phrases[].Template: &subject-spec-phrasesitem-template >-
          Subject catalogue template string unchanged.
        Subject.Spec.Phrases[].Terms: &subject-spec-phrasesitem-terms >-
          Subject catalogue terms in declared list order, unchanged; template joins with ", ", or prints none for empty.
        Subject.Spec.Steps: &subject-spec-steps >-
          Subject own steps in order, each paired with all catalogue matches in catalogue order. The compiler excludes duplicate templates, invalid blocks and malformed template grammar; build-tests preflight refuses these, while build-code ignores compilation findings. Build-tests uses own gaps; build-code uses the whole Scenario. Each carries its block and TrimSpace of statement text without the and/but keyword. Empty is an empty list.
        Subject.Spec.Steps[].Block: &subject-spec-stepsitem-block >-
          Subject step block: literal given, when or then, unchanged.
        Subject.Spec.Steps[].Templates: &subject-spec-stepsitem-templates >-
          Subject matching catalogue template strings in catalogue order, unchanged, empty if none. Build-tests prints zero/one/many separately, semicolon between multiple matches; build-code iterates matches and uses its no-match else.
        Subject.Spec.Steps[].Text: &subject-spec-stepsitem-text >-
          Subject statement text after TrimSpace, excluding its and/but key; model-run prefixes stay.
        Subject.Spec.Terms: &subject-spec-terms >-
          Subject words declared by reached phrases, unique in first-declaration order. Each includes EVERY exactly spelled glossary definition and architecture mapping in document order; missing entries remain empty lists, duplicates remain visible.
        Subject.Spec.Terms[].Mappings: &subject-spec-termsitem-mappings >-
          Subject matching architecture terms entries in document order, duplicates retained; empty emits the template's missing-mapping line.
        Subject.Spec.Terms[].Mappings[].ObservedBy: &subject-spec-termsitem-mappingsitem-observedby >-
          Subject architecture.terms observed_by text unchanged, including YAML block newlines; template prefixes it and adds a newline.
        Subject.Spec.Terms[].Mappings[].Technical: &subject-spec-termsitem-mappingsitem-technical >-
          Subject architecture.terms technical text unchanged, including YAML block newlines; template prefixes it and adds a newline.
        Subject.Spec.Terms[].Means: &subject-spec-termsitem-means >-
          Subject matching glossary means strings in document order, no trimming; one "- Means: " line each, or the template's missing-glossary line when empty.
        Subject.Spec.Terms[].Term: &subject-spec-termsitem-term >-
          Subject word spelling unchanged from catalogue terms.
        SubjectID: &registry-subject-id >-
          Run subject identifier, unchanged for display: Registry Scenario id. Only artifact filenames sanitise it.
        UserAnswers: *useranswers
    build_tests_fix_generator_system:
      rendering: *prompt-rendering
      fields:
        Structured: *structured
        Subject.Spec.Declared: *subject-spec-declared
    build_tests_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: *fixprompt
        ResultPath: *application-result-path
        Subject.Description: *registry-description
        Subject.FormatSteps: *registry-steps
        Subject.ID: *registry-id
        Subject.Requirement: *subject-requirement
        Subject.Service: *registry-service
    build_tests_fix_applier_system:
      rendering: *prompt-rendering
      fields: *apply-fix-applier-system-fields
    build_code_checklist:
      rendering: *prompt-rendering
      fields: {}
    build_code_checklist_system:
      rendering: *prompt-rendering
      fields: {}
    build_code_fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: >-
          Resolved configured Specification paths, keyed by document key.
        FailedCheck.ActualAnswer: >-
          Engine verdict, fail.
        FailedCheck.FixPrompt: >-
          Shipped F: plan guidance, unchanged.
        FailedCheck.Question: >-
          D: tests-pass.
        FailedCheck.SectionPath: >-
          Checklist stem and section, unchanged.
        ResultPath: >-
          Cell generation artifact path, with the sanitized stable Item id; clarification iteration artifacts are overwritten by a later repair of the same Cell.
        Structured: >-
          Provider result-schema support; controls the JSON answer contract.
        Subject.Tests: >-
          Remaining failing members, sorted by discovery id; passing members leave after each completed apply.
        Subject.Tests[].ID: >-
          Discovery BuildID: empty service + / + framework + / + framework + : + native id with slashes folded to dots and spaces to underscores. Enrichment never rebuilds it.
        Subject.Tests[].Service: >-
          Sole architecture service name when one exists, overridden by an exactly matched Go Registry Scenario service; otherwise empty, displayed as none is known.
        Subject.Tests[].Suite: >-
          Architecture testing.framework, unchanged.
        Subject.Tests[].Framework: >-
          Architecture testing.framework: go-test, jest or playwright.
        Subject.Tests[].TestName: >-
          Native id: Go package::function or package::<build>; Jest repository-relative file::fullName; Playwright file::title chain joined by > with surrounding spaces, or <startup>.
        Subject.Tests[].FilePath: >-
          Go package import path; Jest file rebased against process cwd when absolute; Playwright deepest nonempty suite/spec file, or startup config Path.
        Subject.Groups: >-
          Remaining failures grouped by build tests runtime normalization: test identity, Scenario heading, source prefixes and runner elapsed times are ignored for comparison only. Group order follows first member.
        Subject.Groups[].IDs: >-
          Every member id in this group, in discovery order, joined with comma and space.
        Subject.Groups[].Output: >-
          The whole first member output, untrimmed. Go concatenates test output or compiler and package output; Jest joins failureMessages by newline; Playwright retains failed attempts with errors, stacks, stdout and stderr. Missing own results say did not run; a selected Go test with no output because its package failed to build also carries the compiler and package output. Refreshed after every apply.
        Subject.Documents: >-
          Configured product, architecture_yaml and scenarios_yaml paths available through the resolver, with architecture from the command argument. Optional unavailable documents warn and are omitted; map renders in key order.
        Subject.Scenarios: >-
          Each matched remaining Registry Scenario once, in member order; only exact module-aware Go package::CamelCase matches enrich members. No guessing for subtests, synthetic or non-Go members.
        Subject.Scenarios[].ID: >-
          Registry key, unchanged.
        Subject.Scenarios[].Description: >-
          Registry description, unchanged.
        Subject.Scenarios[].Service: >-
          Registry service, unchanged.
        Subject.Scenarios[].Path: >-
          Registry path, unchanged.
        Subject.Scenarios[].FormatSteps: >-
          All original Given, When and Then steps, in Registry order, with their block headings.
        Subject.Specification: >-
          Union of the remaining members catalogue Specifications in discovery order. Optional unreadable or catalogue-less product leaves it undeclared without dropping matched Scenarios.
        Subject.Specification.Declared: >-
          True when any remaining member has a declared catalogue.
        Subject.Specification.Phrases: >-
          Each reached catalogue phrase once, in first-reached order across members.
        Subject.Specification.Phrases[].Template: >-
          Catalogue template, unchanged.
        Subject.Specification.Phrases[].Block: >-
          Catalogue block, unchanged.
        Subject.Specification.Phrases[].Means: >-
          Catalogue meaning, unchanged.
        Subject.Specification.Phrases[].Terms: >-
          Declared words in catalogue order, joined by comma and space, or none.
        Subject.Specification.Terms: >-
          Each declared word once, in first-reached order across members.
        Subject.Specification.Terms[].Term: >-
          Declared word, unchanged.
        Subject.Specification.Terms[].Means: >-
          All glossary definitions for this word in source order, or a missing-definition sentence.
        Subject.Specification.Terms[].Mappings: >-
          All architecture word mappings in source order, or a missing-mapping sentence.
        Subject.Specification.Terms[].Mappings[].Technical: >-
          Mapping technical text, unchanged.
        Subject.Specification.Terms[].Mappings[].ObservedBy: >-
          Mapping observed_by text, unchanged.
        SubjectID: >-
          Stable Item id: discovery BuildID for a singleton, failing-set otherwise. Membership changes do not change it within the walk.
        UserAnswers: >-
          Clarification answers by question id; _user_refinement carries the persons feedback.
    build_code_fix_generator_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    build_code_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: >-
          The person-approved repair plan, unchanged.
        ResultPath: >-
          Per-turn apply confirmation artifact path, with the sanitized stable Item id.
          The writer ends its final message with the FILE_START/FILE_END block
          in the message itself. The heading names where the engine saves
          extracted content; the writer never writes that path itself.
          A successful response with no extractable block follows PostNotApplied
          in build code alone, preserving files, warning once with this path
          and rerunning the remaining set. Started codex or Claude writer failures also follow the not-applied rerun; other provider failures remain fatal;
          malformed extracted content retains its existing handling.
        Subject.Tests: >-
          Remaining failing members, sorted by discovery id; passing members leave after each completed apply.
        Subject.Tests[].ID: >-
          Discovery BuildID: empty service + / + framework + / + framework + : + native id with slashes folded to dots and spaces to underscores. Enrichment never rebuilds it.
        Subject.Tests[].Service: >-
          Sole architecture service name when one exists, overridden by an exactly matched Go Registry Scenario service; otherwise empty, displayed as none is known.
        Subject.Tests[].Suite: >-
          Architecture testing.framework, unchanged.
        Subject.Tests[].Framework: >-
          Architecture testing.framework: go-test, jest or playwright.
        Subject.Tests[].TestName: >-
          Native id: Go package::function or package::<build>; Jest repository-relative file::fullName; Playwright file::title chain joined by > with surrounding spaces, or <startup>.
        Subject.Tests[].FilePath: >-
          Go package import path; Jest file rebased against process cwd when absolute; Playwright deepest nonempty suite/spec file, or startup config Path.
        Subject.Groups: >-
          Remaining failures grouped by build tests runtime normalization: test identity, Scenario heading, source prefixes and runner elapsed times are ignored for comparison only. Group order follows first member.
        Subject.Groups[].IDs: >-
          Every member id in this group, in discovery order, joined with comma and space.
        Subject.Groups[].Output: >-
          The whole first member output, untrimmed. Go concatenates test output or compiler and package output; Jest joins failureMessages by newline; Playwright retains failed attempts with errors, stacks, stdout and stderr. Missing own results say did not run; a selected Go test with no output because its package failed to build also carries the compiler and package output. Refreshed after every apply.
        Subject.Documents: >-
          Configured product, architecture_yaml and scenarios_yaml paths available through the resolver, with architecture from the command argument. Optional unavailable documents warn and are omitted; map renders in key order.
        Subject.Scenarios: >-
          Each matched remaining Registry Scenario once, in member order; only exact module-aware Go package::CamelCase matches enrich members. No guessing for subtests, synthetic or non-Go members.
        Subject.Scenarios[].ID: >-
          Registry key, unchanged.
        Subject.Scenarios[].Description: >-
          Registry description, unchanged.
        Subject.Scenarios[].Service: >-
          Registry service, unchanged.
        Subject.Scenarios[].Path: >-
          Registry path, unchanged.
        Subject.Scenarios[].FormatSteps: >-
          All original Given, When and Then steps, in Registry order, with their block headings.
        Subject.Specification: >-
          Union of the remaining members catalogue Specifications in discovery order. Optional unreadable or catalogue-less product leaves it undeclared without dropping matched Scenarios.
        Subject.Specification.Declared: >-
          True when any remaining member has a declared catalogue.
        Subject.Specification.Phrases: >-
          Each reached catalogue phrase once, in first-reached order across members.
        Subject.Specification.Phrases[].Template: >-
          Catalogue template, unchanged.
        Subject.Specification.Phrases[].Block: >-
          Catalogue block, unchanged.
        Subject.Specification.Phrases[].Means: >-
          Catalogue meaning, unchanged.
        Subject.Specification.Phrases[].Terms: >-
          Declared words in catalogue order, joined by comma and space, or none.
        Subject.Specification.Terms: >-
          Each declared word once, in first-reached order across members.
        Subject.Specification.Terms[].Term: >-
          Declared word, unchanged.
        Subject.Specification.Terms[].Means: >-
          All glossary definitions for this word in source order, or a missing-definition sentence.
        Subject.Specification.Terms[].Mappings: >-
          All architecture word mappings in source order, or a missing-mapping sentence.
        Subject.Specification.Terms[].Mappings[].Technical: >-
          Mapping technical text, unchanged.
        Subject.Specification.Terms[].Mappings[].ObservedBy: >-
          Mapping observed_by text, unchanged.
        WriteRoots: >-
          Every architecture service path, in declaration order.
        CodexWriter: >-
          True only for an explicitly requested build-code codex writer; selects native process polling; the Claude branch requires foreground completion.
        TestCommand: >-
          Codex and explicitly requested Claude build-code writers get the configured canonical replay forms; nil for other Claude turns or an unrepresentable command. Codex polls its native process tool; Claude requires foreground completion and receives the shell-quoted suite-directory cd prefix before rendering.
        TestCommand.Command: >-
          Canonical replay command without machine-output flags, per ADR-0018.
        TestCommand.Selector: >-
          Framework selector: -run, --testNamePattern or --grep.
        TestCommand.Dir: >-
          Absolute suite working directory from testing.config, or the project root.
