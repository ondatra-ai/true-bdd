# Architectural spec for this repository (the TrueBDD engine itself).
#
# Two sections, both read by the build pipeline:
#   testing:  — the suites `build code` walks and `build tests` writes
#               into. One section for the whole repository, because how
#               a project runs its tests is a property of the project,
#               not of any one service.
#   services: — the production source roots `build code --fix` may edit.
#
# Path resolved from `documents.architecture_yaml` in true-bdd/true-bdd.yaml.
#
# This repository tests in Go and only in Go: `go-test` for everything,
# with playwright-go driving the browser inside the bdd-web suite. The
# engine still supports `jest` and `playwright` for host projects that
# want them; this repo declares neither.

architecture:
  testing:
    suites:
      # Scenario-driven fixture harness under tests/bdd-cli/. Scenarios
      # come from docs/scenarios.yaml; each one's steps resolve against
      # the step definitions in tests/bdd-cli/steps/. The suite is gated
      # behind `//go:build bdd` and takes its AI mode from a `-mode`
      # flag, neither of which any engine default could have guessed —
      # which is why `commands:` exists. All three modes are mandatory;
      # `build code` runs `replay`, the only one that spawns no model
      # and costs nothing.
      - name: bdd-cli
        service: bdd-cli
        path: tests/bdd-cli
        framework: go-test
        commands:
          record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=record"
          replay: "go test -tags bdd -json -count=1 -timeout=20m ./tests/bdd-cli/ -mode=replay"
          live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=live"

      # The web relay's suite, same runner, same registry — the step
      # definitions drive a browser through playwright-go instead of a
      # subprocess. Its specs live in the root Go module; the parked
      # TypeScript suite it replaces is at tests/legacy/bdd-web-playwright/.
      - name: bdd-web
        service: bdd-web
        path: tests/bdd-web
        framework: go-test
        commands:
          record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-web/ -mode=record"
          replay: "go test -tags bdd -json -count=1 -timeout=30m ./tests/bdd-web/ -mode=replay"
          live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-web/ -mode=live"

  services:
    - name: bdd-cli
      type: "cli"
      path: services/bdd-cli
      language: go
      frameworks:
        - cobra
      # What this service talks to at runtime. `protocol` is the
      # connection mechanism (cli = spawned subprocess over argv/stdio,
      # http, ws, sql, redis, …). `scope` places the dependency:
      #   internal    — another service declared in this file
      #   self_hosted — we run the instance (redis, postgres, kafka);
      #                 builds use the real thing
      #   third_party — a vendor's service is behind it, wherever the
      #                 binary lives (crush is local, GLM's API is not);
      #                 builds mock these (record/replay)
      dependencies:
        - name: claude
          protocol: cli
          scope: third_party
        - name: crush
          protocol: cli
          scope: third_party
        - name: codex
          protocol: cli
          scope: third_party

    - name: bdd-web
      path: services/bdd-web
      type: "web:frontend"
      language: typescript
      frameworks:
        - next.js
        - react

      design_system:
        path: services/bdd-web/design/system

      dependencies:
        # The remotes (`true-bdd remote --server <url>`) register with
        # and poll this relay over its HTTP API — bdd-web never spawns
        # the CLI itself.
        - name: bdd-cli
          protocol: http
          scope: internal
        - name: redis
          protocol: redis
          scope: self_hosted
