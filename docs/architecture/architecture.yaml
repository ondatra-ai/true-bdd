# Architectural spec for this repository (the TrueBDD engine itself).
#
# Two sections, both read by the build pipeline:
#   testing:  — the suites `build code` walks and `build tests` writes
#               into. One section for the whole repository, because how
#               a project runs its tests is a property of the project,
#               not of any one service.
#   services: — the production source roots `build code --fix` may edit.
#
# Path resolved from `documents.architecture_yaml` in true-bdd/true-bdd.yaml.
#
# This repository tests in Go and only in Go: `go-test` for everything,
# with playwright-go driving the browser inside the bdd-web suite. The
# engine still supports `jest` and `playwright` for host projects that
# want them; this repo declares neither.

architecture:
  testing:
    suites:
      # Scenario-driven fixture harness under tests/bdd-cli/ (scenarios from
      # docs/scenarios.yaml). Gated behind //go:build bdd with a -mode flag —
      # neither guessable, hence commands:. All 3 modes mandatory; build code uses replay (spawns no model).
      - name: bdd-cli
        service: bdd-cli
        path: tests/bdd-cli
        framework: go-test
        commands:
          record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=record"
          replay: "go test -tags bdd -json -count=1 -timeout=20m ./tests/bdd-cli/ -mode=replay"
          live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=live"
          # Asked by `build tests` before it walks anything: which registry
          # steps bind to no definition. Deterministic, under a second, no
          # harness brought up — the question is about two files on disk.
          coverage: "go test -tags bdd -count=1 -run '^TestStepCoverage$' ./tests/bdd-cli/"

      # The web relay's suite, same runner and registry — steps drive a
      # browser via playwright-go instead of a subprocess. Parked TypeScript
      # suite it replaces: tests/legacy/bdd-web-playwright/.
      - name: bdd-web
        service: bdd-web
        path: tests/bdd-web
        framework: go-test
        commands:
          record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-web/ -mode=record"
          replay: "go test -tags bdd -json -count=1 -timeout=30m ./tests/bdd-web/ -mode=replay"
          live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-web/ -mode=live"
          # Answers without node, without a build and without a browser,
          # which is the whole reason it is a separate command from the
          # three above.
          coverage: "go test -tags bdd -count=1 -run '^TestStepCoverage$' ./tests/bdd-web/"

  services:
    - name: bdd-cli
      type: "cli"
      path: services/bdd-cli
      language: go
      frameworks:
        - cobra
      # What this service talks to at runtime: `protocol` is the connection
      # mechanism (cli, http, ws, sql, redis, …); `scope` places it:
      #	internal    — another service declared in this file
      #	self_hosted — we run the instance (redis, postgres, kafka); builds
      #	              use the real thing
      #	third_party — a vendor's service, wherever the binary lives (crush is
      #	              local, GLM's API is not); builds mock these (record/replay)
      dependencies:
        - name: claude
          protocol: cli
          scope: third_party
        - name: crush
          protocol: cli
          scope: third_party
        - name: codex
          protocol: cli
          scope: third_party

    - name: bdd-web
      path: services/bdd-web
      type: "web:frontend"
      language: typescript
      frameworks:
        - next.js
        - react

      design_system:
        path: services/bdd-web/design/system

      dependencies:
        # The remotes (`true-bdd remote --server <url>`) register with
        # and poll this relay over its HTTP API — bdd-web never spawns
        # the CLI itself.
        - name: bdd-cli
          protocol: http
          scope: internal
        - name: redis
          protocol: redis
          scope: self_hosted
