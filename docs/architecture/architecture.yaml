      frameworks:
        - cobra
      patterns:
        owned_io:
          description: The engine owns all repository code it uses, including its IO layer; a cut-A rebuild deletes and regenerates the whole services/true-bdd folder.
          rules:
            - >-
              No engine Go package, including its tests or files hidden by build constraints,
              imports this repository outside services/true-bdd. The engine uses only the
              exact third-party module versions in this service's libraries above; that list
              includes the complete imported graph, verified with go list -deps. Tests and
              tooling retain independent pkg implementations and are never engine libraries.
            - >-
              Under internal/infrastructure, console owns the three standard descriptors
              and plain answers, prompts, headers, separators and stdin. logging alone
              constructs slog handlers: text INFO and above on stdout, DEBUG and above
              as newline-delimited JSON in paths.tmp_dir/true-bdd.log.json. The JSON file
              is created even with zero records, appended per record, and engine records
              have no tooling tool/run attributes. enginelog owns the message/key vocabulary
              stated under terms.log record and the AI-turn invocation contract below.
              Scenarios keep that contract compatible with the independent test reporter.
            - >-
              disk owns explicit filesystem byte access, wrapping errors without losing their identity.
              Configuration loading retains the declared Viper library's own file reader;
              the hold Scenarios exercise Registry reading through disk.
              A read takes a shared advisory flock on the target's parent; a mutation takes
              an exclusive one, so atomic rename cannot bypass it by changing the target inode.
              Conflicting holds poll every 5ms for up to 10s, then fail with directory lock
              not released and the parent path. Handles and holds close before returning.
              Whole-file writes clear stale .true-bdd.tmp.<basename> staging files without
              following symlinks, create exclusively, write/close and atomically rename;
              they do not fsync. Existing file permissions survive replacement; new shared
              files/directories use 0644/0755 and private ones 0600/0700. Append writes one
              newline-terminated log record under one hold. Update reads/changes/writes
              under the same exclusive hold. Copies use the same read/write operations.
              Directory creation, rooted creation and unique temporary-directory creation
              take no hold; they need no existing target. Removal holds the target's parent.
              No handle escapes these operations; rooted writer directory creation refuses
              symlink escapes. Private module-download temporary
              directories and credential files are removed on their stated cleanup paths.
            - >-
              shell alone imports os/exec. Only cli/cli.go and explicitly named cli wrappers
              claude, codex, git, gotool, spec and truebdd may import shell. cli aliases its
              result/options vocabulary; wrappers export typed operations, never an arbitrary
              spawn entry point except spec for architecture-declared argv. A completed
              nonzero exit is a result code, distinct from a failure to start. Captures
              preserve exact bytes, streams stay separate unless combined explicitly, and
              writers receive stdout/stderr without scanner line limits. Claude and codex
              turns run in process groups; caller cancellation kills descendants and remains
              fatal. Individual command handlers bind interrupt/termination to that context.
              The engine adds no AI-turn deadline. Each spawn/exit JSON record names binary,
              args and dir; exits include exit_code, signal, elapsed_ms, stdout_bytes and
              stderr_bytes. Declared suite commands keep their argv and working directory.
            - >-
              gotool reads Go runtime/module roots, and downloads the complete graph of an
              isolated exact manifest with go mod download -json all, GOWORK=off,
              GOTOOLCHAIN=local and no inherited GOFLAGS. Its Git environment policy strips
              the repository-local variables git rev-parse --local-env-vars names from
              inherited or explicit environments; it performs no repository mutation.
              Download errors name the library and stop before a writer. Claude streaming
              parses newline-delimited events across arbitrary writes, emits assistant/tool/
              result events, prefers structured_output, preserves usage/cost, and distinguishes
              started nonzero, error-result and missing-result failures from start failures.
              Its child strips CLAUDECODE and prior history role, sets CLAUDE_HISTORY_ROLE
              and disables the advisor; writer-specific isolation is stated in invocation.
              Refused Claude and codex calls use the log-record target contract below.
        project_resources:
          description: Configuration, checklists and prompt templates are host files initialized once and checked before work (ADR-0029).
          rules:
            - >-
              The init command uses no bootstrap configuration. It carries copies under
              services/true-bdd/internal/infrastructure/initialization/files/, embedded by
              the initialization package so go:embed stays within its directory and Go
              stays within services/. Only init reads these copies; runtime loaders
              read project files exclusively and never fall back to embedded content.
              The existing embedded Go scenario-test generation template is separate.
            - >-
              Init writes missing true-bdd/true-bdd.yaml, all true-bdd/checklists/ files
              and all templates/ prompt templates in the current folder. The host
              configuration has no scripts; this repository keeps scripts in its own
              true-bdd/true-bdd.yaml. Existing files, including empty, invalid and symbolic
              link entries, are left untouched. Each path is reported through an INFO log record with msg Created or
              Left existing and a path attribute. Init binds stdout text logging and
              tmp/true-bdd.log.json without loading configuration. Creation rechecks existence under the disk channel's
              exclusive directory Hold. Init installs the product, architecture and Registry schemas from their repository copies under true-bdd/; it writes no Specification and
              performs no framework detection. Version and init need none of these files.
            - >-
              Every checklist-driven command loads its configuration and selected
              checklist and parses its selected system and user validation templates
              before loading Items, starting test discovery or dispatching an AI turn.
              Under --fix it also parses its system and user fix-generator and
              fix-applier templates. Selection uses the configured paths of that
              command's generator triple, so another command's templates are not required.
              Parsing uses the same Go text/template functions as rendering, including
              Sprig and toYaml. Missing files name the path and true-bdd init; invalid
              files retain the parse error and path and ask to fix the file without
              init advice. All refuse before command work.
                  # What this service talks to at runtime: `protocol` is the connection
      # mechanism (cli, http, ws, sql, redis, …); `scope` places it:
      #	internal    — another service declared in this file
      #	self_hosted — we run the instance (redis, postgres, kafka); builds
      #	              use the real thing
      #	third_party — a vendor's service, wherever the binary lives (a vendor CLI is
      #	              local, GLM's API is not); builds mock these (record/replay)
      dependencies:
        # Replay hashes every AI turn's argv and stdin, so each CLI states its
        # invocation exactly (docs/qna Q2, Q19): a rebuilt engine must send
        # the same requests.
        - name: codex
          protocol: cli
          scope: third_party
          # binary and args match every codex cassette's `binary` and `argv`.
          invocation:
            binary: codex
            args:
              - exec
              - when: The turn is a plan or validation turn.
                args: [-s, "{sandbox}"]
              - --ephemeral
              - --skip-git-repo-check
              - --color
              - never
              - when: The turn is an apply turn of any command.
                args: [--strict-config, --ignore-rules, --json]
              - -C
              - "{work_dir}"
              - -m
              - "{model}"
              - when: >-
                  The turn carries a result schema, as every codex validation
                  and fix turn does; an apply turn carries none.
                args: [--output-schema, "{schema_path}"]
              - -o
              - "{answer_path}"
              - "-"
            stdin: &folded-prompt
              with_system: "### SYSTEM INSTRUCTIONS (authoritative — follow exactly)\n\n{system_prompt}\n\n### TASK\n\n{user_prompt}"
              without_system: "{user_prompt}"
            values:
              sandbox: >-
                `read-only` for every plan and validation turn, independently of scratch tool permissions.
                Every apply turn instead selects its generated named writer permission profile, with no -s flag.
              model: >-
                The model half of the `<cli>:<model>` reference the turn's tier
                resolves to under `engine.models`, split on the first colon:
                `gpt-6.1-sol` in every codex cassette.
              work_dir: &work-dir >-
                The directory true-bdd was started in, as an absolute path: the
                host project root. Cassettes record it as `{{CWD}}`.
              system_prompt: &system-prompt The turn's system prompt, rendered from templates/.
              user_prompt: &user-prompt The turn's user prompt, rendered from templates/.
              run_dir: &run-dir >-
                The run's artifact directory, `<paths.tmp_dir>/<YYYY-MM-DD-HH-MM-SS>-<pid>`,
                created at startup. The join is cleaned and stays relative to
                `{work_dir}`, so `paths.tmp_dir: ./tmp` gives `tmp/<...>`.
                Cassettes record the `<YYYY-MM-DD-HH-MM-SS>-<pid>` part as
                `{{RUN_DIR}}`.
              label: >-
                `codex-turn<NNN>`: NNN is this turn's number, from 1 and
                zero-padded to three digits, among every AI turn the run
                dispatched, whichever CLI ran it. For concurrent scen check validation only,
                the label is validation-<Prompt index, at least two digits>-<SHA256 of subject id,
                lowercase hex>, so schema and answer paths remain stable under reordered turns.
              schema_path: >-
                `{run_dir}/{label}-codex-schema.json`, written before the spawn
                with the JSON Schema the answer must satisfy, every object's
                `required` listing all of its properties: codex refuses a
                schema that leaves one out, which claude accepts.
              answer_path: >-
                `{run_dir}/{label}-codex-answer.txt`, where codex writes its final
                message; the engine reads the answer there, never from stdout.
            dir: "{work_dir}"
            notes:
              - >-
                Plan and validation turns select -s read-only explicitly. Every apply turn selects default_permissions=writer and approval_policy=never in its generated configuration.
              - The trailing `-` makes codex read the prompt from stdin.
              - >-
                `--skip-git-repo-check`: a BDD fixture's run directory is no git
                repository, and codex refuses to run outside one without it.
              - >-
                Ordinary turns inherit the environment and merge stdout/stderr as before.
                Every apply turn sets CODEX_HOME to {host}/tmp/codex-homes/{run_basename}/{label}-codex-home,
                copying only auth.json with private permissions, never user config,
                sessions, AGENTS.md, history or MCP definitions. The provider removes auth.json
                after preparation or turn completion, on success and failure, reporting cleanup errors. --ephemeral remains.
                Its generated config disables web search, apps, plugins, multi-agent,
                memories, login shells, shell snapshots and host skill discovery;
                project_doc_max_bytes=0 suppresses AGENTS.md and --ignore-rules
                suppresses execpolicy files. No outer sandbox-exec wraps codex.
              - >-
                The apply profile grants host-root reads, that execution mode's exact file or directory roots, and host tmp writes. :minimal supplies OS runtime exceptions listed
                in ADR-0021; go env resolves GOROOT as read-only and GOMODCACHE as denied by default.
                Only the downloaded libraries and their version metadata receive narrower read entries.
                GOMODCACHE/cache/vcs, the shared host tmp/codex-homes subtree, /private/tmp and /private/var/tmp are denied.
                The narrower host and tmp grants still work when nested under a denied root.
                Every other filesystem path is restricted by default, including
                sibling cuts, user work, codex sessions and claude transcripts.
                Before spawning, the engine creates missing directory roots and literal parents of file roots inside the host,
                using rooted filesystem operations that cannot follow a symlink outside it, and logs each created root once at INFO.
                Edit roots resolving outside the host are refused. The profile grants remain limited to the edit roots and host tmp;
                creating their parents does not grant the writer any other host-root writes. Existing files stay files; missing files are not made into directories. Configured globs authorize creating and changing matching files even without existing matches. Terminal /** grants its literal subtree; other wildcards grant their narrowest literal directory and enforce the original patterns after every turn, including failed turns. Newly created non-matching files are removed; a changed, deleted, renamed or permission-changed pre-existing non-matching file fails the turn with one WARN naming it. Overlapping grants authorize their union. Such violations are fatal even for build code, with changed pre-existing contents retained for diagnosis. Non-matching files can be changed during the turn; this boundary is enforced afterward. Generated homes are excluded from comparison. Malformed patterns, host-root grants and escapes refuse (ADR-0024).
              - >-
                Writer subprocesses inherit no environment: the profile sets PATH to
                GOROOT/bin, system bin directories and a generated runtime-bin with installed node, npm, npx and docker links; HOME, TMPDIR and GOCACHE inside
                host tmp, GOROOT/GOMODCACHE, GOPROXY=off, GOSUMDB=off,
                GOTOOLCHAIN=local, GOFLAGS='-trimpath -buildvcs=false', GOTELEMETRY=off
                and CGO_ENABLED=0. Optional node/npm/npx/docker executables, npm's validated package, Mach-O dependency libraries and their installation links are listed as read grants. Homebrew opt link directories supply symlink metadata, while unrelated canonical installation targets remain denied. npm/npx JavaScript package grants require bin/npm-cli.js or bin/npx-cli.js beneath a package.json naming npm, outside the host and authentication roots and the user's sensitive .codex, .claude, work, .ssh, .aws and .config roots and their ancestors. An unsafe or unverifiable runtime is refused with a WARN and no link or grant. npm uses offline mode and scratch cache/config; Docker uses scratch config without a daemon/socket grant; OPENSSL_CONF=/dev/null suppresses outside configuration. Network is disabled for commands and their children.
                Codex's own model connection remains available. This is calibrated
                for codex-cli 0.162.1 on macOS; no weaker fallback is supplied.
              - >-
                The writer config selects high reasoning and model_context_window=1050000.
                A configured window is not a demonstrated prompt size: 1M remains
                unverified. Model selection still comes from the resolved tier.
              - >-
                The writer saves stdout JSONL as {run_dir}/{label}-codex-events.jsonl
                and stdout plus stderr as {run_dir}/{label}-codex.log. The final message
                still comes only through -o.
              - >-
                A started codex writer exiting non-zero (including usage limits),
                missing its answer file or returning whitespace carries CodexTurnError.
                Build code keeps its edits, counts the attempt, warns once and runs
                PostNotApplied. Start failures and refusals before spawning stay fatal.
                No role or CLI receives a router deadline (ADR-0025); every turn runs until it ends or the caller cancels.
                Cancellation stops the turn's process group and descendants and remains fatal. There is no codex stall watch; codex's own request timeouts apply. Plan and validation turns retain their inherited environment and read-only sandbox. Other commands' confined applies retain fatal failure handling; build code alone requests recovery and replay forms. Process group and wait bound
                remain as for the other writers.
              - >-
                Before the spawn the engine logs the turn's sandbox level as
                msg="Codex turn sandboxed" with the turn's `label` and `sandbox`.

              - |
                Generated config.toml wire form (codex-cli 0.162.1, ADR-0026). The following template fixes every key and table, in emission order. Braced names are path substitutions, not literal TOML. Paths and values are TOML quoted strings; {runtime_read_entries} and {write_entries} expand to complete quoted-path assignments. Blank lines and the explanatory :minimal comments have no semantic effect. There is no [permissions.writer] network boolean, file_system table, type field or entries array. The filesystem table itself is the restricted path-to-access map: no :root grant or inherited workspace profile is emitted.

                default_permissions = "writer"
                approval_policy = "never"
                model_reasoning_effort = "high"
                model_context_window = 1050000
                web_search = "disabled"
                project_doc_max_bytes = 0
                allow_login_shell = false
                cli_auth_credentials_store = "file"
                [history]
                persistence = "none"
                [features]
                apps = false
                plugins = false
                multi_agent = false
                memories = false
                shell_snapshot = false
                skip_host_skill_discovery = true

                [permissions.writer.filesystem]
                ":minimal" = "read"
                "{host}" = "read"
                "{GOROOT}" = "read"
                "{GOMODCACHE}" = "deny"
                {library_read_entries}
                {runtime_read_entries}
                {write_entries}
                "{host}/tmp/library-download" = "deny"
                "{host}/tmp/codex-homes" = "deny"
                "/private/tmp" = "deny"
                "/private/var/tmp" = "deny"
                "{GOMODCACHE}/cache/vcs" = "deny"

                [permissions.writer.network]
                enabled = false
                [shell_environment_policy]
                inherit = "none"
                [shell_environment_policy.set]
                CGO_ENABLED = "0"
                DOCKER_CONFIG = "{host}/tmp/codex-shell-home/.docker"
                GOCACHE = "{host}/tmp/codex-go-build"
                GOFLAGS = "-trimpath -buildvcs=false"
                GOMODCACHE = "{GOMODCACHE}"
                GOPROXY = "off"
                GOROOT = "{GOROOT}"
                GOSUMDB = "off"
                GOTELEMETRY = "off"
                GOTOOLCHAIN = "local"
                HOME = "{host}/tmp/codex-shell-home"
                OPENSSL_CONF = "/dev/null"
                PATH = "{GOROOT}/bin:/usr/bin:/bin:/usr/sbin:/sbin:{host}/tmp/codex-shell-home/runtime-bin"
                TMPDIR = "{host}/tmp/codex-tmp"
                npm_config_cache = "{host}/tmp/codex-shell-home/npm-cache"
                npm_config_offline = "true"
                npm_config_userconfig = "{host}/tmp/codex-shell-home/.npmrc"

                {host} is the symlink-resolved Host project root; go env -json GOROOT GOMODCACHE supplies the two Go roots. The library_read_entries are sorted, deduplicated quoted read paths: each resolved module source directory and its exact .info, .mod, .zip and .ziphash files, with no organization-specific rule. Scratch paths resolve within the host before emission. Shell set keys are sorted lexically. The runtime PATH suffix and Docker/npm/OpenSSL environment entries are always emitted, even when no optional executable is installed. Runtime discovery visits installed docker, node, npm, npx in lexical name order. For each it emits the executable, recursively enumerated non-system Mach-O libraries (installation alias then canonical path), validated npm package when applicable, then installation symlink ancestors, necessary Homebrew opt metadata directories and dylib parent directories, preserving discovery order and deduplicating paths by first occurrence. Each is a quoted path = "read" assignment; no installed runtime means no such entries. The acceptance and refusal rules above govern these paths.

                {write_entries} emits each accepted execution-mode write root as a quoted resolved path = "write" assignment, in Write/Edit/MultiEdit pattern order, then any additional SourceWriteRoots, then host tmp. Overlapping roots are deduplicated by first occurrence. Literal files stay exact; terminal /** strips the suffix; other globs grant their narrowest literal directory and retain the post-turn enforcement described above. The six deny entries follow all write grants in the stated order. The network value must be enabled = false within [permissions.writer.network]; network = false directly under [permissions.writer] is refused by the real CLI.
                    - name: claude
          protocol: cli
          scope: third_party
          # binary and args match every engine claude cassette's `binary` and
          # `argv`: fitting prompts retain their recorded argument form; larger
          # prompts use stdin. Replay hashes argv and stdin together.
          invocation:
            binary: claude
            args:
              - --setting-sources
              - ""
              - --strict-mcp-config
              - when: Every Claude turn except the build-code writer.
                args: [--safe-mode, --allowedTools, "{allowed_tools}", --disallowed-tools, "{disallowed_tools}"]
              - when: Only the explicitly requested build-code writer.
                args: [--restricted, --disable-slash-commands, --tools, "Read,Glob,Grep,Edit,Write,MultiEdit,Bash", --settings, "{writer_settings}", --session-id, "{session_id}"]
              - when: Each extra read root of the build-code writer, in order.
                args: [--add-dir, "{read_root}"]
              - --model
              - "{model}"
              - when: >-
                  The turn's system prompt is not empty, as every engine
                  turn's is.
                args: [--system-prompt, "{system_prompt}"]
              - --permission-mode
              - "{permission_mode}"
              - --output-format
              - stream-json
              - --verbose
              - when: >-
                  The turn carries a result schema: every validation turn and
                  every fix turn does; an apply turn carries none.
                args: [--json-schema, "{schema}"]
              - -p
              - when: The complete request fits the conservative argument budget below.
                args: ["{user_prompt}"]
            stdin:
              with_system: &claude-stdin >-
                Empty when user_prompt travels in argv; otherwise the whole {user_prompt},
                byte for byte, with EOF after its final byte. The default text input
                format reads it with -p alone, including stream-json output and --json-schema.
              without_system: *claude-stdin
            # Empty setting sources exclude user/project/local settings; strict MCP admits no servers.
            # Safe mode excludes discovered CLAUDE.md memory, skills, plugins and hooks.
            # Auth and built-in tools remain; --bare would require API-key auth.
            values:
              permission_mode: default for the build-code Claude writer; acceptEdits otherwise.
              run_dir: *run-dir
              label: >-
                `claude-turn<NNN>`: NNN is this turn's number, from 1 and
                zero-padded to three digits, among every AI turn the run
                dispatched, whichever CLI ran it. The counter is shared with
                codex, not restarted per CLI or role. Thus the Claude writer
                after one plan turn is `claude-turn002`. Concurrent scen check validation instead uses
                validation-<Prompt index, at least two digits>-<SHA256 of subject id, lowercase hex>
                to keep artifact paths independent of dispatch order.
              writer_settings: >-
                {run_dir}/{label}-claude-config/settings.json. Explicit PreToolUse
                hook runs this engine's claude-guard --policy pointing to sibling
                policy.json, with replay (the canonical command/write-root
                policy), read_roots, excluded_roots and protected_roots (the
                generated configuration directory). Permissions allow Read/Glob/Grep, deny Agent/Task,
                WebFetch/WebSearch/NotebookEdit, and never grant Bash patterns.
                Bash and writes require the hook's explicit allow. Both Bash
                timeouts are 600000 ms in settings and environment.
              session_id: A fresh UUID for this writer only.
              read_root: >-
                go env GOROOT, GOMODCACHE, then this session's tool-results
                directory under CLAUDE_CONFIG_DIR/projects (default ~/.claude).
                The host cwd is always a working root. The hook narrows module-cache file tools to the architecture library graph, even for a cache inside the host; add-dir on the cache is only the CLI outer boundary. The policy carries library_cache and read_roots containing GOROOT, the sorted graph roots and the spill directory; excluded_roots is empty.
              allowed_tools: >-
                The turn's allowed tools joined by commas. A validation or fix
                turn: `Read(**),Write({tmp_glob}),Glob(**),Grep(**)`. An apply
                turn: `Read(**),Write({tmp_glob}),Edit({tmp_glob}),MultiEdit({tmp_glob}),Glob(**),Grep(**)`,
                followed, for each write root the command grants its applier
                in order, by `Write(<glob>),Edit(<glob>),MultiEdit(<glob>)`.
                `build code` replaces its scratch glob with host `./tmp/**` and grants the remaining failing set's services' `path:` and exact `writable:` paths. Existing folders and explicitly declared absent folders receive recursive subtrees; exact files, including absent files, stay literal. Other commands retain their existing scratch/document grants.
              disallowed_tools: >-
                A validation or fix turn: `Bash,Edit(**),MultiEdit(**),Agent,Task`.
                An apply turn: `Bash,Agent,Task`.
              tmp_glob: >-
                `paths.tmp_glob` from true-bdd.yaml: `./tmp/**` in every
                cassette.
              model: >-
                The model half of the `<cli>:<model>` reference the turn's tier
                resolves to under `engine.models`, split on the first colon:
                `claude-opus-5` in almost every cassette.
              system_prompt: *system-prompt
              user_prompt: *user-prompt
              work_dir: *work-dir
              schema: >-
                `{validation_schema}` for a validation turn, `{fix_schema}` for
                a fix turn, each byte for byte.
              validation_schema: |-
                {
                  "type": "object",
                  "properties": {
                    "answer": {"type": "string", "enum": ["pass", "fail"]},
                    "context": {"type": "array", "items": {"type": "string"}},
                    "fix_prompt": {"type": "string"}
                  },
                  "required": ["answer", "context"],
                  "additionalProperties": false
                }
              fix_schema: |-
                {
                  "type": "object",
                  "properties": {
                    "fix_prompt": {"type": "string"},
                    "questions": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {"type": "string"},
                          "question": {"type": "string"},
                          "context": {"type": "string"},
                          "options": {"type": "array", "items": {"type": "string"}}
                        },
                        "required": ["id", "question", "context", "options"],
                        "additionalProperties": false
                      }
                    }
                  },
                  "required": ["fix_prompt", "questions"],
                  "additionalProperties": false
                }
            dir: "{work_dir}"
            env:
              CLAUDE_HISTORY_ROLE: Empty; the engine labels no turn.
              CLAUDE_CODE_DISABLE_ADVISOR_TOOL: "1"
            notes:
              - |
                  Generated settings.json wire form (Claude Code 2.1.285, ADR-0026). It is UTF-8 JSON with the exact layout below: two-space indentation, one array element per line, nonempty objects expanded across lines, and a final newline. JSON object keys are emitted in sorted lexical order at every depth; empty objects stay {}. {guard_command} below is a JSON string value, escaped as JSON, not a nested object.

                  {
                    "autoMemoryEnabled": false,
                    "claudeMdExcludes": [
                      "**"
                    ],
                    "enabledPlugins": {},
                    "env": {
                      "BASH_DEFAULT_TIMEOUT_MS": "600000",
                      "BASH_MAX_TIMEOUT_MS": "600000"
                    },
                    "hooks": {
                      "PreToolUse": [
                        {
                          "hooks": [
                            {
                              "command": "{guard_command}",
                              "timeout": 15,
                              "type": "command"
                            }
                          ],
                          "matcher": "*"
                        }
                      ]
                    },
                    "permissions": {
                      "allow": [
                        "Read",
                        "Glob",
                        "Grep"
                      ],
                      "defaultMode": "default",
                      "deny": [
                        "Agent",
                        "Task",
                        "WebFetch",
                        "WebSearch",
                        "NotebookEdit"
                      ]
                    }
                  }

                  The guard command is the shell-single-quoted current engine executable, then the literal ` claude-guard --policy `, then the shell-single-quoted sibling policy.json path ({run_dir}/{label}-claude-config/policy.json). A single quote inside an argument is replaced by the shell sequence '"'"' before surrounding the whole argument with single quotes. JSON escaping is applied afterward (including encoding <, > and & as Unicode escapes). Bash has no allow pattern. The hook array has exactly one command hook with numeric timeout 15 and matcher "*". These settings accompany the separately generated guard policy described under writer_settings; that policy remains the authority for allowed file roots and replay forms.
              - >-
                Only the build-code writer adds or strips these environment entries:
                BASH_DEFAULT_TIMEOUT_MS/BASH_MAX_TIMEOUT_MS=600000;
                CLAUDE_CODE_DISABLE_CLAUDE_MDS, DISABLE_AUTO_MEMORY,
                DISABLE_BUNDLED_SKILLS, DISABLE_WORKFLOWS,
                DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL, DISABLE_PLUGIN_FORWARDING,
                DISABLE_BACKGROUND_TASKS each use the CLAUDE_CODE_ prefix and value 1.
                CLAUDE_CODE_SAFE_MODE, CLAUDE_CODE_SIMPLE and inherited
                CLAUDE_RELAUNCH_SESSION_ADD_DIRS are stripped.
              - >-
                Preserve -p {user_prompt} only when argv and the complete child environment
                together fit 112 KiB (128 KiB minus 16 KiB). Count UTF-8 bytes, one NUL per
                string, argv[0], and eight bytes per argument/environment pointer including
                both vector terminators. Freeze that environment for the spawn. Linux
                guarantees a 128 KiB total argument/environment allowance at its minimum
                stack setting and a 128 KiB per-string allowance with 4 KiB pages; macOS
                permits at least 256 KiB total. The 16 KiB reserve covers executable and
                interpreter paths, PWD and platform bookkeeping. Thus every argument is
                also below Linux's per-string limit. Above this budget, omit the prompt
                argument and send it through stdin without truncation or an added newline.
                The same choice applies to every role, ordinary and writer turns, JSON and
                streaming output, with or without a schema. Small requests retain their
                cassette hashes; the proxy and committed recordings do not change.
              - >-
                `CLAUDECODE` is removed from the inherited environment, so the turn does
                not look launched from a Claude session.
              - >-
                `--setting-sources ""` excludes user, project and local settings; `--strict-mcp-config` loads no MCP
                server, since the command line names none. The advisor is a
                server-side tool `--disallowed-tools` cannot reach, so only
                the environment entry turns it off.
              - >-
                `-p` comes last: a flag before it would otherwise read the
                prompt as its own value.
              - >-
                The answer is the stream's `result` record: its
                `structured_output` object when the turn carried a schema,
                else its text. An output-cap subtype or max_tokens stop_reason is fatal even if a complete structured object is present. A schema turn whose result holds no object, or
                a non-zero exit, fails the turn. Every role and CLI runs with the caller's context
                and its own process group without a router deadline (ADR-0025); cancellation
                stops the turn and its descendants and remains fatal. No request, prompt,
                checklist or template adds a time, turn, token or cost budget.
                For the explicit build-code writer, non-zero exits, is_error or
                api_error_status >=400 results, assistant error records, absent
                envelopes and empty answers are started outcomes; available cost
                and usage survive errors. Start failures and pre-spawn refusals
                stay fatal. Other roles retain fatal provider-error handling.

  terms:
  - term: Model
    technical: Service models map a name to system/user template paths and a JSON Schema in YAML scheme path. Engine checklist roles validate their explicit data view before rendering, without changing template inputs.
  - term: Concept
    technical: Product concepts are ordered given/when/then lists of concept, means and terms; names are unique per
      block. Closure checks define and map every declared term exactly once, even without Story claims. The loader
      refuses extra concept keys and the retired catalogue key. Glossary form is validated by every product reader
      and command startup under the product summary’s counting rule, before any AI turn.
  - term: Concept binding
    technical: architecture.concepts entries name concept, block and service with references and does, or UI-only
      intent. Check all declarations for duplicate bindings, unknown concepts/services and incomplete instructions.
      References select exactly one declared command, file, log_record, outgoing_call, operation_id or element. CLI
      selectors are exact document keys; HTTP uses operationId; UI uses page/region, role and accessible name. Only
      linked concepts require the Scenario service’s binding.
  - term: Public interface
    technical: 'Each service declares public_interface.kind: cli, http or ui. CLI names an OpenCLI-like YAML/JSON
      document, HTTP an OpenAPI 3 document, UI inline elements. Named documents resolve from the Host project root;
      HTTP local references stay there, with network references refused. Missing or invalid documents refuse architecture
      loading. The public-interface check fails absent declarations, library kind and unsupported kinds.'
  - term: build identity
    technical: 'Resolve version and commit independently: nonempty link-time stamp, then Go Main.Version or vcs.revision,
      then (devel) or unknown. Never synthesize pseudo-versions or append vcs.modified. version prints exactly "true-bdd
      version <version> commit <commit>\n" without creating files. Log installation emits one first INFO Engine started
      record with version and commit; version, help, guard and pre-logging refusals install no log. Link-time -X symbols remain
      github.com/ondatra-ai/true-bdd/services/true-bdd/internal/infrastructure/buildinfo.version and
      github.com/ondatra-ai/true-bdd/services/true-bdd/internal/infrastructure/buildinfo.commit, which the kept release tooling stamps.'
  - term: Library
    technical: Service and testing libraries list exact {module, version} pins. Before discovery and writer preparation,
      download their complete Go build graph through isolated private manifests under tmp/library-download, then remove
      manifests. Refuse conflicting pins, version substitution, incomplete downloads and production imports of test-only
      modules, including platform-tagged files but excluding _test.go. Writers read only resolved sources and exact
      .info/.mod/.zip/.ziphash metadata. Never modify host manifests. Non-Go hosts omit libraries; host-local node_modules
      remains unchanged. Codex confines subprocesses and network; Claude replay remains unconfined.
  - term: engine
    technical: The true-bdd process under services/true-bdd, with independent IO channels as patterns.owned_io specifies.
      Text INFO+ goes to stdout; JSON DEBUG+ goes to paths.tmp_dir/true-bdd.log.json, created even without records.
  - term: command
    technical: 'Run the engine in the prepared tree, splitting the step’s command at whitespace without shell quoting;
      substitute {{CWD}} per argument. Supply queued stdin and the mode’s AI CLI PATH. The Scenario timeout defaults
      to five minutes. Hand completed and incomplete runs to the harness recorder before returning: run directory,
      stream paths, file changes and exit status when available. Evidence is published in true-bdd-logs/harness.json.'
  - term: project tree
    technical: Overlay tests/true-bdd/fixtures/<name>/input/ onto repository true-bdd/ and templates/ in tmp/test_run/<session>/<name>/.
      Optional prep.sh runs before the initial snapshot; teardown.sh runs after all Then steps even on failure. Checklist
      narrowing and AI modes are provided by the test library, not the engine.
    observed_by: Paths read after a run must be nonempty, relative and inside the run tree after cleaning and resolving
      symlinks on both sides. Resolve missing suffixes through their deepest existing ancestor. Require regular files
      for reads and directories for commands; refuse escaping paths. Diff-only assertions compare path text without
      reading.
  - term: exit code
    technical: Process status is 1 for errors and 0 otherwise. Completed failing us refine/us apply walks log their
      verdict, skip saving and return 0. scen check, build steps and build code return nonzero for failed checks or
      incomplete work.
  - term: stdout
    technical: Console answers and INFO+ slog text share stdout. Emit uppercase command COMPLETE only after successful
      finalization and post-run checks; build tests owns its banner after deterministic verification/rendering.
  - term: stderr
    technical: 'Cobra writes "Error: <error>" and argument-error usage here. Before logging installation, errors also
      use the default dated ERROR text handler.'
  - term: log record
    technical: Messages and keys are wire contracts, including the Public interface’s log_records. A denied-tool warning
      carries label, role and semicolon-separated calls in reported order. Claude targets use file_path, then path;
      Glob uses pattern joined to path, never Grep’s query. Limit targets to 200 Unicode characters plus ellipsis.
      Codex item.completed refusals come from declined status or failed status with explicit permission/refusal errors,
      for command_execution, file_change and mcp_tool_call. Extract path-like command arguments excluding shell launchers,
      changes.path or arguments.file_path/path respectively. Other failures and narration prove no denial. Warnings
      do not change turn outcomes.
  - term: pattern
    technical: Go RE2 expression, taken verbatim as the rest of the step, including quotes. Compilation failure fails
      the step.
    observed_by: Every-file patterns expand {{CWD}}, {{ENGINE}}, {{GOROOT}} and {{GOMODCACHE}} to resolved runtime
      paths. Escape as JSON string contents for .json, TOML basic strings for .toml, raw otherwise, then regex-escape.
      ENGINE inside JSON hook commands also shell-escapes single quotes first. Lookup failures fail the step.
  - term: file change
    technical: Structural diff between prepared pre-run and post-command snapshots, with relative paths and created/modified/deleted
      kind. Exclude noise directories such as .git and node_modules, include tmp. Directory membership requires a
      whole path-component prefix.
  - term: checklist
    technical: Host true-bdd/checklists/<command-stem>.yaml holds sections of validation_prompts. D Prompts precede
      ordered Q Prompts; a failed D skips Q. scen check uses a bounded worker pool controlled by engine.scen_check_concurrency
      (default 1), waits for all prior links before shared bindings, joins validation before serial Scenario-id-ordered
      menus, and discards all verdicts after an apply. max_apply_attempts bounds new walks.
  - term: Prompt
    technical: An ordered validation_prompts entry contains Q or D, rationale, docs and optional F. A question snippet
      must select exactly one Prompt.
  - term: AI turn
    technical: Before spawning claude or codex, the router counts system and user UTF-8 bytes, including Codex assembly
      headings. engine.max_prompt_bytes is a positive integer in true-bdd.yaml, default 150000; above it PromptLimitError
      stops the walk with turn label/role, size and limit. Dispatching AI turn logs prompt_bytes and prompt_limit_bytes.
      Retries and fixes are measured anew; CLI-owned system/tool bytes are excluded. Replay answers the same request
      from its cassette.
  - term: AI CLI
    technical: Resolve <cli>:<model> by splitting the first colon. Role tier precedence is Prompt model/fix_model/apply_model,
      checklist engine, then engine.default_<role>_model. Validate configured tiers and run-only overrides before
      dispatch. CLI and role are logged per turn.
  - term: fix loop
    technical: A failed Prompt under --fix proposes a fix after any clarification. Clarification options are numbered
      from 1 with 0) Other; final nonempty EOF text counts as an answer. Menu lines are [1] Apply this fix to working
      copy, [2] Refine the fix prompt, [3] Exit without applying. Accept 1/apply, 2/refine (feedback through a blank
      line), otherwise exit. Empty EOF raises a distinct person-required or menu-choice error; blank newline retains
      interactive meaning. No advance approval or terminal detection. allowance two permits three applies; the terminal
      apply reruns but still ends at the bound. Started build-code writer failures or missing confirmations keep edits,
      warn once and rerun; start failures stay fatal.
  - term: test dependencies
    technical: Fixture prep.sh runs in the assembled tree before snapshots, capped at 15 minutes. A blank script is
      absent; the Given requires it but installs nothing itself.
  - term: fixture
    technical: A single-component quoted step value naming an existing <suite>/fixtures/<name>/ identifies fixture
      inputs. Read regular files outside cassettes/ without following symbolic links; unrelated fixtures are excluded.
      Body turns receive fixture directory paths; the tool-less critique embeds contracts selected under prompt_data.
  - term: glob
    technical: 'Use Go filepath.Match on relative paths: * and ** do not cross /; ? matches one character and brackets
      a set. Validate syntax before matching, even for an empty diff. Created-file counts inspect only created entries.
      Content counts require exactly one current regular file; every-file comparisons require at least one, with each
      path confined to the tree.'
  - term: Story
    technical: YAML under paths.stories_dir, named <id>-<slug>.yaml; story holds id, feature, title, as_a, i_want,
      so_that, status and acceptance_criteria. A read glob must resolve to exactly one confined file with a story
      mapping.
  - term: Feature
    technical: The Story’s feature scalar, compared unchanged; absent means empty.
  - term: Acceptance Criterion
    technical: A Story acceptance_criteria element with id, description and steps lists by given/when/then. Ids are
      <NNN>-<slug>, with legacy AC-<n> retained. Look up by id, not position; a missing id fails observation.
  - term: step
    technical: 'A scalar or one-key and/but mapping in a given/when/then list. Mapping keys are display modifiers,
      excluded from matching. judge: is legal only in Then, llm: only Given/When; other blocks refuse. A present block
      has at least one step.'
  - term: Scenario
    technical: A Registry scenarios entry with description, service, required path, optional timeout, user_stories
      and merged_steps. Observe it by key or lineage; an absent entry fails.
  - term: Registry
    technical: documents.scenarios_yaml names the YAML scenarios mapping, conventionally docs/scenarios.yaml. Read
      it through a confined regular-file path; unreadable, malformed or empty Registry observation fails.
  - term: lineage
    technical: Each user_stories entry carries story (project-relative file), scenario_id (<story-id>-<ac-id>) and
      merge_date. Match scenario_id exactly. Count all matches for counts; other observations require exactly one,
      then compare story, key or YAML-rendered entry.
  - term: Scenario key
    technical: The scenarios map key, lineage id once claimed; legacy E2E-NNN keys remain until renamed. Render Test
      plus its CamelCase as the Go function name.
  - term: step definition
    technical: Literal .Step(pattern, function) registrations pair whole-text regexes with func(*State, []string)
      error. Checked proposals create one concept skeleton per block/name/suite/pattern SHA256 identity, with a //truebdd:concept
      record and pending failure. Preserve signatures/registrations while writing bodies, imports and shared State.
      Missing Register/State get register.go/state.go, prefixed true_bdd_ on filename collision. Static inspection
      parses every immediate Go file and requires exactly one pattern per deterministic step, skipping model-run steps;
      parse or regex errors fail.
    observed_by: Inspect only the confined steps directory, without building it. Name every unmatched or multiply
      matched step. The red-without-target run separately rejects definitions doing product work.
  - term: test runner
    technical: Split architecture testing.commands with shell quoting, preserving working directory and machine-output
      requirements. Rerun remaining build-code members in one start using alternated -run, --testNamePattern or --grep
      selectors. Go <build> and Playwright <startup> force an unfiltered rerun; Jest <load> selects remaining file
      paths with --runTestsByPath. Require each member’s own success; missing/skipped ordinary members stay failing.
      Go build members need package pass or no-test-files skip without failure; Jest load members need successful
      file loading. Nonzero with no named failure stops before AI with command, status and output tail. Outer walks
      rediscover the whole suite.
  - term: shell command
    technical: After the engine ends, split the quoted command at whitespace and run in a confined tree directory
      with GOWORK=off and CLAUDECODE removed, capped at ten minutes. Empty commands, spawn failures or unexpected
      status fail with stream evidence. Run last because it may change files.
  - term: claude
    technical: 'Claude Code 2.1.285, invoked by dependencies[claude]. Only the explicitly requested build-code writer
      receives the restricted hook configuration; other turns retain safe mode. Keep default sign-in: an empty CLAUDE_CONFIG_DIR
      was signed out. No credentials are copied.'
  - term: codex
    technical: codex-cli 0.162.1, invoked by dependencies[codex]. Apply turns receive a private generated home, permission
      profile and temporary authentication copy; plan and validation use read-only.
  - term: write guard
    technical: claude-guard reads --policy and one complete stdin payload. File reads/searches use declared roots,
      module exclusions and protected configuration; writes use declared roots. Resolve symlinks and file identity.
      Bash permits only canonical foreground replay, whole-suite or one nonempty single-quoted selector in the resolved
      suite directory, including its quoted cd prefix. Unknown tools, malformed policy and background calls deny.
      Allow emits hook JSON; deny exits 2 with one true-bdd guard reason.
  - term: write policy
    technical: JSON shape is declared by the Public interface write-policy file. Resolve root identity and reduce
      write globs to fixed prefixes. Canonical replay removes machine flags before -args/-- while preserving later
      arguments. Join arguments with spaces, quoting all but A-Za-z0-9_./:=,@%+-. A single quote, newline or NUL withholds
      the grant with one warning. Selectors are -run, --testNamePattern or --grep; testing.config determines the suite
      directory.
  - term: tool call
    technical: Decode tool_name, cwd and tool_input as one call. File target precedence is file_path, path, cwd; relative
      paths resolve against cwd. Bash uses command and run_in_background.
  - term: hook payload
    technical: 'Stdin JSON carries tool_name, cwd and tool_input: file_path, path, command and run_in_background.
      Unreadable policy, malformed JSON and non-absolute read_root deny.'
  - term: symbolic link
    technical: Filesystem symlink retaining its literal target, with relative targets resolved from the link’s parent.
      Snapshot traversal refuses links, so probe links sit in excluded directories. Link creation refuses an absolute
      or escaping link path.
  - term: hard link
    technical: Another directory entry for the same inode; whole-file replacement renames a new inode, leaving the
      old link’s bytes intact.
  - term: hold
    technical: Parent-directory shared/exclusive flock, released before returning, as patterns.owned_io specifies.
      The interference binding observes contention after the pre-run snapshot.
  - term: staging file
    technical: Atomic-write sibling .true-bdd.tmp.<basename>, removed without following stale symlinks, exclusively
      recreated and renamed while retaining target permissions, as patterns.owned_io specifies.

  # Concept bindings: setup, calls and observations through the Public interface.
  concepts:
  - concept: project tree
    block: given
    service: true-bdd
    references:
    - file: project-tree
    - file: configuration
    - file: checklists
    - file: prompt-templates
    - file: staging-files
    - outgoing_call: claude
    - outgoing_call: codex
    does: >-
      Select tests/true-bdd/fixtures/<name>/ from the named project-tree Given; retain its name and
      directory for later steps. Defer assembly until When: overlay input/ on repository true-bdd/ and
      templates/ in tmp/test_run/<session>/<name>/, run optional fixture-root prep.sh, then snapshot. The
      suite's -mode services value selects replay (PATH-first claude/codex programs answer from fixture
      cassettes/; require cassettes/golden.json), record (those programs record real CLI calls; publish on
      Scenario success), or live (real CLIs without recording). Further Givens remove an existing confined
      path; or queue shell-quoted mkdir -p <link-directory> && ln -s <target> <link> before snapshots,
      confining only the relative link path, preserving the target literally even outside the tree. Links
      belong inside snapshot-excluded node_modules, .git, .next, test-results or playwright-report.
      Checklist narrowing asserts fixture-root checklist-prompts.yaml has exactly one snippet under the
      named checklist stem, equal to the quoted text; the harness then keeps only questions containing that
      snippet during assembly, without the Given editing checklists. Atomic probes require nonblank
      fixture-root prep.sh; engine-io-atomic's script makes tests/mcp/ticket_test.go mode 0600 and
      tmp/staging-target.txt contain sentinel plus newline. Teardown runs after all Then steps.
  - concept: machine environment
    block: given
    service: true-bdd
    references:
    - file: project-tree
    - outgoing_call: go-toolchain
    does: >-
      Change only the next command's environment. The project-tree Given identifies
      tests/true-bdd/fixtures/<name>/: dependencies require its root prep.sh nonblank, browser dependencies
      additionally require that script to contain literal "playwright install". The harness runs it in the
      assembled tree before snapshots to install dependencies; these Givens only verify preparation. Failed
      downloads set GOPROXY=file://<absolute-run-root>/empty-module-proxy (an empty local source),
      GOSUMDB=off, GONOPROXY=none and GOPRIVATE="". Git probes set GIT_DIR=/outside/nonexistent-git and
      GIT_INDEX_FILE=/outside/index, without creating either. Resolve genuine go on the step process's PATH
      before fixture programs are prepended; set TRUE_BDD_REAL_GO to that executable's absolute path for
      fixture Go programs to delegate after checking Git variables, not as an engine option.
  - concept: fixture AI CLIs
    block: given
    service: true-bdd
    references:
    - outgoing_call: claude
    - outgoing_call: codex
    does: >-
      Change the next command's PATH/environment. The project-tree Given selects F=absolute
      tests/true-bdd/fixtures/<name>; R is its assembled run root. The suite reads
      services:record/replay/live from -mode: PATH-first claude/codex proxies record real calls or replay
      fixture cassettes/; ordinary live runs reach real CLIs directly. Controlled writer/concurrent variants
      retain observing proxies even live. Observed Claude prepends F/claude-only before proxies in every
      mode; set TRUE_BDD_IO_FIXTURE=F, CLAUDE_CONFIG_DIR=R/tmp/claude-state,
      CLAUDECODE=fixture-parent-session, CLAUDE_HISTORY_ROLE=inherited-parent-role, CLAUDE_CODE_SAFE_MODE=1,
      CLAUDE_CODE_SIMPLE=1, CLAUDE_RELAUNCH_SESSION_ADD_DIRS=/outside/inherited and
      CLAUDE_CODE_DISABLE_ADVISOR_TOOL=0. Controlled codex inserts F/cli immediately after proxies, sets
      CODEX_HOME=F/auth (dummy auth.json) and TRUE_BDD_AIPROXY_WRITER_FIXTURE=F for the proxy's spawn
      verification. Invalid link/grouping replies both insert F/input/cli after proxies, first in live; the
      selected fixture's claude supplies its particular invalid answer. Accept only concept-link-malformed,
      concept-link-missing-answer, concept-link-incomplete, concept-grouping-missing,
      concept-grouping-repeat, concept-grouping-rank, concept-grouping-cap, concept-grouping-unknown or
      concept-grouping-same; fail otherwise or if claude is absent. Cannot-serve inserts F/cli similarly,
      requiring codex and fixture build-steps-cannot-serve. Concurrent arrival orders PATH as F/front,
      proxies, F/cli, remaining PATH; set TRUE_BDD_CONCURRENT_PROXY to the proxy claude's absolute path.
      Existing front launchers coordinate alpha/beta requests, alpha first in record, beta first in replay;
      the Given installs them without implementing ordering.
  - concept: scripted answers
    block: given
    service: true-bdd
    references:
    - command: us refine
    - command: us apply
    - command: scen check
    - command: build steps
    - command: build code
    does: Queue stdin as the quoted answer plus newline repeated 64 times, or split the quoted text at /, trim each
      piece and send one line per piece, then EOF.
  - concept: write policy
    block: given
    service: true-bdd
    references:
    - file: write-policy
    - command: claude-guard
    does: 'Record the policy for When to prepare tmp/claude-guard-policy.json before snapshots. Write {"replay": P}
      only: P.read_root is absolute tree root or empty when absent, write_roots are root-joined directories in step
      order. A granted command adds test_command, test_selector and root-joined test_dir from the three quoted values.
      Unreadable means literal invalid; missing means no file, still named by --policy.'
  - concept: tool call
    block: given
    service: true-bdd
    references:
    - command: claude-guard
    does: 'Record one payload for When: {tool_name, cwd, tool_input: {command, run_in_background, file_path, path}}.
      Default tool is Bash. Tree-file targets join the absolute tree root; literal targets stay unchanged. A combined
      hook-payload Given overrides separately named tool/target, setting file_path or path as stated. cwd is tree
      root or root-joined shell directory; command/background apply only to Bash, otherwise empty/false.'
  - concept: a role runs a command
    block: when
    service: true-bdd
    references:
    - command: us refine
    - command: us apply
    - command: scen check
    - command: build tests
    - command: build steps
    - command: build code
    - command: init
    - command: version
    does: Run the quoted command once in the prepared tree with queued stdin and {{CWD}} substitution, retaining status,
      stdout, stderr, engine log and file changes. The role changes no execution behaviour. Register the outcome with
      the harness recorder even when execution fails.
  - concept: a command runs under interference
    block: when
    service: true-bdd
    references:
    - command: us refine
    - command: us apply
    - command: scen check
    - command: build tests
    - command: build steps
    - command: build code
    - command: init
    - command: version
    - file: project-tree
    - file: staging-files
    - file: architecture-document
    - outgoing_call: claude
    - outgoing_call: codex
    does: >-
      Run the quoted command with normal queued stdin, {{CWD}} substitution and retained status, streams,
      log and file changes, through a launcher writing the engine PID to run-root tmp/engine.pid.
      Hold/staging barriers follow the initial snapshot. For holds, open the named existing directory
      (init's true-bdd directory comes from the base overlay; only its configuration file was removed), take
      its named nonblocking shared/exclusive flock, then release the launcher. Blocks requires an alive,
      unreturned engine after 300ms, then releases the hold; beyond wait limit holds until engine exit at
      9–12 seconds; permits requires return within three seconds while held. Staging keeps tmp/original.go
      as a hard link to tests/mcp/ticket_test.go and plants tests/mcp/.true-bdd.tmp.ticket_test.go pointing
      to ../../tmp/staging-target.txt before release. Cancellation puts the selected fixture's root cli/
      first on PATH in every mode, waits up to ten seconds for run-root tmp/descendant.pid, then sends
      SIGINT only to the engine PID and waits for return. Kill that engine with SIGKILL and fail if
      observation fails or execution remains unfinished five seconds after observation. Binding change
      instead runs selected fixture input/run-after-check as the executable with build steps --fix arguments
      and TRUE_BDD_GROUPING_ENGINE=<absolute engine executable>. Its existing script runs scen check without
      arguments, stops on nonzero exit, copies run-root ambiguous-architecture.json (from fixture input/)
      over docs/architecture/architecture.yaml, then execs the engine with build steps --fix. Retain the
      normal run outcome.
  - concept: the write guard is asked
    block: when
    service: true-bdd
    references:
    - command: claude-guard
    - file: write-policy
    does: Prepare the recorded policy at tmp/claude-guard-policy.json before snapshots, except for a missing policy.
      Run claude-guard --policy tmp/claude-guard-policy.json with the recorded JSON payload on stdin, keeping status
      and streams. No AI turn.
  - concept: exit code
    block: then
    service: true-bdd
    references:
    - command: us refine
    - command: us apply
    - command: scen check
    - command: build tests
    - command: build steps
    - command: build code
    - command: init
    - command: version
    does: Compare the retained status with the stated integer; no means zero.
  - concept: console output
    block: then
    service: true-bdd
    references:
    - log_record: stdout-text
    - log_record: stderr-error
    does: Apply the rest-of-step Go regex anywhere in the retained named stream, stdout or stderr. Require a match,
      or none for does not match.
  - concept: file changes
    block: then
    service: true-bdd
    references:
    - file: project-tree
    does: Compare pre/post snapshots including tmp, using relative paths and whole-component directory membership.
      Require no changes, changes confined to one/two directories, one named exception, a file created/modified/unchanged,
      or a glob-matched created-file count. Unchanged requires an existing file. Validate globs even for zero created
      files; filepath.Match * and ** do not cross /.
  - concept: file content
    block: then
    service: true-bdd
    references:
    - file: project-tree
    - file: engine-log
    - file: run-artifacts
    - file: staging-files
    does: Read confined regular files after the run. Match the rest-of-step regex in one named file; count lines with
      a final newline closing the last; require at least one glob match and every file matching, or none matching
      for does not match; or require one glob-matched file and count non-overlapping regex matches. Every-file patterns
      expand CWD/ENGINE/GOROOT/GOMODCACHE using the pattern mapping’s escaping. Atomic replacement requires mode 0600,
      different inode from the named old hard link, and differing content.
  - concept: Story content
    block: then
    service: true-bdd
    references:
    - file: stories
    does: Read exactly one confined file matching the quoted glob as a Story. Compare id/feature, count criteria,
      require at least one criterion and each given/when/then block, match or reject a regex in a criterion description,
      or require no criterion step text to match. A named criterion must exist and a step assertion requires steps.
  - concept: Registry content
    block: then
    service: true-bdd
    references:
    - file: registry
    - file: step-definitions
    does: Read the named confined Registry as YAML. Count lineage scenario_id matches; other origin assertions require
      exactly one and compare its Story path, key or YAML-rendered entry. Detect duplicate merged_steps by YAML equality,
      ignoring entries without steps. For definition coverage parse immediate Go files’ literal .Step registrations
      and require each named Scenario’s deterministic step to match exactly one pattern, excluding judge:/llm:.
  - concept: engine activity
    block: then
    service: true-bdd
    references:
    - file: engine-log
    - log_record: spawning-test-runner
    - log_record: dispatching-ai-turn
    - log_record: engine-started
    - log_record: cell-validation-started
    - log_record: cell-validation-finished
    - log_record: check-answered
    - log_record: applying-fix
    - outgoing_call: suite-command
    does: Read tmp/true-bdd.log.json; missing fails. Inspect/count Spawning test runner by binary or regex on space-joined
      args; count Dispatching AI turn, optionally by CLI and role (validation=prompt, fix=fix, apply=apply); or require
      the first and sole Engine started record at INFO with nonempty whitespace-free version/commit. For overlap,
      each Cell validation started follows its subject’s Check answered since the latest Applying fix prompt, never
      names gamma, and follows its previous finish. Require two subjects outstanding simultaneously. Applying fix
      prompt occurs with none outstanding and reads alpha then beta.
  - concept: after-run shell check
    block: then
    service: true-bdd
    references:
    - file: project-tree
    does: Split the quoted shell command at whitespace, run in the named confined tree directory with GOWORK=off and
      CLAUDECODE removed, then compare status; no means zero.
  - concept: write guard's answer
    block: then
    service: true-bdd
    references:
    - command: claude-guard
    does: Compare retained status with 0 for allows or 2 for denies, or match the rest-of-step regex against retained
      stderr reason.
  - concept: AI CLI observations
    block: then
    service: true-bdd
    references:
    - outgoing_call: claude
    - outgoing_call: codex
    - file: project-tree
    does: >-
      Inspect run-root artifacts in every services mode, read from the suite's services: value of -mode
      (record/replay/live). Cancellation reads tmp/descendant.pid and requires no process with that PID
      within three seconds. Writer provisioning requires tmp/aiproxy-state/writer-spawn.txt to equal
      "fixture authentication and edit roots verified\n" and exactly one tmp/codex-homes/*/*-codex-home with
      no auth.json. The suite's observing codex proxy, enabled by the controlled-writer Given even live,
      writes this receipt only after checking the spawn's exact dummy-auth copy, file mode 0600, home mode
      0700, absence of other inherited home files, protected home and deny entry, empty edit root and
      private shell scratch. Reverse-order replay reads tmp/aiproxy-state/consumed-claude, a JSON array of
      consumed recording names in order, requiring first name "claude-002"; record/live pass without reading
      it.
