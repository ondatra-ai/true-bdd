  # How this repository runs its tests, stated once. No suites: a test's
  # service and file are the scenario's own.
  testing:
    libraries:
      - module: gopkg.in/yaml.v3
        version: v3.0.1
      - module: znkr.io/diff
        version: v1.0.1
    framework: go-test
    # Gated behind //go:build bdd with a -mode flag naming a mode per
    # CALLER (`services:` the engine, `tests:` the judge) — not guessable,
    # hence commands:. build code runs replay, which reaches no model.

    # Cold-cache replay downloads github.com/ondatra-ai/true-bdd@v0.0.0-20261026072958-954797a04424
    # and its build graph for build-code-spec-005-matched-scenario-embedded.
    # Warm that graph first for a fully disconnected replay.
    commands:
      record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/true-bdd/ -mode=services:record,tests:record"
      replay: "go test -tags bdd -json -count=1 -timeout=40m ./tests/true-bdd/ -mode=services:replay,tests:replay"
      live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/true-bdd/ -mode=services:live,tests:live"

  services:
    - name: true-bdd
      type: "cli"
      path: services/true-bdd
      language: go
      # Everything its step definitions set up or observe (ADR-0030); the
      # document is part of the Specification and every drill cut keeps it.
      public_interface:
        kind: cli
        document: docs/architecture/true-bdd-cli.yaml
      libraries:
        - module: github.com/woodsbury/decimal128
          version: v1.3.0
        - module: github.com/perimeterx/marshmallow
          version: v1.1.5
        - module: github.com/oasdiff/yaml3
          version: v0.0.0-20250309153720-d2182401db90
        - module: github.com/oasdiff/yaml
          version: v0.0.0-20250309154309-f31be36b4037
        - module: github.com/mohae/deepcopy
          version: v0.0.0-20170929034955-c48cc78d4826
        - module: github.com/mailru/easyjson
          version: v0.7.7
        - module: github.com/josharian/intern
          version: v1.0.0
        - module: github.com/go-openapi/swag
          version: v0.23.0
        - module: github.com/go-openapi/jsonpointer
          version: v0.21.0
        - module: github.com/getkin/kin-openapi
          version: v0.133.0
        - module: github.com/Masterminds/goutils
          version: v1.1.1
        - module: github.com/Masterminds/semver/v3
          version: v3.2.0
        - module: github.com/Masterminds/sprig/v3
          version: v3.2.3
        - module: github.com/fsnotify/fsnotify
          version: v1.8.0
        - module: github.com/go-viper/mapstructure/v2
          version: v2.4.0
        - module: github.com/google/uuid
          version: v1.6.0
        - module: github.com/huandu/xstrings
          version: v1.3.3
        - module: github.com/imdario/mergo
          version: v0.3.11
        - module: github.com/mitchellh/copystructure
          version: v1.0.0
        - module: github.com/mitchellh/reflectwalk
          version: v1.0.0
        - module: github.com/pelletier/go-toml/v2
          version: v2.2.3
        - module: github.com/sagikazarmark/locafero
          version: v0.7.0
        - module: github.com/shopspring/decimal
          version: v1.2.0
        - module: github.com/sourcegraph/conc
          version: v0.3.0
        - module: github.com/spf13/afero
          version: v1.12.0
        - module: github.com/spf13/cast
          version: v1.7.1
        - module: github.com/spf13/cobra
          version: v1.9.1
        - module: github.com/spf13/pflag
          version: v1.0.6
        - module: github.com/spf13/viper
          version: v1.20.1
        - module: github.com/subosito/gotenv
          version: v1.6.0
        - module: golang.org/x/crypto
          version: v0.52.0
        - module: golang.org/x/sys
          version: v0.46.0
        - module: golang.org/x/text
          version: v0.37.0
        - module: gopkg.in/yaml.v3
          version: v3.0.1
        # Exact dependency-test pins make offline go mod tidy reproducible.
        - module: github.com/google/go-cmp
          version: v0.7.0
        - module: github.com/kr/pretty
          version: v0.3.1
        - module: github.com/kr/text
          version: v0.2.0
        - module: github.com/rogpeppe/go-internal
          version: v1.12.0
        - module: gopkg.in/check.v1
          version: v1.0.0-20201130134442-10cb98267c6c
        - module: go.uber.org/atomic
          version: v1.9.0
        - module: go.uber.org/multierr
          version: v1.9.0
        - module: github.com/inconshreveable/mousetrap
          version: v1.1.0
      frameworks:
        - cobra
      patterns:
        owned_io:
          description: The engine owns all repository code it uses, including its IO layer; a cut-A rebuild deletes and regenerates the whole services/true-bdd folder.
          rules:
            - >-
              No engine Go package, including its tests or files hidden by build constraints,
              imports this repository outside services/true-bdd. The engine uses only the
              exact third-party module versions in this service's libraries above; that list
              includes the complete imported graph, verified with go list -deps. Tests and
              tooling retain independent pkg implementations and are never engine libraries.
              The engine-imports gate scans source imports without needing to compile;
              the drill audit records passed or failed with offending source/import diagnostics
              in engine_imports, and reports missing source as a failure, never a pass.
            - >-
              Under internal/infrastructure, console owns the three standard descriptors
              and plain answers, prompts, headers, separators and stdin. logging alone
              constructs slog handlers: text INFO and above on stdout, DEBUG and above
              as newline-delimited JSON in paths.tmp_dir/true-bdd.log.json. The JSON file
              is created even with zero records, appended per record, and engine records
              have no tooling tool/run attributes. enginelog owns the message/key vocabulary
              stated under terms.log record and the AI-turn invocation contract below.
              Scenarios keep that contract compatible with the independent test reporter.
            - >-
              disk owns explicit filesystem byte access, wrapping errors without losing their identity.
              Configuration loading retains the declared Viper library's own file reader;
              the hold Scenarios exercise Registry reading through disk.
              A read takes a shared advisory flock on the target's parent; a mutation takes
              an exclusive one, so atomic rename cannot bypass it by changing the target inode.
              Conflicting holds poll every 5ms for up to 10s, then fail with directory lock
              not released and the parent path. Handles and holds close before returning.
              Whole-file writes clear stale .true-bdd.tmp.<basename> staging files without
              following symlinks, create exclusively, write/close and atomically rename;
              they do not fsync. Existing file permissions survive replacement; new shared
              files/directories use 0644/0755 and private ones 0600/0700. Append writes one
              newline-terminated log record under one hold. Update reads/changes/writes
              under the same exclusive hold. Copies use the same read/write operations.
              Directory creation, rooted creation and unique temporary-directory creation
              take no hold; they need no existing target. Removal holds the target's parent.
              No handle escapes these operations; rooted writer directory creation refuses
              symlink escapes. Private module-download temporary
              directories and credential files are removed on their stated cleanup paths.
            - >-
              shell alone imports os/exec. Only cli/cli.go and explicitly named cli wrappers
              claude, codex, git, gotool, spec and truebdd may import shell. cli aliases its
              result/options vocabulary; wrappers export typed operations, never an arbitrary
              spawn entry point except spec for architecture-declared argv. A completed
              nonzero exit is a result code, distinct from a failure to start. Captures
              preserve exact bytes, streams stay separate unless combined explicitly, and
              writers receive stdout/stderr without scanner line limits. Claude and codex
              turns run in process groups; caller cancellation kills descendants and remains
              fatal. Individual command handlers bind interrupt/termination to that context.
              The engine adds no AI-turn deadline. Each spawn/exit JSON record names binary,
              args and dir; exits include exit_code, signal, elapsed_ms, stdout_bytes and
              stderr_bytes. Declared suite commands keep their argv and working directory.
            - >-
              gotool reads Go runtime/module roots, and downloads the complete graph of an
              isolated exact manifest with go mod download -json all, GOWORK=off,
              GOTOOLCHAIN=local and no inherited GOFLAGS. Its Git environment policy strips
              the repository-local variables git rev-parse --local-env-vars names from
              inherited or explicit environments; it performs no repository mutation.
              Download errors name the library and stop before a writer. Claude streaming
              parses newline-delimited events across arbitrary writes, emits assistant/tool/
              result events, prefers structured_output, preserves usage/cost, and distinguishes
              started nonzero, error-result and missing-result failures from start failures.
              Its child strips CLAUDECODE and prior history role, sets CLAUDE_HISTORY_ROLE
              and disables the advisor; writer-specific isolation is stated in invocation.
              Refused Claude and codex calls use the log-record target contract below.
        project_resources:
          description: Configuration, checklists and prompt templates are host files initialized once and checked before work (ADR-0029).
          rules:
            - >-
              The init command uses no bootstrap configuration. It carries copies under
              services/true-bdd/internal/infrastructure/initialization/files/, embedded by
              the initialization package so go:embed stays within its directory and Go
              stays within services/. Only init reads these copies; runtime loaders
              read project files exclusively and never fall back to embedded content.
              The existing embedded Go scenario-test generation template is separate.
            - >-
              Init writes missing true-bdd/true-bdd.yaml, all true-bdd/checklists/ files
              and all templates/ prompt templates in the current folder. The host
              configuration has no scripts; this repository keeps scripts in its own
              true-bdd/true-bdd.yaml. Existing files, including empty, invalid and symbolic
              link entries, are left untouched. Each path is reported through an INFO log record with msg Created or
              Left existing and a path attribute. Init binds stdout text logging and
              tmp/true-bdd.log.json without loading configuration. Creation rechecks existence under the disk channel's
              exclusive directory Hold. Init writes no Specification or schema and
              performs no framework detection. Version and init need none of these files.
            - >-
              Every checklist-driven command loads its configuration and selected
              checklist and parses its selected system and user validation templates
              before loading Items, starting test discovery or dispatching an AI turn.
              Under --fix it also parses its system and user fix-generator and
              fix-applier templates. Selection uses the configured paths of that
              command's generator triple, so another command's templates are not required.
              Parsing uses the same Go text/template functions as rendering, including
              Sprig and toYaml. Missing files name the path and true-bdd init; invalid
              files retain the parse error and path and ask to fix the file without
              init advice. All refuse before command work.
            - >-
              The Init defaults drift gate runs TestInitDefaultsMatchProjectFiles in
              scripts/gates. It compares the complete relative path sets and bytes
              of the embedded checklist and template trees against true-bdd/checklists/
              and templates/, detecting missing and extra copies too. YAML-decoded host
              configuration must equal true-bdd/true-bdd.yaml after removing only scripts;
              a scripts key in the host copy fails. Comments and formatting are not
              configuration values. Resource and copy changes select this gate in CI
              and the local changed-file pipeline. An installed-binary test initializes
              an outside folder twice and drives its own Specification and failing Go
              tests to the first planning turn with fake claude/codex executables.
      # What this service talks to at runtime: `protocol` is the connection
      # mechanism (cli, http, ws, sql, redis, …); `scope` places it:
      #	internal    — another service declared in this file
      #	self_hosted — we run the instance (redis, postgres, kafka); builds
      #	              use the real thing
      #	third_party — a vendor's service, wherever the binary lives (a vendor CLI is
      #	              local, GLM's API is not); builds mock these (record/replay)
      dependencies:
        # Replay hashes every AI turn's argv and stdin, so each CLI states its
        # invocation exactly (docs/qna Q2, Q19): a rebuilt engine must send
        # the same requests.
        - name: codex
          protocol: cli
          scope: third_party
          # binary and args match every codex cassette's `binary` and `argv`.
          invocation:
            binary: codex
            args:
              - exec
              - when: The turn is a plan or validation turn.
                args: [-s, "{sandbox}"]
              - --ephemeral
              - --skip-git-repo-check
              - --color
              - never
              - when: The turn is an apply turn of any command.
                args: [--strict-config, --ignore-rules, --json]
              - -C
              - "{work_dir}"
              - -m
              - "{model}"
              - when: >-
                  The turn carries a result schema, as every codex validation
                  and fix turn does; an apply turn carries none.
                args: [--output-schema, "{schema_path}"]
              - -o
              - "{answer_path}"
              - "-"
            stdin: &folded-prompt
              with_system: "### SYSTEM INSTRUCTIONS (authoritative — follow exactly)\n\n{system_prompt}\n\n### TASK\n\n{user_prompt}"
              without_system: "{user_prompt}"
            values:
              sandbox: >-
                `read-only` for every plan and validation turn, independently of scratch tool permissions.
                Every apply turn instead selects its generated named writer permission profile, with no -s flag.
              model: >-
                The model half of the `<cli>:<model>` reference the turn's tier
                resolves to under `engine.models`, split on the first colon:
                `gpt-6.1-sol` in every codex cassette.
              work_dir: &work-dir >-
                The directory true-bdd was started in, as an absolute path: the
                host project root. Cassettes record it as `{{CWD}}`.
              system_prompt: &system-prompt The turn's system prompt, rendered from templates/.
              user_prompt: &user-prompt The turn's user prompt, rendered from templates/.
              run_dir: &run-dir >-
                The run's artifact directory, `<paths.tmp_dir>/<YYYY-MM-DD-HH-MM-SS>-<pid>`,
                created at startup. The join is cleaned and stays relative to
                `{work_dir}`, so `paths.tmp_dir: ./tmp` gives `tmp/<...>`.
                Cassettes record the `<YYYY-MM-DD-HH-MM-SS>-<pid>` part as
                `{{RUN_DIR}}`.
              label: >-
                `codex-turn<NNN>`: NNN is this turn's number, from 1 and
                zero-padded to three digits, among every AI turn the run
                dispatched, whichever CLI ran it.
              schema_path: >-
                `{run_dir}/{label}-codex-schema.json`, written before the spawn
                with the JSON Schema the answer must satisfy, every object's
                `required` listing all of its properties: codex refuses a
                schema that leaves one out, which claude accepts.
              answer_path: >-
                `{run_dir}/{label}-codex-answer.txt`, where codex writes its final
                message; the engine reads the answer there, never from stdout.
            dir: "{work_dir}"
            notes:
              - >-
                Plan and validation turns select -s read-only explicitly. Every apply turn selects default_permissions=writer and approval_policy=never in its generated configuration.
              - The trailing `-` makes codex read the prompt from stdin.
              - >-
                `--skip-git-repo-check`: a BDD fixture's run directory is no git
                repository, and codex refuses to run outside one without it.
              - >-
                Ordinary turns inherit the environment and merge stdout/stderr as before.
                Every apply turn sets CODEX_HOME to {host}/tmp/codex-homes/{run_basename}/{label}-codex-home,
                copying only auth.json with private permissions, never user config,
                sessions, AGENTS.md, history or MCP definitions. The provider removes auth.json
                after preparation or turn completion, on success and failure, reporting cleanup errors. --ephemeral remains.
                Its generated config disables web search, apps, plugins, multi-agent,
                memories, login shells, shell snapshots and host skill discovery;
                project_doc_max_bytes=0 suppresses AGENTS.md and --ignore-rules
                suppresses execpolicy files. No outer sandbox-exec wraps codex.
              - >-
                The apply profile grants host-root reads, that execution mode's exact file or directory roots, and host tmp writes. :minimal supplies OS runtime exceptions listed
                in ADR-0021; go env resolves GOROOT as read-only and GOMODCACHE as denied by default.
                Only the downloaded libraries and their version metadata receive narrower read entries.
                GOMODCACHE/cache/vcs, the shared host tmp/codex-homes subtree, /private/tmp and /private/var/tmp are denied.
                The narrower host and tmp grants still work when nested under a denied root.
                Every other filesystem path is restricted by default, including
                sibling cuts, user work, codex sessions and claude transcripts.
                Before spawning, the engine creates missing directory roots and literal parents of file roots inside the host,
                using rooted filesystem operations that cannot follow a symlink outside it, and logs each created root once at INFO.
                Edit roots resolving outside the host are refused. The profile grants remain limited to the edit roots and host tmp;
                creating their parents does not grant the writer any other host-root writes. Existing files stay files; missing files are not made into directories. Configured globs authorize creating and changing matching files even without existing matches. Terminal /** grants its literal subtree; other wildcards grant their narrowest literal directory and enforce the original patterns after every turn, including failed turns. Newly created non-matching files are removed; a changed, deleted, renamed or permission-changed pre-existing non-matching file fails the turn with one WARN naming it. Overlapping grants authorize their union. Such violations are fatal even for build code, with changed pre-existing contents retained for diagnosis. Non-matching files can be changed during the turn; this boundary is enforced afterward. Generated homes are excluded from comparison. Malformed patterns, host-root grants and escapes refuse (ADR-0024).
              - >-
                Writer subprocesses inherit no environment: the profile sets PATH to
                GOROOT/bin, system bin directories and a generated runtime-bin with installed node, npm, npx and docker links; HOME, TMPDIR and GOCACHE inside
                host tmp, GOROOT/GOMODCACHE, GOPROXY=off, GOSUMDB=off,
                GOTOOLCHAIN=local, GOFLAGS='-trimpath -buildvcs=false', GOTELEMETRY=off
                and CGO_ENABLED=0. Optional node/npm/npx/docker executables, npm's validated package, Mach-O dependency libraries and their installation links are listed as read grants. Homebrew opt link directories supply symlink metadata, while unrelated canonical installation targets remain denied. npm/npx JavaScript package grants require bin/npm-cli.js or bin/npx-cli.js beneath a package.json naming npm, outside the host and authentication roots and the user's sensitive .codex, .claude, work, .ssh, .aws and .config roots and their ancestors. An unsafe or unverifiable runtime is refused with a WARN and no link or grant. npm uses offline mode and scratch cache/config; Docker uses scratch config without a daemon/socket grant; OPENSSL_CONF=/dev/null suppresses outside configuration. Network is disabled for commands and their children.
                Codex's own model connection remains available. This is calibrated
                for codex-cli 0.162.1 on macOS; no weaker fallback is supplied.
              - >-
                The writer config selects high reasoning and model_context_window=1050000.
                A configured window is not a demonstrated prompt size: 1M remains
                unverified. Model selection still comes from the resolved tier.
              - >-
                The writer saves stdout JSONL as {run_dir}/{label}-codex-events.jsonl
                and stdout plus stderr as {run_dir}/{label}-codex.log. The final message
                still comes only through -o. Drill audit reads command_execution and
                file_change items, preserving raw evidence and marking decisions unknown;
                commands do not prove successful reads. Invalid evidence is reported.
                Recording excludes generated homes and shell/build scratch state.
              - >-
                A started codex writer exiting non-zero (including usage limits),
                missing its answer file or returning whitespace carries CodexTurnError.
                Build code keeps its edits, counts the attempt, warns once and runs
                PostNotApplied. Start failures and refusals before spawning stay fatal.
                No role or CLI receives a router deadline (ADR-0025); every turn runs until it ends or the caller cancels.
                Cancellation stops the turn's process group and descendants and remains fatal. There is no codex stall watch; codex's own request timeouts apply. Plan and validation turns retain their inherited environment and read-only sandbox. Other commands' confined applies retain fatal failure handling; build code alone requests recovery and replay forms. Process group and wait bound
                remain as for the other writers.
              - >-
                Before the spawn the engine logs the turn's sandbox level as
                msg="Codex turn sandboxed" with the turn's `label` and `sandbox`.

              - |
                Generated config.toml wire form (codex-cli 0.162.1, ADR-0026). The following template fixes every key and table, in emission order. Braced names are path substitutions, not literal TOML. Paths and values are TOML quoted strings; {runtime_read_entries} and {write_entries} expand to complete quoted-path assignments. Blank lines and the explanatory :minimal comments have no semantic effect. There is no [permissions.writer] network boolean, file_system table, type field or entries array. The filesystem table itself is the restricted path-to-access map: no :root grant or inherited workspace profile is emitted.

                default_permissions = "writer"
                approval_policy = "never"
                model_reasoning_effort = "high"
                model_context_window = 1050000
                web_search = "disabled"
                project_doc_max_bytes = 0
                allow_login_shell = false
                cli_auth_credentials_store = "file"
                [history]
                persistence = "none"
                [features]
                apps = false
                plugins = false
                multi_agent = false
                memories = false
                shell_snapshot = false
                skip_host_skill_discovery = true

                [permissions.writer.filesystem]
                ":minimal" = "read"
                "{host}" = "read"
                "{GOROOT}" = "read"
                "{GOMODCACHE}" = "deny"
                {library_read_entries}
                {runtime_read_entries}
                {write_entries}
                "{host}/tmp/library-download" = "deny"
                "{host}/tmp/codex-homes" = "deny"
                "/private/tmp" = "deny"
                "/private/var/tmp" = "deny"
                "{GOMODCACHE}/cache/vcs" = "deny"

                [permissions.writer.network]
                enabled = false
                [shell_environment_policy]
                inherit = "none"
                [shell_environment_policy.set]
                CGO_ENABLED = "0"
                DOCKER_CONFIG = "{host}/tmp/codex-shell-home/.docker"
                GOCACHE = "{host}/tmp/codex-go-build"
                GOFLAGS = "-trimpath -buildvcs=false"
                GOMODCACHE = "{GOMODCACHE}"
                GOPROXY = "off"
                GOROOT = "{GOROOT}"
                GOSUMDB = "off"
                GOTELEMETRY = "off"
                GOTOOLCHAIN = "local"
                HOME = "{host}/tmp/codex-shell-home"
                OPENSSL_CONF = "/dev/null"
                PATH = "{GOROOT}/bin:/usr/bin:/bin:/usr/sbin:/sbin:{host}/tmp/codex-shell-home/runtime-bin"
                TMPDIR = "{host}/tmp/codex-tmp"
                npm_config_cache = "{host}/tmp/codex-shell-home/npm-cache"
                npm_config_offline = "true"
                npm_config_userconfig = "{host}/tmp/codex-shell-home/.npmrc"

                {host} is the symlink-resolved Host project root; go env -json GOROOT GOMODCACHE supplies the two Go roots. The library_read_entries are sorted, deduplicated quoted read paths: each resolved module source directory and its exact .info, .mod, .zip and .ziphash files, with no organization-specific rule. Scratch paths resolve within the host before emission. Shell set keys are sorted lexically. The runtime PATH suffix and Docker/npm/OpenSSL environment entries are always emitted, even when no optional executable is installed. Runtime discovery visits installed docker, node, npm, npx in lexical name order. For each it emits the executable, recursively enumerated non-system Mach-O libraries (installation alias then canonical path), validated npm package when applicable, then installation symlink ancestors, necessary Homebrew opt metadata directories and dylib parent directories, preserving discovery order and deduplicating paths by first occurrence. Each is a quoted path = "read" assignment; no installed runtime means no such entries. The acceptance and refusal rules above govern these paths.

                {write_entries} emits each accepted execution-mode write root as a quoted resolved path = "write" assignment, in Write/Edit/MultiEdit pattern order, then any additional SourceWriteRoots, then host tmp. Overlapping roots are deduplicated by first occurrence. Literal files stay exact; terminal /** strips the suffix; other globs grant their narrowest literal directory and retain the post-turn enforcement described above. For writer-config-001-codex this is exactly "{host}/tmp" = "write", then "{host}/services/calc" = "write" (scratch already occurs in the mode patterns). The six deny entries follow all write grants in the stated order. The network value must be enabled = false within [permissions.writer.network]; network = false directly under [permissions.writer] is refused by the real CLI.

                writer-config-001-codex matches the entire generated file through the existing scratch-file comparison step. Its anchored pattern substitutes {{CWD}}, {{GOROOT}} and {{GOMODCACHE}} with resolved host and go env paths, TOML-string-escaped then regex-escaped, tolerates the :minimal comments and the optional runtime read entries, and pins every other byte, including the ordered write/deny entries and complete shell environment. No authentication or other generated-home file is read by the assertion.

              - >-
                Live-only writer provisioning is held by writer-lifecycle-001-success and
                writer-lifecycle-002-failure (ADR-0026). Their fixtures supply only dummy
                auth.json and deterministic external CLI stand-ins, not model credentials.
                At the codex spawn boundary, before either recording or replaying file effects,
                the harness shim resolves CODEX_HOME beneath host tmp/codex-homes, requires
                a private 0700 home containing only regular, non-symlink 0600 files:
                config.toml and auth.json, the latter byte-identical to the declared dummy fixture;
                an already-created empty services/calc edit root; private HOME/TMPDIR/GOCACHE scratch directories;
                and the shared generated-home deny entry. It writes a non-secret receipt
                outside cassette file effects. The Then step requires that receipt, exactly
                one generated home, and no auth.json after the turn. The failure fixture's
                CLI exits 7 after editing; its Scenario requires the non-zero-exit warning.
                Both Scenarios compare stdout-only JSONL events exactly and require both
                the stdout event sentinel and separate stderr sentinel in the combined transcript.
                The stand-in never creates the edit root, and replay validates before applying its recorded edit.
                The existing writer-config-001-codex pins every shell environment setting,
                inherited-environment suppression, ordered permissions and generated config
                content. A configured shell policy is the engine's contract; enforcement
                by native codex remains the installation-dependent live calibration in
                ADR-0021/0024, not something a replaying stand-in can demonstrate.
                The shim activates this inspection only for the explicit fixture-controlled
                Given; ordinary turns never have authentication opened by the harness.
                Record uses the fixture's cli/ executables behind the shim. In services:live
                these two fixtures use an observing pass-through shim and the same stand-ins,
                without cassettes; normal live turns remain unmediated. Existing request
                hashes are unchanged. Generated homes and runtime scratch stay excluded
                before snapshot traversal; authentication bytes never enter a cassette or log.

        - name: claude
          protocol: cli
          scope: third_party
          # binary and args match every engine claude cassette's `binary` and
          # `argv`: the turn's prompts, model, tools and answer schema all ride
          # in argv, which replay hashes.
          invocation:
            binary: claude
            args:
              - --setting-sources
              - ""
              - --strict-mcp-config
              - when: Every Claude turn except the build-code writer.
                args: [--safe-mode, --allowedTools, "{allowed_tools}", --disallowed-tools, "{disallowed_tools}"]
              - when: Only the explicitly requested build-code writer.
                args: [--restricted, --disable-slash-commands, --tools, "Read,Glob,Grep,Edit,Write,MultiEdit,Bash", --settings, "{writer_settings}", --session-id, "{session_id}"]
              - when: Each extra read root of the build-code writer, in order.
                args: [--add-dir, "{read_root}"]
              - --model
              - "{model}"
              - when: >-
                  The turn's system prompt is not empty, as every engine
                  turn's is.
                args: [--system-prompt, "{system_prompt}"]
              - --permission-mode
              - "{permission_mode}"
              - --output-format
              - stream-json
              - --verbose
              - when: >-
                  The turn carries a result schema: every validation turn and
                  every fix turn does; an apply turn carries none.
                args: [--json-schema, "{schema}"]
              - -p
              - "{user_prompt}"
            # Empty setting sources exclude user/project/local settings; strict MCP admits no servers.
            # Safe mode excludes discovered CLAUDE.md memory, skills, plugins and hooks.
            # Auth and built-in tools remain; --bare would require API-key auth.
            values:
              permission_mode: default for the build-code Claude writer; acceptEdits otherwise.
              run_dir: *run-dir
              label: >-
                `claude-turn<NNN>`: NNN is this turn's number, from 1 and
                zero-padded to three digits, among every AI turn the run
                dispatched, whichever CLI ran it. The counter is shared with
                codex, not restarted per CLI or role. Thus the Claude writer
                after one plan turn is `claude-turn002`.
              writer_settings: >-
                {run_dir}/{label}-claude-config/settings.json. Explicit PreToolUse
                hook runs this engine's claude-guard --policy pointing to sibling
                policy.json, with replay (the canonical command/write-root
                policy), read_roots, excluded_roots and protected_roots (the
                generated configuration directory). Permissions allow Read/Glob/Grep, deny Agent/Task,
                WebFetch/WebSearch/NotebookEdit, and never grant Bash patterns.
                Bash and writes require the hook's explicit allow. Both Bash
                timeouts are 600000 ms in settings and environment.
              session_id: A fresh UUID for this writer only.
              read_root: >-
                go env GOROOT, GOMODCACHE, then this session's tool-results
                directory under CLAUDE_CONFIG_DIR/projects (default ~/.claude).
                The host cwd is always a working root. The hook narrows module-cache file tools to the architecture library graph, even for a cache inside the host; add-dir on the cache is only the CLI outer boundary. The policy carries library_cache and read_roots containing GOROOT, the sorted graph roots and the spill directory; excluded_roots is empty.
              allowed_tools: >-
                The turn's allowed tools joined by commas. A validation or fix
                turn: `Read(**),Write({tmp_glob}),Glob(**),Grep(**)`. An apply
                turn: `Read(**),Write({tmp_glob}),Edit({tmp_glob}),MultiEdit({tmp_glob}),Glob(**),Grep(**)`,
                followed, for each write root the command grants its applier
                in order, by `Write(<glob>),Edit(<glob>),MultiEdit(<glob>)`.
                `build code` replaces its scratch glob with host `./tmp/**` and grants the remaining failing set's services' `path:` and exact `writable:` paths. Existing folders and explicitly declared absent folders receive recursive subtrees; exact files, including absent files, stay literal. Other commands retain their existing scratch/document grants.
              disallowed_tools: >-
                A validation or fix turn: `Bash,Edit(**),MultiEdit(**),Agent,Task`.
                An apply turn: `Bash,Agent,Task`.
              tmp_glob: >-
                `paths.tmp_glob` from true-bdd.yaml: `./tmp/**` in every
                cassette.
              model: >-
                The model half of the `<cli>:<model>` reference the turn's tier
                resolves to under `engine.models`, split on the first colon:
                `claude-opus-5` in almost every cassette.
              system_prompt: *system-prompt
              user_prompt: *user-prompt
              work_dir: *work-dir
              schema: >-
                `{validation_schema}` for a validation turn, `{fix_schema}` for
                a fix turn, each byte for byte.
              validation_schema: |-
                {
                  "type": "object",
                  "properties": {
                    "answer": {"type": "string", "enum": ["pass", "fail"]},
                    "context": {"type": "array", "items": {"type": "string"}},
                    "fix_prompt": {"type": "string"}
                  },
                  "required": ["answer", "context"],
                  "additionalProperties": false
                }
              fix_schema: |-
                {
                  "type": "object",
                  "properties": {
                    "fix_prompt": {"type": "string"},
                    "questions": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {"type": "string"},
                          "question": {"type": "string"},
                          "context": {"type": "string"},
                          "options": {"type": "array", "items": {"type": "string"}}
                        },
                        "required": ["id", "question", "context", "options"],
                        "additionalProperties": false
                      }
                    }
                  },
                  "required": ["fix_prompt", "questions"],
                  "additionalProperties": false
                }
            dir: "{work_dir}"
            env:
              CLAUDE_HISTORY_ROLE: Empty; the engine labels no turn.
              CLAUDE_CODE_DISABLE_ADVISOR_TOOL: "1"
            notes:
              - |
                Generated settings.json wire form (Claude Code 2.1.285, ADR-0026). It is UTF-8 JSON with the exact layout below: two-space indentation, one array element per line, nonempty objects expanded across lines, and a final newline. JSON object keys are emitted in sorted lexical order at every depth; empty objects stay {}. {guard_command} below is a JSON string value, escaped as JSON, not a nested object.

                {
                  "autoMemoryEnabled": false,
                  "claudeMdExcludes": [
                    "**"
                  ],
                  "enabledPlugins": {},
                  "env": {
                    "BASH_DEFAULT_TIMEOUT_MS": "600000",
                    "BASH_MAX_TIMEOUT_MS": "600000"
                  },
                  "hooks": {
                    "PreToolUse": [
                      {
                        "hooks": [
                          {
                            "command": "{guard_command}",
                            "timeout": 15,
                            "type": "command"
                          }
                        ],
                        "matcher": "*"
                      }
                    ]
                  },
                  "permissions": {
                    "allow": [
                      "Read",
                      "Glob",
                      "Grep"
                    ],
                    "defaultMode": "default",
                    "deny": [
                      "Agent",
                      "Task",
                      "WebFetch",
                      "WebSearch",
                      "NotebookEdit"
                    ]
                  }
                }

                The guard command is the shell-single-quoted current engine executable, then the literal ` claude-guard --policy `, then the shell-single-quoted sibling policy.json path ({run_dir}/{label}-claude-config/policy.json). A single quote inside an argument is replaced by the shell sequence '"'"' before surrounding the whole argument with single quotes. JSON escaping is applied afterward (including encoding <, > and & as Unicode escapes). Bash has no allow pattern. The hook array has exactly one command hook with numeric timeout 15 and matcher "*". These settings accompany the separately generated guard policy described under writer_settings; that policy remains the authority for allowed file roots and replay forms.

                writer-config-002-claude matches the entire generated settings file through the existing scratch-file comparison step, substituting {{ENGINE}} with the engine executable (invoked or symlink-resolved path), escaping internal single quotes for the shell, then JSON-string-escaping and regex-escaping, and eliding only the run-directory basename in the hook command. It pins the hook arguments, arrays, deny rules, environment, empty plugin map and memory/document exclusions in record and replay alike.
              - >-
                Only the build-code writer adds or strips these environment entries:
                BASH_DEFAULT_TIMEOUT_MS/BASH_MAX_TIMEOUT_MS=600000;
                CLAUDE_CODE_DISABLE_CLAUDE_MDS, DISABLE_AUTO_MEMORY,
                DISABLE_BUNDLED_SKILLS, DISABLE_WORKFLOWS,
                DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL, DISABLE_PLUGIN_FORWARDING,
                DISABLE_BACKGROUND_TASKS each use the CLAUDE_CODE_ prefix and value 1.
                CLAUDE_CODE_SAFE_MODE, CLAUDE_CODE_SIMPLE and inherited
                CLAUDE_RELAUNCH_SESSION_ADD_DIRS are stripped.
              - >-
                No stdin: the prompts travel in argv. `CLAUDECODE` is removed
                from the inherited environment, so the turn does not look
                launched from a Claude session.
              - >-
                `--setting-sources ""` excludes user, project and local settings; `--strict-mcp-config` loads no MCP
                server, since the command line names none. The advisor is a
                server-side tool `--disallowed-tools` cannot reach, so only
                the environment entry turns it off.
              - >-
                `-p` comes last: a flag before it would otherwise read the
                prompt as its own value.
              - >-
                The answer is the stream's `result` record: its
                `structured_output` object when the turn carried a schema,
                else its text. A schema turn whose result holds no object, or
                a non-zero exit, fails the turn. Every role and CLI runs with the caller's context
                and its own process group without a router deadline (ADR-0025); cancellation
                stops the turn and its descendants and remains fatal. No request, prompt,
                checklist or template adds a time, turn, token or cost budget.
                For the explicit build-code writer, non-zero exits, is_error or
                api_error_status >=400 results, assistant error records, absent
                envelopes and empty answers are started outcomes; available cost
                and usage survive errors. Start failures and pre-spawn refusals
                stay fatal. Other roles retain fatal provider-error handling.

  # How each product word the catalogue declares is built and observed, in
  # words naming no code identifier, so the steps can be rebuilt from it.
  # It maps every word the catalogue declares, one entry per word.
  terms:
    - term: Phrase mapping
      technical: >-
        architecture.phrases is an optional list of template and service pairs. Operation
        entries carry references and does; intent replaces both, currently accepted only
        for UI services. Each reference has exactly one selector: command is an exact CLI
        commands key, file/log_record/outgoing_call is a key under the corresponding
        files/log_records/outgoing_calls extension, operation_id is an OpenAPI operationId,
        or element is a declared UI page/region, role and accessible name. The same Public
        interface loader retains the declarations used for membership checks. The built-in
        phrase-mappings check reads the Catalogue and architecture afresh, checks matched
        phrases of claimed Scenarios by service, and reports missing, duplicate, incomplete
        or undeclared mappings without AI. No Catalogue or Story claim passes unchecked;
        model-run steps and steps not matched in their block are left to their own checks.
      observed_by: >-
        Run scen check and compare named phrase and reference findings, exit code and
        zero AI turns. Under --fix the System Architect answers what the step does; the
        proposal reaches the menu before apply, and only the architecture changes. Exit
        leaves documents unchanged. The Word mapping still maps terms and stores no
        link from a phrase to a step definition.
    - term: Public interface
      technical: >-
        Each architecture.services entry optionally carries public_interface with kind,
        document for cli or http, or inline elements for ui. The loader reads named
        YAML/JSON documents relative to the Host project root at startup. CLI uses
        opencli, info, commands with parameters and responses, and named extensions;
        HTTP uses kin-openapi v0.133.0
        with local references loaded through the file channel under the Host project root;
        UI uses page or region, role and name. The public-interface built-in check
        reports absent, invalid, library or unsupported declarations for every Scenario.
      observed_by: >-
        Run scen check against host declarations, compare its named service findings,
        exit code and zero AI turns, and verify missing or invalid documents refuse
        before any Scenario, runner or AI turn. A fix edits only the architecture.
    - term: build identity
      technical: >-
        A pure resolver accepts version and commit stamps and optional runtime/debug.BuildInfo.
        Each nonempty stamp wins independently; otherwise Main.Version supplies version
        and the vcs.revision setting supplies commit. Empty or absent metadata falls
        back to (devel) and unknown. Go 1.24+ can supply a VCS pseudo-version as Main.Version;
        no pseudo-version is synthesized and vcs.modified does not alter either field.
        Current build metadata is read through runtime/debug.ReadBuildInfo.
        Linker symbols are github.com/ondatra-ai/true-bdd/services/true-bdd/internal/infrastructure/buildinfo.version
        and github.com/ondatra-ai/true-bdd/services/true-bdd/internal/infrastructure/buildinfo.commit,
        set using -ldflags '-X <symbol>=<value>'. The version command prints one answer
        line, true-bdd version <version> commit <commit>, terminated by a newline,
        without loading configuration, installing logging or creating any file or directory. Every engine log
        installation emits INFO msg="Engine started" with version and commit before
        any other record. Configuration-based commands install logging after loading
        configuration, init installs it directly; version, help, argument refusals,
        configuration-read failures and the hidden guard do not install logging.
      observed_by: >-
        engine-entry-005-version-reports-build checks the whole stdout answer and no file
        changes, including tmp. build-tests-files-002-stale-test-regenerated reads the
        engine log, requiring its first record to be the only INFO Engine started record
        with nonempty, whitespace-free version and commit fields. Pure resolver unit checks cover stamped,
        module, VCS, archive and mixed-precedence inputs. engine-entry-001 retains
        configuration-free operation.

    - term: Library
      technical: >-
        Optional libraries lists on each service and on testing contain {module, version}, exact Go module versions including pseudo-versions. Omitted lists grant no external module reads. Before a build-code fix walk's first runner and before each build-code writer preparation, the engine downloads all declarations and their complete module build graph through an isolated Go manifest under tmp/library-download, using the engine's network and the normal GOMODCACHE. No host go.mod or go.sum is modified. Each download has a private temporary manifest directory, removed afterward; writers cannot modify the library-download subtree. The manifest scratch is excluded from run snapshots and per-call fs-diffs; downloaded cache contents are never recorded. Conflicting declarations, versions selected away from a declared pin and incomplete downloads fail before the writer. Downloads name the declared libraries and the underlying error on failure. The writer reads exactly the resolved source directories and their .info, .mod, .zip and .ziphash files; other versions, cached modules and VCS repositories remain inaccessible. No rule names the engine's own module. Build code resolves service roots and follows linked source directories with cycle detection, then parses production Go imports (including platform-tagged files, excluding _test.go) before discovery and every rerun and refuses an import named only in testing.libraries for that service. Protected tests and step definitions remain read-only under the writable paths definition. Only codex enforces subprocess and network confinement; Claude's replay and the code it runs remain unconfined, with network, for model trials. For non-Go hosts libraries must be omitted or empty: npm/Jest/Playwright dependencies keep their existing host-local node_modules paths, with no new package-manager downloading or import check.
      observed_by: >-
        writer-config-001-codex pins the full profile with an exact named module; writer-config-002-claude pins settings and the policy read roots with a transitive module. libraries-003-test-only-import-refused and libraries-004-download-fails-before-writer assert the refusal, its cause and zero runner/model turns. Live codex sandbox probes use a fresh build cache to compile and run the calculator host and refuse an undeclared module.

    - term: writable paths
      technical: >-
        Each service's optional writable is a list of exact project-relative files or folders, without patterns. Existing folders grant their subtree; an absent entry remains exact unless a trailing slash declares a folder. Together with the service's path and host tmp these bound the build-code writer. Before any runner, build code refuses absolute or escaping paths, patterns, parent traversal, host-root grants and overlap in either direction with protected test directories, symlinks included. Protected tests are tests/, Registry suite directories, the in-host directory holding testing.config, and in-host Go package directories named by every testing.commands entry (./dir or ./dir/..., resolved relative to the configuration directory or host root). Broad ./... names no separate test directory. Command package directories within a service path remain service code, with _test.go files writable by build code; a filename suffix alone grants no protection. Reserved tests/, Registry and configuration directories take precedence. Host tmp is checked too, and arbitrary configured scratch globs cannot expand these writer grants. Protected tests and step definitions stay read-only for build code; build steps derives its test-only grants from exactly those directories, refusing overlap with services or Specification documents. The failing set's services receive grants; unknown-service failures use all declared services. Only codex fully enforces the subprocess boundary; Claude's replay remains unconfined for model trials (ADR-0028 and spec #213).
      observed_by: Scenarios supply architecture entries, assert a successful go.sum repair and inspect exact generated file grants; refused test overlap produces no runner or AI turn.

    - term: impossible repair
      technical: >-
        The plan first searches for a solution within the declaration; a preferred undeclared file is insufficient to declare impossible work. A build-code plan's structured response carries impossible: [{path, reason}] alongside fix_prompt and questions, exactly one branch carrying content. The writer's YAML confirmation carries the same impossible list independently of applied. An empty list preserves retries, including applied false. The first nonempty report keeps edits, reruns the remaining failing set once, and returns a distinct impossible-repair error naming every required file, reason and remaining member. Its remedy is to change the files by hand or add them to the service's writable. No further plan, writer, attempt or COMPLETE banner follows. This returns through the walk's error path before Finalize, independently of #218's banner-order change.
      observed_by: Scenarios assert exit 1, files and reasons, remedy, no COMPLETE, exact plan, writer and runner counts, and retained files. Ordinary applied false without a report still retries.

    - term: engine
      technical: >-
        The `true-bdd` binary, built from `services/true-bdd` once per test
        session. It owns the IO implementation described in patterns.owned_io.
        INFO and higher log records go out as text on stdout; DEBUG and higher
        records go out as one JSON line in `tmp/true-bdd.log.json` under the directory
        the command runs in.
      observed_by: >-
        Steps counting engine events read that JSON log file after the run;
        a run that left no log file fails instead of counting nothing.
        IO Scenarios additionally observe exact captured streams, conflicting
        parent-directory holds and shared readers behind a post-snapshot
        launch barrier, private file permissions and inode replacement via
        an old hard link, and process-group cancellation through controlled
        CLI descendants. The atomic-write probe plants its old hard link and
        stale staging symlink after the pre-run snapshot; successful replacement
        removes both links from the rewritten file before the post-run snapshot.
        Then steps read the sentinel and old content, compare inodes/mode and
        require the descendant PID to disappear. These probes run in replay
        too and cannot be satisfied by recorded filesystem effects alone.

    - term: Item
      technical: >-
        BuildStepsItem carries one Catalogue Entry, service name and suite steps directory. Discovery orders suites by the first Registry Scenario id and phrases by Catalogue order, deduplicating each phrase and suite. Inventory includes phrases mapped to the suite's service or used by its Scenarios, including mapped unused phrases. The read-only command reports whole-Registry coverage with subject id registry. Under --fix the Item includes its skeleton location, complete YAML Specification context and latest per-Item findings, and uses a stable phrase hash as its artifact id, prefixed by the suite directory when multiple suites write the same phrase.
      observed_by: >-
        build-steps-list-001 observes the phrase and suite in each missing-definition log record. build-steps-writing-001 through 007 and the restored term-document, exit and codex-apply Scenarios pin body writing, verification and confinement.

    - term: red without the target
      technical: >-
        buildStepsExecution checks convergence through the shared bounded walk. The Go runner selects package-qualified generated tests, disables result caching and parses their own JSON events. Each failing Scenario needs bddgo's numbered executed-step diagnostic. The copy omits all declared service paths, VCS metadata and scratch, retaining test command cwd and executable modes. Raw streams remain in the engine run artifacts. Green results return only Items written in this run whose phrase is used by that Scenario; apply counters persist across retries. TrueBDD's harness shares a LazyBinary build result, requests it inside definitions and stops root discovery at the copied Specification.
      observed_by: >-
        build-steps-writing-001 pins both Scenarios red at their steps and the declared command on a normal run; 006 rejects harness bring-up as red; 007 injects a faulty writer body, observes the green finding and repairs it through the Fix loop. Unit tests pin skipped, missing, build and owning-package verdicts, the isolated copy, lazy build failure sharing and the unchanged attempt bound.

    - term: Step coverage
      technical: >-
        build steps parses each Registry suite's steps package and constant-folds every registration pattern. A pattern it cannot fold or compile refuses startup. Without --fix ambiguous concrete bindings refuse startup; with --fix concrete Step coverage runs once after every Item is written and refuses ambiguities there. Absent steps directories contain zero definitions. Every Registry Scenario is examined; an empty gap list alone is insufficient. Missing definitions are listed once per Catalogue phrase and suite when mapped to its service or used by a suite Scenario, including mapped unused phrases. A phrase has a definition when their regular-expression languages overlap; concrete Registry steps are checked separately, so a partially covering definition still fails coverage. Pattern intersection traverses the paired finite automata, retaining anchors, word boundaries, Unicode and case folding; it does not guess sample slot values.
      observed_by: >-
        build-steps-coverage-001 through 005 and build-steps-list-001 name missing or ambiguous definitions without AI or runner starts. Unit tests cover unused phrases and pattern intersection.

    - term: command
      technical: >-
        The pipeline is us refine, us apply, build tests, build steps, build code. build tests only renders Registry test files: --fix writes stale files; without it stale files refuse startup. It never reads definitions, starts a test runner or dispatches an AI turn. build steps loads its build-steps checklist; without --fix it lists missing phrases and checks coverage without AI or a runner. With --fix it writes all skeletons first, compiles, then writes each body through the shared Fix loop. Per-apply compilation, exact binding and pending-body checks precede whole-suite coverage, generated-test listing and a run without every service path. A red result requires each named Scenario to fail at an executed definition; compilation, harness bring-up, skipped or missing results fail the check. Green Scenarios send their written phrase Items back together, retaining apply counts and the bounded walk. The writer receives the complete phrase context, writes only protected tests and shared state, and reports interface_cannot_serve with phrase and lacks to stop immediately when the declared interface cannot serve the meaning. The quoted text, split into arguments at whitespace (no quoting, so
        an argument cannot hold a space) and run as the engine binary's
        arguments in a subprocess; `{{CWD}}` in an argument stands for the
        run directory's absolute path, so a command can name a file of the
        project tree by one. Its working
        directory is the run directory assembled from the project tree, its
        stdin carries the answers a Given step set (nothing otherwise), and
        the AI CLIs it finds on its PATH are the harness's record or replay
        stand-ins for the session's mode.
      observed_by: >-
        Run once by the When step, which fails when no Given step prepared a
        project tree. The fixture is handed the command first, so it can
        refuse an empty one or a checklist narrowing the command does not
        read. The run is capped by the Scenario's `timeout:`, five minutes
        when absent, and the fixture carries that cap for the run's record.
        Its exit code, stdout, stderr and file changes are kept for the Then
        steps. As soon as the run returns, before the step passes or fails,
        the When step hands it to the harness's run recorder, a run that
        could not complete included: its run directory, its stdout and
        stderr files, its file changes, and its exit code once it completed.
        The recorder writes them, when the Scenario ends, to
        `true-bdd-logs/harness.json` in the run directory, the record the BDD
        report reads; a When step that does not hand the run over leaves
        that record without a run directory, an exit code or a file change,
        though every step passes. A run that could not complete fails the
        step, naming the run directory it left behind.

    - term: project tree
      technical: >-
        A fixture directory `tests/true-bdd/fixtures/<name>/`. Its `input/` is
        laid over this repository's `true-bdd/` and `templates/` in a fresh
        run directory `tmp/test_run/<session>/<name>/`, the command's working
        directory. Beside `input/` sit `cassettes/` (the recorded AI turns and
        the recorded outcome) and the optional `prep.sh`, `teardown.sh` and
        `checklist-prompts.yaml`. An explicit fixture-controlled writer Given also uses
        auth/auth.json (declared dummy bytes only) and cli/claude and cli/codex
        deterministic external CLI stand-ins, all outside the overlaid input tree.
        IO fixtures can additionally opt into a claude-only launcher before the
        proxy in every mode. Its deterministic CLI checks the actual spawn
        environment, including poisoned inherited session flags and writer
        isolation switches; cassette effects cannot satisfy those checks.
        It never calls a model or reads real authentication. Cancellation
        fixtures likewise start controlled CLI descendants directly in every mode.
      observed_by: >-
        Set up by the Given step naming the tree: it loads that fixture, and
        decides per caller where the run's AI turns come from (the fixture's
        cassettes in replay, refusing a fixture with no cassettes or no
        recorded outcome; a staging directory in record; the real CLIs live).
        Nothing runs yet: the run directory is assembled when the When step
        runs the command. A Given step saying the tree has no file records
        that path, and the assembled run directory has it deleted before
        `prep.sh` and the snapshot; a path leading out of the run directory,
        or one the assembled directory does not hold, fails the run rather
        than proving nothing. A Then step that reads a named file of the tree
        after the run (that an unchanged file is still there, its line count,
        its content) takes the quoted path relative to the run directory and
        holds it inside before reading: an empty or absolute path, one that
        climbs out through `..` once cleaned, or one whose symbolic links,
        resolved on both sides (the run directory's own path too) and whole
        path components compared, lead out of the run directory fails the
        step, and so does a path naming anything but a regular file, such as
        a directory. A path that does not exist is held by its deepest
        existing directory, resolved the same way: inside the run directory
        the step fails because the file is missing, and through a link out
        of it because the path leads out. A step about a created or modified
        file only compares the quoted path, as written, with the paths of the
        run's file changes, and reads no file.
        The fixture-controlled writer Given inserts its cli/ behind the services
        shim and sets CODEX_HOME to its auth/ directory. The writer lifecycle
        Then requires the shim's per-run non-secret spawn receipt and checks
        that exactly one generated home has no auth.json after the command.

    - term: exit code
      technical: >-
        The engine process's exit status: 1 when the command returns an error
        (a refusal, an unusable answer, or a walk of `scen check` or `build code`, or a `build steps` inventory or authoring walk that ends incomplete), 0
        otherwise. The Finalize step of `us refine` and `us apply` returns no
        error for a walk that ends failing: it logs the verdict, skips the
        write, and the process exits 0.
      observed_by: >-
        The step reads the number and compares it with the kept exit status; a
        mismatch fails the step and names where the run's evidence lives.

    - term: stdout
      technical: >-
        The engine's standard output: console answer lines (banners such as
        `SCEN CHECK`, the report table, `ALL CHECKS PASSED!`) and every log
        record in text form, `time=… level=… msg="…" key=value`.
        The shared checklist runner logs the upper-case command name plus
        ` COMPLETE` only after Finalize returns no error; an earlier error
        or a Finalize error emits no completion banner. A command deferring
        completion owns that announcement: build tests logs BUILD TESTS COMPLETE
        only after deterministic rendering or verification succeeds. Existing banner text is preserved.
      observed_by: >-
        The kept stdout, as one string, is asked for a match of the step's
        pattern anywhere in it, or for none; a failed match prints the tail of
        stdout beside the pattern.

    - term: stderr
      technical: >-
        The engine's standard error. When a command returns an error, the
        command-line library prints `Error: ` and the error's text there; the
        text of an argument a command does not take carries the command's
        usage after it. A failure before the log is set up, such as a missing
        `true-bdd/true-bdd.yaml`, also prints its log record there, as
        `<date> <time> ERROR <msg> key=value`.
      observed_by: >-
        The kept stderr, as one string, is asked for a match of the step's
        pattern anywhere in it, or for none; a failed match prints stderr
        beside the pattern.

    - term: log record
      technical: >-
        One record of the engine's structured log: a level, a message and
        named fields. Message strings and field names are a wire contract the
        BDD report also reads, so a step may pin them.
        A turn reporting refused tool calls emits one WARN with
        msg="Tool calls were denied; this turn did less than it was asked to"
        and keys label (the dispatch label), role (prompt, fix or apply), and
        denied (calls in reported order, separated by "; "). Each call is
        its tool name followed by a space and its target, or the tool alone
        when no target is reported. Claude permission_denials supply tool_name
        and tool_input: file_path, otherwise path; Glob uses its pattern,
        joined to path when relative. Grep's query is never a target.
        Each target is limited to its first 200 Unicode characters plus an
        ellipsis when longer; unrelated input is omitted.
        Codex JSONL item.completed events supply refused command_execution,
        file_change or mcp_tool_call calls: status declined, or status failed
        with an explicit permission/refusal error (permission denied,
        operation not permitted, rejected by user/policy, exec command
        rejected, outside of the project or outside the allowed roots).
        Their targets are respectively path-like command arguments (absolute,
        dot-relative, home-relative or containing a slash, omitting shell
        launchers), each changes.path,
        or arguments.file_path/arguments.path; MCP uses its tool name.
        Other failures and non-event narration do not establish a refusal.
        Refusal warnings do not change the turn's existing outcome.
      observed_by: >-
        Through stdout, by a pattern naming its text form, such as
        `level=ERROR msg="Refusing to start" command="scen check"`; in the
        JSON log file, by its exact message (see engine and AI turn).

    - term: pattern
      technical: >-
        An RE2 regular expression: the step's text after its fixed words,
        verbatim to the end of the step, quotes included.
      observed_by: >-
        Compiled by the step that holds it; one that does not compile fails
        the step rather than matching nothing.
        The every-file comparison expands {{CWD}} to the symlink-resolved
        run root, {{ENGINE}} to the engine executable (invoked or symlink-resolved path), and
        {{GOROOT}}/{{GOMODCACHE}} through go env -json,
        escaping each path as the matched file represents it before
        regex-escaping: JSON string contents for .json, TOML basic string
        contents for .toml, raw paths otherwise. In JSON hook commands,
        {{ENGINE}} also escapes internal single quotes for the surrounding
        shell single quotes before JSON escaping. Other patterns and files
        are unchanged; a lookup failure fails the step.

    - term: file change
      technical: >-
        One entry of the run's structural diff of the run directory, taken
        between a snapshot after the directory is assembled and prepared and
        one after the command ends: created, modified or deleted, with its
        path relative to the run directory. Noise directories such as `.git`
        and `node_modules/` are left out of both snapshots.
      observed_by: >-
        A step reads the kept diff. A path lies outside a directory unless it
        is that directory or starts with it plus a slash, so `tmp-x.yaml` is
        outside `tmp`; the step lists every change outside it. The no-file-changed
        assertion requires an empty diff without excluding tmp.

    - term: checklist
      technical: >-
        `true-bdd/checklists/<command stem>.yaml` in the run directory (`scen
        check` reads `scen-check.yaml`): sections of Prompts the command reads
        at startup.
      observed_by: >-
        A fixture narrows a checklist in `checklist-prompts.yaml` at its root,
        mapping a checklist's stem to snippets of its Prompts' questions; the
        harness rewrites the run's copy to keep only the matching Prompts. The
        step checks the fixture declares exactly the one quoted snippet for the
        quoted checklist, and fails when it declares none, several or another.

    - term: Prompt
      technical: >-
        One element of a checklist section's `validation_prompts`: a `Q:`
        question or a `D:` check name, its `rationale`, the `docs` it reads
        and an optional `F:` fix.
      observed_by: >-
        Selected by a snippet of its `Q:` text, which must match exactly one
        Prompt of the checklist.

    - term: AI turn
      technical: >-
        One request through the engine's AI router to claude or codex,
        logged once as msg="Dispatching AI turn" before the CLI is spawned; in
        replay the answer comes from a cassette.
      observed_by: >-
        Count the "Dispatching AI turn" records in the run's JSON log file;
        "no" is zero, and a missing log file fails instead of counting zero.

    - term: model override
      technical: >-
        Repeated command-local --model values are passed to lazy bootstrap.
        After validating the loaded engine.models and role defaults, bootstrap
        validates every override against those declared tiers and the same
        model-reference parser, rejecting duplicate tiers. Only then it builds
        the in-memory registry with the replacements and logs each once at INFO
        as msg="Model tier overridden", tier, from and to. Role selection still
        resolves Prompt, checklist, then role default against this registry.
        No config or override file is written and no override environment
        variable is exported; the resolved model reaches its CLI's argv.
        The drill permits only repeated --model value pairs after its exact
        build tests --fix, build steps --fix or build code --fix prefix, stores the original
        arguments in its run record, and forwards the values unchanged through
        typed model-override options in its engine wrapper. Semantic validation
        stays with the spawned engine; all other extra arguments are refused.
      observed_by: >-
        Read the Model tier overridden records and the cli and model fields
        of Dispatching AI turn. A refusal has exit 1 and no dispatch records;
        the configuration file stays unchanged. Drill checks inspect its run
        record and the spawned engine's arguments.

    - term: AI CLI
      technical: >-
        The binary an AI turn is spawned as, `claude` or `codex`
        (see `dependencies[]` above): the half before the first colon of the
        `<cli>:<model>` reference the turn's tier resolves to under
        `engine.models`, with any run-only model overrides applied at bootstrap. The tier is the Prompt's own `model:`, `fix_model:`
        or `apply_model:` for a validation, fix or apply turn, else its
        checklist's `engine:` block, else `engine.default_<role>_model`.
      observed_by: >-
        Read from the `cli` field of each "Dispatching AI turn" record in the
        run's JSON log file, its `role` field telling the kind of turn:
        `prompt` for a validation turn, `fix` for a fix turn, `apply` for an
        apply turn. The records of that role and CLI are counted; "no" is
        zero, and a missing log file fails instead of counting zero.

    - term: failing set
      technical: >-
        One build code Item containing every discovered failure, its latest
        runner evidence and matched Specification context. Discovery sorts
        members by id and yields zero or one Item. After each apply a single
        set rerun replaces verdicts, passing members leave and evidence is
        grouped afresh. Jest file::<load> members carry the message of each file
        that failed to load. A test command exiting non-zero without any named
        failing member, synthetic members included, stops with its command,
        exit code and output tail before any AI turn or BUILD CODE COMPLETE.
        Build code reports success only when the test command succeeded.
        A new outer walk always discovers the full suite.
      observed_by: >-
        Read Suite failures and Loaded prompts items in the engine log,
        grouped fix requests, tests-pass Check answered records and the
        selected runner arguments after each completed apply.

    - term: fix loop
      technical: >-
        The engine's interactive answer to a failed Prompt under `--fix`. A
        clarifying question prints its suggested answers numbered from 1,
        plus `0) Other`, then reads one line of stdin as the answer, a number
        picking that suggestion. An optional `Your answer: ` prompt follows
        the options before the read; the original engine prints it, with
        indentation and blank lines, and labels Other as `0) Other (type custom answer)`.
        For build code the Item is the whole failing set, zero Items when discovery is green. Its tests-pass D: Prompt passes exactly when every remaining member passed its latest run; failing findings group every still-failing id beside the whole first output using runtime-failure normalization. No validation model runs. The unchanged walker allowance counts applies on that set Item, including applied false, successful responses missing the confirmation, and started codex writers that exit non-zero or answer empty, and started Claude writer turns that exit non-zero, return error results or answer empty; allowance two still permits three applies before stopping. Each missing confirmation warns once with the result path and follows the not-applied rerun. Each started writer failure logs one WARN and follows the same rerun, preserving its files. Start failures, engine refusals before spawning, failures in other roles stay fatal. The next plan sees the rerun's remaining set and rebuilt grouped evidence, including build failures. The terminal attempt is rerun but still stops at the bound even if it passed. The proposed repair plan names changes, files and served tests. The writer gets the same set, Specification, edit roots and codex and Claude command forms, implements the service, tests each part and the whole set, then reports changes and observed passes without a stated time, turn, token or cost budget. The proposed
        fix is then followed by `[1] Apply this fix to working copy`, `[2]
        Refine the fix prompt` and `[3] Exit without applying`, on separate
        lines in that order. An optional `Your choice (1/2/3): ` prompt
        follows before one line is read; the original engine prints it,
        indents the options, adds separators and appends `(provide feedback)`
        to option 2. `1` or `apply` applies the fix, `2` or `refine` reads
        feedback lines up to an empty one, and anything else exits, including
        an interactive blank line. The input collector retains read errors:
        empty EOF is end of input, a final non-empty line without a newline
        is an answer, and a blank newline is an empty answer.
        Every apply requires an answer at the fix menu; no command can
        approve fixes in advance. Empty EOF at a clarifying question stops
        with ErrPersonRequired (a person must answer), after printing the
        question and suggestions. Empty EOF at a menu stops with an error
        saying a person must choose whether to apply the fix, never the
        tests-still-failing error. Other read
        failures propagate. The FixLoopUI and its adapter return input errors
        through the cell handler and walker to runner.Run, which logs Walk
        stopped and returns the error before finalization or COMPLETE.
        No terminal detection is used: the drill's open pipe keeps supplying
        menu choices and clarification answers with its existing prompt forms.
      observed_by: >-
        Set up by a Given step, which fails when no Given step prepared a
        project tree; nothing runs yet, the When step pipes the lines in. The
        every-question step makes the command's stdin the answer and a
        newline, 64 times over, enough for every question one walk asks, and
        lines left over are never read. The line-by-line step splits its
        quoted text at each `/`, trims each piece, and makes stdin those
        pieces, one per line in order and nothing after, so an empty piece is
        an empty line.

    - term: test dependencies
      technical: >-
        The fixture's optional `prep.sh`, beside `input/`: one shell script
        run in the run directory after the directory is assembled and before
        the snapshot the run's file changes are counted from, on a budget of
        its own of 15 minutes. A blank script counts as absent.
      observed_by: >-
        The Given step installs nothing itself, since the run directory does
        not exist yet. It fails when no Given step prepared a project tree,
        or when the fixture ships no `prep.sh`, naming the dependencies the
        step named.

    - term: glob
      technical: >-
        A path pattern over paths relative to the run directory: `*` matches
        any run of characters but `/`, `?` one such character, and `[…]` one
        character of a set.
      observed_by: >-
        The glob is checked on its own first, before any path is matched: one
        that is not well formed, such as one with an unclosed `[`, fails the
        step rather than matching nothing, even when the run created no file
        at all, so neither the no-files step nor a count of none can pass on
        it. Only then is it matched against the path of every file the run's
        diff marks created, never modified or deleted ones, and the matches
        are counted. A content-match count instead resolves the glob against
        the files currently on disk, requires exactly one regular file inside
        the run directory (including after resolving symbolic links), reads
        its complete contents, and counts non-overlapping regexp matches.
        The `every file matching "{glob}" ...` phrase instead expands the glob
        over files currently on disk, fails on no matches, and holds each
        match inside the project after resolving symbolic links, rejecting
        escaping links and non-regular files before reading its complete
        contents and testing the regexp.
        Saved rendered prompts under `tmp/<run>/` are observable files; the
        fix-generator request is named `<index>-<Scenario>-fix-iter<n>-user.txt`.

    - term: Story
      technical: >-
        A YAML file under `paths.stories_dir` (`docs/product/stories/`),
        named `<id>-<slug>.yaml`, whose top-level `story:` holds `id`,
        `feature`, `title`, `as_a`, `i_want`, `so_that`, `status` and
        `acceptance_criteria`.
      observed_by: >-
        After the run, the quoted path is taken as a glob inside the run
        directory and must match exactly one file: none, several, or one
        reached through a link out of the run directory fail the step. The
        file must parse and hold a top-level `story:` mapping; its `id` is
        compared as written.

    - term: Feature
      technical: >-
        The Story's `feature:` value, a slug such as `scen-check`.
      observed_by: >-
        Compared as written; a Story without `feature:` has an empty one.

    - term: Acceptance Criterion
      technical: >-
        One element of the Story's `acceptance_criteria:` list: `id`
        (`<NNN>-<slug>`; legacy Stories use `AC-<n>`), `description`, and
        `steps`, a list of one-key `given:`, `when:` and `then:` blocks each
        holding steps. Its lineage id is `<story id>-<id>`.
      observed_by: >-
        Counted as the elements of that list. Found by its `id` as written,
        and a Story without one with that id fails the step; its
        description is matched as one string.

    - term: step
      technical: >-
        One string, or a one-key `and:` or `but:` mapping holding the
        string, in a `given:`, `when:` or `then:` list. The key is for
        reading only and not part of the text; a text opening with `judge:`
        or `llm:` is run by a model rather than by a step definition.
      observed_by: >-
        Read from the YAML file after the run. A block counts as present
        only when it holds at least one step. A criterion's step texts are
        matched one by one, mapping keys dropped, and a criterion with no
        steps fails. Two Scenarios share the same steps when their
        `merged_steps` read back as identical YAML; a Scenario without
        `merged_steps` shares nothing.

    - term: template
      technical: >-
        A catalogue entry's `template:` text, which the engine compiles into
        one regular expression, anchored at both ends, that a step's whole
        text, without its `and:` or `but:` key, must match: words as written,
        case and spaces included; a quoted slot, which sits between literal
        double quotes, as one or more characters other than a double quote;
        a number slot as digits or `no`; a role slot as exactly one of the
        names under the product document's `roles:` (Product Owner, System
        Architect, Quality Engineer); a pattern slot, only ever the last
        token and after a space, as the rest of the text, at least one
        character; brackets with several alternatives as exactly one of them,
        and brackets with one as that text or nothing; a backslash before
        `{`, `}`, `[`, `]` or `\` as that character.
      observed_by: >-
        A step definition's pattern is its phrase's template written as an
        anchored regular expression: it binds exactly the texts the template
        matches, no fewer and no more, so a step the catalogue takes binds
        and one it refuses binds nothing. Each slot is a capture group: a
        quoted slot captures one or more characters other than a double
        quote, so an empty quote binds nothing; a number slot captures
        digits or `no`, which the definition reads as zero; a role slot
        captures only the declared role names, so other words, however
        capitalised, bind nothing, and which role it names changes nothing
        the step does; a pattern slot captures the rest of the step
        verbatim, quotes included, never split or unquoted, and the step
        compiles it as the mapping of pattern says. Brackets with several
        alternatives are a group that must match exactly one of them and is
        never optional, so a step naming none of them binds nothing; brackets
        with one alternative are optional.

    - term: Scenario
      technical: >-
        One entry under the Registry's `scenarios:`, keyed by its Scenario
        key: `description`, `service`, `path` (the test file it is
        generated into), an optional `timeout`, `user_stories` (its lineage)
        and `merged_steps` (its Given, When and Then steps).
      observed_by: >-
        Read from the Registry the run left behind, after the command has
        ended, and found by its key or by its lineage. A Scenario the
        Registry does not declare fails the step that names it.

    - term: Registry
      technical: >-
        The YAML file `documents.scenarios_yaml` names in the project's
        `true-bdd/true-bdd.yaml`, conventionally `docs/scenarios.yaml`; a
        step names it by its path relative to the run directory.
      observed_by: >-
        Read and parsed after the run. The quoted path is held inside the run
        directory before anything is read, as a Then step holds a file of the
        project tree: an empty or absolute path, one that climbs out through
        `..` once cleaned, or one whose symbolic links, resolved on both sides
        (the run directory's own path too) and whole path components
        compared, lead out of the run directory fails the step, and so does a
        path naming anything but a regular file. A file that cannot be read
        or parsed, or one declaring no Scenario, fails the step too.

    - term: lineage
      technical: >-
        A Scenario's `user_stories:` list, written by `us apply`. Each
        element names `story` (the Story file's path from the project root),
        `scenario_id` (the Acceptance Criterion's lineage id) and
        `merge_date`; an empty list means no Story claims the Scenario yet.
      observed_by: >-
        The Scenarios coming from a criterion are those with an element
        whose `scenario_id` equals the quoted id. A count step counts them;
        every other step requires exactly one and names them all when none
        or several are found. It then compares their `story` values with
        the quoted path as written, or matches the pattern against the whole
        entry written back out as YAML.

    - term: Scenario key
      technical: >-
        The key of the Scenario's entry under `scenarios:`,
        `<story-id>-<NNN>-<slug>` once a Story claims it; legacy `E2E-NNN`
        keys, and other keys in fixture projects, stay until renamed. The
        generated test is named `Test` plus the key in CamelCase.
      observed_by: >-
        Compared as written with the key the entry sits under, and used as
        written to find a Scenario in the Registry.

    - term: step definition
      technical: >-
        A registration in the Go package `steps/` beside a Scenario's test
        file: a regular expression, written as a string literal, paired with
        the code run for every step whose whole text it matches. The engine writes registrations and functions through stepskeleton, using the same Catalogue compiler in capturing mode. Every slot is one group in template order, passed through the harness shape func(*State, []string) error. Pending bodies fail with the phrase and "step not written yet". The AI writes only the body, necessary imports and shared State. No service package is shared. Each phrase's function is named phrase<hex sha256 of the template> and lives in its own <name>.go in the suite's steps/ directory, so an interrupted walk finds it again. The registration is appended to the package's existing Register function; a package without one gets register.go, and one without a State type gets state.go with an empty State, each named true_bdd_register.go or true_bdd_state.go when that file name is already taken.
      observed_by: >-
        The step reads the source of every `.go` file directly in the quoted
        directory, without building it. The directory is held inside the run
        directory first: an empty or absolute one, one that climbs out
        through `..` once cleaned, or one whose symbolic links, resolved on
        both sides (the run directory's own path too) and whole path
        components compared, lead out of the run directory fails the step.
        The step takes each registration's string literal that compiles as a
        regular expression. Each step of the named Scenario must match
        exactly one; model-run steps are skipped. A file that does not parse
        fails the step, and the failure names every step that matched none
        or several.

    - term: test runner
      technical: >-
        A subprocess the engine starts from the suite command the
        architecture document declares under `testing.commands` (`replay`
        for `build code`), split into arguments by shell quoting rules, with
        one runner start after every completed build-code apply, applied or
        not applied, including the terminal attempt. The remaining failing
        set is selected by joining member selectors with alternation: Go
        -run, Jest --testNamePattern, Playwright --grep. A Go <build> or
        Playwright <startup> member makes the rerun unfiltered. A Jest <load>
        member selects every remaining member's file by absolute path through
        --runTestsByPath, with no test-name filter, in the same single start.
        Every ordinary member needs its own passing result; missing or skipped
        members remain failing with a did-not-run finding. Synthetic members
        require their package, file or startup success. A Go <build> member passes
        in both a single-member rerun and a set rerun only when its own package
        reports a package-level pass or skip (no test files), with no package,
        build or test failure. A package missing from the output stays failing.
        A Jest file that fails to load yields one repository-relative file::<load>
        member carrying Jest's message. In discovery, RunOne and RunSet the file
        must load and report no failure to pass; a failed or missing file stays
        failing. The test command's non-zero exit with no named failing member,
        synthetic members included, is an error carrying command, exit code and
        output tail; no AI turn or BUILD CODE COMPLETE follows. Playwright's
        existing <startup> member remains. Build code succeeds only when the
        test command succeeds.
        A new outer walk discovers
        the full suite afresh, catching regressions outside the previous set. Before each start it writes one log record, msg="Spawning
        test runner", with the program in `binary` and its arguments in
        `args`.
      observed_by: >-
        Read the "Spawning test runner" records in the run's JSON log file:
        count them, compare `binary` with the quoted program, or match the
        `args` joined by single spaces against the pattern, including counting only matching starts to pin a single whole-suite listing. A missing log
        file fails instead of counting zero.

    - term: shell command
      technical: >-
        The quoted text split on whitespace, with no shell and no quoting,
        and run as a subprocess in the quoted directory, relative to the run
        directory. It inherits the test's environment without `CLAUDECODE`,
        and it is capped at 10 minutes.
      observed_by: >-
        Run by the Then step itself after the command has ended, so it sits
        last among a Scenario's Then steps: a re-run may change files that
        earlier steps read. An empty command fails the step. The quoted
        directory is then held inside the run directory before anything runs:
        an empty or absolute one, one that climbs out through `..` once
        cleaned, or one whose symbolic links, resolved on both sides (the run
        directory's own path too) and whole path components compared, lead
        out of the run directory fails the step; one that does not exist is
        held by its deepest existing directory, resolved the same way. A
        shell command that cannot start fails the step, as does an exit
        status other than the quoted one, printing the shell command's stdout
        and stderr.

    - term: claude
      technical: >-
        Claude Code 2.1.285. The build-code applier alone explicitly requests
        an isolated unbounded writer. Generated --settings declares a PreToolUse
        hook for every exposed tool, invoking this binary's claude-guard with
        --policy pointing to generated JSON. It emits an explicit allow decision
        or exits 2 with a reason; Bash is never permission-pattern granted.
        --restricted confines file tools to cwd and --add-dir roots, resolving
        symlinks. The hook protects its generated configuration directory from writes, further restricts writes and limits module-cache reads to declared libraries, their build graph and exact version metadata. Search roots outside
        the host must not contain any excluded directory; Glob checks its
        pattern's fixed root too and denies parent traversal. Read roots are the
        host, go env GOROOT, the declared library graph, and only this session's tool-results
        directory. The generated session UUID makes historical transcripts
        inaccessible. The default sign-in is retained: an empty CLAUDE_CONFIG_DIR
        was signed out in the live probe. No credentials are copied.
      observed_by: >-
        Hook Scenarios pass cwd, tool_input.command and run_in_background on
        stdin and a policy file under scratch, without running Claude. Writer
        Scenarios pin Sonnet 5.5, run a granted selection and assert the engine's
        rerun, edits, exit and once-only failure warning. The recording wrapper
        runs real Claude unchanged before injecting a non-zero exit.

    - term: write guard
      technical: claude-guard --policy reads generated JSON and the complete Claude payload. An explicit hook allow object grants
        execution; denial exits 2 with one true-bdd guard reason on stderr. Read, Glob and Grep use host/toolchain/spill roots
        and module exclusions; Write, Edit and MultiEdit use declared write roots and cannot change protected configuration. Symlinks
        and file identity prevent escapes and shared-prefix confusion. Bash accepts exactly the canonical whole-suite command
        or one nonempty single-quoted selector in the resolved suite directory, including the shell-quoted cd prefix from the
        host or suite. Background commands and unknown tools are denied.
      observed_by: The When step runs the hidden hook in the prepared project with a generated policy file and complete payload.
        Then steps assert exit 0 or 2 and match the denial reason. File boundary Scenarios cover inside, outside, relative and
        symbolic-link paths. No model runs for hook-only Scenarios.

    - term: write policy
      technical: Generated JSON carries replay.read_root, replay.write_roots, replay.test_command, replay.test_selector and replay.test_dir,
        with extra read_roots, excluded_roots and protected_roots. The write globs are reduced to their fixed prefixes against
        the host root. CanonicalReplayCommand removes machine flags before -args or --, preserves the boundary and later arguments,
        joins with one space and quotes all but A-Za-z0-9_./:=,@%+-. Quotes, newline and NUL withhold the grant with one warning.
        Selectors are -run, --testNamePattern or --grep. The suite directory follows testing.config. Codex receives these forms
        as instructions and uses ADR-0021's profile; only the explicit Claude build-code writer uses the hook.
      observed_by: Given steps build the replay policy with absolute run and write roots. The test-command step supplies command,
        selector and suite. Missing policy omits the file; unreadable policy writes invalid JSON; missing read root writes an
        empty root. Guard Scenarios observe the resulting refusal.

    - term: tool call
      technical: Claude's tool_name and tool_input in its hook payload; cwd supplies the Bash working directory and relative file
        base, and run_in_background is denied. File tools resolve file_path, then path, then cwd. The complete payload is decoded
        as one call.
      observed_by: Given steps name a tool and a tree file or literal path, or a shell command with foreground/background mode.
        The When step serializes the fields to stdin every time so exported environment cannot supply a different call.

    - term: hook payload
      technical: JSON with tool_name, cwd and tool_input containing file_path, path, command and run_in_background. The generated
        policy path is a required --policy argument. Unreadable policy, malformed JSON or a non-absolute read root fails closed.
      observed_by: The When step pipes that complete JSON into claude-guard. Tree-file paths join the run root; literal paths
        remain unchanged until the guard resolves them.

    - term: symbolic link
      technical: >-
        A filesystem symbolic link holding the target as written, so a
        relative target resolves from the link's own directory.
      observed_by: >-
        The Given step adds a command to the fixture's prep phase that makes
        the link's directory and the link, after the run directory is
        assembled and before the snapshot the file changes are counted from.
        The snapshot refuses a link it walks into, so the link must sit in a
        directory it leaves out, such as `node_modules`; a link path that is
        absolute or climbs out of the project tree fails the step.

  # The Phrase mapping (ADR-0032): what each Catalogue phrase's step does
  # through docs/architecture/true-bdd-cli.yaml, by block (#243).
  phrases:
    - template: the System Architect runs "{command}" while a "{kind}" hold blocks "{directory}" beyond its
        wait limit
      service: true-bdd
      references:
      - &id001
        command: us refine
      - &id002
        command: us apply
      - &id003
        command: scen check
      - &id004
        command: build tests
      - &id005
        command: build steps
      - &id006
        command: build code
      - &id007
        command: init
      - &id008
        command: version
      - file: project-tree
      - file: staging-files
      does: Runs the named command while the harness holds an exclusive or shared advisory lock on the directory
        past the engine's ten-second wait (owned_io holds), keeping the run's outcome for the Then steps.
    - template: the engine uses an observed fixture Claude CLI
      service: true-bdd
      references:
      - outgoing_call: claude
      does: Puts a fixture-owned deterministic Claude launcher before the recording proxy, so the next run's
        claude calls reach an observed stand-in that checks the invocation contract.
    - template: the System Architect runs "{command}" after planting a stale staging symlink
      service: true-bdd
      references:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - file: staging-files
      does: Plants a stale .true-bdd.tmp.<basename> staging symlink after the pre-run snapshot, then runs
        the named command and keeps its outcome.
    - template: the System Architect runs "{command}" while a "{kind}" hold permits "{directory}"
      service: true-bdd
      references:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - file: project-tree
      - file: staging-files
      does: Runs the named command while the harness holds a compatible advisory lock on the directory, keeping
        the outcome to show the lock does not block it.
    - template: the project prepares atomic replacement probes
      service: true-bdd
      references:
      - file: staging-files
      does: Prepares an old hard link and a private file in the project tree for the atomic-replacement probes
        of the next run.
    - template: the rewritten file "{path}" keeps private permissions and replaces its old hard link "{original}"
      service: true-bdd
      references:
      - file: staging-files
      - file: project-tree
      does: Observes that the rewritten file keeps its 0600 mode and is a new inode, its old hard link still
        holding the previous bytes.
    - template: the System Architect cancels "{command}" after a CLI descendant starts
      service: true-bdd
      references:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - outgoing_call: claude
      - outgoing_call: codex
      does: Runs the named command and interrupts it once a descendant of the spawned AI CLI has started,
        keeping the outcome.
    - template: the CLI descendant has stopped
      service: true-bdd
      references:
      - outgoing_call: claude
      - outgoing_call: codex
      does: Observes that the descendant process the cancelled CLI started is no longer running.
    - template: Git hook variables point outside the project
      service: true-bdd
      references:
      - outgoing_call: go-toolchain
      does: Sets the repository-local Git variables of the next run's environment to a directory outside the
        project.
    - template: the System Architect runs "{command}" while a "{kind}" hold blocks "{directory}"
      service: true-bdd
      references:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - file: project-tree
      - file: staging-files
      does: Runs the named command while the harness holds a conflicting advisory lock on the directory, then
        releases it within the wait, keeping the outcome.
    - template: library downloads use an empty offline proxy
      service: true-bdd
      references:
      - outgoing_call: go-toolchain
      does: Points the next run's Go module downloads at an empty file proxy, so a library download fails
        deterministically.
    - template: the "{tree}" project tree
      service: true-bdd
      references:
      - file: project-tree
      - file: configuration
      does: Lays the named fixture's input over the repository's true-bdd/ and templates/ as the Host project
        the next command runs in, with its recorded AI turns.
    - template: the codex writer uses fixture-controlled authentication and CLIs
      service: true-bdd
      references:
      - outgoing_call: codex
      does: Gives the next run's codex writer the fixture's dummy authentication and deterministic CLI stand-ins.
    - template: the codex writer provisioned and removed its fixture authentication
      service: true-bdd
      references:
      - outgoing_call: codex
      does: Observes the codex writer's receipt that it provisioned the dummy authentication privately and
        removed it after the turn.
    - template: the {actor:role} answers "{answer}" to every question
      service: true-bdd
      references: &id009
      - command: us refine
      - command: us apply
      - command: scen check
      - command: build steps
      - command: build code
      does: Queues the answer, repeated, as the next run's stdin for every fix menu and clarifying question.
    - template: the {actor:role} answers "{lines}" line by line
      service: true-bdd
      references: *id009
      does: Queues the given lines, in turn and nothing after them, as the next run's stdin.
    - template: the "{checklist}" checklist is narrowed to its "{prompt}" prompt
      service: true-bdd
      references:
      - file: checklists
      does: Narrows the named checklist of the next run to the one named Prompt, and checks the fixture selects
        exactly that Prompt.
    - template: the project tree has no "{file}"
      service: true-bdd
      references:
      - file: project-tree
      does: Removes the named file from the assembled project tree before the next run.
    - template: the project's [browser ]test dependencies are installed
      service: true-bdd
      references:
      - file: project-tree
      does: Requires the fixture to declare the install of the project's test dependencies, which its prep
        runs while the project tree is assembled for the next run.
    - template: the {actor:role} runs "{command}"
      service: true-bdd
      references: &id010
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      does: Runs the named command of the engine once in the prepared project tree, keeping its exit code,
        stdout, stderr and file changes for the Then steps.
    - template: the command exits with code {code:number}
      service: true-bdd
      references: *id010
      does: Compares the kept exit status of the run with the number, as each command's responses declare
        it.
    - template: stdout matches {expected:pattern}
      service: true-bdd
      references:
      - log_record: stdout-text
      does: Matches the pattern anywhere in the kept stdout of the run, its answer lines and text log records.
    - template: stdout does not match {unexpected:pattern}
      service: true-bdd
      references:
      - log_record: stdout-text
      does: Requires that the pattern matches nowhere in the kept stdout of the run.
    - template: stderr matches {expected:pattern}
      service: true-bdd
      references:
      - log_record: stderr-error
      does: Matches the pattern anywhere in the kept stderr of the run.
    - template: stderr does not match {unexpected:pattern}
      service: true-bdd
      references:
      - log_record: stderr-error
      does: Requires that the pattern matches nowhere in the kept stderr of the run.
    - template: no file changed
      service: true-bdd
      references:
      - file: project-tree
      does: Requires an empty diff of the project tree between the pre-run and post-run snapshots, tmp included.
    - template: no file outside "{dir}" changed
      service: true-bdd
      references:
      - file: project-tree
      does: Requires that every changed path of the run lies inside the directory.
    - template: no file outside "{dir}" and "{other_dir}" changed
      service: true-bdd
      references:
      - file: project-tree
      does: Requires that every changed path of the run lies inside one of the two directories.
    - template: the only file changed outside "{dir}" is "{file}"
      service: true-bdd
      references:
      - file: project-tree
      does: Requires that the named file is the only path the run changed outside the directory.
    - template: the file "{file}" is created
      service: true-bdd
      references:
      - file: project-tree
      does: Observes that the run created the named file.
    - template: the file "{file}" is modified
      service: true-bdd
      references:
      - file: project-tree
      does: Observes that the run modified the named file.
    - template: the file "{file}" is unchanged
      service: true-bdd
      references:
      - file: project-tree
      does: Observes that the run left the named file unchanged.
    - template: the file "{file}" has exactly {lines:number} line[s]
      service: true-bdd
      references:
      - file: project-tree
      does: Counts the lines of the named file after the run and compares them with the number.
    - template: the file "{file}" matches {expected:pattern}
      service: true-bdd
      references:
      - file: project-tree
      does: Matches the pattern against the named file's content after the run.
    - template: every file matching "{glob}" [matches|does not match] {expected:pattern}
      service: true-bdd
      references:
      - file: project-tree
      does: Requires every file matching the glob after the run to match, or not to match, the pattern.
    - template: exactly {count:number} file[s] matching "{glob}" [is|are] created
      service: true-bdd
      references:
      - file: project-tree
      does: Counts the files matching the glob that the run created and compares them with the number.
    - template: no file[s] matching "{glob}" [is|are] created
      service: true-bdd
      references:
      - file: project-tree
      does: Requires that the run created no file matching the glob.
    - template: the story "{story_file}" has id "{id}"
      service: true-bdd
      references:
      - file: stories
      does: Reads the named Story file after the run and compares its id.
    - template: the story "{story_file}" has feature "{feature}"
      service: true-bdd
      references:
      - file: stories
      does: Reads the named Story file after the run and compares its feature.
    - template: the story "{story_file}" has {count:number} acceptance criteria
      service: true-bdd
      references:
      - file: stories
      does: Counts the named Story's Acceptance Criteria after the run.
    - template: every acceptance criterion in the story "{story_file}" has given, when and then steps
      service: true-bdd
      references:
      - file: stories
      does: Requires every Acceptance Criterion of the named Story to carry given, when and then steps.
    - template: the description of acceptance criterion "{criterion}" of the story "{story_file}" matches
        {expected:pattern}
      service: true-bdd
      references:
      - file: stories
      does: Matches the pattern against the description of the named Acceptance Criterion of the Story.
    - template: the description of acceptance criterion "{criterion}" of the story "{story_file}" does not
        match {unexpected:pattern}
      service: true-bdd
      references:
      - file: stories
      does: Requires the pattern to match nowhere in the description of the named Acceptance Criterion.
    - template: the steps of acceptance criterion "{criterion}" of the story "{story_file}" do not match {unexpected:pattern}
      service: true-bdd
      references:
      - file: stories
      does: Requires the pattern to match none of the steps of the named Acceptance Criterion.
    - template: every step of scenario "{scenario}" in "{registry}" is matched by a step definition under
        "{steps_dir}"
      service: true-bdd
      references:
      - file: registry
      - file: step-definitions
      does: Requires every step of the named Scenario in the Registry to be matched by exactly one step definition
        pattern under the directory.
    - template: exactly {count:number} scenario[s] in "{registry}" come[s] from acceptance criterion "{criterion}"
      service: true-bdd
      references:
      - file: registry
      does: Counts the Registry Scenarios whose lineage names the Acceptance Criterion and compares them with
        the number.
    - template: the scenario from acceptance criterion "{criterion}" in "{registry}" cites the story "{story_file}"
      service: true-bdd
      references:
      - file: registry
      does: Requires the Registry Scenario from the Acceptance Criterion to cite the named Story in its lineage.
    - template: the scenario from acceptance criterion "{criterion}" in "{registry}" is keyed "{key}"
      service: true-bdd
      references:
      - file: registry
      does: Compares the key of the Registry Scenario from the Acceptance Criterion with the named key.
    - template: the scenario from acceptance criterion "{criterion}" in "{registry}" matches {expected:pattern}
      service: true-bdd
      references:
      - file: registry
      does: Matches the pattern against the Registry entry of the Scenario from the Acceptance Criterion.
    - template: no two scenarios in "{registry}" share the same steps
      service: true-bdd
      references:
      - file: registry
      does: Requires that no two Registry Scenarios carry the same merged steps.
    - template: the engine spawned the test runner "{program}"
      service: true-bdd
      references:
      - log_record: spawning-test-runner
      - outgoing_call: suite-command
      does: Requires a Spawning test runner record in the engine log whose binary is the named program.
    - template: the engine spawned a test runner with arguments matching {expected:pattern}
      service: true-bdd
      references:
      - log_record: spawning-test-runner
      - outgoing_call: suite-command
      does: Requires a Spawning test runner record whose args, joined by single spaces, match the pattern.
    - template: the engine spawned exactly {count:number} test runner[s]
      service: true-bdd
      references:
      - log_record: spawning-test-runner
      - outgoing_call: suite-command
      does: Counts the Spawning test runner records in the engine log and compares them with the number.
    - template: the engine spawned exactly {count:number} test runner[s] with arguments matching {expected:pattern}
      service: true-bdd
      references:
      - log_record: spawning-test-runner
      - outgoing_call: suite-command
      does: Counts the Spawning test runner records whose args match the pattern and compares them with the
        number.
    - template: the engine spawned no test runner[s]
      service: true-bdd
      references:
      - log_record: spawning-test-runner
      - outgoing_call: suite-command
      does: Requires no Spawning test runner record in the engine log.
    - template: the engine dispatched {turns:number} AI turn[s]
      service: true-bdd
      references:
      - log_record: dispatching-ai-turn
      - file: engine-log
      does: Counts the Dispatching AI turn records in the engine log and compares them with the number; a
        missing log fails.
    - template: the engine dispatched {turns:number} [validation|fix|apply] AI turn[s] to "{cli}"
      service: true-bdd
      references:
      - log_record: dispatching-ai-turn
      - file: engine-log
      does: Counts the Dispatching AI turn records of the named role (prompt, fix or apply) and CLI and compares
        them with the number.
    - template: the shell command "{shell_command}" run in "{dir}" exits with code {code:number}
      service: true-bdd
      references:
      - file: project-tree
      does: Runs the shell command in the directory of the project tree after the run and compares its exit
        status with the number.
    - template: claude's write policy lets the turn write under "{dir}"
      service: true-bdd
      references:
      - file: write-policy
      - command: claude-guard
      does: Writes the write policy the guard will read, granting writes under the directory.
    - template: claude hands the guard no write policy
      service: true-bdd
      references:
      - command: claude-guard
      does: Has the guard run with no --policy file.
    - template: claude hands the guard an unreadable write policy
      service: true-bdd
      references:
      - file: write-policy
      - command: claude-guard
      does: Writes an invalid JSON write policy for the guard.
    - template: claude hands the guard a write policy with no read root
      service: true-bdd
      references:
      - file: write-policy
      - command: claude-guard
      does: Writes a write policy whose read root is empty.
    - template: claude pipes the hook payload naming the tool "{tool}" and the path "{path}"
      service: true-bdd
      references:
      - command: claude-guard
      does: Sets the hook payload the guard reads on stdin to name the tool and the literal path.
    - template: claude names the tool "{tool}"
      service: true-bdd
      references:
      - command: claude-guard
      does: Sets the tool_name of the hook payload.
    - template: claude names the file "{file}" of the project tree
      service: true-bdd
      references:
      - command: claude-guard
      does: Sets the hook payload's path to the named file joined to the project tree.
    - template: claude names the path "{path}" as written
      service: true-bdd
      references:
      - command: claude-guard
