# Architectural spec for this repository (the TrueBDD engine itself).
#
# Two sections read by the build pipeline, and one by `scen check`:
#   testing:  — the suites `build code` walks and `build tests` writes
#               into. One section for the whole repository, because how
#               a project runs its tests is a property of the project,
#               not of any one service.
#   services: — the production source roots `build code --fix` may edit.
#   terms:    — the word mapping: how each product glossary word is built
#               and how a step definition observes it (`D: term-mappings`).
#
# Path resolved from `documents.architecture_yaml` in true-bdd/true-bdd.yaml.
#
# This repository tests in Go and only in Go: `go-test` for everything. The
# engine still supports `jest` and `playwright` for host projects that
# want them; this repo declares neither.

architecture:
  # How this repository runs its tests, stated once. No suites: a test's
  # service and file are the scenario's own.
  testing:
    framework: go-test
    # Gated behind //go:build bdd with a -mode flag naming a mode per
    # CALLER (`services:` the engine, `tests:` the judge) — not guessable,
    # hence commands:. build code runs replay, which reaches no model.
    commands:
      record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=services:record,tests:record"
      replay: "go test -tags bdd -json -count=1 -timeout=40m ./tests/bdd-cli/ -mode=services:replay,tests:replay"
      live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=services:live,tests:live"

  services:
    - name: bdd-cli
      type: "cli"
      path: services/bdd-cli
      language: go
      frameworks:
        - cobra
      # What this service talks to at runtime: `protocol` is the connection
      # mechanism (cli, http, ws, sql, redis, …); `scope` places it:
      #	internal    — another service declared in this file
      #	self_hosted — we run the instance (redis, postgres, kafka); builds
      #	              use the real thing
      #	third_party — a vendor's service, wherever the binary lives (crush is
      #	              local, GLM's API is not); builds mock these (record/replay)
      dependencies:
        - name: claude
          protocol: cli
          scope: third_party
        # crush and codex are spawned by wrappers the engine owns, so a rebuild
        # regenerates them; replay hashes their argv and stdin, so each states
        # its invocation exactly (docs/qna Q2, Q19).
        - name: crush
          protocol: cli
          scope: third_party
          # binary and args match every crush cassette's `binary` and `argv`.
          invocation:
            binary: crush
            args: [run, --quiet, -m, "{model}", --cwd, "{work_dir}"]
            # Neither CLI has a system-prompt flag, so the system prompt is
            # folded into stdin when it is not blank after trimming whitespace.
            stdin: &folded-prompt
              with_system: "### SYSTEM INSTRUCTIONS (authoritative — follow exactly)\n\n{system_prompt}\n\n### TASK\n\n{user_prompt}"
              without_system: "{user_prompt}"
            values:
              model: &model >-
                The model half of the `<cli>:<model>` reference the turn's tier
                resolves to under `engine.models`, split on the first colon:
                `zhipu-coding/glm-5.2` in every crush cassette.
              work_dir: &work-dir >-
                The directory true-bdd was started in, as an absolute path: the
                host project root. Cassettes record it as `{{CWD}}`.
              system_prompt: &system-prompt The turn's system prompt, rendered from templates/.
              user_prompt: &user-prompt The turn's user prompt, rendered from templates/.
              run_dir: &run-dir >-
                The run's artifact directory, `<paths.tmp_dir>/<YYYY-MM-DD-HH-MM-SS>-<pid>`,
                created at startup.
            dir: "{work_dir}"
            env:
              CRUSH_GLOBAL_CONFIG: >-
                A new `{run_dir}/crush-config-<random>` directory per turn holding
                the generated `crush.json`: `options.data_directory` under that
                directory, `permissions.allowed_tools` for the turn's mode, and
                one `PreToolUse` hook named `true-bdd-guard` whose command is
                this executable's path in single quotes, a space and
                `crush-guard`, with a 15-second timeout.
              TRUE_BDD_CRUSH_POLICY: >-
                The JSON write policy `crush-guard` enforces: the turn's write
                roots and whether it may run bash.
            notes:
              - >-
                crush has no permission gate of its own and runs a tool when its
                hook cannot run, so the engine probes `crush-guard` before every
                turn and refuses the turn unless the probe is denied.
              - >-
                crush silently ignores a model it does not know when the model is
                named in config, so the model travels only as `-m`.
              - >-
                A grandchild of crush's embedded shell can hold stdout open past
                the exit, so the turn runs as its own process group, killed as
                one, with a 10-second bound on the wait after the exit.
              - >-
                stdout and stderr merge into one transcript; a non-zero exit
                fails the turn.
        - name: codex
          protocol: cli
          scope: third_party
          # No codex cassette exists, so this is stated from the wrapper.
          invocation:
            binary: codex
            args:
              - exec
              - -s
              - "{sandbox}"
              - --ephemeral
              - --skip-git-repo-check
              - --color
              - never
              - -C
              - "{work_dir}"
              - -m
              - "{model}"
              - when: >-
                  The turn carries a result schema, as every codex turn does
                  except an apply turn.
                args: [--output-schema, "{schema_path}"]
              - -o
              - "{answer_path}"
              - "-"
            stdin: *folded-prompt
            values:
              sandbox: >-
                `workspace-write` when the turn may write a project tree outside
                the run directory (the apply turn of `build code --fix` and
                `build tests --fix`, which hold write roots); `read-only` for
                every other turn. codex has no level between the two.
              model: *model
              work_dir: *work-dir
              system_prompt: *system-prompt
              user_prompt: *user-prompt
              run_dir: *run-dir
              label: >-
                `codex-turn<NNN>`: NNN is this turn's number, from 1 and
                zero-padded to three digits, among every AI turn the run
                dispatched, whichever CLI ran it.
              schema_path: >-
                `{run_dir}/{label}-codex-schema.json`, written before the spawn
                with the JSON Schema the answer must satisfy.
              answer_path: >-
                `{run_dir}/{label}-codex-answer.md`, where codex writes its final
                message; the engine reads the answer there, never from stdout.
            dir: "{work_dir}"
            notes:
              - >-
                `-s` is mandatory: without a sandbox level `codex exec` blocks on
                an approval prompt and hangs forever.
              - The trailing `-` makes codex read the prompt from stdin.
              - >-
                `--skip-git-repo-check`: a BDD fixture's run directory is no git
                repository, and codex refuses to run outside one without it.
              - >-
                The environment is inherited unchanged. Process group, wait bound
                and merged output are as for crush.

  # How each product word the catalogue declares is built and observed, in
  # words naming no code identifier, so the steps can be rebuilt from it.
  # It grows as Stories claim Scenarios.
  terms:
    - term: engine
      technical: >-
        The `true-bdd` binary, built from `services/bdd-cli` once per test
        session. Every log record it writes goes out twice: as text on stdout,
        and as one JSON line in `tmp/true-bdd.log.json` under the directory
        the command runs in.
      observed_by: >-
        A step about what the engine did reads that JSON log file after the
        run, never stdout; a run that left no log file fails the step instead
        of counting nothing.

    - term: command
      technical: >-
        The quoted text, split into arguments by shell quoting rules and run
        as the engine binary's arguments in a subprocess. Its working
        directory is the run directory assembled from the project tree, its
        stdin carries the answers a Given step set (nothing otherwise), and
        the AI CLIs it finds on its PATH are the harness's record or replay
        stand-ins for the session's mode.
      observed_by: >-
        Run once by the When step, which fails when no Given step prepared a
        project tree. The fixture is handed the command first, so it can
        refuse an empty one or a checklist narrowing the command does not
        read. The run is capped by the Scenario's `timeout:`, five minutes
        when absent; its exit code, stdout, stderr and file changes are kept
        for the Then steps, and a run that could not complete fails the step,
        naming the run directory it left behind.

    - term: project tree
      technical: >-
        A fixture directory `tests/bdd-cli/fixtures/<name>/`. Its `input/` is
        laid over this repository's `true-bdd/` and `templates/` in a fresh
        run directory `tmp/test_run/<session>/<name>/`, the command's working
        directory. Beside `input/` sit `cassettes/` (the recorded AI turns and
        the recorded outcome) and the optional `prep.sh`, `teardown.sh` and
        `checklist-prompts.yaml`.
      observed_by: >-
        Set up by the Given step naming the tree: it loads that fixture, and
        decides per caller where the run's AI turns come from (the fixture's
        cassettes in replay, refusing a fixture with no cassettes or no
        recorded outcome; a staging directory in record; the real CLIs live).
        Nothing runs yet: the run directory is assembled when the When step
        runs the command.

    - term: exit code
      technical: >-
        The engine process's exit status: 1 when the command returns an error
        (a refusal, a failed check, an unusable answer), 0 otherwise.
      observed_by: >-
        The step reads the number and compares it with the kept exit status; a
        mismatch fails the step and names where the run's evidence lives.

    - term: stdout
      technical: >-
        The engine's standard output: console answer lines (banners such as
        `SCEN CHECK`, the report table, `ALL CHECKS PASSED!`) and every log
        record in text form, `time=… level=… msg="…" key=value`.
      observed_by: >-
        The kept stdout, as one string, is asked for a match of the step's
        pattern anywhere in it, or for none; a failed match prints the tail of
        stdout beside the pattern.

    - term: log record
      technical: >-
        One record of the engine's structured log: a level, a message and
        named fields. Message strings and field names are a wire contract the
        BDD report also reads, so a step may pin them.
      observed_by: >-
        Through stdout, by a pattern naming its text form, such as
        `level=ERROR msg="Refusing to start" command="scen check"`; in the
        JSON log file, by its exact message (see engine and AI turn).

    - term: pattern
      technical: >-
        An RE2 regular expression: the step's text after its fixed words,
        verbatim to the end of the step, quotes included.
      observed_by: >-
        Compiled by the step that holds it; one that does not compile fails
        the step rather than matching nothing.

    - term: file change
      technical: >-
        One entry of the run's structural diff of the run directory, taken
        between a snapshot after the directory is assembled and prepared and
        one after the command ends: created, modified or deleted, with its
        path relative to the run directory. Noise directories such as `.git`
        and `node_modules/` are left out of both snapshots.
      observed_by: >-
        A step reads the kept diff. A path lies outside a directory unless it
        is that directory or starts with it plus a slash, so `tmp-x.yaml` is
        outside `tmp`; the step lists every change outside it.

    - term: checklist
      technical: >-
        `true-bdd/checklists/<command stem>.yaml` in the run directory (`scen
        check` reads `scen-check.yaml`): sections of Prompts the command reads
        at startup.
      observed_by: >-
        A fixture narrows a checklist in `checklist-prompts.yaml` at its root,
        mapping a checklist's stem to snippets of its Prompts' questions; the
        harness rewrites the run's copy to keep only the matching Prompts. The
        step checks the fixture declares exactly the one quoted snippet for the
        quoted checklist, and fails when it declares none, several or another.

    - term: Prompt
      technical: >-
        One element of a checklist section's `validation_prompts`: a `Q:`
        question or a `D:` check name, its `rationale`, the `docs` it reads
        and an optional `F:` fix.
      observed_by: >-
        Selected by a snippet of its `Q:` text, which must match exactly one
        Prompt of the checklist.

    - term: AI turn
      technical: >-
        One request through the engine's AI router to claude, crush or codex,
        logged once as msg="Dispatching AI turn" before the CLI is spawned; in
        replay the answer comes from a cassette.
      observed_by: >-
        Count the "Dispatching AI turn" records in the run's JSON log file;
        "no" is zero, and a missing log file fails instead of counting zero.
