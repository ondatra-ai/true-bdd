# Architectural spec for this repository (the TrueBDD engine itself).
#
# Read by `build code`, which walks every (service, layer) pair declared
# under quality_gate.tests and discovers failing tests through that
# layer's framework runner. Path resolved from `documents.architecture_yaml`
# in true-bdd/true-bdd.yaml.

architecture:
  services:
    - name: bdd-cli
      type: "cli"
      path: services/bdd-cli
      language: go
      frameworks:
        - cobra
      # What this service talks to at runtime. `protocol` is the
      # connection mechanism (cli = spawned subprocess over argv/stdio,
      # http, ws, sql, redis, …). `scope` places the dependency:
      #   internal    — another service declared in this file
      #   self_hosted — we run the instance (redis, postgres, kafka);
      #                 builds use the real thing
      #   third_party — a vendor's service is behind it, wherever the
      #                 binary lives (crush is local, GLM's API is not);
      #                 builds mock these (record/replay)
      dependencies:
        - name: claude
          protocol: cli
          scope: third_party
        - name: crush
          protocol: cli
          scope: third_party
        - name: codex
          protocol: cli
          scope: third_party

      quality_gate:
        tests:
          # Fixture harness under tests/bdd-cli/fixtures/. The suite is
          # gated behind `//go:build bdd` and takes its AI mode from a
          # `-mode` flag, neither of which any engine default could have
          # guessed — which is why `commands:` exists. All three modes are
          # mandatory; `build code` runs `replay`, the only one that
          # spawns no model and costs nothing.
          e2e:
            path: tests/bdd-cli
            framework: go-test
            commands:
              record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=record"
              replay: "go test -tags bdd -json -count=1 -timeout=20m ./tests/bdd-cli/ -mode=replay"
              live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/bdd-cli/ -mode=live"

    # Temporarily disabled: only bdd-cli is an active build target for now.
    # Uncomment to bring the web relay back into `build code`.
