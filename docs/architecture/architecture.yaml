# TrueBDD engine architecture. Its module owns all engine code and IO.
# Root tests/tooling and pkg are separate modules; engine libraries are pinned below.
# Cut A deletes services/true-bdd, including its manifests, and rebuilds from these contracts.

architecture:
  # Template inputs are a byte contract beside the CLI invocation contract.
  # fields keys are Go template access paths; [] means a range element.
  # A whole-object read describes its serialised shape, not a wildcard.
  model_rendering: &prompt-rendering >-
    Render Go text/template with Sprig and toYaml = yaml.v3 Marshal, retaining its final newline. Preserve literal bytes, trim markers and YAML-decoded strings; no final trim. Lists retain order; string map keys sort. Both templates receive the same typed data; FormatSteps and FormatUserStories remain methods. Models validate an explicit YAML view without replacing typed Subjects. Question, Rationale and FixTemplate are unchanged decoded checklist values; sketch replacements remain in concept_protocols. Effective nonempty Prompt docs replace defaults; keys resolve through documents unchanged, duplicate keys collapse, map keys sort. Structured follows the resolved CLI result-schema support. ResultPath retains the run join, file-position index and sanitised subject/section naming used by saved artifacts. Schemes resolve through templates.schemes.<model>, default true-bdd/models/<model>.schema.yaml, relative to the host working directory just like template paths; no embedded runtime fallback. Missing or malformed schemes refuse rendering. Before its walk, scen check checks every declared Model's scheme and two template files, and requires its name as a whole word in a Scenario step of its service anywhere in the complete Registry, even when ids select a subset.
  concept_protocols: >-
    Structured concept Q protocols bypass these templates: the Q text plus a JSON-only instruction is the system prompt, and indented JSON is the user prompt. Link embeds the Item id/title, steps with numeric keys and optional criterion ids, and the whole product including roles/glossary. Its schema requires every non-judge step and every own-block concept score (integer 0..10), reason and nullable other_block_concept. with.threshold defaults to 9 and accepts integers 1..10. In scen check, Binding is one turn per binding (concept, block, service) per walk, started once every Scenario has answered the Prompts before it: it supplies product_path for reading the complete product document and embeds every distinct step (block and text, keyed from 1 in block and text order) of the walk's passing links that reached the concept for that service, the service, that one linked means and binding, and the full Public interface; its schema requires that block:name key, an unambiguous boolean and reason, and each Scenario's cell grades the verdicts of the bindings its link reached. build steps starts its own walk and shares Item steps before using the same binding judgement. In scen check, Words is one turn per linked concept per walk embedding the product and that concept; in us refine one turn per Story embeds the item id, the product and every linked concept. A shared turn's artifacts are named shared-<index> <judgement> <key>, and each walk validation round, --fix ones included, judges afresh. Raw model answers are saved as model-answer.txt, and the engine-derived canonical answer/context JSON is saved in both response.txt and result.yaml for the coverage census. Links live only in the current walk Item. Walking orders D prompts, then concept links, then other Q prompts, preserving file-position indices; a host declaring no concepts omits the concept cells and keeps its order.
  prompt_data:
    fix_generator:
      rendering: *prompt-rendering
      fields:
        Subject: >-
          Complete StoryRefineData serialized with the same Story fields and exclusions as checklist.Subject, only for a structured concept repair.
        SubjectID: >-
          Selected Story id, unchanged.
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        DocPaths: &docpaths >-
          Failed check effective docs resolved to config path strings by the same resolver as Docs. Duplicate keys collapse; resolution errors warn and skip; template ranges lexically by key, displaying keys unchanged. Empty map renders no Read lines; paths retain configured ./ and are not made absolute.
        FailedCheck.ActualAnswer: &failedcheck-actualanswer >-
          Model JSON answer is copied unchanged; YAML scalar answer is TrimSpace, YAML mapping or sequence is yaml.Marshal with trailing newline bytes removed. Status classification alone lowercases and trims. Built-in or runtime failures supply literal fail.
        FailedCheck.Context: &failedcheck-context >-
          Failed result observation strings in original list order, without trimming or joining; built-in checks supply their finding lines. After a fix whose commit was refused (runner.ErrFixNotTaken), the same subject and Prompt's next failed result gains one last line, that refusal's error text unchanged; a passing result drops it. Template prefixes each with "- "; an empty list produces no findings.
        FailedCheck.FixPrompt: &failedcheck-fixprompt >-
          Failed model result fix_prompt is TrimSpace after JSON/YAML decoding; pass discards it. Built-in and structured concept failures use TrimSpace of F; the template inserts it unchanged, even if empty.
        FailedCheck.Question: &failedcheck-question >-
          Evaluated Q text, including the concept-sketch replacement and embedded context when active; otherwise unchanged, including a trailing YAML block newline. For a built-in check, "D: " plus the trimmed D name.
        FailedCheck.SectionPath: &failedcheck-sectionpath >-
          Checklist command stem (us-refine, us-apply, build-steps, build-code or scen-check), with "/" plus the checklist sections[].id only when nonempty. The runner calls these SectionID and CriterionID respectively; display is unsanitised, while artifact filenames sanitise the entire combined path.
        ResultPath: &generation-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/<failed Prompt index zero-padded to at least 2 digits>-<safe subject id>-fix-prompts.md. Reused across clarification/refinement iterations; iteration appears only in saved debug filenames, not this rendered path.
        Structured: &structured >-
          Run boolean from the resolved role model CLI: true for both supported CLIs, claude and codex. Validation and generation pass the same populated data to both templates; appliers never receive this field.
        Subject.AcceptanceCriteria: &subject-acceptancecriteria >-
          Subject Story criteria in file list order, never sorted; generator numbers them index+1, applier lists ids and descriptions without numbering. Empty emits no entries.
        Subject.AcceptanceCriteria[].Description: &subject-acceptancecriteriaitem-description >-
          Subject criterion description scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].ID: &subject-acceptancecriteriaitem-id >-
          Subject criterion id scalar unchanged; no trim or escaping before interpolation.
        Subject.AcceptanceCriteria[].Steps: >-
          Subject criterion steps in file list order; missing/empty selects NONE in generation. Applier reads only criterion ids/descriptions, not these steps.
        Subject.AcceptanceCriteria[].Steps[].Given: >-
          Subject given statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Given[].Statement: &subject-acceptancecriteriaitem-stepsitem-givenitem-statement >-
          Subject statement text, YAML-decoded unchanged. Template interpolates it without YAML escaping; Q-fix quotes it, closure-fix prints raw text.
        Subject.AcceptanceCriteria[].Steps[].Given[].Type: &subject-acceptancecriteriaitem-stepsitem-givenitem-type >-
          Subject modifier: empty for scalar, literal and or but for a one-key mapping. Q-fix prints it in parentheses when nonempty; closure-fix omits it.
        Subject.AcceptanceCriteria[].Steps[].Then: >-
          Subject then statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].Then[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].Then[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AcceptanceCriteria[].Steps[].When: >-
          Subject when statements in list order. A scalar block is accepted as a singleton; within each step object the template visits Given, When, Then. Empty prints no statements.
        Subject.AcceptanceCriteria[].Steps[].When[].Statement: *subject-acceptancecriteriaitem-stepsitem-givenitem-statement
        Subject.AcceptanceCriteria[].Steps[].When[].Type: *subject-acceptancecriteriaitem-stepsitem-givenitem-type
        Subject.AsA: &subject-asa >-
          Subject Story as_a scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.ID: &story-id >-
          Subject Story id scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.IWant: &subject-iwant >-
          Subject Story i_want scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.SoThat: &subject-sothat >-
          Subject Story so_that scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.Title: &subject-title >-
          Subject Story title scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        UserAnswers: &useranswers >-
          Run map of question id to answer, initially empty; later answers overwrite matching ids across clarification rounds. UI trims each answer, substitutes a valid positive numbered option (option text is not trimmed), and free text or an out-of-range number is retained after trimming; an interactive blank line stays empty; EOF at a clarification stops before another AI request. Refinement stores feedback lines (each trimmed, joined by newline) at _user_refinement. Map range is lexical by id, excludes that reserved key from bullets, and prints it separately as feedback; empty values are false in template conditionals.
    fix_generator_system:
      rendering: *prompt-rendering
      fields:
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        Structured: *structured
    fix_applier:
      rendering: *prompt-rendering
      fields:
        Subject: >-
          StoryRefineData serialised with the same Story shape and exclusions as checklist.Subject; used for an approved concept-link step rewrite.
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        FixPrompt: &fixprompt >-
          Run-selected generated fix, unchanged at applier construction. JSON generation TrimSpace; marker generation extracts between matching FILE markers, TrimSpace, strips a whole wrapping backtick/tilde code fence and TrimSpace again. Clarification/refinement replaces the fix only when a nonempty new fix is returned; no further applier trim.
        ResultPath: &application-result-path >-
          Run result path: run_dir is the cleaned paths.tmp_dir/date-pid join described in invocation.values.run_dir (./tmp yields tmp/<run>, relative; an absolute configured tmp_dir stays absolute); cassettes normalise its date-pid segment to {{RUN_DIR}}. Filename sanitising replaces each run of characters outside [A-Za-z0-9._-] with one hyphen; no other escaping. Subject id has the same command-specific source as the validation path. Format is <run_dir>/apply-<safe subject id>-iter<n>-result.yaml, where n counts applies from 1 across every Item and Cell in this runner. No checklist section or Prompt index here.
        Subject.AcceptanceCriteria: *subject-acceptancecriteria
        Subject.AcceptanceCriteria[].Description: *subject-acceptancecriteriaitem-description
        Subject.AcceptanceCriteria[].ID: *subject-acceptancecriteriaitem-id
        Subject.AsA: *subject-asa
        Subject.ID: *story-id
        Subject.IWant: *subject-iwant
        Subject.SoThat: *subject-sothat
        Subject.Status: >-
          Subject Story status scalar from the selected file's story block, YAML-decoded unchanged (no trim); empty prints blank.
        Subject.TermDocuments: &subject-termdocuments >-
          Run working copies seeded under --fix, product then architecture_yaml, skipping absent/unresolvable documents. Empty outside fix mode. Template retains this list order, without sorting; word judgements expose only the product working copy.
        Subject.TermDocuments[].Key: &subject-termdocumentsitem-key >-
          Config document key, product or architecture_yaml, unchanged.
        Subject.TermDocuments[].Path: &subject-termdocumentsitem-path >-
          Config documents.<key> path unchanged, including ./; it names the canonical document.
        Subject.TermDocuments[].Scratch: &subject-termdocumentsitem-scratch >-
          Run path: filepath.Join(run_dir, key+".yaml"), cleaned (./tmp becomes tmp), relative when run_dir is relative; seeded by copying the canonical document.
        Subject.Title: *subject-title
    fix_applier_system:
      rendering: *prompt-rendering
      fields:
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        ResultPath: *application-result-path
    apply_fix_generator:
      rendering: *prompt-rendering
      fields:
        DocPaths: *docpaths
        FailedCheck.ActualAnswer: *failedcheck-actualanswer
        FailedCheck.FixPrompt: *failedcheck-fixprompt
        FailedCheck.Question: *failedcheck-question
        FailedCheck.SectionPath: *failedcheck-sectionpath
        ResultPath: *generation-result-path
        Structured: *structured
        Subject.ACID: &subject-acid >-
          Subject criterion id as written (<NNN>-<slug>), not its position.
        Subject.Description: &criterion-description >-
          Subject criterion description, YAML-decoded unchanged, no trimming.
        Subject.FormatSteps: &criterion-steps >-
          Subject criterion steps flattened by block in file list order. A scalar statement is unchanged; a mapping becomes its first key + " " + value (the parser accepts at least one pair). Method emits nonempty blocks in Given, When, Then order, each "<Block>:\n" followed by "  - <text>\n" per step. Empty blocks are omitted; entirely empty returns "". No trimming, quoting or escaping.
        Subject.LineageScenarioID: &subject-lineagescenarioid >-
          Requested Story id + "-" + criterion id, unchanged; never derived from criterion position.
        Subject.RequirementsScratchPath: &subject-requirementsscratchpath >-
          Run filepath.Join(run_dir, "scenarios.yaml"), a cleaned relative path for relative tmp_dir; copied from config documents.scenarios_yaml before parsing the Story.
        Subject.StoryID: &subject-storyid >-
          Requested Story id, validated against the declaring file, unchanged.
        Subject.StoryPath: &subject-storypath >-
          Subject file path found among <id>-*.yaml files declaring the requested id under config paths.stories_dir; filepath.Join cleans it and retains relative/absolute form.
        SubjectID: >-
          Run subject identifier, unchanged for display: Story id + "-" + criterion id (the lineage id). Only artifact filenames sanitise it.
        UserAnswers: *useranswers
    apply_fix_generator_system:
      rendering: *prompt-rendering
      fields: &checklist-system-fields
        Structured: *structured
    apply_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: *fixprompt
        ResultPath: *application-result-path
        Subject.ACID: *subject-acid
        Subject.Description: *criterion-description
        Subject.FormatSteps: *criterion-steps
        Subject.LineageScenarioID: *subject-lineagescenarioid
        Subject.RequirementsScratchPath: *subject-requirementsscratchpath
        Subject.StoryID: *subject-storyid
        Subject.StoryPath: *subject-storypath
    apply_fix_applier_system:
      rendering: *prompt-rendering
      fields: &apply-fix-applier-system-fields
        ResultPath: *application-result-path
    build_steps_fix_generator:
      rendering: >-
        Build steps uses the shared Fix loop. An Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Subject.Context: YAML semantic core (Concept, binding, glossary entries, Word mappings, complete Public interface,
          definitions, patterns, captures and every bound step), Registry path, Scenario keys, fixture_root and fixture_inputs
          directory names. Confined reads admit Specification, suite and declared libraries, never service source;
          write grants stay unchanged. Codex body profiles set PWD to the canonical Host root for Go directory resolution.
          No digests, compaction or truncation.
        Subject.Concept.Name: Verbatim concept name.
        Subject.Concept.Block: Concept block.
        Subject.Concept.Means: Verbatim concept meaning.
        Subject.Label: The concept Item's label, its block and quoted concept name.
        FailedCheck.Context: Every finding from the last per-Item compile, binding, body and critique check.
        DocPaths: Configured document paths.
        FailedCheck.ActualAnswer: Latest answer.
        FailedCheck.FixPrompt: Failed Prompt fix guidance.
        FailedCheck.Question: Failed Prompt.
        FailedCheck.SectionPath: Checklist section.
        ResultPath: Result artifact path.
        Structured: Provider structured answer selection.
        Subject.Suite: Suite steps directory.
        Subject.Service: Service name.
        SubjectID: Stable concept and suite Item id, its block and concept name joined by a hyphen, prefixed by its suite when two suites hold that concept.
        UserAnswers: Prior clarification answers.
    build_steps_fix_generator_system:
      rendering: >-
        Build steps uses the shared Fix loop. An Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Structured: Provider structured answer selection.
    build_steps_fix_applier:
      rendering: >-
        Build steps uses the shared Fix loop. An Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        Subject.Context: Whole concept context, identical to the proposal turn.
        FixPrompt: Approved proposal.
        ResultPath: Confirmation artifact path.
        Subject.Suite: Suite steps directory.
        Subject.Service: Service name.
        Subject.Concept.Name: Verbatim concept name.
        Subject.Concept.Block: Concept block.
        Subject.Concept.Means: Verbatim concept meaning.
        Subject.Label: The concept an interface_cannot_serve verdict names, its block and quoted name.
    build_steps_fix_applier_system:
      rendering: >-
        Build steps uses the shared Fix loop. An Item is a concept and suite whose patterns the proposal Prompt supplied and the engine checked. All skeletons precede the first turn. Turns read the Specification and tests only, never service implementation, and do not execute Scenarios against the target. Compilation uses inherited caches. Body checks precede whole-suite coverage and listing.
      fields:
        ResultPath: Confirmation artifact path.
        Subject.Label: The concept an interface_cannot_serve verdict names, its block and quoted name.
    build_steps_critique:
      rendering: >-
        After a completed apply whose compilation, binding and body checks pass, before the Item can pass, a separate read-only prompt-role turn reads the selected definition; an apply those checks fail goes back to the Fix loop without it. Claude's file and shell tools are disabled; Codex uses the standard read-only validation sandbox. Only that definition, imports and shared State may change; the existing suite shape check rejects other definition edits. All suite steps-package Go files are embedded in lexical path order, whole, with path headings, so shared State and helper context are visible even when compilation fails. The semantic core stays embedded; fixture contracts are filtered by source or bound captures. Findings append to the Item's existing compile, binding and body findings and return through D: step-coverage to the same bounded Fix loop. A pattern_captures or pattern_scope finding first sends the Item back to the concept-patterns Prompt, its refusal the Item's current patterns and every such finding prefixed critique:, within max_apply_attempts proposals of the engine's check; the engine then removes each skeleton whose pattern the proposal dropped with its registration, keeps an unchanged one, writes the new ones, compiles, renders the Item's context again and adds a pending-body finding. A malformed verdict stops the walk. The build-steps checklist engine.critique_model tier overrides engine.default_prompt_model; templates and tier validate before any skeleton or runner. No prompt budget is stated. Each apply saves critique-<Item id>-<apply count>-{system,user,response}.txt under the run directory.
      fields:
        Definition: >-
          Every definition of the concept Item, each its engine file path joined with :: and its function name, joined with commas.
        Context: Semantic core, every bound step and fixture contracts selected by source basename or bound captures,
          always including prep.sh, teardown.sh and checklist-prompts.yaml. Scenario keys retain provenance; Registry
          path and unrelated Scenario blocks or fixture files are omitted. No digests or truncation.
        Sources: Whole suite steps-package Go files in lexical path order with path headings, including the definition, imports, registrations and shared State.
    build_steps_critique_system:
      rendering: >-
        Static semantic review policy and JSON verdict contract. Answer pass with no findings, or fail with at least one finding. Each finding requires a nonempty definition, category and finding. The patterns are an AI's proposal, checked by the engine only for binding, and are judged as well as the bodies: the categories are pattern_captures and pattern_scope against a pattern, and concept_binding, concept_meaning and computes_assertion against a body, judged against the binding, each pattern's bound steps and the bound Scenarios' fixture inputs. The binding criterion follows the concept's block: when calls its operation, given puts the state in place, then observes and compares; not every definition must itself call a command. A body requiring anything beyond its binding and those fixture inputs is a concept_binding finding. Unusable replies are errors, never passes.
      fields: {}
    build_code_checklist:
      rendering: *prompt-rendering
      fields: {}
    build_code_checklist_system:
      rendering: *prompt-rendering
      fields: {}
    build_code_fix_generator:
      rendering: *prompt-rendering
      fields:
        WriteRoots: >-
          The remaining failing set's declared service paths and exact writable entries; unknown-service failures use all service declarations. Services are sorted by name, each path precedes its writable list, and equal grants are deduplicated. Host tmp is operational scratch. No protected tests or step definitions (as defined by writable paths) may overlap a grant.
        DocPaths: >-
          Resolved configured Specification paths, keyed by document key.
        FailedCheck.ActualAnswer: >-
          Engine verdict, fail.
        FailedCheck.FixPrompt: >-
          Shipped F: plan guidance, unchanged.
        FailedCheck.Question: >-
          D: tests-pass.
        FailedCheck.SectionPath: >-
          Checklist stem and section, unchanged.
        ResultPath: >-
          Cell generation artifact path, with the sanitized stable Item id; clarification iteration artifacts are overwritten by a later repair of the same Cell.
        Structured: >-
          Provider result-schema support; controls the JSON answer contract.
        Subject.Tests: >-
          Remaining failing members, sorted by discovery id; passing members leave after each completed apply.
        Subject.Tests[].ID: >-
          Discovery BuildID: empty service + / + framework + / + framework + : + native id with slashes folded to dots and spaces to underscores. Enrichment never rebuilds it.
        Subject.Tests[].Service: >-
          Sole architecture service name when one exists, overridden by an exactly matched Go Registry Scenario service; otherwise empty, displayed as none is known.
        Subject.Tests[].Suite: >-
          Architecture testing.framework, unchanged.
        Subject.Tests[].Framework: >-
          Architecture testing.framework: go-test, jest or playwright.
        Subject.Tests[].TestName: >-
          Native id: Go package::function or package::<build>; Jest repository-relative file::fullName or file::<load>; Playwright file::title chain joined by > with surrounding spaces, or <startup>.
        Subject.Tests[].FilePath: >-
          Go package import path; Jest file rebased against process cwd when absolute; Playwright deepest nonempty suite/spec file, or startup config Path.
        Subject.Groups: >-
          Remaining failures grouped by shared runtime normalization: test identity, Scenario heading, source prefixes and runner elapsed times are ignored for comparison only. Group order follows first member.
        Subject.Groups[].IDs: >-
          Every member id in this group, in discovery order, joined with comma and space.
        Subject.Groups[].Output: >-
          The whole first member output, untrimmed. Go concatenates test output or compiler and package output; Jest joins failureMessages by newline; Playwright retains failed attempts with errors, stacks, stdout and stderr. Missing own results say did not run; a selected Go test with no output because its package failed to build also carries the compiler and package output. Refreshed after every apply.
        Subject.Documents: >-
          Configured product, architecture_yaml and scenarios_yaml paths available through the resolver, with architecture from the command argument. Optional unavailable documents warn and are omitted; map renders in key order.
        Subject.Scenarios: >-
          Each matched remaining Registry Scenario once, in member order; only exact module-aware Go package::CamelCase matches enrich members. No guessing for subtests, synthetic or non-Go members.
        Subject.Scenarios[].ID: >-
          Registry key, unchanged.
        Subject.Scenarios[].Description: >-
          Registry description, unchanged.
        Subject.Scenarios[].Service: >-
          Registry service, unchanged.
        Subject.Scenarios[].Path: >-
          Registry path, unchanged.
        Subject.Scenarios[].FormatSteps: >-
          All original Given, When and Then steps, in Registry order, with their block headings.
        Subject.Specification: >-
          Union of the remaining members Specifications in discovery order: the concepts their steps link to. An optional unreadable or concept-less product leaves it empty without dropping matched Scenarios.
        Subject.Specification.Terms: >-
          Each declared word once, in first-reached order across members: the linked concepts' words.
        Subject.Specification.Terms[].Term: >-
          Declared word, unchanged.
        Subject.Specification.Terms[].Means: >-
          All glossary definitions for this word in source order, or a missing-definition sentence.
        Subject.Specification.Terms[].Mappings: >-
          All architecture word mappings in source order, or a missing-mapping sentence.
        Subject.Specification.Terms[].Mappings[].Technical: >-
          Mapping technical text, unchanged.
        Subject.Specification.Terms[].Mappings[].ObservedBy: >-
          Mapping observed_by text, unchanged.
        Subject.Specification.Concepts: >-
          Each concept a remaining member's Scenario links to once, in first-linked order across members: for each deterministic step in Registry order (judge: and llm: excluded), the step definition it alone binds in its Scenario's suite (stepcoverage.LoadSuite of the path's steps directory) and the //truebdd:concept record on that definition (stepskeleton.Concepts, matched by registered pattern) naming a concept the product declares under the step's block. A step binding none or two definitions, an unrecorded definition, or a record naming an undeclared or other-block concept links nothing; an unreadable suite warns and links nothing.
        Subject.Specification.Concepts[].Concept: >-
          Product concept name, unchanged.
        Subject.Specification.Concepts[].Block: >-
          The concept's block: given, when or then.
        Subject.Specification.Concepts[].Means: >-
          Product concept means, unchanged.
        Subject.Specification.Concepts[].Terms: >-
          The concept's declared terms in product order, joined by comma and space, or none.
        Subject.Specification.Concepts[].Bindings: >-
          Every architecture.concepts entry with the concept's name and block and the linking Scenario's service, in document order; a concept linked from several members' services joins each service's bindings once, first-seen order. Empty renders that the architecture binds it for no service of these steps.
        Subject.Specification.Concepts[].Bindings[].Service: >-
          Binding service, unchanged.
        Subject.Specification.Concepts[].Bindings[].References: >-
          Each Public interface reference as its key and value (command: halve), in binding order, joined by comma and space.
        Subject.Specification.Concepts[].Bindings[].Does: >-
          Binding does sentence, unchanged; rendered when no intent is given.
        Subject.Specification.Concepts[].Bindings[].Intent: >-
          Binding intent, unchanged; rendered instead of references and does when present.
        SubjectID: >-
          Stable Item id: discovery BuildID for a singleton, failing-set otherwise. Membership changes do not change it within the walk.
        UserAnswers: >-
          Clarification answers by question id; _user_refinement carries the persons feedback.
    build_code_fix_generator_system:
      rendering: *prompt-rendering
      fields: *checklist-system-fields
    build_code_fix_applier:
      rendering: *prompt-rendering
      fields:
        FixPrompt: >-
          The person-approved repair plan, unchanged.
        ResultPath: >-
          Per-turn apply confirmation artifact path, with the sanitized stable Item id.
          The writer ends its final message with the FILE_START/FILE_END block
          in the message itself. The heading names where the engine saves
          extracted content; the writer never writes that path itself.
          A successful response with no extractable block follows PostNotApplied
          in build code alone, preserving files, warning once with this path
          and rerunning the remaining set. Started codex or Claude writer failures also follow the not-applied rerun; other provider failures remain fatal;
          malformed extracted content retains its existing handling.
        Subject.Tests: >-
          Remaining failing members, sorted by discovery id; passing members leave after each completed apply.
        Subject.Tests[].ID: >-
          Discovery BuildID: empty service + / + framework + / + framework + : + native id with slashes folded to dots and spaces to underscores. Enrichment never rebuilds it.
        Subject.Tests[].Service: >-
          Sole architecture service name when one exists, overridden by an exactly matched Go Registry Scenario service; otherwise empty, displayed as none is known.
        Subject.Tests[].Suite: >-
          Architecture testing.framework, unchanged.
        Subject.Tests[].Framework: >-
          Architecture testing.framework: go-test, jest or playwright.
        Subject.Tests[].TestName: >-
          Native id: Go package::function or package::<build>; Jest repository-relative file::fullName or file::<load>; Playwright file::title chain joined by > with surrounding spaces, or <startup>.
        Subject.Tests[].FilePath: >-
          Go package import path; Jest file rebased against process cwd when absolute; Playwright deepest nonempty suite/spec file, or startup config Path.
        Subject.Groups: >-
          Remaining failures grouped by shared runtime normalization: test identity, Scenario heading, source prefixes and runner elapsed times are ignored for comparison only. Group order follows first member.
        Subject.Groups[].IDs: >-
          Every member id in this group, in discovery order, joined with comma and space.
        Subject.Groups[].Output: >-
          The whole first member output, untrimmed. Go concatenates test output or compiler and package output; Jest joins failureMessages by newline; Playwright retains failed attempts with errors, stacks, stdout and stderr. Missing own results say did not run; a selected Go test with no output because its package failed to build also carries the compiler and package output. Refreshed after every apply.
        Subject.Documents: >-
          Configured product, architecture_yaml and scenarios_yaml paths available through the resolver, with architecture from the command argument. Optional unavailable documents warn and are omitted; map renders in key order.
        Subject.Scenarios: >-
          Each matched remaining Registry Scenario once, in member order; only exact module-aware Go package::CamelCase matches enrich members. No guessing for subtests, synthetic or non-Go members.
        Subject.Scenarios[].ID: >-
          Registry key, unchanged.
        Subject.Scenarios[].Description: >-
          Registry description, unchanged.
        Subject.Scenarios[].Service: >-
          Registry service, unchanged.
        Subject.Scenarios[].Path: >-
          Registry path, unchanged.
        Subject.Scenarios[].FormatSteps: >-
          All original Given, When and Then steps, in Registry order, with their block headings.
        Subject.Specification: >-
          Union of the remaining members Specifications in discovery order: the concepts their steps link to. An optional unreadable or concept-less product leaves it empty without dropping matched Scenarios.
        Subject.Specification.Terms: >-
          Each declared word once, in first-reached order across members: the linked concepts' words.
        Subject.Specification.Terms[].Term: >-
          Declared word, unchanged.
        Subject.Specification.Terms[].Means: >-
          All glossary definitions for this word in source order, or a missing-definition sentence.
        Subject.Specification.Terms[].Mappings: >-
          All architecture word mappings in source order, or a missing-mapping sentence.
        Subject.Specification.Terms[].Mappings[].Technical: >-
          Mapping technical text, unchanged.
        Subject.Specification.Terms[].Mappings[].ObservedBy: >-
          Mapping observed_by text, unchanged.
        Subject.Specification.Concepts: >-
          Each concept a remaining member's Scenario links to once, in first-linked order across members: for each deterministic step in Registry order (judge: and llm: excluded), the step definition it alone binds in its Scenario's suite (stepcoverage.LoadSuite of the path's steps directory) and the //truebdd:concept record on that definition (stepskeleton.Concepts, matched by registered pattern) naming a concept the product declares under the step's block. A step binding none or two definitions, an unrecorded definition, or a record naming an undeclared or other-block concept links nothing; an unreadable suite warns and links nothing.
        Subject.Specification.Concepts[].Concept: >-
          Product concept name, unchanged.
        Subject.Specification.Concepts[].Block: >-
          The concept's block: given, when or then.
        Subject.Specification.Concepts[].Means: >-
          Product concept means, unchanged.
        Subject.Specification.Concepts[].Terms: >-
          The concept's declared terms in product order, joined by comma and space, or none.
        Subject.Specification.Concepts[].Bindings: >-
          Every architecture.concepts entry with the concept's name and block and the linking Scenario's service, in document order; a concept linked from several members' services joins each service's bindings once, first-seen order. Empty renders that the architecture binds it for no service of these steps.
        Subject.Specification.Concepts[].Bindings[].Service: >-
          Binding service, unchanged.
        Subject.Specification.Concepts[].Bindings[].References: >-
          Each Public interface reference as its key and value (command: halve), in binding order, joined by comma and space.
        Subject.Specification.Concepts[].Bindings[].Does: >-
          Binding does sentence, unchanged; rendered when no intent is given.
        Subject.Specification.Concepts[].Bindings[].Intent: >-
          Binding intent, unchanged; rendered instead of references and does when present.
        WriteRoots: >-
          The remaining failing set's service paths and exact writable entries, in the same order as the planner's roots. Unknown-service failures use every service. Grants are revalidated as passing members leave.
        CodexWriter: >-
          True only for an explicitly requested build-code codex writer; selects native process polling; the Claude branch requires foreground completion.
        TestCommand: >-
          Codex and explicitly requested Claude build-code writers get the configured canonical replay forms; nil for other Claude turns or an unrepresentable command. Codex polls its native process tool; Claude requires foreground completion and receives the shell-quoted suite-directory cd prefix before rendering.
        TestCommand.Command: >-
          Canonical replay command without machine-output flags, per ADR-0018.
        TestCommand.Selector: >-
          Framework selector: -run, --testNamePattern or --grep.
        TestCommand.Dir: >-
          Absolute suite working directory from testing.config, or the project root.
    build_code_fix_applier_system:
      rendering: *prompt-rendering
      fields: {}
    scen_check_fix_generator:
      rendering: *prompt-rendering
      fields:
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        DocPaths: *docpaths
        FailedCheck.ActualAnswer: *failedcheck-actualanswer
        FailedCheck.Check: &failedcheck-check >-
          TrimSpace of the checklist D name; empty for a model Q. Selects the model-fix wording when empty, the public-interface wording, or the concept document wording of declared-terms, term-mappings, step-definitions and concept-bindings.
        FailedCheck.Context: *failedcheck-context
        FailedCheck.FixPrompt: *failedcheck-fixprompt
        FailedCheck.Question: *failedcheck-question
        FailedCheck.Rationale: &failedcheck-rationale >-
          Checklist rationale scalar copied unchanged to the failed result, including YAML block newlines; printed without trimming.
        FailedCheck.SectionPath: *failedcheck-sectionpath
        ResultPath: *generation-result-path
        Structured: *structured
        Subject.Description: &registry-description >-
          Subject description from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items are selected and fixes offered in ascending id order; scen check may validate them concurrently.
        Subject.FormatSteps: &registry-steps >-
          Subject Registry merged_steps: scalar strings unchanged; and/but mappings display their original key + " " + value. Keep within-block order, group Given then When then Then, omit empty blocks; method returns "<Block>:\n" and "  - <text>\n" per line, including a final newline, or "" for no steps. No trimming, escaping or quoting.
        Subject.FormatUserStories: &subject-formatuserstories >-
          Subject lineage projected from Registry user_stories in list order, dropping merge_date. Empty returns "(none — no story claims this scenario)\n"; otherwise each line is "  - <story> (<scenario_id>)\n", with strings unchanged.
        Subject.ID: &registry-id >-
          Subject Registry map key from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items are selected and fixes offered in ascending id order; scen check may validate them concurrently.
        Subject.InterfaceDocuments: &subject-interfacedocuments >-
          Run working copies seeded under --fix of each cli or http document the architecture's public_interface declarations name, in service order, each path once. Empty outside fix mode or without an architecture document.
        Subject.InterfaceDocuments[].Path: &subject-interfacedocumentsitem-path >-
          The document path as the declaration states it, relative to the Host project root; it names the canonical document.
        Subject.Path: &subject-scenario-path >-
          Registry path, YAML-decoded unchanged.
        Subject.Service: &registry-service >-
          Subject service from the Registry, YAML-decoded unchanged; missing strings are empty. Registry Items are selected and fixes offered in ascending id order; scen check may validate them concurrently.
        SubjectID: &registry-subject-id >-
          Run subject identifier, unchanged for display: Registry Scenario id. Only artifact filenames sanitise it.
        UserAnswers: *useranswers
    scen_check_fix_generator_system:
      rendering: *prompt-rendering
      fields:
        FailedCheck.Judgement: >-
          The structured Q protocol from with.concepts: link, bindings or words, empty for ordinary Q and D prompts. Selects concept repair wording; no earlier link is trusted.
        FailedCheck.Check: *failedcheck-check
        Structured: *structured
        Subject.Service: *registry-service
        ResultPath: *generation-result-path
    scen_check_fix_applier:
      rendering: *prompt-rendering
      fields:
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        Subject.Service: *registry-service
        Check: &check >-
          Failed result D name carried unchanged into the applier; empty for a model Q. Selects Scenario rewrite versus term-document fix; public-interface and concept-bindings select application to the architecture and the Public interface documents it names.
        FixPrompt: *fixprompt
        ResultPath: *application-result-path
        Subject.Description: *registry-description
        Subject.FormatSteps: *registry-steps
        Subject.ID: *registry-id
        Subject.InterfaceDocuments: *subject-interfacedocuments
        Subject.InterfaceDocuments[].Path: *subject-interfacedocumentsitem-path
        Subject.InterfaceDocuments[].Scratch: >-
          Run path: filepath.Join(run_dir, "interface-<n>-<basename>"), n counting the listed documents from 1; seeded by copying the canonical document. A public-interface or concept-bindings fix that changed it commits it, once it parses in the form of its kind, before the architecture.
        Subject.RegistryDocument: >-
          Run Registry working-copy pointer, seeded under --fix; nil otherwise. with omits its line when nil.
        Subject.RegistryDocument.Key: >-
          Config document key scenarios_yaml, unchanged.
        Subject.RegistryDocument.Path: *subject-termdocumentsitem-path
        Subject.RegistryDocument.Scratch: *subject-termdocumentsitem-scratch
        Subject.TermDocuments: *subject-termdocuments
        Subject.TermDocuments[].Key: *subject-termdocumentsitem-key
        Subject.TermDocuments[].Path: *subject-termdocumentsitem-path
        Subject.TermDocuments[].Scratch: *subject-termdocumentsitem-scratch
        Subject.Writes: &subject-writes >-
          Method called with literal architecture_yaml; true exactly when a TermDocuments element has that key, otherwise false. Controls whether architecture.terms is mentioned, never prints the boolean.
    scen_check_fix_applier_system:
      rendering: *prompt-rendering
      fields:
        Judgement: >-
          The failed structured Q protocol, carried unchanged to the approved applier; empty retains legacy wording.
        Check: *check
        Subject.Writes: *subject-writes

  # How this repository runs its tests, stated once. No suites: a test's
  # service and file are the scenario's own.
  testing:
    testkit:
      ai_clis: [claude, codex]
    libraries:
      - module: gopkg.in/yaml.v3
        version: v3.0.1
      - module: znkr.io/diff
        version: v1.0.1
    framework: go-test
    commands:
      record: "go test -tags bdd -json -count=1 -timeout=180m ./tests/true-bdd/ -mode=services:record,tests:record"
      replay: "go test -tags bdd -json -count=1 -timeout=40m ./tests/true-bdd/ -mode=services:replay,tests:replay"
      live: "go test -tags bdd -json -count=1 -timeout=180m ./tests/true-bdd/ -mode=services:live,tests:live"

