# Architectural spec for this repository (the TrueBDD engine itself).
#
# Read by `build code`, which walks every (service, layer) pair declared
# under quality_gate.tests and discovers failing tests through that
# layer's framework runner. Path resolved from `documents.architecture_yaml`
# in true-bdd/true-bdd.yaml.

architecture:
  services:
    - name: bdd-cli
      type: "cli"
      path: services/bdd-cli
      language: go
      frameworks:
        - cobra
      # What this service talks to at runtime. `protocol` is the
      # connection mechanism (cli = spawned subprocess over argv/stdio,
      # http, ws, sql, redis, …). `scope` places the dependency:
      #   internal    — another service declared in this file
      #   self_hosted — we run the instance (redis, postgres, kafka);
      #                 builds use the real thing
      #   third_party — a vendor's service is behind it, wherever the
      #                 binary lives (crush is local, GLM's API is not);
      #                 builds mock these (record/replay)
      dependencies:
        - name: claude
          protocol: cli
          scope: third_party
        - name: crush
          protocol: cli
          scope: third_party
        - name: codex
          protocol: cli
          scope: third_party

      quality_gate:
        tests:
          # Fixture harness under tests/bdd-cli/fixtures/. NOTE: the suite
          # is gated behind `//go:build bdd`, which the go-test runner does
          # not pass — only the untagged packages here are discoverable.
          e2e:
            path: tests/bdd-cli
            framework: go-test

    - name: bdd-web
      path: services/bdd-web
      type: "web:frontend"
      language: typescript
      frameworks:
        - next.js
        - react

      design_system:
        path: services/bdd-web/design/system

      dependencies:
        # The remotes (`true-bdd remote --server <url>`) register with
        # and poll this relay over its HTTP API — bdd-web never spawns
        # the CLI itself.
        - name: bdd-cli
          protocol: http
          scope: internal
        - name: redis
          protocol: redis
          scope: self_hosted

      quality_gate:
        tests:
          # Self-contained Playwright package: protocol (p*), workspace (w*)
          # and AI (a*) projects, each test booting its own host server.
          e2e:
            path: tests/bdd-web
            framework: playwright
            config: tests/bdd-web/playwright.config.ts
