  - decision_trace:
      research:
        - |
          Go's runtime reflection cannot list a package's functions or read
          their comments; the standard go doc command reads a package's code
          and prints its exported declarations with their doc comments.
          go doc -short is 1,174 bytes for pkg/testkit, 1,966 for bddgo and
          4,699 for runner; go doc -all is 9,591, 15,531 and 30,064.
        - |
          The only use the 2 November round needed: the body of the project
          tree step, return state.PrepareTree(args[0]), where the writer must
          know what the library offers and the critique what PrepareTree does
          (tests/true-bdd/steps/cli_steps.go:86 registers the pattern,
          :107 the function; the engine writes both, the AI only the body,
          ADR-0035).
        - |
          Checked after the answer, in a throwaway host example.com/calc
          requiring github.com/ondatra-ai/true-bdd/pkg@7e714a90 from the module
          cache: once a host file imports testkit, go doc
          github.com/ondatra-ai/true-bdd/pkg/testkit ScenarioRun.PrepareTree
          prints the signature and comment of that version; before any import
          it answers "no such package". The current comments describe the
          implementation and name the proxy ("Run executes under the proxy,
          preserving results even on infrastructure failure"). The suite
          imports nine pkg packages: testkit, bddgo, runner, reporter, disk,
          cli, cli/gotool, cli/spec, enginelog.
      recommendation: |
        Yes: no catalogue. The engine takes the library's table of contents
        with go doc from the version the host uses; each function's meaning is
        its doc comment; the rule cli -> pkg/proxy/cli lives in the engine's
        code while there is one protocol (Q4). The description sits in one
        place beside the code and never goes stale.
      settled: |
        No catalogue file. The engine reads the library's description with go
        doc from the version the host's module graph resolves; a function's
        meaning is its doc comment, rewritten to state the meaning; the rule
        selecting pkg/proxy/cli for a cli dependency lives in the engine's
        code. This overrides Q8 and Q2's file the engine knows how to find.
        How much of go doc a prompt gets is not settled.
