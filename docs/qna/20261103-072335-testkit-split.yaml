  - decision_trace:
      research:
        - |
          Every binary under pkg/ sits inside testkit today: aiproxy,
          cmd/coverage, cmd/report-server, materializer. A host already
          requires github.com/ondatra-ai/true-bdd/pkg; the harness builds the
