      recommendation: |
        A: the utilities in the pkg/ module beside testkit, for example
        pkg/proxy/cli/, with their import path in the SDK catalogue; hosts
        already require pkg, and building from the host's module graph works
        unchanged. C (an own module) is cleaner but adds a module and a
