    answer: |
      Я бы сказал, что я бы сделал не ПКГ, а сделал бы CLI. Вот. Ну, то есть
      имеется в виду, что SDK должно лежать, наверное, там, где ты сказал,
      ПКГ, прокси CLI, например, да, там какой-то прокси для Airbyte. Ну, то
      есть ПКГ, прокси Airbyte, можно его назвать. А сам Airbyte должен
      лежать, наверное, как бы CLI или Utilities. И там Airbyte у нас лежит. Я
      ответил на твой вопрос, как я это себе видел бы? Или тут остались
      непонятки?

  - decision_trace:
      research:
        - |
          The CLI proxy is 1,684 lines, nearly all shared by claude and codex:
          the PATH shim, argv and stdin hashing, the cassette store,
          record/replay/live. Vendor differences are a few rules: claude's
          session id and spill paths as {{CLAUDE_SESSION}} and
          {{CLAUDE_SPILLS}} (aiproxy/normalize.go:122-145) and the AdvisorOff
          env (aiproxy/record.go:121); codex-homes paths are the engine's
          choice, not the vendor's (aiproxy/fsdiff_filter.go:23).
        - |
          HTTP services such as Stripe or Slack share a mechanism too
          (redirect the base URL, match, record, replay) and differ in
          normalization rules; per-dependency rules already have a place in
          the architecture's dependencies, under invocation
          (docs/architecture/architecture.yaml:736).
      recommendation: |
        A: per protocol, pkg/proxy/cli with one CLI utility and pkg/proxy/http
        with one HTTP utility; vendor specifics are normalization rules
        declared on the dependency, and a vendor package appears only when
        data is not enough.
      settled: |
        Only the CLI protocol is handled now; HTTP, GraphQL, WebSockets and
        webhooks wait until the next application needs them. Per protocol or
        per vendor goes to whichever needs fewer changes, which the Owner
        handed to Claude (next entry).
    question: |
      Q4 - SDK и утилиты: под протокол или под вендора?
      A. Под протокол. Пары pkg/proxy/cli + одна CLI-утилита и pkg/proxy/http
      + одна HTTP-утилита. Особенности вендора (session id у claude,
      idempotency key у Stripe) — это правила нормализации, объявленные на
      самой зависимости. Пакет под вендора появляется, только когда данных не
      хватает.
      B. Под вендора. pkg/proxy/claude, pkg/proxy/codex, pkg/proxy/airbyte,
      pkg/proxy/stripe, у каждого своя утилита, общий механизм — в общем
      пакете.
      C. Два слоя кодом. Механизм под протокол и поверх него обязательный
      пакет-адаптер под каждого вендора.
    answer: |
      Меня здесь нет ответа на этот вопрос. Как будто нужно и то, но смотри, я
      бы сейчас пошел простым путем. Давай посмотрим, что проще всего. Если
      проще под вендора, меньше изменений надо сделать для того, чтобы выбрать
      под вендора, пусть будет под вендора. Если под протокол, то давай под
      протокол. Смотри, у нас-то сейчас готов только CLI протокол. Давай мы
      только его будем обрабатывать. А веб скорее всего, HTTP, там, я не знаю,
      какие-нибудь GraphQL, какие еще могут быть протоколы. Да, там элементы
      интеграции, веб-сокеты. И не знаю, там веб-хуки, потом сделаем, причем
      настолько потом, что когда будем писать следующее глобальное
      приложение, вот тогда мы подумаем, как его туда добавить.

  - decision_trace:
      research:
        - |
          pkg/testkit/suite.go:288-330: installShims builds the aiproxy binary
          once and installs it under every AI CLI's name, one directory per
          caller. The proxy is already one CLI-protocol binary, not one per
          vendor.
      recommendation: |
        Per protocol: it is the current shape, so it needs the fewest changes.
      settled: |
        Per protocol, CLI only: one SDK package (pkg/proxy/cli) and one CLI
        proxy utility serving claude and codex. Their vendor rules stay in the
        utility's code for now, as knowledge that is the same for every host
        (Q1); no rules move into declarations in this change.
    question: |
      Which needs fewer changes, per protocol or per vendor?
    answer: |
      Claude, delegated in Q4: per protocol. The current proxy is already one
      binary built once and installed under each AI CLI's name, so per
      protocol keeps its shape, while per vendor would split it into two
      binaries over a shared package. The claude and codex rules stay in the
      CLI utility's code.

  - decision_trace:
      research:
        - |
          The harness builds the proxy with go build <import path> from the
          host root (pkg/testkit/suite.go:301), so the proxy's module must be
          in the host's module graph.
        - |
          Go 1.24 added the go.mod tool directive (go get -tool, go tool
          <name>) for executable dependencies
          (https://go.dev/doc/go1.24#tools); this repository is on go 1.25.0.
        - |
          A utilities root inside the root module github.com/ondatra-ai/true-bdd
          would bring the tests and 109 MB of fixtures to a host; the name cli/
          is easily confused with pkg/cli/, the typed wrappers over the CLIs
          we spawn.
      recommendation: |
        A: utilities/ with its own go.mod (module
        github.com/ondatra-ai/true-bdd/utilities), the CLI proxy in
        utilities/cliproxy/, which the host declares as a tool dependency; the
        harness builds it from the host's module graph with the import path
        from the SDK catalogue, and the Owner allows a fifth root in
        .alint.yml go-known-roots.
      settled: |
        The host declares nothing for the proxy utility: no tool or require
        line. The SDK builds the proxy binary and substitutes it for the
        declared CLIs at its init, as installShims does today. The root's
        module and name stay open: the SDK can build only source in the host's
        module graph.
    question: |
      Q5 - Как устроить корень утилит?
      A. utilities/ со своим go.mod (модуль
      github.com/ondatra-ai/true-bdd/utilities), CLI-proxy лежит в
      utilities/cliproxy/. Хост объявляет его как tool-зависимость в своём
      go.mod, harness собирает его из графа модулей хоста, а путь импорта
      берёт из каталога SDK. Вы разрешаете добавить пятый корень в
      go-known-roots в .alint.yml.
      B. utilities/ внутри корневого модуля. Без нового go.mod, но хосту
      придётся требовать корневой модуль с тестами и фикстурами.
      C. Как A, но корень называется cli/.
    answer: |
      Смотри, какая вещь. Utilities и CLI proxy, по идее, не надо объявлять
      как зависимость в каком-то коу, потому что это же бинарь, который
      должен быть билджен. То есть, вот если мы сейчас билдим вот этот CLI
      proxy, вот где он лежит? Он же лежит в каких-то binary, да? И мы его
      потом подставляем. Вот здесь то же самое. То есть код этого air proxy,
      если я правильно понимаю, он у нас лежит. То есть SDK, которая вызывает
      этот air proxy, правильно подставляет под нужную. Там мы, например,
      говорим в SDK, что-то там подмени, ну, в нити, да, там, например,
      подмени Claude Code на что-нибудь. То есть вот это делается SDK.

  - decision_trace:
      research:
        - |
          The harness builds the proxy today with go build
          github.com/ondatra-ai/true-bdd/pkg/testkit/aiproxy from the host root
          (pkg/testkit/suite.go:288-301) into <os temp>/true-bdd-shim-XXXX/aiproxy,
          symlinks claude and codex to it in one directory per caller
          (suite.go:346), and puts that directory first on PATH
          (runner/aiproxy_env.go:27).
        - |
          go build from the host root finds only source in the host's module
          graph. Outside it, the only build is GOBIN=<tmp> go install
          <path>@<version>, which needs a fetchable version, the module cache
          for offline replay, and a local path while TrueBDD itself is
          developed. SDK and utility share the TRUE_BDD_AIPROXY_* env and the
          cassette format, so separate modules can drift apart.
      recommendation: |
        A: the utility's source in the pkg module beside its SDK
        (pkg/proxy/cli/ the SDK, pkg/proxy/cli/cliproxy/ the utility); the
        build stays as it is, versions always match, local development uses
        the existing replace ./pkg; an ADR and an .alint.yml entry for
        pkg/proxy, no fifth root.
      settled: |
        The SDK lives in pkg/proxy/cli/ and the proxy binary's source in
        utilities/cliproxy/, a root of its own outside pkg; A's placement
        inside pkg is rejected. The utilities module, how the SDK builds from
        it, and the .alint.yml change stay open.
    question: |
      Q6 - В каком модуле лежит исходник proxy-утилиты?
