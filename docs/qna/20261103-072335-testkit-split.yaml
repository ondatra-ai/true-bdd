intent: |
  #293: split pkg/testkit so it becomes an abstract library holding nothing a
  step critique must check against the Specification. No prompt embeds whole
  source files. What the Specification describes about this product moves into
  tests/true-bdd/ (for example helpers) and build steps writes it; the
  repository's tooling leaves the harness. Evidence:
  tmp/codex/research-293-testkit-truebdd/final.md (43 generic, 12 framework,
  52 product files of 107).
  The Owner, 3 November, in six messages before the session, after the
  #293 code run's critique selected 141,414 bytes of whole testkit files:

  «кстати а что в 293 как critique size надло фиксить?»

  «Нет, стой, подожди, тут надо разобраться, а зачем мы вообще туда передаем
  полные сорцы файлов? Что это за промпт? Можешь дать мне темплейт промпта? И
  что именно он критикует?»

  «В общем, смотри, нам нужно отказаться от вставки полного файла, а тем более
  нескольких файлов в целый промпт. Так, это не очень хорошая идея. И то есть
  ну да, давай попробуем его описать в... Да, и, короче говоря, я бы здесь
  поресерчил разные варианты. Во-первых, возможно, удастся его тоже сгенерить.
  Ну, то есть, как бы, может быть, эти файлы можно прям сгенерить в коде.
  Во-вторых, объявить спецкик, тест-кит в specification, это что, о чем мы,
  по-моему, договаривались. Ну да, пиши сценарий run и suit по одному смыслу
  на метод. Вот. Отбор по прямому использованию, я вообще не понимаю. Короче,
  это путь в никуда. Нам вообще нужно отказаться от того, чтобы файлы
  вставлялись полностью в дальше смотри, вместо того, чтобы загружать весь
  файл, я, кстати, ну да, то есть смотри, я вообще не понимаю, зачем
  загружать тест-кит, потому что, подожди, реально, зачем, вот, а какой вот,
  вот все-таки, покажи мне пример, зачем мы загружаем тест-кит и что
  произойдет, если мы его не будем загружать в промпт? Ну, потому что по мне
  так это достаточно тупо загружать пакет, то есть файлы из пакетжа, которых
  у тебя, кстати, не будет, потому что будет просто в дальнейшем импорт
  пакетжа и все, как в библиотеке. То есть пакетж должен быть абстрактный, в
  нем не должно быть никакой информации, на которую, ну, которую надо
  сверять. Все, что сверяется, оно должно быть внутри этого, ну, то есть
  внутри самих тестов, внутри папочки тест. И здесь надо еще определиться,
  что все-таки с чем. Что с чем все-таки критикуется? То есть, что мы хотим
  найти в результате этой критики? Различие между чем и чем?»

  «Это тот случай, когда нам нужно было бы записать эти файлы внутри
  test/true/bdd/, например, я не знаю, helpers. То есть вот как будто бы эти
  файлы должны были бы быть сгенерены внутри true/bdd папочки. То есть если
  мы их описываем, если мы описываем поведение всей этой вещи. Понял
  концепт?»

  «Нам тест-кит надо разделить. Вообще, смотри, давай посмотрим. Вот этот
  конкретный пример, он делает state prepare three args. State у нас берется
  из тест-кит. Правильно? А что внутри state prepare three? Покажи мне, как
  это, блин, зачем его проверять?»

  «Пробуй найти, имеет ли тест-кит какую-то информацию, которая бы относилась
  к TrueBDD как к харнесу.»

  The session started on «Ну, поехали».

log:
  - decision_trace:
      research:
        - |
          pkg/testkit serves every Go Host project, not only this repository:
          README.md:150 (go get .../pkg/testkit/bddgo), README.md:591
          (testing.testkit enables the harness), and the calc hosts in the
          fixtures import it (for example
          tests/true-bdd/fixtures/build-steps-slots/input/tests/calc/scenarios/scenarios.go).
        - |
          Codex research (tmp/codex/research-293-testkit-truebdd/final.md):
          43 generic files (4,711 lines), 12 framework files (2,655 lines:
          host_config.go, harness.go, suite.go, bddgo/registry.go,
          bddgo/model_steps.go and others), 52 product files (10,517 lines:
          runner/runner.go:46, runner/checklist_filter.go, scenario_names.go:13,
          aiproxy/writer_spawn.go:138, reporter/*, cmd/coverage/*).
        - |
          Framework code is called by the Suite wiring the engine writes
          deterministically, not by step bodies. TrueBDD's product is itself
          the framework, so the Registry format, true-bdd.yaml and the fixture
          layout are in its Specification too; they are the same for every
          host, whereas product knowledge holds only when the system under
          test is TrueBDD's engine.
      recommendation: |
        A: testkit keeps what is the same for every Host project, generic and
        framework knowledge; whatever holds only for this Host project leaves.
        testkit ships to every Go host, step critiques never check the
        framework code, and its own tests cover it. B would make every host's
        build steps rewrite Registry decoding and coverage checks, about 2,655
        lines, for no gain in critique.
      settled: |
        pkg/testkit keeps generic and framework knowledge, what is the same for
        every Host project; knowledge that holds only because the system under
        test is TrueBDD's engine leaves it.
    question: |
      Q1 - Граница: что может остаться в pkg/testkit?
      A. Правило «одинаково для любого хоста»: testkit оставляет generic и
      framework, то есть то, что TrueBDD требует от каждого хоста (его
      true-bdd/ и true-bdd.yaml, Registry, раскладку фикстур, синтаксис
      llm:/judge:, объявленные ai_clis). Всё, что верно только для этого Host
      project, уходит из testkit, то есть всё, где тестируемый продукт —
      движок TrueBDD.
      B. Строго: testkit не знает о TrueBDD вообще: только запуск Gherkin,
      proxy, snapshots. Framework-знание тоже уходит в код, который движок
      генерирует для каждого хоста, и Suite wiring разрастается.
      C. Своя граница.
    answer: |
      A

  - decision_trace:
      research:
        - |
          The product files mix categories: runner/runner.go keeps a generic
          fixture lifecycle (overlay, prep.sh and teardown.sh at :174,
          execution at :310) beside the TrueBDD-only RepoLayer list at :44;
          aiproxy/record.go streams generically (:113) beside engine scratch
          exclusions; aiproxy/normalize.go normalizes paths generically (:46)
          beside engine directory names.
      recommendation: |
        Split each mixed file by Q1's rule.
      settled: |
        Forced by Q1: in a file mixing categories, the host-invariant mechanism
        stays in pkg/testkit and the TrueBDD-only values and rules leave it.
    question: |
      What happens to a file that mixes a host-invariant mechanism with
      TrueBDD-only values?
    answer: |
      Claude, no question asked: Q1 keeps in testkit exactly what is the same
      for every Host project, so the mechanism stays and the TrueBDD-only
      values and rules leave.

  - decision_trace:
      research:
        - |
          RepoLayer() is a two-item list, true-bdd and templates
          (pkg/testkit/runner/runner.go:44); the judge label is the literal
          "true-bdd %s" (runner/judge.go:319); the fixture name is a regex
          (scenario_names.go:13). Checklist narrowing is 389 lines over the
          engine's checklist format (runner/checklist_filter.go); writer
          verification is 172 lines including services/calc
          (aiproxy/writer_spawn.go).
        - |
          The proxy is a separate binary the harness builds from
          github.com/ondatra-ai/true-bdd/pkg/testkit/aiproxy (suite.go:301)
          and puts first on PATH as claude and codex; it cannot call the
          suite's code in process.
      recommendation: |
        A: values (repo_layer, judge label, fixture name pattern) are declared
        in the Specification under the architecture's testing.testkit and
        testkit reads them; logic (checklist narrowing, writer checks) is
        helpers in tests/true-bdd/helpers/ written by build steps and plugged
        in through declared testkit hooks the Suite wiring passes; for the
        proxy a hook can only be data or an external program.
      settled: |
        The Owner did not pick A, B or C; the answer moves the proxy instead.
        Proxy binaries leave pkg/testkit as separate tools, one per kind (CLI,
        REST, web), generic and for every host; scripts/ was proposed, with no
        hardcoded path. testkit gains SDK packages per kind (testkit/cli,
        testkit/rest, testkit/web), included as needed and selected from the
        architecture. Their description comes from a file the engine knows how
        to find, not from architecture.yaml: which proxy packages exist, what
        they hold and how to use them. The test runner calls something like
        testkit/cli.Init() without knowing it drives a proxy. Q2's choice for
        the non-proxy values and logic stays open.
    question: |
      Q2 - Как продуктовое попадает обратно в testkit? Жизненный цикл фикстуры
      (наложение, prep.sh, snapshot, запуск, teardown.sh) по Q1 остаётся в
      testkit. Ему нужно откуда-то получить продуктовые значения и правила.
      A. Значения объявлены, логика в helpers. Значения (repo_layer, метка
      судьи, шаблон имени фикстуры) объявлены в Specification, в
      testing.testkit архитектуры, и testkit их читает. Ни писать, ни
      критиковать их не нужно. Логика (сужение checklist, проверки writer) —
      это helpers в tests/true-bdd/helpers/, их пишет build steps. Они
      подключаются через объявленные hooks testkit, а hooks передаёт Suite
      wiring. Для proxy hook может быть только данными или внешней программой.
      B. Всё в helpers. Даже списки и строки — это код helpers, который
      подключается через Suite wiring.
      C. Helpers сами ведут поток. Шаги вызывают helpers, а helpers —
      низкоуровневые примитивы testkit (скопировать дерево, запустить
      программу, записать результат). Жизненный цикл тогда пишется в каждом
      хосте заново.
    answer: |
