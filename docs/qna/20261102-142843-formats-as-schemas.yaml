intent: |
  Decide what replaces `architecture.prompt_data` (133 KB of prose describing
  every prompt template's input fields) and, beyond it, how the formats of the
  files and data the engine reads and writes are declared: the fields a
  Scenario reads should follow from the Scenarios, and a format the
  architecture must declare should be a reference to a structured schema, not
  prose. The Owner, 2 November:

  «И еще один вопрос. Смотри, нужно подумать, вот я там обсуждал в соседнем,
  а зачем нам нужны вот эти вообще prompt data, да, вот какие-то такие вещи.
  Мне кажется, что это у нас, смотри, у нас основная часть информации должна
  быть зашита в сценариях. То есть то, какие поля должны быть в тех или иных
  вещах, они должны как будто вытекать из сценариев. То есть сценарий должен
  как бы просто где-то говорить, что вот мы что-то читаем из такого поля,
  что-то читаем из такого поля, что-то читаем из такого поля. Да, там. Ну, то
  есть вот каким-то таким способом это делать. И тогда то, какая структура
  YAML-файла, да, она должна будет задаваться сценарием, либо она должна
  задаваться будет, если мы хотим какую-то сделать это в... Это невозможно
  сделать в архитектуре, потому что мы, например, его читаем, и это модель,
  да, помнишь, мы говорили, что модели, они на самом деле описываются в
  архитектуре. Тогда это прям должно быть не текст, а прям, ну, например,
  YAML, ну, то есть отсылка, что типа, вот, это прям YAML, вещь. Ну, то есть,
  как бы, тогда мы формат каждого файла задаем в архитектуре с помощью просто
  вот ссылки, что такой endpoint или это как бы такая команда читает файл
  такого типа.»

  «Хорошо, давай, я согласен с твоим планом.» (the plan: #287 resumed without
  prompt_data, this grilling run beside #286 and #287, round 5 after both.)

log:
  - decision_trace:
      research:
        - |
          architecture.prompt_data has 32 entries, one per template under
          templates/, each with `rendering` prose and `fields`: the Go template
          access paths a template reads, each explained in prose (for example
          "Judgement: The failed structured Q protocol, carried unchanged to
          the approved applier").
        - |
          Every drill cut keeps templates/, and `init` writes them into every
          host, where they may be overridden; a rebuilt engine must feed the
          kept templates the same fields with the same meaning.
        - |
          The Registry already observes prompt contents in 128 steps such as
          `every file matching "tmp/*/critique-*-user.txt" matches binding:`.
        - |
          Three schemas exist, in Yamale: true-bdd/product-schema.yaml,
          architecture_yaml-schema.yaml and scenarios_yaml-schema.yaml; the
          engine does not read them, a host runs them in its own lint step.
      recommendation: |
        (2): one structured schema per template (for example
        true-bdd/prompt-data/<template>.schema.yaml, Yamale): field, type and a
        one-line meaning; true-bdd-cli.yaml's prompt-templates entry points at
        them instead of prose; prompt_data's prose goes.
      settled: |
        (2), with the Owner's addition: the service in the architecture gets a
        `models` key mapping a model name to its schema file, for example
        `xxx_checklist: true-bdd/prompt-data/<template>.schema.yaml`, under
        `services: - name: true-bdd`.
    question: |
      Q1 - Where does the contract "which fields the engine hands a template"
      live? (1) Nowhere apart: the templates name the fields they read, the
      Scenarios fix what matters; prompt_data is deleted. (2) A structured
      schema per template (true-bdd/prompt-data/<template>.schema.yaml,
      Yamale: field, type, one-line meaning), referenced from
      true-bdd-cli.yaml's prompt-templates instead of prose; prompt_data's
      prose deleted. (3) Keep prompt_data in the architecture, compacted to
      "field → one line".
