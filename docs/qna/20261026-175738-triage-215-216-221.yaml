intent: |
  Triage the three needs-triage tickets of spec #213 (the release emulation of 26 October 2026):
  #215 (build code --fix keeps retrying a repair outside its writer's roots), #216 (the writers
  cannot read the TrueBDD harness a host requires) and #221 (how TrueBDD is packaged), and grill
  each into a decided, buildable ticket.
  The Owner's positions before Q1, in their words: on #215, «это задача плана еще до вызова
  райтера определить, что это невозможно сделать и остановиться», and also «кто конкретно должен
  об этом сообщить, то да, это должен сделать райтер»; first understand «почему это вообще
  происходит», whether the writer should get access to those files, and where access is defined:
  «это должен быть сервис архитектура … те папочки, которые определяются сервисами, они должны
  позволять давать это менять». On #221: «пусть будет команда init … она должна создавать
  какие-то базовые файлы».

log:
  - decision_trace:
      research:
        - services/bdd-cli/internal/app/commands/build_code.go:104-107 sets the build-code writer's write roots from the architecture's services, servicePaths(arch.Services), with the comment that write roots come from the architecture spec, so the document that defines where production source lives also bounds the writer.
        - Each service declares one path (docs/architecture/architecture.yaml, services[].path). The writer may also write the host's tmp. Nothing else, so a root go.mod or go.sum belongs to no service.
      recommendation: |
        Fact, no question.
      settled: |
        Today the build-code writer may change only the folders of the services the architecture declares (services[].path), plus tmp. This already matches the Owner's view that the architecture's services define the writer's access.
    question: |
      Where is the build-code writer's write access defined today?
    answer: |
      Claude, no question asked: in the architecture document, by each service's path (build_code.go:104-107); go.mod and go.sum at the host root belong to no service.

  - decision_trace:
      research:
        - The release emulation's run 2 failed with "missing go.sum entry for module providing package gopkg.in/yaml.v3"; its install step ran `go get github.com/ondatra-ai/true-bdd@954797a0` (the root module) instead of the harness package, so go.sum lacked the harness's own dependencies (tmp/release-spec/evidence/live-run-2.summary).
        - Run 3, with `go get .../pkg/testkit/bddgo@954797a0`, had no go.sum failure.
      recommendation: |
        Fact, no question.
      settled: |
        The run-2 failure was a host setup error, made by the install step, not by the code the writer wrote. A writer would legitimately need go.mod/go.sum when a service needs a new dependency, which today it cannot add.
    question: |
      Why did the writer need go.mod/go.sum in the emulation?
    answer: |
      Claude, no question asked: the install step left go.sum incomplete; separately, adding a dependency for a service is a legitimate case the writer cannot do today.

  - decision_trace:
      research:
        - The build-code writer's write roots come only from the architecture, each service's path (services/bdd-cli/internal/app/commands/build_code.go:104-107).
        - The codex writer runs with network disabled and GOPROXY off (services/bdd-cli/adapters/ai/codex_writer.go:154), so even with go.mod/go.sum writable it can add only a module already in the local module cache.
      recommendation: |
        (a): each service may list, in the architecture, extra files the writer may change, such as go.mod and go.sum; without a list the writer changes only the service's folder. It keeps the rule that the writer changes only what the architecture records, visible in the Specification.
      settled: |
        A service in the architecture may declare extra files or folders its writer may change (for example go.mod and go.sum); without that list the writer changes only the service's folder. Nothing outside what the architecture records is writable. Downloading a new module stays a person's step, since the writer has no network.
    question: |
      Q1 - Может ли сервис в архитектуре разрешить райтеру менять файлы вне своей папки: (а) каждый сервис перечисляет дополнительные файлы, например go.mod и go.sum; (б) движок сам разрешает файлы зависимостей языка сервиса, без записи в архитектуре; (в) только папка сервиса, файлы зависимостей всегда меняет человек?
    answer: |
      Я би пошел путем чтобы были как-то записаны пока что файлы, которые еще можно
      Что ты записываешь? Я бы пошел путем A. Чтобы можно было менять только то, что записано в архитектуре.

  - decision_trace:
      research:
        - The plan returns only its plan text, one field fix_prompt (services/bdd-cli/internal/app/generators/validate/checklist_evaluator.go:53).
        - The writer ends with a confirmation block of applied, target and summary (fix_applier.go:207). Neither has a field to say that the work needs a file the architecture does not allow.
        - The engine itself cannot judge that a repair is impossible; only the plan or the writer, reading the test failure, can see it (in run 2 the writer named go.mod/go.sum from the "missing go.sum entry" failure).
      recommendation: |
        The plan and the writer each get a field listing the files the work needs but the architecture does not allow, with a reason. On the first such report the engine stops: no writer after a plan's report, no new plan or attempt after a writer's report; it keeps the files already changed, reruns the tests once, prints the files and reasons, and exits with an error distinct from a non-converging loop.
      settled: |
        The architecture must be enough to build the system: a writer finds a way within the files the architecture allows. If the work is truly impossible without changing a file the architecture does not allow, the run fails with an error at once, with no further attempt. The plan or the writer is what notices it, and the error names the file and why. Also opened by this answer: TrueBDD's own architecture.yaml must be rewritten and checked, so that every solution can be made by changing only the files it lists.
