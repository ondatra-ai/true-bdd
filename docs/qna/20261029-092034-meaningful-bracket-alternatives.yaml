          The claim of #248 holds: a bracket group compiles to a non-capturing
          group (services/true-bdd/internal/domain/models/catalogue/template.go,
          closeBrackets); capturing_test.go pins that [with|using] is not
          captured; stepDefinitionBinding (build_steps_execution.go) requires
          the engine's exact pattern. No .out-of-scope/ entry exists.
        - |
          docs/qna/20261021-112516-self-spec-and-doc-validation-chain.yaml, Q34:
          the Catalogue grammar from spike #133, brackets as "inflections and
          literal alternatives"; the product document's template entry calls
          them "a choice"; meaning is carried by what fills a slot.
        - |
          Cucumber Expressions: alternative text (belly/stomach) and optional
          text (cucumber(s)) never capture; a choice the step definition must
          see is a parameter, often a custom parameter type with an enumeration
          regexp (https://github.com/cucumber/cucumber-expressions#readme).
      recommendation: |
        (b): an enumeration slot kind, captured and named; brackets stay
        grammar only, as in Cucumber.
