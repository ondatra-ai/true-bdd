        - Concepts are written without square brackets, in the product
          document, per block, a little more abstract than the steps (for
          example a Given concept "number is set" means build steps must
          produce the preparatory operations that put the system in that
          state).
        - Each concept is bound again in the architecture document with more
          detail on how it appears in the system (for example a field on a web
          page), without technical implementation, enough for the LLM that
          later writes the step definition to know how to write it.
