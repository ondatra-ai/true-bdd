          people validate concepts beforehand: the LLM validates that concepts
          exist and are bound; people in their roles validate that the
          concepts describe the system adequately, the System Architect that a
          concept is unambiguous enough for an LLM to write its step.
        The Owner asked to research and restore what goes into Given, When and
        Then (the repository's checklists and general practice) and keep it.
