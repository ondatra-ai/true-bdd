# Q&A log of one grilling session (mpc_grilling).

intent: |
  Triage and grill #248: `build steps` writes each step definition's pattern
  from its Catalogue phrase and captures only slots, so a phrase whose bracket
  alternatives carry meaning ([matches|does not match], [validation|fix|apply],
  [browser ]) reaches a definition that cannot tell them apart. Decide how such
  a phrase reaches its step definition, then shape #248 for an agent.

