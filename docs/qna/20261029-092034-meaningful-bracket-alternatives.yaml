      settled: |
        The link of each step to a concept of its own block is judged by an
        LLM, a score out of 10 with a reason per step, 9 or more passing, in
        three places, each stopping rather than going on with the error:
        - us refine: a Story whose step does not link fails its walk; the fix
          offers at the menu a rewritten step or a new or wider concept, the
          Product Owner choosing; an unfixed Story is not saved;
        - scen check: every Scenario's steps are judged afresh against the
          current concepts, trusting no earlier result; a failure fails the
          Scenario and the command exits 1; --fix offers the same choices;
        - build steps: its grouping pass stops the run with a distinct error,
          before any skeleton, when a step links to no concept at 9 or more.
        build tests drops its deterministic refusal of a step outside the
        Catalogue, since it runs no LLM; scen check is the gate before it.
