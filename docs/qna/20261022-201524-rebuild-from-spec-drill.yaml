# Q&A log of one grilling session (mpc_grill-with-docs).

intent: |
  A one-off check, the milestone after #127: build the next version of TrueBDD from
  the specification documents alone. Delete the code, generate the step definitions
  as a separate stage, then generate the engine itself, and verify that the
  previously built engine behaves exactly like the newly built one. The user asked
  for a light grilling, and asked how step definitions are generated today.

log:
  - decision_trace:
      research:
        - |
          Step definitions are written today by `build tests --fix`: stepcoverage.Scan finds
          unbound Registry steps without a model, and build-tests.yaml's `F:` hands the model
          the catalogue phrase, the glossary meaning, the `architecture.terms` mapping, the
          Scenario and its neighbours; it appends a `suite.Step` under tests/bdd-cli/steps/.
          The generated `_test.go` files render deterministically from the Registry and steps.
        - |
          #155's drill deleted all 55 step definitions and rebuilt them from the spec: 46 of
          55 byte-identical, replay 196 of 197, about $30. #173 (`build tests --fix` never
          runs what it writes) is still open.
        - |
          The previous session's Q1 (docs/qna/20261021-112516-self-spec-and-doc-validation-chain.yaml)
          made steps/ committed source, never regenerated per build; only services/bdd-cli
          is regenerated, pkg/ stays source.
        - |
          The engine is about 16.3K lines of non-test Go. The harness builds it in TestMain
          (tests/bdd-cli/scenarios/scenarios.go:400) and accepts `-engine-bin` to run the same
          suite against any prebuilt binary.
      recommendation: |
        (b): steps and engine, in sequence, the old engine as oracle. Stage 1 rebuilds steps/
        with the old binary's `build tests --fix` and replays them against the old engine;
        stage 2 deletes services/bdd-cli and rebuilds it with `build code --fix` against the
        new steps. One suspect per stage for every red test.
      settled: |
        (b), as a research spike: the goal is to find where the spec-only rebuild breaks and
        collect the findings, possibly across several tasks. Two runs are done separately:
        one deletes only services/bdd-cli and keeps the committed steps; the other deletes
        services/bdd-cli and steps/ too. The generated test files are regenerated as well.
        Fixtures are open: the user first said delete them, then keep, then delete.
