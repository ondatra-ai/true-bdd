# Q&A log of the grilling that triages #249, the first ticket of #276's triage.

intent: |
  Triage #249: decide where the steps package's harness glue comes from when
  cut B of #276's drill deletes `tests/true-bdd/steps/`, so that `build steps`
  can rebuild a steps package the kept harness compiles against, and the
  ticket can be shaped for `/mpc_implement`. The Owner chose #249 first among
  #276's tickets and answered "да" to starting its grilling (1 November).

