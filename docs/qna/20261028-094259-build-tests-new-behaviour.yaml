      recommendation: |
        (a): the Specification names the API before the code exists (for example
        `services/calc.Halve(value int) int`); build tests binds to it, build code implements it.
        Then a compile error on a declared but absent symbol means "not built" deterministically,
        no Registry marker is needed, and a definition can be checked to call the API its phrase
        maps to.
      settled: |
        The Owner answered with a rule by kind of interface, not by one option:
        - a public interface is declared in the Specification, with its criteria and format,
          something like Swagger (not implemented today);
        - an internal interface whose data persists between builds (a database's data model,
          SQL or Mongo) is kept between builds and declared in the architecture;
        - an internal, non-persistent interface is left to the AI: build code decides it.
