# Q&A log of one grilling session (mpc_grilling).

intent: |
  Grill epic #212 (`build tests`: recover the tests from the Specification) in the light of
  the live pipeline run of 28 October (#192): the new behaviour of Story `halve` was lost in
  `build tests --fix` before any `Then`, because the step definition called the not-yet-built
  `calc.Halve`, the package did not compile, and the Fix loop rewrote the definition to halve
  the number itself. Then triage #212 and #192 and file tickets, including the `us refine --fix`
  and error-AC findings.

