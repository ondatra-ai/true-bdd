          interface (https://cavac.at/cavacopedia/Test-driven_development); whether a compile
          error counts as red is disputed (https://llm-coding.github.io/Semantic-Anchors/anchor/red-green-tdd).
          A test that computes what it asserts is a named reward-hacking class, the tautological
