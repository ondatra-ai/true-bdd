      settled: |
        (b). "From scratch" is a rule for the result, not the order of work: build code may start
        from existing code, but must end where a from-scratch build would accept it, every test
        green and nothing beyond the tests. When code is present, build code repairs only the
        failing tests, however they appeared. build tests must not rely on code: its result is
        the same on an empty tree and on a built one. The goal is that the code is not kept in
        the repository (gitignored); even where it is kept today, no build may count on finding
        it at the next build or on working incrementally. build tests' purpose is only to make
        tests, 100% of them red, and to check that they appear in the test list and that every
        Scenario is covered by a test.
