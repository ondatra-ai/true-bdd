      recommendation: |
        (a): keep ADR-0034's shape; the link pass was measured on prose; a list
        field buys no deterministic check; a widening shows as a one-sentence
        diff of means at the menu.
      settled: |
        (a). The variations a concept admits are written in prose inside its
        means; the shape stays concept, means and terms. Widening a concept
        rewrites its means, shown as a diff at the menu.
    question: |
      Q4 - Где записан перечень допустимых вариаций: (a) прозой внутри `means`,
      как в спайке, форма ADR-0034 не меняется, расширение — новый текст
      `means` как diff; (b) отдельным полем-списком (например `admits:`),
      расширение — добавленный пункт; поле добавляется в схему, загрузчик и
      README (#256).
    answer: |
      Я не знаю. давай (a).

  - decision_trace:
