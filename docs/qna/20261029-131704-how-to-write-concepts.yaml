# Q&A log of one grilling session (mpc_grilling).

intent: |
  Triage and grill #254: how to write the product concepts that replace the
  Catalogue's templates (ADR-0034, ADR-0035), so that the link pass, the
  grouping pass and build steps can go on using them deterministically: how
  broad a concept is, how it is worded, how concepts stay disjoint, how many a
  product needs and what keeps the number down, and TrueBDD's own concepts.
  Inputs: spike #255's measurements on TrueBDD's Registry, and a public-source
  research run on standard practice.

log:
  - decision_trace:
      research:
        - |
          Triage of #254 (enhancement, needs-triage): nothing in README,
          GLOSSARY, the product or architecture document, the checklists or the
          prompt templates says how a concept is written; ADR-0034 fixes only
          its shape. No .out-of-scope/ exists. #254 has no blocker and blocks
          #259.
        - |
          Spike #255 (report on #255, comments 6497580601 and 6497581326): 19
          provisional concepts (6 Given, 3 When, 10 Then) fold all 76
          templates; the link pass links 3,104 of 3,108 Registry steps at 9;
          its systematic errors come from one overlap (engine activity and file
          content both reach steps that read tmp/true-bdd.log.json as a file);
          15 Givens are worded as actions; 57 to 59 proposed patterns against
          77 hand-written registrations.
      recommendation: |
        Research standard practice first (a Codex research run with web
        search), then grill one question at a time, starting with the boundary
        between concepts.
      settled: |
        The session starts: a public-source research run on standard practice
        (breadth, disjointness, Given as state, what keeps a step vocabulary
        small) goes first, and the grilling follows on its findings and the
        spike's. The spike #255 is not that research: it measured TrueBDD's own
        Registry. The Owner also asked to file the spike's recommendations in
        #254, #256, #257 and #258, and to close #255.
    question: |
      Run the research and start the grilling?
    answer: |
      И да, заведи рекомендации в 254, 256, 257 и 258. Ну и закрой сам тикет 255

      research, и запускай грилинг, только смотри, ты же только что получил результаты предыдущего ресерча, это оно или нет?
  - decision_trace:
      research:
        - |
          Cucumber groups step definitions by domain concept, one group holding
          several operations across Given, When and Then
          (https://cucumber.io/docs/gherkin/step-organization/, updated
          2026-10-27); a step binds by its text and two matching definitions
          are an ambiguity error (https://cucumber.io/docs/cucumber/api/#ambiguous).
        - |
          Reqnroll replaces generic wording with explicit context in the step
          (https://docs.reqnroll.net/latest/automation/scoped-bindings.html).
          No reviewed source sets a concept count or a rule that semantic
          categories never overlap (research run research-254-concepts,
          tmp/codex/research-254-concepts/final.md).
        - |
          Spike #255: every systematic error came from one overlap, engine
          activity ("what the engine log records") and file content both
          reaching steps that read tmp/true-bdd.log.json as a file; the
          proposed patterns had no collision after the engine check (57 to 59
          patterns).
      recommendation: |
        (b): a concept is one way a step definition puts state in place, calls
        or observes through the Public interface, as the step's wording fixes
        it; an argument's value does not change it. It matches what build steps
        does next (patterns bind by text, a binding names one operation), and
        the pattern collision check then guards the boundaries. About 19
        concepts.
      settled: |
        (b). A step's concept is decided by what its step definition does, as
        the step's wording fixes it: one concept is one way of putting state
        in place (Given), calling (When) or observing and comparing (Then)
        through the Public interface. The target an argument names never
        changes the concept.
    question: |
      Q1 - Что решает, к какому концепту относится шаг: (a) смысл для роли, вид
      состояния, действия или исхода, как писал спайк; (b) что делает step
      definition, как это задаёт формулировка шага: один концепт — один способ
      поставить состояние, вызвать или наблюдать через Public interface, а
      цель в аргументе концепт не меняет; (c) объект, о котором шаг (лог
      движка, Story, Registry, project tree), как группирует Cucumber. Примеры:
      then `every file matching "tmp/true-bdd.log.json" matches
      "msg":"Dispatching AI turn",…` (a: engine activity; b: file content; c:
      концепт лога); when `the System Architect runs "build code"` и `… runs
      "build tests" while a "shared" hold blocks "docs"` (b: разные концепты);
      given `the project's browser test dependencies are installed` (b:
      machine environment; c: project tree).
    answer: |
      (b)

  - decision_trace:
      research:
        - |
          Spike #255's engine activity said "as its engine log records it",
          which reaches every step that reads tmp/true-bdd.log.json; the
          Registry holds such steps in the file content shape (every file
          matching … matches …, the file matching … has exactly N matches for …).
      recommendation: |
        Forced by Q1.
      settled: |
        Forced by Q1 (b): a step that reads the engine log through a file shape
        belongs to the concept of that shape (file content), and no concept's
        means may claim steps by the target they name ("anything the engine
        log records"). Engine activity covers only steps worded as the engine's
        own activity (spawned, dispatched, logged).
    question: |
      Which concept owns a step that observes the engine log through a generic
      file shape?
    answer: |
      Claude, no question asked: forced by Q1 (b). The step's wording decides,
      so `every file matching "tmp/true-bdd.log.json" matches …` is file
      content, and engine activity's means names the engine's own activity,
      not everything its log records.

  - decision_trace:
      research:
        - |
          GLOSSARY.md, Given: "The state the system is in before the behaviour
          starts, put in place without the role acting. It is never an action of
          the role." docs/qna/20261029-092034-meaningful-bracket-alternatives.yaml,
          Q6 and Q9's last point: a Given is a state. Cucumber: a Given is
          established context and avoids user interaction
          (https://cucumber.io/docs/gherkin/reference/).
        - |
          Spike #255: 15 TrueBDD Givens are worded "claude pipes …"; the link
          pass rejects one in every run (score 4) and holds another at 8.
      recommendation: |
        Forced by GLOSSARY's Given and #248's Q6.
      settled: |
        A Given concept's means states a state, never an action; a Given step
        worded as an action is reworded as the state it puts in place (for
        example "the hook payload names the tool "Write" and the file …"),
        and TrueBDD's 15 such steps are reworded in #259.
    question: |
      Is a Given concept worded as a state, and what happens to Givens worded
      as actions?
    answer: |
      Claude, no question asked: forced by GLOSSARY's Given and Q6 of
      docs/qna/20261029-092034-meaningful-bracket-alternatives.yaml. A Given
      concept states a state; TrueBDD's action-worded Givens are reworded as
      states in #259.

  - decision_trace:
      research:
        - |
          Cucumber keeps several operations on one domain concept in one group
          of definitions, a variation inside it usually a parameter
          (https://cucumber.io/docs/gherkin/step-organization/,
          https://cucumber.io/docs/cucumber/cucumber-expressions/).
        - |
          Spike #255: engine activity folded 8 templates into one concept with
          5 to 7 patterns; its bodies passed the critique's first round and the
          validation-to-fix mutations failed at the mutated step; 19 concepts
          linked 3,104 of 3,108 Registry steps. Merging only templates that
          differ by polarity, stream or kind leaves about 50 to 55 of the 76.
      recommendation: |
        (i): about 19 concepts, measured by the spike; (ii) brings the count
        back toward the templates' (the Owner's Q2 of #248), and sibling
        concepts on one interface item differing by a pattern detail raise
        the link pass's ambiguity.
      settled: |
        (i). One concept per Public interface item and kind of use: a Given per
        way of putting that item's state in place, a When per way of calling,
        a Then per way of observing and comparing it. The variations of that
        use (the steps' different shapes, alternatives and values) are the
        concept's patterns and captures, not concepts of their own.
    question: |
      Q2 - Насколько велик «один способ» из Q1: (i) один концепт на элемент
      Public interface и вид обращения к нему, а варианты операции становятся
      паттернами и захватами (given `project tree` покрывает свежее дерево,
      удалённый файл, symlink и сужённый checklist; then `engine activity`
      покрывает test runners, AI turns и build identity; около 19 концептов,
      у концепта 1–7 паттернов); (ii) один концепт на отдельную операцию
      (then `test runners started`, `AI turns dispatched`, `build identity
      logged`; given `fixture tree`, `file absent`, `symbolic link`,
      `checklist narrowed`; около 50–55 концептов, по одному пункту `does` и
      обычно одному паттерну).
    answer: |
      (i)

  - decision_trace:
      research:
        - |
          #257's fix for a step that links to no concept offers a rewritten
          step, or a new or wider concept, applied by the Product Owner at the
          menu.
      recommendation: |
        Forced by Q2.
      settled: |
        Forced by Q2 (i): a new concept is right only when a step needs a
        Public interface item, or a kind of use of one, that no concept covers.
        A step that needs a new variation of a covered use widens that
        concept (and its binding), never adds a sibling. What keeps the count
        down is therefore the number of (interface item, kind of use) pairs a
        product's steps reach.
    question: |
      When does a failed link justify a new concept rather than a wider one?
    answer: |
      Claude, no question asked: forced by Q2 (i). Only a new Public interface
      item or a new kind of use of one justifies a new concept; any other new
      variation widens the concept that already covers that item and use.

  - decision_trace:
      research:
        - |
          Cucumber's enumerated parameter type is a closed set: a value outside
          it does not bind (https://cucumber.io/docs/cucumber/cucumber-expressions/).
          Botrytis matches openly by meaning ("gently caresses the Buy Now
          button" binds the click definition,
          https://github.com/sublayerapp/botrytis).
        - |
          Spike #255 read means as closed (its Prompt: a concept means what its
          text states, not everything in its area): at 9, all 15 near misses
          rejected, all 13 new wordings of covered meanings linked, no near miss
          above 8 ("the network is unavailable" at most 7 against machine
          environment).
        - |
          ADR-0034 and Q6 of #248's log: people validate concepts before any
          step is written; when the LLM writes a step it is too late to involve
          a person.
      recommendation: |
        (a): open means would let a new variation reach the step definitions'
        code without the Product Owner or the System Architect seeing it; the
        closed reading still links new wordings of a covered meaning.
      settled: |
        (a). A concept's means is closed: it names the interface item, the kind
        of use and every variation the concept admits. A step whose variation
        it does not state does not link, and its fix widens the concept, and
        then its binding, at the menu.
    question: |
      Q3 - Чем является `means`: (a) закрытым перечнем: называет элемент
      интерфейса, вид обращения и все вариации, которые концепт допускает;
      шаг с вариацией, которой там нет, не связывается, и фикс расширяет
      концепт и привязку в меню (given `the network is unavailable` против
      `machine environment`, when `the operating system sends the engine
      SIGTERM` против `a command runs under interference`, then `the engine
      dispatched at least 2 AI turns` против `engine activity` не связываются);
      (b) описанием с примерами: все три связываются, и `build steps`
      предлагает паттерн и тело для вариации, которую никто не утверждал.
    answer: |
      (a)

  - decision_trace:
      research:
        - |
          ADR-0034 and #256 (ready-for-agent) fix a concept's shape: concept,
