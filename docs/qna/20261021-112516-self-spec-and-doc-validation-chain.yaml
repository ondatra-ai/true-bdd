          tomiko's `--stale` re-records only what changed (https://github.com/Tomiko-M/tomiko).
      recommendation: |
        Rule re-recording on rebuild out.
      settled: |
        Forced by Q1 (fixtures and cassettes are committed and never regenerated per
        build): a rebuilt engine is never validated by re-recording its cassettes.
        Re-recording stays legal only when a source document changes (a template, a
        checklist, a fixture input), never when only code does.
    question: |
      May a rebuild re-record the cassettes it fails to replay?
    answer: |
      Claude, no question asked: no. Q1 keeps cassettes fixed across builds, so a build
      that changes only code must replay the committed cassettes as they are.
