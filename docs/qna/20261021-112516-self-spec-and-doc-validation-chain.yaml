      research:
        - |
          No `build tests` fixture has a product document, so a closure check must stay off
          where none is declared (Q31). All 63 Scenarios still carry `user_stories: []`, so
          a contract keyed on a Story's claim lets the catalogue grow Story by Story while
          the rest of the Registry stays unconverted. #133 had worded the contract per
          catalogued Story.
      recommendation: |
        Declared means the file at `documents.product` exists and has a top-level
        `catalogue` list (an empty one counts); a missing key, file or setting means not
        declared, never a refusal. Not declared: every closure check passes every Item with
        "not checked: the product document declares no catalogue". Declared: a Scenario is
        checked once a Story claims it (non-empty `user_stories`), an unclaimed one passes
        with "not checked: no Story claims this Scenario yet"; `us refine` always checks the
        Story it walks; `build tests` checks every Scenario in the Registry. No explicit list.
      settled: |
        As recommended. Verdicts stay pass or fail (ADR 0015); "not checked" is a pass with
        a context line. Phase 4 converts a Story by writing it, rekeying its Scenarios and
        filling their `user_stories`. #135's criterion "an uncatalogued Story is not
        checked" becomes "a Scenario no Story claims is not checked".
