# Q&A log of one grilling session (mpc_grill-with-docs).

intent: |
  Write a full specification and documentation for TrueBDD itself, complete enough
  that the project can be rebuilt from scratch: from the user stories and the
  scenarios in docs/scenarios.yaml, `build tests` and `build code` produce new
  working code. For that the registry must be fully understandable to the system:
  every term it uses must be present in the architecture and product documents
  (the document universe), and each stage of the pipeline must validate the next
  piece of documentation against the ones before it, an idea not necessarily
  implemented today.

