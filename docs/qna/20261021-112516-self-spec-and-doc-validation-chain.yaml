          and passes inputs under `with:`
          (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax).
        - |
          The engine already runs a clarification loop inside `--fix`: the fix generator may
          return questions (id, question, context, options), the engine asks the user and
          folds the answers into the next generation call
          (services/bdd-cli/internal/app/engine/cell_handler.go:60,
          services/bdd-cli/internal/domain/models/checklist/clarification.go).
      recommendation: |
        `D: <check-name>` as a key mutually exclusive with `Q:`, parameters under `with:`.
      settled: |
        A deterministic element is written `D: <check-name>`, mutually exclusive with `Q:`;
        a prompt carrying both or neither is a startup refusal. The name picks a built-in
        Go check from the engine's list; an unknown name is a startup refusal, like an
        unconfigured model tier. Check-specific parameters go under `with:`. `rationale`,
        `docs` (the document keys the check reads) and `F:` keep their meaning; `model:` is
        refused on a `D:` element, since no validation turn exists, while `fix_model` and
        `apply_model` stay. A `D:` cell returns the same verdict shape as a model cell (pass
        or fail plus context lines), so reports and the fix loop, clarification questions
        included, treat it alike. Within an item the engine runs every `D:` cell first, in
        file order, then the `Q:` cells; a failed `D:` cell skips that item's `Q:` cells.
    question: |
