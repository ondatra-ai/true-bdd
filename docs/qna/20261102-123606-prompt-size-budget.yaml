intent: |
  #285: every AI turn's prompt fits a 150,000-byte limit the engine checks
  before it starts claude or codex; whatever is over it is a turn to optimize,
  through paths, filtering and portions in place of one whole embedded context.
  The Owner, 2 November, in three messages before the session:

  «Я в целом думаю, что это надо выделить в отдельную задачу и взять сразу
  после 84-й. Вот. И здесь надо подумать, потому как оптимизировать эти
  промпты, то есть задача с тем, чтобы промпты оптимизировать. Под
  оптимизировать понимается, что там есть больше, чем три, ну, больше, чем
  один способ. Один способ – это передавать пути. Второй способ – это,
  например, можно было бы фильтровать. То есть тут бы интересно попробовать
  пофильтровать что-нибудь. Например, поразбивать их на какие-то части,
  давать порциями. Там не один большой промпт, а делать 10 итераций
  Claude-кода там с 10 разными промптами. Ну, как-то так. В любом случае
  нужно сделать так, чтобы в целом объем задачи, да, которая туда попадает,
  он был вменяемый, для того, чтобы его можно было сделать на контекстном
  окне в несколько килобайт. Вообще желательно, чтобы его можно было сделать
  на контекстном окне в 250 килобайт, даже не в 1 мегабайт. Ну, в смысле, не
  1 миллион токенов. Вот. И для этого нужно уменьшить промпты, увеличить их
  количество, сделать какую-то фильтрацию. В общем, как-то это собрать в
  какую-то такую картинку. То есть это немножко задача обратная от того,
  когда мы оптимизировали скорость, да, теперь надо оптимизировать размер.
  И, но это надо сделать после того, как будет работать, ну, на какой-то
  стабильной версии. Вот.»

  «конкретно к задаче с оптимизацией промптов, я бы подошел с еще одного
  жесткого ракурса, чтобы вот там есть движок, да, мы же где-то вызываем вот
  эту всю вещь, чтобы перед вызовом Claude-P прям была проверка, что размер
  промпта, который в него сейчас отправляется, меньше 100 килобайт. Кстати,
  100 килобайт я взял с потолка. Я бы сказал тебе, да, что... Ну, я бы
  передал тебе... То есть я бы сказал, что тебе нужно было бы, да, самому
  посчитать, какой должен быть размер промпта, чтобы уложиться вместе с
  ответом и с ризонингом в 250 тысяч токенов. Мне почему-то кажется, что 0,6
  мегабайта — это даже многовато. Вот. Я бы еще уменьшал, но это уже ты
  должен опираться на какие-то данные, а не на guess feelings. Вот, поэтому
  проапдейть эту задачу и поехали дальше.»

  «Смотри, я бы взял бы лимит в конце концов, да, я бы взял лимит в 150
  килобайт. И все, что выше, да, было бы предложением для оптимизации, и мы
  бы эту вещь оптимизировали. Настолько, насколько это возможно.»

log:
  - decision_trace:
      research:
        - |
          The body turns run claude with Read(**), Glob(**), Grep(**) and
          Write(./tmp/**) (recorded argv, e.g.
          tests/true-bdd/fixtures/concept-bodies-cases/cassettes/claude-001/meta.json);
          the codex writer reads its worktree; only the critique turn is
          stripped of Read, Glob and Grep
          (services/true-bdd/internal/app/generators/validate/step_critic.go:73).
        - |
          Agentic turns already read files themselves: over 708 recorded
          calls, context grew from the first to the peak request by 11,542
          tokens at p99, 18,105 at most.
        - |
          The record and replay proxy hashes argv and stdin only
          (pkg/testkit/aiproxy, requestHash); a file read through a tool is
          outside the hash, so a changed fixture would replay an old answer
          unless the prompt carries the file's digest.
        - |
          Anthropic, "Effective context engineering for AI agents"
          (https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents):
          agents "maintain lightweight identifiers (file paths, stored queries,
          web links, etc.)" and load data just in time; context is "a finite
          resource with diminishing marginal returns"; "a hybrid strategy,
          retrieving some data up front for speed".
        - |
          In round 4's `project tree` body prompt, fixture contents are
          2,457,752 of 2,916,161 bytes (84%).
      recommendation: |
        (1): turns with read tools get each file by path, size and digest and
        read what they need; the core (concept, binding, the Item's steps)
        stays embedded; the critique decided separately.
      settled: |
        Option (1), paths with digests, is accepted as an approach, but the
        Owner's next message reframes #285 as experiments: several approaches
        are tried and compared, (1) among them, and no implementation is fixed
        before their results.
    question: |
      Q1 - May a turn get a file by path instead of its content? (1) Yes, for
      turns with read tools: path, size and digest of each file in the prompt,
      the turn reads what it needs, the core stays embedded, the critique
      decided separately. (2) No: only filtering and portions, everything
      embedded. (3) Yes, paths without digests.
    answer: |
      1.

      Я хотел бы подойти к этой задаче в виде экспериментов. То есть не фиксировать конкретную реализацию, а попробовать несколько, в том числе и тот, который мы только что обсудили.

