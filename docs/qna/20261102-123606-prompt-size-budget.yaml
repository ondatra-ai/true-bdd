      recommendation: |
        (1): offline on round 4's saved turns, a script per approach builds the
        variant and runs the same claude-opus-5 turn three times; measure
        bytes, tokens, cost, time and agreement with the reference; build the
        winner into the engine and let the next round check it.
      settled: |
        Neither option as asked. One isolated call, a script that takes a
        prompt, runs it as the engine would and shows the result, judged by
        looking at it; no test suite for it. A result is judged by whether it
        leads, through the pipeline, to a building code (the tests the next
        stages need), and the build algorithm itself may change as well.
        Scale: a few at first (3), then more (10), isolated from the engine;
        the engine is then fitted to generate the prompt that worked best.
    question: |
      Q2 - How are the experiments run and what picks the winner? (1)
      Offline on round 4's saved turns: a script per approach builds the
      variant and runs the same claude-opus-5 turn three times, measuring
      bytes, tokens, cost, time and agreement with a reference; the winner
      goes into the engine and the next drill round checks it. (2) In the
      engine: every approach behind a switch, full `build steps` runs on a
      cut. (3) Mixed: filter offline, then the best two in the engine through
      a full round. Winner: under 150 KB and agreeing with the reference in
      all three repeats; on a tie, the cheaper.
    answer: |
      Смотри, я бы выносил это в какие-то, изолировал бы сам вызов и просто передавал бы в этот вызов и смотрел, что получается. То есть я бы не делал для этого там какие-то скрипты, какие-то тесты. Я бы просто вот вынес бы в виде какого-то, не знаю, можно там сказать, например, сделать какой-нибудь скрипт. Мы ему передаем вот этот промпт, смотрим, что он там делает, да, смотрим на результат, смотрим, подходит, не подходит. Тут смотри, какая вещь. Нам наша конкретная задача, то есть нам как-то нужно будет это все дело свести к тому, чтобы код билдился. А для того, чтобы код билдился, да, то есть там какие-то... Нам нужно получить тесты. Для этого... В общем, для этого у нас больше рычагов влияния, чем только вот конкретно этот рычаг влияния, на котором мы сейчас говорим. Поэтому я не уверен, моя идея, которая... Да, я это говорю к тому, что нам надо как-то смотреть и анализировать, а будут ли эти результаты, в конце концов, правильно приводить к билду кода, исходя из нашего алгоритма. Или нам нужно будет изменить алгоритм билда кода, да, что-то, короче, с ним переделать, ну, как-то его тоже, может быть, изменить. То есть... Это не выглядит как абсолютно изолированная задача. То есть нам точно нужно ускорить и оптимизировать промпты. Это цель этой задачи. Но результаты мы должны оценивать через призму того, как они будут влиять на следующую переделку. Вот, поэтому я не уверен, к какому пункту это относится. Скорее всего, это второй, только... я бы не гонял бы полный build steps, да, я бы гонял бы 3-4 каких-то build steps, да, там, ну, то есть сперва 3, потом 10, вот что-то такое, как бы. То есть я бы гонял это как-то изолированно от самого движка, для того, чтобы понять, а какой промпт там лучше всего работать. А потом, поняв, какой промпт начинает лучше всего работать, подогнал бы движок для того, чтобы он генерил такой промпт.

  - decision_trace:
      research:
        - |
          TrueBDD's suite has 19 concepts, each an Item; hand-written
          definitions per concept range from 1 (`exit code`) to 9
          (`engine activity`, `file changes`); `project tree` has 5,
          `console output` 4.
        - |
          An Item's body is a chain in the engine: the claude fix turn proposes
          it, the codex apply turn writes it, the engine compiles and checks
          bindings, a tool-less claude critique judges it. Round 4's cut holds
          the skeletons, `State` and the wiring a chain can compile against.
      recommendation: |
        (1): 3, then 10 Items of TrueBDD's suite with the whole suite as
        context; a run is one Item's whole chain outside the engine (variant
        prompt, claude's proposal, codex's write, compilation in round 4's
        cut); first `project tree`, `console output` and `exit code`.
      settled: |
        "3, then 10" is an abstraction, not a unit: an experiment starts small
        and scales (for example 3 prompts, then 10, then 19) as its own design
        calls for. The design of each experiment is left to the executor at
        run time, and the experiments may differ in design. What matters: in
        the end an understanding of which implementation to go on with, and a
        mechanism that will not work is known to fail within about ten
        minutes, not after hours of runs.
    question: |
      Q3 - What is "first 3, then 10", and what is one run's result? (1) 3,
      then 10 Items of TrueBDD's suite with the whole suite as context; a run
      is one Item's whole chain outside the engine (variant prompt, claude's
      proposal, codex's write, compilation in round 4's cut), judged by
      whether the code builds and the body does what its binding says;
      first `project tree`, `console output`, `exit code`. (2) The same, but
      a run is only the proposal, judged by reading it. (3) 3, then 10
      Scenarios of a reduced Registry through a full `build steps`.
    answer: |
      Что такое сперва 3, потом 10, я не могу точно сказать. Относись к этому как к некоторой абстракции, не конкретике. Ну, то есть, например, если мы захотим разбить все эти промпты на все 19 штук, да, то давай сперва проверим сперва 3 промпта, да, потом 10, а потом 19. Но это зависит от дизайна конкретного эксперимента. Вот. То есть я бы дизайн эксперимента на самом деле оставил бы на время выполнения команды и оставил бы самому экзекьютору там, задизайнить этот эксперимент. То есть, потому что их же будет несколько, да, и ну, пусть каждый из них будет задизайлен как-то по-разному. Самое главное, чтобы в конце мы получили какое-то понимание, с какой из возможных реализаций нам двигаться дальше. И тут вторая фишка, да, что если этот механизм не будет работать, то чтобы мы узнали об этом через 10 минут, а не через 4 часа прогонов, и потом вдруг обнаружили, что это не будет работать. Так что это вопрос про дизайн экспериментов.

