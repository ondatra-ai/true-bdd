    answer: |
      Почему сцен чек надо, возможно, заниматься этим или даже, может быть, следующим шагом? Это потому, что я вижу, что если мы не сделаем эту оптимизацию, то вполне возможно, мы никогда не дойдем до полного решения поставленного задачи, поставленного эпика. Вот. То есть, потому что сейчас эта операция занимает чересчур много времени для того, чтобы протестировать ее несколько раз. Вот. Так что посмотри, блокирует ли время сцен для завершения всего эпика или нет. И на основе этого я приму дальше решение, что делать с этой задачей, брать ее сейчас или делать ее потом.
