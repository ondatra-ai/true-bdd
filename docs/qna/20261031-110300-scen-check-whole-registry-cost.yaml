  - decision_trace:
      research:
        - |
          The research note (tmp/orchestrator/research-264/where-the-time-goes.md,
          posted on #264, comment 6548415797): writing the answer, mostly
          thinking, is the time (4.9 s plus 13 s per 1000 output tokens, input
          size adds nothing); bindings are 59% of a pass; a pass makes 2,198
          binding and 2,198 word judgements for 19 distinct bindings and 19
          concepts, and 3,350 link step judgements for 1,373 distinct steps;
          with --fix every applied fix re-validates every Scenario; the
          baseline itself is noisy (9 of 19 bindings got differing verdicts
          within one pass). 344 Scenarios, about 100 min a pass at 10 workers.
      recommendation: |
        A plan on the 25-Scenario sample, one experiment at a time: 0, today's
        walk twice for time and noise; A, 20 or 30 workers; B, fast mode; C,
        bindings once per binding; D, words once per concept; E, link once per
        distinct step; F, under --fix keep what a fix did not touch; G, less
        thinking, last. Same quality: the same failing bindings, concepts and
        steps, and no more disagreement than two runs of today's walk.
      settled: |
        The aim is less complexity, fewer judgements, not the same work done
        faster: A and B are dropped (and G with them, which keeps the same
        work). C, D and E are tried; 0 stays as the measure of quality.
    question: |
      Q3 - Согласны с планом опытов (0 базовая линия; A 20–30 параллельных; B
      fast mode; C привязки раз на привязку; D слова раз на concept; E связь раз
      на разный шаг; F при --fix не перепроверять нетронутое; G меньше
