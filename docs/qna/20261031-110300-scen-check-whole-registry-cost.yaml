  - decision_trace:
      research:
        - |
          The experiments (#264, comment 6549427827; branch
          impl/264-fewer-judgements at 1908f9d2): on the 25-Scenario sample at
          concurrency 10, the two baselines took 506 s and 473 s and differed
          in 2 of 75 cells; D cut words turn time 65% with no words cell
          differing; E cut link turn time 15 to 21% and left one of 184 steps
