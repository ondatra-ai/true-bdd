intent: |
  #264: make `scen check` judge a whole Registry cheaper and faster than the
  measured $1.47 and 174 s of turn time per Scenario (about $500 and 1.8 hours
  for TrueBDD's 339 Scenarios at concurrency 10), before #259's whole-Registry
  run. The Owner, 31 October: «Меня концерн по поводу этого, этой части.
  Скорее всего, нужно будет попытаться вот этот сцен-чек попробовать
  оптимизировать. То есть не делать его полностью, а попытаться оптимизировать
  так, чтобы эта задача была, делалась дешевле и быстрее. То есть это нужно
  вынести в какую-то отдельную подзадачу, посмотри, куда она должна
  принадлежать. Но в целом оптимизация скин-чек должна, сцен-чек должна тоже
  быть сделана.»

log:
  - decision_trace:
      research:
        - |
          The three concept Prompts (link, bindings, words) are one Claude turn
          each per Scenario. Every turn embeds TrueBDD's whole product document
          (about 65 KB); the Scenario's own steps are under 1 KB; bindings adds
          the service's bindings (6.5 KB) and Public interface (16 KB). Each
          user message opens with the Scenario id, so no turn reuses another's
          prompt. Code: services/true-bdd/internal/app/generators/validate/
          concept_link.go, concept_words.go, concept_bindings.go.
        - |
          The word check reads only the linked concepts' means, nothing of the
          Scenario. The shipped checklist also asks 8 scenario_quality questions
          per Scenario; #259's sample left them out, and #259's criterion names
          only the concept checks.
      recommendation: |
        (a): only the three concept Prompts, which #259's criterion and the
        measurement cover; the 8 quality questions stay as they are.
      settled: |
        No scope was chosen. The Owner reframed #264 as research: find where the
        time goes (what is slow, why there are so many operations), propose
        strategies, discuss the plan with the Owner, then try each strategy and
        keep what is faster at the same quality. The goal is the fastest walk
        with the same quality; nothing is decided before the experiments.
    question: |
      Q1 - Что именно удешевляем в #264?: (a) только три Prompt проверки
