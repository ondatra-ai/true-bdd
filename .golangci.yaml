version: "2"

run:
  timeout: 5m
  tests: true
  # Without this the whole bdd-tagged tree is never analysed at all. No !bdd
  # constraint exists, so the union is linted; `generated: lax` still skips
  # the generated tests, which is why the vet -tags bdd gate stays.
  build-tags:
    - bdd

linters:
  default: standard
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    # - containedctx  # TODO: Fix context.Context in struct fields
    # - contextcheck  # TODO: Fix non-inherited context usage
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    # - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange

    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    # - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    # - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  # Disable specific linters.
  settings:
    cyclop:
      max-complexity: 10
    funlen:
      lines: 80
      statements: 40
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    # sloglint's defaults struct carries NoMixedArgs: true and YAML decodes
    # OVER it, so naming a settings block does not switch that default off.
    sloglint:
      kv-only: true
      # static-msg is OFF on purpose: it takes only a literal or a bare ident,
      # so it rejects `enginelog.MsgDispatch`, the constant pinning the wire.

      # slog's own envelope fields. An attribute of the same name emits the
      # key twice, and a JSON reader keeps whichever it saw last.
      forbidden-keys: [time, level, msg, source]
    loggercheck:
      require-string-key: true
      no-printf-like: true
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        # pkg/ is the floor: every root imports it, it imports none. The
        # negations: `**/pkg/**` also matches internal/pkg/, not the floor;
        # pkg/testkit/ is the harness, which exists to reach roots (ADR 0008).
        root-pkg-floor:
          files:
            - "**/pkg/**"
            - "!**/services/**"
            - "!**/scripts/**"
            - "!**/tests/**"
            - "!**/pkg/testkit/**"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/services"
              desc: 'pkg is the floor: every root imports it, it imports none'
            - pkg: "github.com/ondatra-ai/true-bdd/scripts"
              desc: 'pkg is the floor: every root imports it, it imports none'
            - pkg: "github.com/ondatra-ai/true-bdd/tests"
              desc: 'pkg is the floor: every root imports it, it imports none'
        root-services:
          files:
            - "**/services/**"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/scripts"
              desc: 'product code never imports this repo tooling or its tests'
            - pkg: "github.com/ondatra-ai/true-bdd/tests"
              desc: 'product code never imports this repo tooling or its tests'
        root-scripts:
          files:
            - "**/scripts/**"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/services"
              desc: 'tooling shells out to the binary; it does not link it'
            - pkg: "github.com/ondatra-ai/true-bdd/tests"
              desc: 'tooling shells out to the binary; it does not link it'
        # The domain defines; it does not reach outward. A port that names its
        # own implementation is a seam that breaks nothing.
        hex-domain:
          files:
            - "**/services/bdd-cli/internal/domain/**"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/services/bdd-cli/internal/infrastructure"
              desc: 'the domain defines; it does not reach outward'
            - pkg: "github.com/ondatra-ai/true-bdd/services/bdd-cli/internal/app"
              desc: 'the domain defines; it does not reach outward'
            - pkg: "github.com/ondatra-ai/true-bdd/services/bdd-cli/adapters"
              desc: 'a port names domain types only — never its own implementation'
            - pkg: "github.com/ondatra-ai/true-bdd/services/bdd-cli/cmd"
              desc: 'the domain defines; it does not reach outward'
        # Spawning is the fourth channel (ADR 0005). _test.go is exempt: several
        # tests exist to synthesise the raw behaviour shell abstracts — a real
        # *exec.ExitError, a Start with no Wait.
        spawn-exec:
          files:
            - "$all"
            - "!**/pkg/shell/**"
            - "!**/*_test.go"
          deny:
            - pkg: "os/exec$"
              desc: 'spawn: subprocesses go through pkg/shell — need one? add a pkg/cli wrapper and call that'
            - pkg: "golang.org/x/sys/execabs"
              desc: 'spawn: subprocesses go through pkg/shell — need one? add a pkg/cli wrapper and call that'
        # pkg/cli is exempt from THIS list only, so it still cannot import
        # os/exec: the layering is proved rather than trusted.
        spawn-shell:
          files:
            - "$all"
            - "!**/pkg/cli/**"
            - "!**/pkg/shell/**"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/pkg/shell"
              desc: 'spawn: reach a binary through its pkg/cli wrapper — add one if it is missing'
        logging:
          # depguard matches by PREFIX, so a bare `log` would deny log/slog
          # with it; the trailing $ makes it exact. Globs run against ABSOLUTE
          # paths, hence the leading **/.
          files:
            - "$all"
            - "!**/pkg/logging/**"
          deny:
            - pkg: "log$"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "github.com/sirupsen/logrus"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "go.uber.org/zap"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "github.com/rs/zerolog"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "github.com/go-kit/log"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "k8s.io/klog"
              desc: 'log/slog only, and only through pkg/logging'
            - pkg: "github.com/hashicorp/go-hclog"
              desc: 'log/slog only, and only through pkg/logging'
        # scripts/ answers a caller or narrates; narration is a log. Each of
        # the four exemptions holds a DESCRIPTOR, never a print — the hook's
        # stdin and verdict moved to pkg/claude/hooks, which owns both.
        scripts-console:
          files:
            - "**/scripts/**"
            - "!**/scripts/cmd/history/main.go"
            - "!**/scripts/gates/run.go"
            - "!**/scripts/commit/run.go"
            - "!**/scripts/merge/exec.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/ondatra-ai/true-bdd/pkg/console"
              desc: 'scripts narrate: use log/slog, which reaches the shared tools log'
    # forbidigo matches IDENTIFIERS, never call expressions — it never sees an
    # argument. The `^fmt\.Errorf\([^,)]*\)$` pattern that stood here could
    # therefore never fire; err113's checkWrap is what forbids a %w-less Errorf.
    forbidigo:
      # Buys the aliased `import osx "os"` case, which walks past a name-only
      # rule. Free: golangci loads type info for forbidigo either way.
      analyze-types: true
      forbid:
        # Banning the three descriptors is what makes banning fmt.Fprint*
        # unnecessary, so the 48 `fmt.Fprintf(&buf, ...)` string-building sites
        # stay untouched — and it is what catches `cmd.Stdout = os.Stdout`.
        - pattern: '^os\.Std(out|err|in)$'
          msg: 'three channels: reach a terminal through pkg/console'
        # os.Stat/os.Lstat/os.ReadDir/os.Symlink are deliberately absent: they
        # move no bytes, so they cannot observe a half-written file.
        - pattern: '^os\.(Chmod|Create|CreateTemp|Mkdir|MkdirAll|MkdirTemp|Open|OpenFile|ReadFile|Remove|RemoveAll|Rename|Truncate|WriteFile)$'
          msg: 'three channels: read and write files through pkg/disk'
        # Carries no `three channels:` marker, so the migration entries below
        # do not switch it off: the tree already satisfies it everywhere.
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: 'use pkg/console for terminal output, pkg/logging for logs'
        # forbidigo can ban SetDefault outright but can never ban "SetDefault
        # with a foreign handler" — it never sees an argument.
        - pattern: '^slog\.(New|NewTextHandler|NewJSONHandler|NewLogLogger|SetDefault)$'
          msg: 'log construction: build and install handlers through pkg/logging'
        # The spawn paths depguard cannot see, being identifiers and not
        # imports. Zero first-party hits today; this keeps it that way.
        - pattern: '^(os\.StartProcess|syscall\.(Exec|ForkExec))$'
          msg: 'spawn: subprocesses go through pkg/shell — need one? add a pkg/cli wrapper and call that'
    wrapcheck:
      # Don't require wrapping for errors from internal packages
      # Our internal/pkg/errors package provides properly wrapped errors
      ignore-package-globs:
        - "github.com/ondatra-ai/true-bdd/services/bdd-cli/internal/*"
        - "*/internal/*"
        # Same reason as internal/pkg/errors above: every error pkg/disk
        # returns already names the path and the operation that failed.
        - "github.com/ondatra-ai/true-bdd/pkg/*"
      ignore-sig-regexps:
        - 'github\.com/ondatra-ai/true-bdd/services/bdd-cli/internal/pkg/errors\.Err.*'
    tagliatelle:
      # For internal domain models and application code
      case:
        rules:
          json: snake  # Internal JSON APIs use snake_case
          yaml: snake  # All YAML configs use snake_case
          # Note: GitHub API structures (in adapters/github and models/thread.go)
          # are excluded below to match GitHub's camelCase API contract

  exclusions:
    generated: lax
    warn-unused: true
    rules:
      # GitHub API structures must use camelCase to match GitHub's API contract
      - path: services/bdd-cli/internal/adapters/github/.*\.go
        linters:
          - tagliatelle
      - path: services/bdd-cli/internal/domain/models/thread\.go
        linters:
          - tagliatelle
      # Test-runner DTOs mirror third-party JSON wire formats
      # (`go test -json` PascalCase, `jest --json` camelCase). The field
      # casing is the wire contract, not ours.
      - path: services/bdd-cli/internal/infrastructure/testrunner/dto/.*\.go
        linters:
          - tagliatelle
      # Don't require wrapping for internal package returns
      # Our internal/pkg/errors package provides properly wrapped errors
      - path: (services/bdd-cli/internal/.*|services/bdd-cli/adapters/.*)\.go
        linters:
          - wrapcheck
        text: 'github\.com/ondatra-ai/true-bdd/services/bdd-cli/internal/pkg/errors'
      # Allow dynamic errors in test files for test fixtures
      - path: _test\.go
        linters:
          - err113
      # Permanent. Each channel is exempt from its OWN pattern only; pkg/
      # logging gets no entry, since it reaches stdout and its file through the
      # other two — so the linter proves that layering instead of ignoring it.
      - path: ^pkg/console/
        linters:
          - forbidigo
        text: 'three channels: reach a terminal'
      - path: ^pkg/disk/
        linters:
          - forbidigo
        text: 'three channels: read and write files'
      - path: ^pkg/shell/
        linters:
          - forbidigo
        text: 'spawn: subprocesses go through pkg/shell'
      # A test writes fixtures a lock would only slow down, and writes ones
      # deliberately malformed. The terminal patterns still apply here.
      - path: _test\.go
        linters:
          - forbidigo
        text: 'three channels: read and write files'
      # pkg/logging IS the constructor; the harness wraps its handler to tap
      # usage records; a test swaps the default around a capture and restores.
      - path: ^pkg/logging/
        linters:
          - forbidigo
        text: 'log construction:'
      - path: ^pkg/testkit/runner/harness_logging\.go$
        linters:
          - forbidigo
        text: 'log construction:'
      - path: _test\.go
        linters:
          - forbidigo
        text: 'log construction:'


# The defaults (3 same-issue, 50 per-linter) silently truncate a report, so a
# fix-everything pass is told it is finished when it is not.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
