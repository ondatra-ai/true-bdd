# E2E per-instance harness override.
#
# ServerController (tests/harness/helpers/server-controller.ts) launches ONE
# harness container per server instance from THIS file — with a unique compose
# project name (`-p harness-e2e-<uuid>`) so multiple instances coexist (p17/p20/
# p21) and restart recreates the same-port container (p7/a8/p18).
#
# Two variables are injected per instance by ServerController:
#   HARNESS_PORT      — the allocated host port (mapped to the container's 4517)
#   HARNESS_ENV_FILE  — path to a generated env-file carrying REDIS_URL
#                       (host-rewritten to host.docker.internal), the unique
#                       REDIS_KEY_PREFIX, and any per-test serverEnv keys.
#
# Redis is NOT defined here: it is the suite-level singleton brought up once by
# global-setup (`docker compose -f docker-compose.yml up -d redis`) and published
# on the host at 127.0.0.1:6379. Each container reaches it via host.docker.internal
# (mapped to the host gateway so this works on Linux/CI, not just Docker Desktop).
#
# The image is prebuilt once by global-setup (`docker compose build harness`), so
# there is deliberately no `build:` here — a per-instance `up` must never rebuild.
services:
  harness:
    image: true-bdd-harness:e2e
    ports:
      - "127.0.0.1:${HARNESS_PORT}:4517"
    env_file:
      - ${HARNESS_ENV_FILE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
