architecture:
  services:
  - name: greeter
    path: services/greeter
    language: go
    public_interface:
      kind: cli
      document: docs/greeter-cli.yaml
  concepts:
  - concept: greeting
    block: given
    service: greeter
    references:
    - file: greeting-config
    does: Write the expected greeting to the configuration file before running translate.
  - concept: translation
    block: when
    service: greeter
    references:
    - command: translate
    does: Call translate once with the stated language.
  - concept: greeting
    block: then
    service: greeter
    references:
    - log_record: greeted
    does: Observe the greeted log record and compare its greeting to the expected text.
  terms:
  - term: greeting
    technical: Text read from the greeting configuration and recorded in the greeted log record.
    observed_by: Set the greeting configuration and compare the greeted text.
