scenarios:
  host-001:
    description: The greeter must log the configured greeting translated into the requested language
    service: greeter
    path: tests/greeter/scenario_test.go
    user_stories:
    - story: greet
      scenario_id: greet-001
    merged_steps:
      given:
      - the greeting "Hello" is configured in greeter.yaml
      when:
      - the greeting is translated into "French"
      then:
      - the greeted log record has greeting "Bonjour"
