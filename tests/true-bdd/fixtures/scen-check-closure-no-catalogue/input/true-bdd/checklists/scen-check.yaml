# Fixture checklist for `scen-check-closure-no-catalogue`.
#
# The term-mapping and step-definition checks, so the walk spends no
# model turn.

version: "1.0"
last_updated: "2026-10-21"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every term a matched catalogue phrase declares must be mapped, and every template bind to one step definition."
    validation_prompts:
      - D: term-mappings
        rationale: "A product word the architecture never maps says nothing of how a step definition builds or observes it, so the definition cannot follow from the spec."
        docs:
          - product
          - architecture_yaml
        F: "Propose one architecture.terms entry (term, technical, observed_by) for each unmapped term, asking how it is built and observed first. Write it to the architecture document, never to the Scenario."
      - D: step-definitions
        rationale: "A step bound to two step definitions, or to one recording no declared concept of its block, leaves what runs for it to chance, so no step definition follows from the spec."
        docs:
          - product
        F: "Ask what each named step means first, then propose the concept of its block that its one step definition records, declared in the product document's concepts. Write it to the product document, never to the Scenario or a step definition; a step bound to two definitions is the suite's to repair."
