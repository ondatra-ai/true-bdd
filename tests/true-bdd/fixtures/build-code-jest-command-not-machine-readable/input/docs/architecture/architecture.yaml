# The replay command is a working Jest invocation that omits `--json`. It
# would run, exit non-zero on the planted failure, and print a report for
# people, in which the runner finds no failures. That looks exactly like
# success, so it is refused before anything is spawned.

architecture:
  testing:
    framework: jest
    # Run from the directory holding `config:` (here `tests/`), so npx
    # finds the Jest install under tests/node_modules.
    config: tests/jest.config.js
    commands:
      record: npx jest --json --config jest.config.js
      replay: npx jest --config jest.config.js
      live: npx jest --json --config jest.config.js
  services:
    - name: greeter
      path: services/greeter
      language: javascript
