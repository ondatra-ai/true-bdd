architecture:
  services:
  - name: calc
    path: services/calc
    language: go
    public_interface:
      kind: cli
      document: docs/architecture/calc-cli.yaml
  testing:
    framework: go-test
    libraries:
    - module: github.com/ondatra-ai/true-bdd/pkg
      version: v0.0.0-20261027174914-58543b8e324b
    commands:
      record: go test -tags bdd -json -count=1 ./tests/calc/...
      replay: go test -tags bdd -json -count=1 ./tests/calc/...
      live: go test -tags bdd -json -count=1 ./tests/calc/...
  terms:
  - term: number
    technical: The integer argument and stdout of the calculator double command.
    observed_by: The step runs double as a process and compares its integer stdout
      with the expected value.
  phrases:
  - template: the number is {value:number}
    service: calc
    references:
    - command: double
    does: Store the number as the next double command argument.
  - template: the number is doubled
    service: calc
    references:
    - command: double
    does: Observe the private transient heap address without a command; the declared interface offers only double stdout and no way to read the heap.
  - template: the result is {value:number}
    service: calc
    references:
    - command: double
    does: Compare the double command stdout with the expected integer.
