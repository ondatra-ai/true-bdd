architecture:
  services:
  - name: calc
    path: services/calc
    language: go
    public_interface:
      kind: cli
      document: docs/architecture/calc-cli.yaml
  testing:
    framework: go-test
    libraries:
    - module: github.com/ondatra-ai/true-bdd/pkg
      version: v0.0.0-20261027174914-58543b8e324b
    commands:
      record: go test -tags bdd -json -count=1 ./tests/calc/...
      replay: go test -tags bdd -json -count=1 ./tests/calc/...
      live: go test -tags bdd -json -count=1 ./tests/calc/...
  terms:
  - term: number
    technical: The integer argument and stdout of the calculator double command.
    observed_by: The step runs double as a process and compares its integer stdout
      with the expected value.
  - term: heap address
    technical: The address in the double process's memory at which it holds the doubled integer.
    observed_by: The step reads that address from the double process that doubled the number and compares it with the stated one.
  concepts:
  - concept: installation
    block: given
    service: calc
    references:
    - command: double
    does: Build the declared calculator command as a program under the host's tmp directory and keep its path for the When.
  - concept: doubling
    block: when
    service: calc
    references:
    - command: double
    does: Run the kept calculator program's double command as a process from the host root with the step's whole number and keep its integer stdout.
  - concept: heap address
    block: then
    service: calc
    references:
    - command: double
    does: Read the heap address at which the double process that doubled the number held its doubled number, and compare it with the step's stated address.
