roles:
  - name: Owner
    description: Uses the calculator.
concepts:
  given:
    - concept: installation
      means: The calculator program is built from its source and ready for the Owner to run.
      terms: []
  when:
    - concept: doubling
      means: The Owner doubles a whole number with the calculator.
      terms: [number]
  then:
    - concept: heap address
      means: The calculator process that doubled the number held its doubled number at a stated heap address while it ran.
      terms: [number, heap address]
glossary:
  - term: number
    means: An integer operand whose double is its sum with itself.
  - term: heap address
    means: The memory address inside the running calculator process at which it keeps a value; it changes from run to run.
