title: Summary viewer
description:
  summary: Three independent summary views show at most 150 words of the selected shared document. No other thresholds are specified. The brief, overview and preview views all enforce this limit.
roles:
- name: Calculator User
  definition: A person requesting a summary view
vocabulary:
  forbidden_qualifiers: []
  forbidden_actions: []
glossary: []
concepts:
  given:
    - concept: document selected
      means: A shared document the Calculator User can open is selected.
      terms: []
  when:
    - concept: view requested
      means: The Calculator User requests one named summary view of the selected document, brief, overview or preview.
      terms: []
  then:
    - concept: summary length
      means: The displayed summary contains at most a stated number of words.
      terms: []
