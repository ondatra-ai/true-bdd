opencli: 1.0.0
info:
  title: Greeter
  version: 1.0.0
commands:
  greet:
    parameters:
    - name: person
      in: argument
      required: true
      schema:
        type: string
    - name: loud
      in: flag
      schema:
        type: boolean
    responses:
      '0':
        description: Greeting printed
      '1':
        description: Invalid input
extensions:
  files:
    greeting-config:
      path: greeter.yaml
      format: YAML mapping with a greeting string
      access: read
  log_records:
    greeted:
      message: Greeting printed
      format: logfmt with person and greeting fields
  outgoing_calls:
    notify:
      command: notifier
      arguments:
      - --person
      - '{person}'
