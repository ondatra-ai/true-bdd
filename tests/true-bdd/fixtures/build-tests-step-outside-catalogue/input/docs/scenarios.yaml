# Seed registry for the `build-tests-step-outside-catalogue` BDD fixture.
#
# Four scenarios of one suite, `mcp`, rooted at `tests/mcp`, which has no
# `steps/` package yet, so every step binds to nothing and `build tests
# --fix` would spend an AI turn authoring them. The catalogue in
# docs/product/product.yaml phrases each step of INT-901 and leaves one
# step of each other scenario outside it:
#
# - INT-902: its Then step matches no template;
# - INT-903: its Then step matches two templates;
# - INT-904: its last Then step matches a template declared for Given.
#
# A Story claims INT-901 and INT-903 and none claims INT-902 or INT-904:
# `build tests` holds every scenario to the catalogue, claimed or not.
# The run is refused before codegen and before any AI turn.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-step-outside-catalogue fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories:
      - story: "docs/product/stories/99.5-fixture.yaml"
        scenario_id: "99.5-001"
        merge_date: "2026-10-22"
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket"
  INT-902:
    description: "A Claude User opening a session at the MCP server is granted a ticket promptly"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
  INT-903:
    description: "A Claude User opening a session at the MCP server is accepted"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories:
      - story: "docs/product/stories/99.5-fixture.yaml"
        scenario_id: "99.5-002"
        merge_date: "2026-10-22"
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the server answers 200"
  INT-904:
    description: "The MCP server keeps running after a Claude User opens a session"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket"
        - and: "the MCP server is running"
