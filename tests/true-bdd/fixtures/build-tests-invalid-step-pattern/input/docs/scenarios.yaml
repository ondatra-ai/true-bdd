# Seed registry for the `build-tests-invalid-step-pattern` BDD fixture.
#
# One scenario whose suite registers a step pattern with an unclosed
# group in tests/mcp/steps/steps.go, so it is not a regular expression
# at all.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-invalid-step-pattern fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
