# Registry seed for `scen-check-validation-fails`.
#
# Two Scenarios a Story claims, walked against the shipped checklist.
#
# E2E-001 passes every structural check, none of its steps bound to a
# step definition yet, and carries a designed defect for every model
# question that rules on it:
#
#   concept link     its when step and its first then step fall under
#                    no concept of their block
#   1 description is two sentences with neither must nor should
#   2 no given step
#   3 "quickly" in the description
#   4 "properly" in a then step
#   5 "handles" and "processes", forbidden action verbs
#   6 "formatGreeting() was called" is implementation, not behaviour
#   7 no measurable criterion anywhere
#   8 "shown properly" cannot be decided without taste
#
# E2E-002's last step binds a step definition that records no concept,
# so it fails the step-definition check and its model questions are
# skipped, costing no turn. The walk reports both and the CLI exits 1,
# so a bare `scen check` gates a change.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "Two claimed scenarios, one failing every question and one a check"

scenarios:
  E2E-001:
    description: Greeting people. The greeter handles names quickly
    service: greeter
    path: tests/greeter/greet_test.go
    user_stories:
      - story: docs/product/stories/greet-by-name.yaml
        scenario_id: greet-by-name-001-prints-greeting
        merge_date: "2026-10-21"
    merged_steps:
      when:
        - the Operator processes the name "Ada"
      then:
        - the greeting is shown properly
        - and: stdout matches formatGreeting\(\) was called
  E2E-002:
    description: The greeter must print the configured greeting followed by the name it is given
    service: greeter
    path: tests/greeter/greet_test.go
    user_stories:
      - story: docs/product/stories/greet-by-name.yaml
        scenario_id: greet-by-name-002-prints-one-line
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the greeting is configured as "Hello"
      when:
        - the Operator runs "greet Ada"
      then:
        - the greeter prints "Hello Ada" on one line
