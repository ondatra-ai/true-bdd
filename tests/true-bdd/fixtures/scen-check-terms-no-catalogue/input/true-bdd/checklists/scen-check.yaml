# Fixture checklist for `scen-check-terms-no-catalogue`.
#
# The declared-term check alone, so the walk spends no model turn.

version: "1.0"
last_updated: "2026-10-21"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every term a declared concept relies on must be defined in the product glossary."
    validation_prompts:
      - D: declared-terms
        rationale: "A concept whose meaning relies on an undefined word still has no stated meaning, so no step definition follows from the spec."
        docs:
          - product
        F: "Propose one glossary entry (term, means) for each undefined term, asking what it means first. Write it to the product document's glossary, never to the Scenario."
