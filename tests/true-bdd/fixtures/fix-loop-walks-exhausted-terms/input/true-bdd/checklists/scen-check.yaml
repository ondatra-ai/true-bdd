# Fixture checklist for `fix-loop-walks-exhausted-terms`.
#
# The declared-term check alone, with a fix that proposes its glossary
# entry straight away, under a budget of one walk: the fix is applied and
# the Scenario re-checked, but the re-walk that would confirm it is the
# second attempt, which the budget does not allow.

version: "1.0"
last_updated: "2026-10-30"

config:
  max_apply_attempts: 1

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every term a declared concept relies on must be defined in the product glossary."
    validation_prompts:
      - D: declared-terms
        rationale: "A concept whose meaning relies on an undefined word still has no stated meaning, so no step definition follows from the spec."
        docs:
          - product
        F: "Propose one glossary entry (term, means) for the undefined term, without asking first. Write it to the product document's glossary, never to the Scenario."
