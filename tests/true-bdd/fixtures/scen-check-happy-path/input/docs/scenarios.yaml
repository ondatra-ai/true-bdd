# Registry seed for `scen-check-happy-path`.
#
# One Scenario a Story claims, written to pass every prompt of the
# shipped scen-check checklist, so one un-narrowed walk observes all of
# them passing: every step links to one concept of its block whose terms
# the glossary defines and the architecture maps, whose binding says what
# its steps do through the greeter's Public interface and whose meaning
# relies only on those terms and plain English, and the description is a
# one-sentence `must` rule with a measurable, binary outcome in the
# product's vocabulary.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "One claimed scenario that passes every scen-check prompt"

scenarios:
  E2E-001:
    description: The greeter must print the configured greeting followed by the name it is given, and exit with code 0
    service: greeter
    path: tests/greeter/greet_test.go
    user_stories:
      - story: docs/product/stories/greet-by-name.yaml
        scenario_id: greet-by-name-001-prints-greeting
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the greeting is configured as "Hello"
      when:
        - the Operator runs "greet Ada"
      then:
        - the command exits with code 0
        - and: stdout matches ^Hello Ada$
