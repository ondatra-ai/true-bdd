# Host config for the `build-tests-unresolvable-default-tiers` BDD fixture.
#
# The repository's own config, except that `coder` is gone from
# `engine.models` while `default_apply_model` still names it, and
# `default_prompt_model` names a tier the engine does not know. The fix
# role's default is sound. The engine must refuse to start and name both
# faulty defaults, in one run.

engine:
  models:
    xhigh: "claude:claude-fable-5"
    high: "claude:claude-opus-5"
    quick: "claude:claude-sonnet-5"
  # DELIBERATELY BROKEN: `medium` is not a tier the engine knows.
  default_prompt_model: medium
  # Sound: the refusal must not name it.
  default_fix_model: high
  # DELIBERATELY BROKEN: `coder` is not configured under engine.models.
  default_apply_model: coder

templates:
  prompts:
    checklist: "./templates/us-checklist.prompt.tpl"
    checklist_system: "./templates/us-checklist.system.prompt.tpl"
    fix_generator: "./templates/us-checklist.fix-generator.prompt.tpl"
    fix_generator_system: "./templates/us-checklist.fix-generator.system.prompt.tpl"
    fix_applier: "./templates/us-checklist.fix-applier.prompt.tpl"
    fix_applier_system: "./templates/us-checklist.fix-applier.system.prompt.tpl"
    apply_checklist: "./templates/us.apply-checklist.prompt.tpl"
    apply_checklist_system: "./templates/us.apply-checklist.system.prompt.tpl"
    apply_fix_generator: "./templates/us.apply-checklist.fix-generator.prompt.tpl"
    apply_fix_generator_system: "./templates/us.apply-checklist.fix-generator.system.prompt.tpl"
    apply_fix_applier: "./templates/us.apply-checklist.fix-applier.prompt.tpl"
    apply_fix_applier_system: "./templates/us.apply-checklist.fix-applier.system.prompt.tpl"
    build_steps_checklist: "./templates/build-steps.checklist.prompt.tpl"
    build_steps_checklist_system: "./templates/build-steps.checklist.system.prompt.tpl"
    build_steps_fix_generator: "./templates/build-steps.fix-generator.prompt.tpl"
    build_steps_fix_generator_system: "./templates/build-steps.fix-generator.system.prompt.tpl"
    build_steps_fix_applier: "./templates/build-steps.fix-applier.prompt.tpl"
    build_steps_fix_applier_system: "./templates/build-steps.fix-applier.system.prompt.tpl"
    build_code_checklist: "./templates/build-code.checklist.prompt.tpl"
    build_code_checklist_system: "./templates/build-code.checklist.system.prompt.tpl"
    build_code_fix_generator: "./templates/build-code.fix-generator.prompt.tpl"
    build_code_fix_generator_system: "./templates/build-code.fix-generator.system.prompt.tpl"
    build_code_fix_applier: "./templates/build-code.fix-applier.prompt.tpl"
    build_code_fix_applier_system: "./templates/build-code.fix-applier.system.prompt.tpl"
    scen_check_checklist: "./templates/scen-check.checklist.prompt.tpl"
    scen_check_checklist_system: "./templates/scen-check.checklist.system.prompt.tpl"
    scen_check_fix_generator: "./templates/scen-check.fix-generator.prompt.tpl"
    scen_check_fix_generator_system: "./templates/scen-check.fix-generator.system.prompt.tpl"
    scen_check_fix_applier: "./templates/scen-check.fix-applier.prompt.tpl"
    scen_check_fix_applier_system: "./templates/scen-check.fix-applier.system.prompt.tpl"

paths:
  tmp_dir: "./tmp"
  tmp_glob: "./tmp/**"
  stories_dir: "docs/product/stories"
  checklists_dir: "./true-bdd/checklists"

documents:
  product: "./docs/product/product.yaml"
  architecture_yaml: "./docs/architecture/architecture.yaml"
  scenarios_yaml: "./docs/scenarios.yaml"
