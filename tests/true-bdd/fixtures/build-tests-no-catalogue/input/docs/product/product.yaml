# Product document for `build-tests-no-catalogue`.
#
# It declares roles and a glossary but no `catalogue:` key, so no step of
# docs/scenarios.yaml is held to a phrase, however it reads.

title: "Fixture host project"

description:
  summary: >-
    A single MCP server a Claude User's client opens sessions at, used
    by the true-bdd fixtures as the host project a scenario registry
    describes.

roles:
  - name: Claude User
    definition: Uses Claude, whose client opens sessions at the MCP server.

glossary:
  - term: ticket
    means: >-
      The credential the MCP server grants a session when it accepts it.
