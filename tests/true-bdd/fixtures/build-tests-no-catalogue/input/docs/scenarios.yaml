# Seed registry for the `build-tests-no-catalogue` BDD fixture.
#
# One scenario a Story claims, every step of which binds to a definition
# already in tests/mcp/steps/. Its Then step is the one
# `build-tests-step-outside-catalogue` refuses as matching no template;
# here the product document declares no catalogue, so nothing holds the
# step to one and `build tests --fix` renders the test and walks nothing.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-no-catalogue fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket promptly"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories:
      - story: "docs/product/stories/99.5-fixture.yaml"
        scenario_id: "99.5-001"
        merge_date: "2026-10-22"
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
