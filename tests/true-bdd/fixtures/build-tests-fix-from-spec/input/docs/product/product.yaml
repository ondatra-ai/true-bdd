# Product document for `build-tests-fix-from-spec`.
#
# The catalogue phrases every step of INT-901 and INT-902, and the
# glossary defines every word those phrases declare. How each word is
# built and observed is the architecture's word mapping.

title: "Fixture host project"

description:
  summary: >-
    A single MCP server a Claude User's client opens sessions at, used
    by the true-bdd fixtures as the host project a scenario registry
    describes.

roles:
  - name: Claude User
    definition: Uses Claude, whose client opens sessions at the MCP server.

glossary:
  - term: MCP server
    means: >-
      The service this project builds: it answers Model Context Protocol
      requests from a Claude User's client. Nothing in a Scenario reaches
      the product except through it.
  - term: session
    means: >-
      One conversation between a Claude User's client and the MCP server,
      from the request that opens it to the last request carrying its
      ticket.
  - term: ticket
    means: >-
      The credential the MCP server grants a session when it accepts it.
      Every later request of that session carries it, and a request
      without a valid one is refused.
  - term: protocol version
    means: >-
      The edition of the Model Context Protocol the MCP server speaks. A
      client that speaks another edition must not go on with the session.

catalogue:
  - template: 'the MCP server is running'
    block: given
    means: >-
      The MCP server has started and is ready to answer, so a Claude
      User's client can reach it.
    terms: [MCP server]
  - template: 'the {actor:role} opens a session'
    block: when
    means: >-
      That role's client asks the MCP server for a new session, once, and
      keeps the server's answer for the steps that follow.
    terms: [MCP server, session]
  - template: 'the session is granted a ticket'
    block: then
    means: >-
      The MCP server accepted the session and handed back its ticket.
    terms: [session, ticket]
  - template: 'the server names its protocol version'
    block: then
    means: >-
      The MCP server's answer to the session's opening says which
      protocol version it speaks.
    terms: [MCP server, protocol version]
