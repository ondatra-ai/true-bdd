engine:
  fix_model: quick
  apply_model: quick
  critique_model: quick
# Checklist for `true-bdd build steps`.
config:
  max_apply_attempts: 3
sections:
  - id: step-coverage
    name: Step coverage
    validation_prompts:
      - D: step-coverage
        rationale: Each phrase needs one compiled definition with its body written; the whole suite is covered and listed after all Items.
        F: Write only this phrase's body using its Phrase mapping and declared Public interface, preserving the engine's registration and signature.
