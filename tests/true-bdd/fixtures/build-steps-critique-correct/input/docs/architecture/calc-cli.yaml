opencli: 0.1
info:
  title: Calculator CLI
  version: '1.0'
commands:
  double:
    description: Run go run ./services/calc double VALUE from the host root; stdout
      is the doubled integer and a newline. The service appends one double VALUE line
      to its call log for each invocation.
    parameters:
    - name: value
      in: argument
      required: true
      schema:
        type: integer
    responses:
      '0':
        description: Doubled integer on stdout
      '1':
        description: Invalid arguments
extensions:
  files:
    calc_calls:
      path: tmp/calc-calls.log
      format: One double VALUE line per invocation, newline terminated.
      access: write
