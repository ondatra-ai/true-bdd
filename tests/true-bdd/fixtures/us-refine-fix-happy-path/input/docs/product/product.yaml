title: Integer calculator
description:
  summary: 'The divide Story divides two already validated integers exactly. Its only failure mode is a zero divisor, which must exit 1 with stderr "Cannot divide by zero" and no result. Missing or non-integer
    input errors belong to calculator-input. Successes: 6 / 2 = 3; 9 / 3 = 3; 0 / 2 = 0.'
roles:
- name: Calculator User
  definition: A person using the calculator CLI
vocabulary:
  forbidden_qualifiers:
  - properly
  - correctly
  - appropriate
  - fast
  forbidden_actions: []
glossary: []
concepts:
  given:
    - concept: operand supplied
      means: The calculator is supplied a stated, already validated integer as its dividend or as its divisor.
      terms: []
  when:
    - concept: division
      means: The Calculator User runs the calculator's divide command once, with the supplied dividend and divisor.
      terms: []
  then:
    - concept: outcome
      means: Either the divide command exits 0 and prints exactly a stated integer on stdout, or it exits 1 with exactly a stated message on stderr and prints no result.
      terms: []
