# Fixture checklist for `fix-loop-own-words`.
#
# The declared-term check alone, with a fix that asks one question before
# it proposes its glossary entry, so the person answers it in their own
# words.

version: "1.0"
last_updated: "2026-10-30"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every term a declared concept relies on must be defined in the product glossary."
    validation_prompts:
      - D: declared-terms
        rationale: "A concept whose meaning relies on an undefined word still has no stated meaning, so no step definition follows from the spec."
        docs:
          - product
        F: >-
          Propose one glossary entry (term, means) for the undefined term, asking exactly one question first: what the term means.
          After the person answers, copy their definition into means verbatim, removing only the introductory "It means".
          Keep means on one YAML scalar line. Preserve the person's pronouns and wording; do not expand "its reply" into a longer phrase.
          Write it to the product document's glossary, never to the Scenario.
