architecture:
  services:
  - name: calc
    path: services/calc
    language: go
    public_interface:
      kind: cli
      document: docs/architecture/calc-cli.yaml
  - name: neighbour
    path: services/neighbour
    language: go
  testing:
    framework: go-test
    commands:
      record: go test -tags bdd -json -count=1 ./tests/calc/...
      replay: go test -tags bdd -json -count=1 ./tests/calc/...
      live: go test -tags bdd -json -count=1 ./tests/calc/...
  terms:
  - term: number
    technical: The integer argument and stdout of the calculator double command.
    observed_by: The step runs double as a process and compares its integer stdout
      with the expected value.
  concepts:
  - concept: installation
    block: given
    service: calc
    references:
    - command: double
    does: Build the declared calculator command as a program under the host's tmp directory and keep its path for the When.
  - concept: doubling
    block: when
    service: calc
    references:
    - command: double
    does: Run the kept calculator program's double command as a process with the step's whole number and keep its integer stdout.
  - concept: result
    block: then
    service: calc
    references:
    - command: double
    does: Compare the kept double command stdout with the step's expected whole number.
