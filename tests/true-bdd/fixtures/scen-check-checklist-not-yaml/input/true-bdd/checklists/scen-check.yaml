# Fixture checklist for `scen-check-checklist-not-yaml`.
#
# DELIBERATELY NOT YAML: the second Prompt's `rationale:` sits one
# column left of its `D:`, which no YAML reader accepts. The engine
# must refuse to start, naming this file and the line its reader
# stopped at.

version: "1.0"
last_updated: "2026-10-22"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every step of a Scenario a Story claims must match one catalogue phrase."
    validation_prompts:
      - D: step-phrases
        rationale: "A step outside the catalogue has no stated meaning."
        docs:
          - product
      - D: declared-terms
       rationale: "A phrase relying on an undefined word has no stated meaning."
        docs:
          - product
