# Fixture checklist for `scen-check-checklist-not-yaml`.
#
# DELIBERATELY NOT YAML: the second Prompt's `rationale:` sits one
# column left of its `D:`, which no YAML reader accepts. The engine
# must refuse to start, naming this file and the line its reader
# stopped at.

version: "1.0"
last_updated: "2026-10-22"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every term a declared concept relies on must be defined in the product glossary and mapped in the architecture."
    validation_prompts:
      - D: declared-terms
        rationale: "A concept relying on an undefined word has no stated meaning."
        docs:
          - product
      - D: term-mappings
       rationale: "A concept relying on an unmapped word says nothing of how a step definition builds it."
        docs:
          - product
          - architecture_yaml
