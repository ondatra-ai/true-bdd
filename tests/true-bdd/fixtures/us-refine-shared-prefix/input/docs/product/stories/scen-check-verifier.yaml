# The Story `us refine scen-check` asks for, in `us-refine-shared-prefix`.
#
# Its sibling `scen-check-phrases-tag.yaml` also matches the glob
# `scen-check-*.yaml`; this file is the one whose own id is `scen-check`.
# One of its steps carries an `or:` modifier, which no Story may hold, so
# the run refuses it while reading it, before any AI turn: the refusal
# names the file the engine picked.

story:
    id: scen-check
    title: Check A Claimed Scenario Against Its Spec
    as_a: Quality Engineer
    i_want: to check that a claimed Scenario keeps to the spec its Story declares
    so_that: a Scenario that drifted from the spec is caught before it ships
    status: PLANNED
    acceptance_criteria:
        - id: 001-claimed-scenario-passes
          description: A claimed Scenario that keeps to every prompt of the checklist must pass the walk.
          steps:
            - given:
                - a Registry holding one claimed Scenario that keeps to the spec
            - when:
                - the Quality Engineer runs "scen check"
            - then:
                - the command exits with code 0
                - or: the command prints ALL CHECKS PASSED
