# Seed registry for the `build-tests-step-modifier-list` BDD fixture.
#
# One scenario whose second Then step is an `and:` holding a list, not one step.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-step-modifier-list fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
        - and:
            - "the session is listed as open"
            - "the ticket is not yet used"
