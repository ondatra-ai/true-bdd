# Fixture checklist for `scen-check-prompt-with-both-kinds`.
#
# The second Checklist item names both `Q.code` and `Q.prompt`.
# The engine refuses it before the walk: a Q uses one option,
# never both. The first Checklist item is well formed, so the
# refusal must name the second by its position.

version: "1.0"
last_updated: "2026-10-21"

sections:
  - id: scenario_quality
    name: "Scenario Quality"
    validation_prompts:
      - Q:
          code: given-when-then
        rationale: "A scenario missing a kind cannot be executed as written: no precondition, no action, or nothing asserted."

      - Q:
          code: given-when-then
          prompt: |
            Decide whether this scenario's steps carry all three
            Given/When/Then kinds.
        rationale: "A scenario missing a kind cannot be executed as written: no precondition, no action, or nothing asserted."
