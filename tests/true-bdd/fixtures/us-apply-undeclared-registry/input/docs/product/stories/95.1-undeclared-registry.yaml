# Story seed for `us-apply-undeclared-registry`: a Story `us apply` could
# merge, so the only reason to refuse the run is the Registry
# true-bdd.yaml never declares. It must come back byte-identical.

story:
    id: "95.1"
    title: BDD fixture - us apply with no registry declared
    as_a: Claude User
    i_want: a synthetic story us apply could merge into a registry
    so_that: the BDD harness can assert us apply refuses a host that declares no registry
    status: PLANNED
    acceptance_criteria:
        - id: 001-mcp-initialize
          description: The MCP server must respond with a 200 status and a JSON-RPC envelope when a Claude User posts a valid JSON-RPC initialize request to the /mcp endpoint.
          steps:
            - given:
                - the MCP server is running on its configured port
                - the server accepts JSON-RPC over HTTP POST at /mcp
            - when:
                - the Claude User posts a valid JSON-RPC initialize request to /mcp
            - then:
                - the server returns HTTP 200
                - and: the response body is a well-formed JSON-RPC envelope referencing the request id
