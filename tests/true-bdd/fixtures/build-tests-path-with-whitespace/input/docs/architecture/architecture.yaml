# Architectural spec for the `build-tests-path-with-whitespace` fixture.
#
# One service, mcp-service, whose tests are Go tests under tests/mcp/.
# `build tests` reads it to resolve the suite that owns each scenario.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/mcp/... -mode=record
      replay: go test -json -count=1 ./tests/mcp/... -mode=replay
      live: go test -json -count=1 ./tests/mcp/...
  services:
    - name: mcp-service
      path: services/mcp-service
      language: go
