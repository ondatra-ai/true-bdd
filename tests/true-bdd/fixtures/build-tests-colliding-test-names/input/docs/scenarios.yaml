# Seed registry for the `build-tests-colliding-test-names` BDD fixture.
#
# Two scenarios keyed INT-901 and INT901: both render the Go test name
# TestINT901.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-colliding-test-names fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
  INT901:
    description: "A Claude User's ticket is granted within the session's limit"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 5 seconds"
