the scen_check_checklist prompt is byte-identical when step arguments are absent:
  glob: tmp/*/01-E2E-001-checklist-*-user.txt
  operator: matches
  pattern: |-
    \A# Registry Scenario Validation

    ## Purpose
    Evaluate ONE scenario from the scenario registry against one quality
    question\. The scenario's own fields are reproduced in full below —
    everything the question can be answered from is on this page\.

    ## Instructions
    1\. Read any reference documentation listed below\.
    2\. Read the subject scenario reproduced below\.
    3\. Answer the validation question about THAT SCENARIO ALONE\.
    4\. Always explain your reasoning BEFORE the answer block\.

    You are not shown the registry file, and you must not go looking for it\.
    A question you can only answer by comparing this scenario against others
    is a question this checklist does not ask — answer the one it does\.

    ## Subject — Registry Scenario

    \*\*Scenario ID:\*\* E2E-001
    \*\*Description:\*\* The greeter must print the configured greeting followed by the name it is given, and exit with code 0
    \*\*Service:\*\* greeter
    \*\*Generated test file:\*\* tests/greeter/greet_test\.go

    ### Steps
    Given:
      - the greeting is configured as "Hello"
    When:
      - the Operator runs "greet Ada"
    Then:
      - the command exits with code 0
      - and stdout matches \^Hello Ada\$
      - but stderr has no lines

    ### Lineage — user_stories\[\]
      - docs/product/stories/z-greeting\.yaml \(z-greeting-002-name\)
      - docs/product/stories/a-greeting\.yaml \(a-greeting-001-name\)

    ---

    ## Validation Question

    Decide whether this scenario's description follows the
    rule-based format\. A violation is any of:
    - missing the keyword "must" or "should"
    - exceeds one sentence
    - contains Gherkin Given/When/Then text \(Gherkin belongs in the
      steps, not the description\)

    Pass when the description follows the rule-based format\.
    Fail when it violates any of the above\.

    Context: emit one line\.
      - "<scenario id>: ok"
      - "<scenario id>: <violation> — <quoted offending phrase>"
     SO THAT WE ENSURE A description is the one sentence a reader sees first; a rule states what must hold, where prose only gestures at it\.

    ## If Validation Fails
    If your answer is `fail`, copy the following fix template VERBATIM into
    the `fix_prompt:` field of your result\. Do not paraphrase\.

    Rewrite this Scenario's description, in its registry entry, as one sentence stating the rule it pins, with must or should and no Given/When/Then text\. Keep what it specifies; change no step\.

    ## Answer Format
    Output your answer using this exact format:

    === FILE_START: tmp/[^/\n]+/01-E2E-001-checklist-scen-check-scenario_quality-result\.yaml ===
    answer: <pass \| fail>
    context:
      - "<context line per the question's context spec>"
    fix_prompt: \|
      <if answer is fail, paste the fix template above verbatim>
      <if answer is pass, omit this field entirely>
    === FILE_END: tmp/[^/\n]+/01-E2E-001-checklist-scen-check-scenario_quality-result\.yaml ===


    \*\*ANSWER CONTRACT FOR THIS RUN — this supersedes the FILE_START/FILE_END
    instructions above\.\*\* Your final message must be a single JSON object:

    - `answer`: exactly `"pass"` or `"fail"`\.
    - `context`: an array of one-line observation strings, as described above\.
    - `fix_prompt`: the fix instructions when the answer is `fail`; omit or
      leave empty otherwise\.

    Do not emit FILE_START/FILE_END markers, and do not wrap the object in
    markdown fences\. Reasoning before the object is fine and is ignored\.

    \z
the scen_check_checklist prompt keeps its system bytes when step arguments are absent:
  glob: tmp/*/01-E2E-001-checklist-*-system.txt
  operator: matches
  pattern: |-
    \AYou are a Registry Scenario Reviewer ruling on one scenario from the
    requirements registry against one quality question\.

    \*\*Mode:\*\* Scen-Check Checklist Validator

    \*\*Core Identity:\*\*
    - Role: BDD Engineer — Registry Scenario Reviewer
    - Style: Strict, evidence-based; never guess
    - Focus: Whether ONE scenario reads as one testable behaviour

    \*\*What you are given:\*\*
    The scenario's own fields — id, description, service, generated test
    path, lineage and steps — reproduced in the user prompt\. That is the
    whole subject\. You are deliberately not given the registry file, so no
    question here can be about how this scenario compares to another one\.

    \*\*Tool Usage \(CRITICAL\):\*\*
    1\. The user prompt may list reference docs as `Read\(`path`\)`\. Read each
       one before answering — the forbidden-qualifier and forbidden-action
       vocabularies live there, and a verdict against a list you did not
       read is a guess\.
    2\. Do NOT search for, glob or read the scenario registry\. Do NOT read
       the generated test file or the step definitions\. Nothing outside the
       subject and the listed documents bears on the answer\.
    3\. Do NOT modify any file\. This command is read-only\.

    \*\*Workflow:\*\*
    1\. Read every document referenced in the user prompt
    2\. Read the subject scenario
    3\. Decide pass / fail per the question's pass/fail rule
    4\. Emit context lines per the question's context spec

    \*\*Output Format:\*\*
    Always output a YAML document inside FILE_START / FILE_END markers with:
    - `answer: pass` or `answer: fail`
    - `context:` — list of strings per the question's context spec
    - `fix_prompt:` — only present when `answer: fail` and a fix template
      is provided in the user prompt; otherwise omit


    \*\*ANSWER CONTRACT FOR THIS RUN — this supersedes the FILE_START/FILE_END
    instructions above\.\*\* Your final message must be a single JSON object:

    - `answer`: exactly `"pass"` or `"fail"`\.
    - `context`: an array of one-line observation strings, as described above\.
    - `fix_prompt`: the fix instructions when the answer is `fail`; omit or
      leave empty otherwise\.

    Do not emit FILE_START/FILE_END markers, and do not wrap the object in
    markdown fences\. Reasoning before the object is fine and is ignored\.

    \z
