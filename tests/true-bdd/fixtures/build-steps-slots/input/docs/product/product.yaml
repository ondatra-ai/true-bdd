roles:
  - name: Owner
    description: Uses the calculator.
concepts:
  given:
    - concept: installation
      means: The calculator program is built from its source and ready for the Owner to run.
      terms: []
  when:
    - concept: running
      means: The Owner runs the calculator command the step names on a whole number.
      terms: [number]
  then:
    - concept: result
      means: The calculator prints the whole number the command produced.
      terms: [number]
glossary:
  - term: number
    means: An integer operand whose double is its sum with itself.
