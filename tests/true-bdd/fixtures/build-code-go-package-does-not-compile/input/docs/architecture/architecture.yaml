# One Go service with one go test suite whose only package does not
# compile: a test calls a function production source does not declare.
# All three commands carry -json, so the suite-command pre-pass passes
# and the walk runs the suite.
#
# `path: services/calc` is also the applier's write root: the fix turn
# may edit production source there and nothing else.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/suite/...
      replay: go test -json -count=1 ./tests/suite/...
      live: go test -json -count=1 ./tests/suite/...
  services:
    - name: calc
      path: services/calc
      language: go
