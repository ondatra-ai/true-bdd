architecture:
  services:
  - name: calc
    path: services/calc
    language: go
    public_interface:
      kind: cli
      document: docs/architecture/calc-cli.yaml
  testing:
    framework: go-test
    libraries:
    - module: github.com/ondatra-ai/true-bdd/pkg
      version: v0.0.0-20261027174914-58543b8e324b
    commands:
      record: go test -tags bdd -json -count=1 ./tests/calc/...
      replay: go test -tags bdd -json -count=1 ./tests/calc/...
      live: go test -tags bdd -json -count=1 ./tests/calc/...
  terms:
  - term: number
    technical: The integer argument and stdout of the calculator double command.
    observed_by: The step runs double as a process and compares its integer stdout
      with the expected value.
  concepts:
  - concept: doubling
    block: when
    service: calc
    references:
    - command: double
    does: Run the declared double command as a process from the host root, as go run ./services/calc double with the step's whole number, and keep its integer stdout.
  - concept: result
    block: then
    service: calc
    references:
    - command: double
    does: Compare the kept double command stdout with the step's expected whole number.
