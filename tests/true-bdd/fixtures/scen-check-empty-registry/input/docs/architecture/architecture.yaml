# Architectural spec for `scen-check-empty-registry`.
#
# The shipped scen-check checklist's closure prompts cite the
# architecture document, and the engine resolves every cited document
# before the walk; this host maps no term, since the run walks nothing.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/mcp/... -mode=record
      replay: go test -json -count=1 ./tests/mcp/... -mode=replay
      live: go test -json -count=1 ./tests/mcp/...
  services:
    - name: mcp-service
      path: services/mcp-service
      language: go
  terms: []
