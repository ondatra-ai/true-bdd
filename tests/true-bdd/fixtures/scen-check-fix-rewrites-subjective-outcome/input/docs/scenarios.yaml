metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "One scenario with a subjective outcome"

scenarios:
  E2E-001:
    description: The greeter must greet the person whose name it is given so that they feel welcome
    service: greeter
    path: tests/greeter/greet_test.go
    user_stories: []
    merged_steps:
      given:
        - the greeting is configured as "Hello"
      when:
        - the Operator runs "greet Ada"
      then:
        - Ada feels welcomed by what the greeter prints
