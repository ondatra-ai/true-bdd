scenarios:
  calc-001-double:
    description: Double a number
    service: calc
    path: tests/calc/calc_test.go
    merged_steps:
      given: ['the number is 2']
      when: ['the number is doubled']
      then: ['the result is 4']
  calc-002-shared:
    description: Observe an unchanged number through the shared definition
    service: calc
    path: tests/calc/calc_test.go
    merged_steps:
      given: ['the number is 3']
      then: ['the result is 3']
