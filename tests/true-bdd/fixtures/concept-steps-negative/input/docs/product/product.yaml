roles:
  - name: Owner
    description: Uses the calculator.
concepts:
  when:
    - concept: halving
      means: The Owner halves a whole number, positive, zero or negative, with the calculator, which rounds an odd number's half toward zero.
      terms: [number]
  then:
    - concept: result
      means: The calculator prints the whole number the halving produced.
      terms: [number]
glossary:
  - term: number
    means: A whole number, positive, zero or negative.
