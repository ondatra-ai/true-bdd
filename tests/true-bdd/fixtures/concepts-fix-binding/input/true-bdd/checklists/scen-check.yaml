version: '1.0'
sections:
- id: term_closure
  validation_prompts:
  - D: phrase-mappings
    rationale: A phrase without a Public interface operation leaves its step definition to invent what to do.
    docs:
    - product
    - architecture_yaml
    F: 'Ask the System Architect what a step of this shape does through the service''s Public interface, by block: a when
      calls an operation, a given sets up state, a then observes and compares. For a template host propose one architecture.phrases
      entry with the verbatim template; for a concept host propose architecture.concepts with the declared concept name and
      block. Include service, references and does, or intent for a UI service, and add to the Public interface document what
      the answers name that it does not declare yet. Write the architecture and that document only after apply, never the
      Scenario.'
