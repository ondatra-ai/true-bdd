# Per-fixture override of `true-bdd/checklists/us-refine.yaml`.
#
# SINGLE-PROMPT override: contains only shipped prompt q6
# (forbidden action verbs in steps), copied VERBATIM (Q, rationale, docs, F). The coverage
# collector matches run prompts to the shipped universe by EvalKey
# (digest over Q + rationale + F + docs), so this run's lone prompt
# still credits the shipped us-refine q6 branches while the walk
# stays decoupled from the other 11 prompts' judge stability.
#
# If the shipped q6 (or a shipped `config:` block) changes, this
# copy must be updated too — the override_sync test in
# tests/bdd/coverage fails otherwise.

version: '1.0'
last_updated: '2026-04-18'
sections:
- id: acceptance_criteria
  name: Acceptance Criteria Quality
  description: Testable conditions that define 'done' (incorporates Ron Jeffries'
    Confirmation)
  source: https://www.altexsoft.com/blog/acceptance-criteria-purposes-formats-and-best-practices/
  validation_prompts:
  - Q: |
      For every AC, decide whether its Given/When/Then steps use action
      verbs from the forbidden_actions list in the terms reference
      (true-bdd/terms.yaml).

      Pass when no AC uses forbidden action verbs in its steps.
      Fail when one or more ACs use forbidden action verbs.

      Context: emit one line per AC.
        - "<AC-id>: ok"
        - "<AC-id>: forbidden verb '<verb>' in <given|when|then>"
          (e.g. "AC-2: forbidden verb 'parse' in then")
    rationale: Every step must use concrete, reproducible action verbs. Verbs in
      the forbidden_actions list do not specify the interaction mechanism and cannot
      be automated.
    docs:
    - prd
    - terms
    - bdd_guidelines
    F: |
      Rewrite each step that uses a forbidden action verb.

      Use the terms reference document to select a concrete replacement verb
      that specifies the interaction mechanism — not just the user's intent.
