# Architectural spec for the p3-inventory-spread harness fixture.
# Valid per the shape read by the us-refine prompts (services with
# quality-gate test layers + BDD vocabulary), so the architecture chip
# renders `present`.

architecture:
  services:
    - name: mcp-service
      path: services/mcp
      language: go
      frameworks:
        - net/http
      quality_gate:
        tests:
          e2e:
            path: tests/e2e
            framework: playwright
            config: tests/playwright.config.ts
            helpers:
              - name: chatPage
                description: "Playwright fixture that opens the Claude chat UI, submits a prompt, and reads the rendered reply"
      dependencies: []

vocabulary:
  actions:
    - name: "ask Claude"
      means: "write a prompt in Claude chat"

  forbidden_qualifiers:
    - properly
    - correctly
    - quickly

  forbidden_actions:
    - name: "handle"
      reason: "Hides what the system observably does with the input."
      replacement: "Name the observable action: displays, returns, lists, rejects."
