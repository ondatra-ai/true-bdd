# A test layer that does not say how to run itself must be refused, not
# run some other way.
#
# The engine used to carry a built-in invocation per framework
# (`go test -C <path> -json -count=1 ./...` and friends). That default
# is what this fixture exists to keep deleted: the spec here declares
# `commands.record` and `commands.live` but omits `commands.replay`, the
# one mode `build code` uses. If any fallback ever returns, the walk
# runs, finds the failing test the fixture plants, and both assertions
# below go red.
#
# The refusal must also land BEFORE the first subprocess: the fixture
# ships a real, runnable test package holding a failing test, so
# "reported no failures" cannot be confused with "had nothing to find".
#
# Companion to `build-code-commands-from-spec`, which proves the
# declared command is honoured when it IS present.
#
# Deliberately cheap: it exits before the first AI call, so unlike most
# fixtures it costs no model time.

cmd: build code

input: input

expected:
  # The load fails, the runner reports it, the CLI exits 1.
  exit_code: 1

  stdout_regex:
    # The refusal must be attributable on stdout, not only as a cobra
    # stderr line under a usage dump.
    - "Cannot start:"

    # It must name the key the host has to add. A refusal that says only
    # "invalid architecture" sends the reader hunting through a document
    # with two layers per service.
    - 'commands\.replay'

    # And it must name WHERE — service and layer both.
    - 'services\[calc\]'
    - 'quality_gate\.tests\.e2e'

  judge: |
    # Expectations for `true-bdd build code` with an incomplete commands: block

    The fixture's `docs/architecture/architecture.yaml` declares an e2e
    test layer with `framework: go-test` and a `commands:` block holding
    `record:` and `live:` but no `replay:`. `build code` runs the replay
    command, so the spec does not say how to run the only layer it
    declares. The engine must refuse at startup rather than fall back to
    an invocation of its own.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so every file the run created, modified or deleted
    appears in it. A path absent from the diff was not touched. Absence
    is therefore evidence.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.**
    2. The run aborted **before any test runner was spawned**. The log
       artifact `tmp/true-bdd.log.json` is included in the diff below;
       read it. It MUST contain **zero** records whose `msg` is
       `"Spawning test runner"`. This is the core assertion: the fixture
       plants a failing test at `tests/suite/`, so an engine that fell
       back to a built-in command would have found it. A run that
       spawned nothing did not fall back.
    3. The run aborted **before any AI turn was dispatched**:
       `tmp/true-bdd.log.json` contains zero records whose `msg` is
       `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone —
       `tmp/true-bdd.log.json` names the missing key, the service and
       the layer. Judge this ONLY on the diff below; the run's stdout is
       asserted separately by the harness and is not part of what you
       are given.

    ## What MUST NOT happen

    - The run MUST NOT have executed `record:` or `live:` in replay's
      place. Substituting a neighbouring mode is the same silent
      degradation as substituting a built-in default, and would show up
      as a `Spawning test runner` record in the log.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for rules 2, 3 and 4.
    - The exact wording of the error message is not fixed. Only the
      rules above matter.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
