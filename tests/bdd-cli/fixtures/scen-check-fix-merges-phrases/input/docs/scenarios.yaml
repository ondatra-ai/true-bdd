# Registry seed for `scen-check-fix-merges-phrases`.
#
# Two claimed Scenarios whose answer steps match two templates and bind
# one step definition between them. The fix changes the catalogue and
# must leave this file exactly as it is.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "One step definition two templates of the claimed scenarios reach"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-001-answers-pong
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the Operator sends "ping"
      then:
        - the service answers "pong"
  E2E-002:
    description: The service must answer a greeting with a greeting
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-002-answers-greeting
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the Client Developer sends "hi"
      then:
        - the service replies "hello"
