# The `build tests --fix` happy path: a scenario nothing executes must
# end the run with the code that executes it written down.
#
# The seed registry holds one scenario, INT-900, whose three steps bind
# to nothing — the suite that owns it has no `steps/` package at all.
# The walk finds every step unbound, the fix-generator and fix-applier
# author the definitions, the re-walk converges, the CLI exits 0.

input: input

# Three sequential model turns — validate, generate the fix, apply it —
# and the middle one is the expensive one: authoring a step definition
# means reading the suite's existing definitions and writing Go against
# their state type, not pasting a one-line spec. At the suite's 5m
# default the applier was killed mid-write with the fix prompt already
# on disk, which reads as "the applier wrote nothing" and is not.
timeout: 15m

answers: |
  1
  1
  1
  1
  1
  1
  1
  1

expected:
  judge: |
    # Expectations for `true-bdd build tests --fix`

    The seed registry (`input/docs/scenarios.yaml`) holds one scenario,
    `INT-900`, with three steps. `build tests`' contract is: every step
    of every registry scenario must bind to a step definition in the
    suite that owns it, and when one does not, `build tests --fix`
    writes it.

    Which suite owns it comes from
    `docs/architecture/architecture.yaml`: the
    `architecture.testing.suites[]` entry whose `service:` is
    `mcp-service` is named `mcp` and rooted at `tests/mcp`. So the
    definitions belong under `tests/mcp/steps/`.

    ## What MUST be true after the run

    1. The diff contains at least one **created** `.go` file under
       `tests/mcp/steps/`.
    2. Its content registers step definitions — at least one call whose
       shape is `suite.Step(` followed by a regexp literal and a
       function.
    3. The registered patterns between them cover all three of the
       scenario's steps:
       - "the MCP server is running on its configured port"
       - "the Claude User posts a valid JSON-RPC initialize request to /mcp"
       - "the server returns HTTP 200"
       A pattern may be parameterised (a capture group where the step's
       text varies); judge coverage by whether the pattern would match
       the step text, not by literal equality.

    ## What MUST NOT happen

    - The seed `docs/scenarios.yaml` MUST NOT be modified by the run.
    - No file is created outside `tests/` or the per-run `tmp/` scratch
      directory.

    ## Tolerances

    - The file name inside `tests/mcp/steps/`, the state type the
      functions take, and whether the definitions land in one file or
      several are all up to the implementation.
    - A definition whose body is a stub that returns nil is acceptable
      here: this fixture is about the binding existing, and `build code`
      is the command that makes it pass.
    - Files inside `tmp/` are scratch artifacts — ignore them.

    Reply `PASS` if all the MUST-be-true rules hold AND all the
    MUST-NOT-happen rules hold. Otherwise reply
    `FAIL: <one-sentence reason>` describing the first violation you
    find.
