# A story carried forward from the older `scenarios.test_scenarios[]`
# layout must be refused, and told what to convert.
#
# `us apply`'s own help text promises this rejection. Nothing tested it,
# so the promise was only a comment.
#
# The story here ships VALID acceptance criteria alongside the legacy
# block. That is deliberate: with both shapes present, only the
# deprecated-format check can fire, so this fixture pins the ORDER of
# the two checks as well as the message. A change that moved the
# empty-acceptance-criteria check ahead of it would produce a different
# refusal and go red here — which is the point, because the reader with
# a legacy story needs to be told about the legacy block, not handed a
# less specific complaint.
#
# Deliberately cheap: it exits before the first AI call.

cmd: us apply 95.5

input: input

expected:
  exit_code: 1

  stdout_regex:
    - 'US APPLY — Story 95\.5'
    - 'msg="Seeded scratch registry"'

    - 'Cannot start: .*story uses deprecated scenarios\.test_scenarios format'

    # The refusal must say what to do, not only what is wrong. This is
    # an upgrade path: the reader needs the target shape named.
    - 'us apply requires acceptance_criteria with embedded steps'

    - 'docs/product/stories/95\.5-legacy-test-scenarios\.yaml'

    - 'level=ERROR msg="Refusing to start" command="us apply"'

  judge: |
    # Expectations for `true-bdd us apply 95.5` on a legacy-format story

    The story carries a top-level `scenarios.test_scenarios[]` block —
    the layout `us apply` no longer accepts — alongside valid
    acceptance criteria. The run must refuse and name the deprecated
    format.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular `docs/scenarios.yaml` is byte-identical — the scratch
       copy seeded before the story was read must not be committed.
    2. **The story file is unmodified.** `us apply` must not silently
       migrate the legacy block to the new shape. Rewriting a user's
       story as a side effect of a command they ran to read it is a
       worse outcome than the refusal.
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. The legacy block is detectable
       structurally; no model is needed to see it.
    4. The failure is attributable from the log alone: a record names
       the story file and the deprecated format.

    ## What MUST NOT happen

    - The run MUST NOT walk the legacy `test_scenarios` entries as if
       they were acceptance criteria. Merging steps the engine no longer
       understands would put unreviewed content into the registry.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
