architecture:
  services:
    - name: frontend
      path: services/frontend
      language: typescript
      frameworks:
        - next.js
        - react

      patterns:
        component-composition:
          description: "Default React composition for Next.js App Router."
          rules:
            - "Use server components by default."
            - "Add 'use client' only when needed (hooks, browser APIs)."

      quality_gate:
        code:
          - name: typescript
            config: services/frontend/tsconfig.json
        tests:
          integration:
            path: tests/integration
            framework: playwright
            config: tests/playwright.config.ts
            # Run from the directory holding `config:` (here `tests/`),
            # so `npx` resolves this fixture's own Playwright install and
            # the paths below stay relative to it.
            commands:
              record: "npx playwright test --reporter=json --config playwright.config.ts integration"
              replay: "npx playwright test --reporter=json --config playwright.config.ts integration"
              live: "npx playwright test --reporter=json --config playwright.config.ts integration"

      dependencies: []
