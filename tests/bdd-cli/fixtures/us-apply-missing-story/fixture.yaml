# `us apply` on a story number that has no file must be refused, and the
# refusal must say what filename it looked for.
#
# The everyday cause is a typo, or running `us apply` before `us create`.
# Until now this path returned an error that reached only cobra's
# stderr, under a usage dump — the output shape for "you typed the flags
# wrong", not for "that story does not exist". Nothing reached stdout or
# the log, so neither a reader nor a harness could tell this apart from
# any other non-zero exit.
#
# A decoy story sits at 95.1 and a decoy registry at docs/scenarios.yaml,
# both unrelated. They are the controls: the engine must not fall back to
# "the only story it could find", and it must not touch the registry on
# the way out.
#
# Deliberately cheap: it exits before the first AI call.

cmd: us apply 95.4

input: input

expected:
  exit_code: 1

  stdout_regex:
    # The run got past every precondition and seeded its scratch copy —
    # so the only thing wrong is the story, not the config.
    - 'US APPLY — Story 95\.4'
    - 'msg="Seeded scratch registry"'

    # The refusal is on stdout, which is the only channel a replay
    # fixture can assert: the judge does not run in replay, and cobra's
    # stderr is never matched.
    - 'Cannot start: .*no story file found for story 95\.4'

    # Names the directory searched AND the filename shape expected. Those
    # two facts are what turn a refusal into an instruction.
    - 'in docs/product/stories \(expected format: 95\.4-<slug>\.yaml\)'

    - 'level=ERROR msg="Refusing to start" command="us apply"'

  judge: |
    # Expectations for `true-bdd us apply 95.4` with no such story

    The fixture ships a story at 95.1 and a non-empty registry, but
    nothing for 95.4. The run must refuse, name the file it looked for,
    and leave both decoys alone.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular `docs/scenarios.yaml` is unchanged — the run seeds a
       scratch copy of the registry before it reads the story, and a
       refusal must never commit that scratch copy back.
    2. **The decoy story `docs/product/stories/95.1-duplicate-collapse.yaml`
       is unmodified.** A run that fell back to "the only story present"
       would have walked it. This is the core assertion.
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. An empty diff alone cannot tell
       "refused at startup" apart from "walked and wrote nothing".
    4. The failure is attributable from the log alone: a record names
       story 95.4 and the directory that was searched.

    ## What MUST NOT happen

    - No story file was created. `us apply` reads stories; it never
      writes one to satisfy a missing id.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
