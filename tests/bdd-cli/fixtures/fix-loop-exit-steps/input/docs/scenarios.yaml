# Seed registry for the `fix-loop-exit-steps` BDD fixture.
#
# One scenario (INT-900) whose three steps bind to nothing: the suite that
# owns it, `mcp`, rooted at `tests/mcp` per
# docs/architecture/architecture.yaml, has no `steps/` package at all.
#
# `build tests --fix` renders the scenario's Go test, the walk finds every
# step unbound and proposes step definitions, and the person exits the fix
# loop at its first choice: no step definition is written, this file stays
# exactly as it is, and the walk ends unconverged.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-08-16"
  description: "Seed for fix-loop-exit-steps fixture"

scenarios:
  INT-900:
    description: "MCP /mcp endpoint responds 200 to a valid initialize POST"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    requirement: "fixture seed — expects `build tests` to write the step definitions"
    last_updated: "2026-08-16"
    user_stories:
      - story: "docs/product/stories/99.3-fixture.yaml"
        scenario_id: "99.3-001"
        merge_date: "2026-05-14"
    merged_steps:
      given:
        - "the MCP server is running on its configured port"
      when:
        - "the Claude User posts a valid JSON-RPC initialize request to /mcp"
      then:
        - "the server returns HTTP 200"
