# Registry seed for `scen-check-without-config`.
#
# A host project with a Registry, a product and an architecture document
# but no true-bdd/true-bdd.yaml: the Scenario's Given step leaves the
# engine's own copy out of the tree. Without its configuration the
# engine cannot know where any of these live, so it walks nothing.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-08-25"
  description: "One scenario the run never reaches"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong within 200 milliseconds
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories: []
    merged_steps:
      given:
        - the mcp service is running
      when:
        - a client sends a ping
      then:
        - the service answers pong
