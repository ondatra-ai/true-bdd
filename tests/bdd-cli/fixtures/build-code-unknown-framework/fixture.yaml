# A framework the engine cannot route to must be refused, not walked.
#
# `rspec` has no runner registered, so there is nothing for the suite's
# declared command to be run by. The refusal has to come before the walk
# prints its progress line and before any subprocess: "Running calc/e2e
# tests via rspec..." followed by a stderr traceback claims work that
# never started.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build code` with an unroutable framework

    The e2e suite declares `framework: rspec`, which no runner in the
    engine implements. The spec must be refused at startup.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules above.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.**
    2. The run aborted **before any test runner was spawned**. Read
       `tmp/true-bdd.log.json` in the diff below: it MUST contain zero
       records whose `msg` is `"Spawning test runner"`. The fixture
       plants a failing test at `tests/suite/`, so a run that fell back
       to some other invocation would have found it. A run that spawned
       nothing did not fall back.
    3. The run aborted **before any AI turn**: zero records whose `msg`
       is `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone — it names what
       was wrong with the spec.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
