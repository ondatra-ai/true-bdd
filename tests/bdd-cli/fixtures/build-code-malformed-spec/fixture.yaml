# A spec the loader cannot decode must be refused with the file named.
#
# The quiet failure here is a decode that half-succeeds: yaml.v3 fills
# what it can and leaves the rest zero-valued, so a swallowed parse
# error would produce an Architecture with no services, a walk over
# nothing, and a clean exit 0. The refusal has to name the file, because
# a parse error the reader cannot locate is one they cannot fix.
#
# Sibling of `build-code-no-services`, which covers the document that
# parses fine and declares nothing.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build code` with an undecodable spec

    The fixture's `docs/architecture/architecture.yaml` is not valid
    YAML: a mapping under `commands:` is interrupted by a sequence item.
    `build code` must refuse at startup, naming the file.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular the malformed spec itself is unchanged — the engine
       reads its documents, it does not repair them.
    2. The run aborted **before any test runner was spawned**. Read
       `tmp/true-bdd.log.json` in the diff below: zero records whose
       `msg` is `"Spawning test runner"`. The fixture plants a failing
       test at `tests/suite/`, so a run that shrugged off the parse
       error and walked anyway would have found it.
    3. The run aborted **before any AI turn**: zero records whose `msg`
       is `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone — it names the
       file that could not be parsed.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for rules 2, 3 and 4.
    - The exact wording of the parser's own message is not fixed.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
