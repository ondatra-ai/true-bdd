# A suite whose `service:` names no declared service must be refused.
#
# That name is the whole join between the two halves of the spec: it is
# what decides which source root a failure in this suite may be fixed
# in. Misspelled, it grants nothing — and the walk would still run the
# suite, discover the failure the fixture plants, and drive a fix loop
# with no writable root, arriving minutes later at "not fixed" for a
# reason the document could have stated before the first subprocess.
#
# The typo here is one letter (`calulator` for `calculator`), which is
# both how the mistake is actually made and why no reader catches it.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build code` with a suite naming an unknown service

    The spec's only suite declares `service: calulator`; the only
    declared service is `calculator`. The engine must refuse at startup
    rather than walk a suite whose failures it could not grant a fix
    root for.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.**
    2. The run aborted **before any test runner was spawned**. Read
       `tmp/true-bdd.log.json` in the diff below: it MUST contain zero
       records whose `msg` is `"Spawning test runner"`. The fixture
       plants a failing test at `tests/suite/`, so a run that walked the
       suite anyway would have found it.
    3. The run aborted **before any AI turn**: zero records whose `msg`
       is `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone — it names the
       suite and the service name that resolved to nothing.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
