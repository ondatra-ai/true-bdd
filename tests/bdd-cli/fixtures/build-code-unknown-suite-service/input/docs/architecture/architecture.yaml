# The suite's `service:` names nothing. `calulator` is one letter off
# `calculator`, which is exactly how this mistake is made and exactly why
# no reader spots it.
#
# The name is load-bearing: it is what tells `build code` which source
# root a failure in this suite may be fixed in. A name that resolves to
# no service grants no write root at all, so the walk would run the
# suite, find the planted failure, and drive a fix loop that can never
# land — minutes spent to arrive at "not fixed" for a reason the spec
# could have stated up front.

architecture:
  testing:
    suites:
      - name: e2e
        service: calulator
        path: tests
        framework: go-test
        commands:
          record: "go test -json -count=1 ./tests/suite/..."
          replay: "go test -json -count=1 ./tests/suite/..."
          live: "go test -json -count=1 ./tests/suite/..."

  services:
    - name: calculator
      path: services/calculator
      language: go
