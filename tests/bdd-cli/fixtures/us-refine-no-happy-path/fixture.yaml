cmd: us refine 96.4
input: input

# Walks the whole us-refine checklist — 12 sequential validation turns
# at 20-40s each on the `high` tier. That sits right on the suite's 5m
# default: this fixture was killed at 305s in one run and finished in
# 279s in the next, with nothing changed between them. The budget was
# the flake, not the fixture.
timeout: 10m

expected:
  exit_code: 0

  stdout_regex:
    - "Validation failed. Use --fix flag to enter interactive fix mode."
    - "REFINE COMPLETE"

  judge: |
    # Expectations for `us refine 96.4` (no happy-path AC)

    The story seed at `docs/prd/stories/96.4-summary-error-messages.yaml`
    contains three well-formed ACs that are ALL error scenarios
    (unshared document, timeout, empty document). No AC describes the
    primary success scenario, so the happy-path check must fail while
    the rest of the checklist is designed to pass.

    Expected behavior: the non-fix walk records the happy-path failure,
    prints the report and "Validation failed. Use --fix flag to enter
    interactive fix mode.", and exits 0 WITHOUT writing any story file.

    ## What MUST be true after the run

    1. NO file outside `tmp/` is created or modified. In particular
       `docs/prd/stories/96.4-summary-error-messages.yaml` is unchanged.
    2. Stdout contains the checklist report with at least one FAIL row
       and an Overall status that is not PASS.
    3. The happy-path check (the prompt asking whether at least one AC
       describes the happy path) reports FAIL.
    4. Stdout contains "Validation failed. Use --fix flag to enter
       interactive fix mode."

    ## What MUST NOT happen

    - No "ALL CHECKS PASSED!" banner.
    - No "Story saved to:" line.

    ## Tolerances

    - Other rows may occasionally fail on judge interpretation; do not
      fail the fixture over extra FAIL rows as long as the happy-path
      check is among the failures and nothing was written.
    - Files inside `tmp/` are scratch artifacts - ignore them.

    If all of the above hold, reply `PASS`. Otherwise reply
    `FAIL: <one-sentence reason>` describing the first violation you
    find.
