# Architectural spec for `build-code-directory-architecture`, inside the
# directory true-bdd.yaml declares as the spec itself.
#
# Valid, with a suite whose replay command passes: a run that guessed
# this file from the directory would spawn the suite and exit 0.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/suite/...
      replay: "go test -json -count=1 -run '^TestGreen$' ./tests/suite/..."
      live: go test -json -count=1 ./tests/suite/...
  services:
    - name: calc
      path: services/calc
      language: go
