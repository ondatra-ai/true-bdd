# A story file that is not valid YAML must be refused with the parser's
# own complaint, not a generic failure.
#
# The trigger is the commonest hand-edit that breaks a story: an
# unquoted colon-space inside an acceptance-criterion description,
# written by someone quoting a message the product displays. The quote
# marks around the message do not help, because the colon sits outside
# them.
#
# What makes this worth a fixture is the line number. "Failed to parse"
# sends the reader back to a document that looks fine to them; "line 32:
# mapping values are not allowed in this context" puts them on the line.
# That detail arrives on its own output line, which is why the patterns
# below are split.
#
# The refusal must NOT tell the user to run `us create`. The story is
# not missing — it is unparseable — and re-running `us create` would
# overwrite the file they are trying to repair. `us refine` used to
# attach that advice to every loader failure, so the assertion below
# pins the corrected wrapper as the evidence it was not reattached.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd us refine 96.9` on an unparseable story

    The story file carries an unquoted colon-space inside AC-2's
    description, so it is not valid YAML. The run must refuse and pass
    the parser's complaint through.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **The story file is unmodified.** A parse failure must never
       truncate, rewrite or "repair" the document it could not read.
       `us refine` rewrites stories in the normal case, which is exactly
       why a failed read must not reach the write path — a half-parsed
       story written back would destroy the user's work.
    2. **No file was created or modified anywhere outside `tmp/`.**
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. Invalid YAML is detectable without a
       model, and a prompt built from a half-read story would be worse
       than no prompt.
    4. The failure is attributable from the log alone: a record names
       the file and carries the YAML parser's own error text.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
