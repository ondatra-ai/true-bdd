# `us refine` on a story that was never created must be refused, and the
# refusal must tell the user which command makes the file.
#
# This is the commonest ordering mistake in the workflow: `us refine`
# before `us create`. It is also the one refusal in this family whose
# advice is correct — see the sibling fixtures, where the same sentence
# is attached to failures it does not describe.
#
# A decoy story sits at 96.1. It is the control: the engine must not
# fall back to "the only story it could find".
#
# Deliberately cheap: it exits before the first AI call.

cmd: us refine 96.9

input: input

expected:
  exit_code: 1

  stdout_regex:
    # The run got past the document checks — product.yaml and
    # architecture.yaml are both shipped — so the story is the only
    # thing missing.
    - 'US REFINE — Story 96\.9'

    # The loader's own record. This family already logged before the
    # refusal helper existed; pinning it keeps a future refactor from
    # quietly dropping the structured fields.
    - 'level=ERROR msg="No story file found" story_number=96\.9 pattern=docs/product/stories/96\.9-\*\.yaml'

    # The refusal on stdout, with the advice that makes it actionable.
    - 'Cannot start: .*run `true-bdd us create 96\.9` first'

    # Names the directory searched and the filename shape expected.
    - 'no story file found for story 96\.9 in docs/product/stories'
    - '\(expected format: 96\.9-<slug>\.yaml\)'

    - 'level=ERROR msg="Refusing to start" command="us refine"'

  judge: |
    # Expectations for `true-bdd us refine 96.9` with no such story

    The fixture ships the two documents the us-refine checklist declares
    and a decoy story at 96.1, but nothing for 96.9. The run must refuse
    and point at `us create`.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular no story file was written under
       `docs/product/stories/` — `us refine` reads and rewrites an
       existing story; it never creates one to satisfy a missing id.
    2. **The decoy story `docs/product/stories/96.1-document-summary-refined.yaml`
       is unmodified.** A run that fell back to "the only story present"
       would have refined it. This is the core assertion.
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. An empty diff alone cannot tell
       "refused at startup" apart from "walked and wrote nothing".
    4. The failure is attributable from the log alone: a record names
       story 96.9 and the glob pattern that matched nothing.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
