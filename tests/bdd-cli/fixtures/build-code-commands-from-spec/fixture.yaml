# `build code` must run the command its architectural spec declares —
# and specifically the `replay` one.
#
# The suite's suite holds two tests, TestGreen and TestRed, in a single
# package. Only `commands.replay` carries the `-run '^TestGreen$'` filter
# that keeps TestRed out of scope; `record` and `live` name the
# unfiltered command on purpose. So there are four distinct ways for the
# engine to be wrong, and every one of them discovers TestRed and turns
# the assertions below red:
#
#   - inventing its own invocation (the pre-`commands:` behaviour, which
#     walked `./...` under the suite's path)
#   - dropping the quoted `-run` argument while splitting the command
#   - ignoring the `-run` filter but honouring the package selector
#   - selecting the record or live command instead of replay
#
# Deliberately cheap: the run discovers zero failing tests, so the walk
# has zero items, so no checklist cell exists and no AI call is made.
# The fixture costs nothing to replay and nothing to record beyond the
# judge's own turn.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build code` with a spec-declared command

    The fixture seeds a host project whose architectural spec declares
    one service `calc` with an e2e test suite, `framework: go-test`, and
    a `commands:` block naming a command line per AI-dependency mode.

    The suite's package `tests/suite/` holds two tests:
    - `TestGreen`, which passes.
    - `TestRed`, which fails unconditionally.

    Only `commands.replay` filters the suite down to TestGreen with
    `-run '^TestGreen$'`. `build code` must run THAT command, verbatim,
    and therefore must discover zero failing tests.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree. A path absent from it was not touched, so absence is
    evidence.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** The
       run has no failing test to fix and was invoked without `--fix`,
       so it must write nothing at all.
    2. The engine spawned the spec's replay command. The log artifact
       `tmp/true-bdd.log.json` is included in the diff below; read it.
       It MUST contain a `Spawning test runner` record whose `args`
       include BOTH `-run` and `^TestGreen$`. A record whose args lack
       the filter means the engine ran an invocation the spec did not
       declare.
    3. The run made **no AI call**: `tmp/true-bdd.log.json` contains
       zero records whose `msg` is `"Dispatching AI turn"`. With zero
       failing tests there is no checklist cell to evaluate, and a turn
       dispatched anyway means items were discovered that should not
       have been.

    ## What MUST NOT happen

    - `tmp/true-bdd.log.json` MUST NOT contain a `Spawning test runner`
      record for the unfiltered command (args ending in
      `./tests/suite/...` with no `-run`). That is the `record` / `live`
      command; running it means `build code` selected the wrong mode.
    - No file under `tests/`, `docs/` or `true-bdd/` is modified.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for rules 2 and 3.
    - Go's build cache and any `go.sum` the toolchain may write are
      toolchain side effects, not something the run decided to do.

    Reply `PASS` if all three rules hold and neither MUST-NOT does.
    Otherwise reply `FAIL: <one-sentence reason>` naming the first
    violation.
