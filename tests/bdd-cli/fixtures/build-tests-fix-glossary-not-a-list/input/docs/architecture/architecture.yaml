# Architectural spec for `build-tests-fix-glossary-not-a-list`.
#
# Sound: the word mapping maps every word the catalogue's phrases
# declare. Nothing in it is why the run is refused.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/mcp/... -mode=record
      replay: go test -json -count=1 ./tests/mcp/... -mode=replay
      live: go test -json -count=1 ./tests/mcp/...
  services:
    - name: mcp-service
      path: services/mcp-service
      language: go
  terms:
    - term: MCP server
      technical: >-
        The mcp-service process, listening on 127.0.0.1 at the port the
        MCP_PORT environment variable names, 7411 when it is unset. It
        answers GET /healthz with 200 once it is ready.
      observed_by: >-
        Resolve the address from MCP_PORT, 7411 when it is unset, and poll
        GET /healthz there until it answers 200, for at most 5 seconds. A
        server that never answers fails the step, naming the address it
        polled.
    - term: session
      technical: >-
        Opened by a JSON-RPC 2.0 request whose method is initialize,
        POSTed to /mcp with Content-Type application/json. The server's
        reply to it is the session's opening.
      observed_by: >-
        POST {"jsonrpc":"2.0","id":1,"method":"initialize"} to /mcp at the
        server's address and keep the reply's status code and headers for
        the steps after. A Then step that finds no reply fails instead of
        passing.
    - term: ticket
      technical: >-
        The X-Session-Ticket header of the reply to initialize: 32
        lowercase hexadecimal characters. A reply without it opened no
        session, whatever its status.
      observed_by: >-
        Read the X-Session-Ticket header of the last reply. It must be 32
        lowercase hexadecimal characters on a 200 reply; a missing or
        malformed ticket fails, naming the status and the header value
        the reply carried.
    - term: protocol version
      technical: >-
        The X-MCP-Protocol header of the reply to initialize, a date in
        YYYY-MM-DD form, such as 2025-06-18.
      observed_by: >-
        Read the X-MCP-Protocol header of the last reply. It must be a
        date in YYYY-MM-DD form; a missing or malformed value fails,
        naming what the reply carried.
