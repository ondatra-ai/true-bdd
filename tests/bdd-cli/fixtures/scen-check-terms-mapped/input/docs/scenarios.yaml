# Registry seed for `scen-check-terms-mapped`.
#
# A claimed scenario whose every declared term is mapped, an unclaimed
# one relying on an unmapped term, and a claimed one relying on none.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "Three scenarios the term-mapping check passes"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-001-answers-pong
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the Operator sends "ping"
      then:
        - the service answers "pong"
  E2E-002:
    description: The service must answer a ping after it restarts
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories: []
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the service restarts
        - and: the Operator sends "ping"
      then:
        - the service answers "pong"
  E2E-003:
    description: The project must stay silent while nothing runs
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-002-silent-when-idle
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - nothing is running
      when:
        - the Operator waits 5 seconds
      then:
        - nothing is answered
