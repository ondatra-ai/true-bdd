# Seed registry for the `build-tests-hand-written-test-kept` BDD fixture.
#
# Two scenarios. tests/mcp/session_test.go was generated from an older
# registry and is stale; tests/mcp/ticket_test.go, which INT-902's
# `path:` names, is hand-written and carries no generated marker.
# `build tests --fix` must refuse to overwrite ticket_test.go, and must
# not rewrite session_test.go either.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-hand-written-test-kept fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/session_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
  INT-902:
    description: "A Claude User's ticket is granted within the session's limit"
    service: "mcp-service"
    path: "tests/mcp/ticket_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 5 seconds"
