# Two files claiming the same epic number must be refused, not silently
# resolved by taking the first glob match.
#
# What splitting an epic and forgetting to renumber leaves behind. The
# two files here BOTH define a story 92.1, and they define different
# work — so "take the first match" would not merely pick a file, it
# would extract a story the user did not ask for, with nothing in the
# output saying which one it chose.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd us create 92.1` with two epic-92 files

    The fixture ships two files claiming epic 92, each defining a
    different story 92.1. The run must refuse and name both.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created under `docs/product/stories/`.** This is the
       core assertion. Both epics define a story 92.1 describing
       different work, so an engine that picked one would have written a
       story the user may not have meant, and the output would not say
       which source it came from.
    2. **Neither epic file was modified.** No file was created or
       modified anywhere outside `tmp/`.
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone: a record names
       epic 92 and both colliding paths.

    ## What MUST NOT happen

    - The engine MUST NOT choose between the two files by any rule —
      first match, newest mtime, most stories. Ambiguity in the input is
      the user's to resolve.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
