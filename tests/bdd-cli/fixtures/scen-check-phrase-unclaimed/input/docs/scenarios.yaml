# A claimed scenario the catalogue phrases, and an unclaimed one it does not.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "One claimed scenario and one no Story claims"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-001-answers-pong
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the Operator sends "ping"
      then:
        - the service answers "pong"
  E2E-002:
    description: The service must answer a ping within 200 milliseconds
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories: []
    merged_steps:
      given:
        - the mcp service is running
      when:
        - the Operator sends "ping"
      then:
        - the service answers within 200 milliseconds
