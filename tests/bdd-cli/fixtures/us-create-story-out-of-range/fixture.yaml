# Asking for a story index the epic does not have must be refused with
# both numbers in the message.
#
# `us create 94.7` against an epic holding two stories. Everything else
# is right: the epic file is found, it parses, the story number is
# well-formed. Only the index is wrong — so the refusal has to say what
# was asked for AND what exists, or the reader cannot tell whether they
# mistyped the story or the epic.
#
# Note `us-create-missing-document` refuses EARLIER, at the checklist
# document check, which is why it never reaches this loader. This is the
# first fixture to exercise the epic loader at all.
#
# Deliberately cheap: it exits before the first AI call.

cmd: us create 94.7

input: input

expected:
  exit_code: 1

  stdout_regex:
    # The run got past the document check — product.yaml is shipped — so
    # the epic loader is genuinely what failed.
    - 'US CREATE — Story 94\.7'

    # LINE 1 of the refusal. The diagnosis is on the NEXT line because
    # the errors are joined with a newline, and Go's `.` does not cross
    # one — a single pattern spanning both would never match.
    - 'Cannot start: failed to load items: failed to load story:'

    # LINE 2: the actionable half. Both numbers, so the reader can see
    # at a glance that 7 > 2.
    - 'story index 7 out of bounds for epic 94 \(has 2 stories\)'

    - 'level=ERROR msg="Refusing to start" command="us create"'

  judge: |
    # Expectations for `true-bdd us create 94.7` on a two-story epic

    The epic file is found and parses; it holds two stories and the run
    asked for the seventh. The run must refuse and name both the index
    and the count.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created under `docs/product/stories/`.** This is the
       core assertion: an engine that clamped the index, wrapped around,
       or fell back to the last story would have written a story file
       for work nobody asked for.
    2. **No file was created or modified anywhere outside `tmp/`.** In
       particular the epic file is unchanged.
    3. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. Counting stories needs no model.
    4. The failure is attributable from the log alone: a record names
       the index requested, the epic, and how many stories it has.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
