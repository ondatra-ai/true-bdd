# Registry seed for `scen-check-phrase-closed`.
#
# One claimed scenario, every step phrased by exactly one template; the
# llm: and judge: steps a model runs are exempt.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-21"
  description: "One claimed scenario every step of which the catalogue phrases"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong within 200 milliseconds and log no error
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories:
      - story: docs/product/stories/ping-answers.yaml
        scenario_id: ping-001-answers-pong
        merge_date: "2026-10-21"
    merged_steps:
      given:
        - the mcp service is running
        - and: 'llm: the Operator warms the cache'
      when:
        - the Client Developer sends "ping"
      then:
        - the service answers "pong" within 200 milliseconds
        - and: the service logged no errors
        - and: the service accepts the request
        - and: 'the reply matches ^pong( \(cached\))?$'
        - and: 'the reply body is {}'
        - and: 'judge: the reply reads as a greeting'
