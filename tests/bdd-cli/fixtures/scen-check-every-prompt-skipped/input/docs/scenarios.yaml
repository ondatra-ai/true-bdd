# Registry seed for `scen-check-every-prompt-skipped`.
#
# Non-empty on purpose: the refusal under test is the checklist whose
# every Prompt is parked, raised in the validation phase before the
# registry is ever loaded. An empty registry would raise a different one.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "One scenario the run never reaches"

scenarios:
  E2E-001:
    description: The service must answer a ping with a pong within 200 milliseconds
    service: mcp-service
    path: tests/mcp/ping_test.go
    user_stories: []
    merged_steps:
      given:
        - the mcp service is running
      when:
        - a client sends a ping
      then:
        - the service answers pong
