# Story seed for the `us-refine-step-outside-catalogue` BDD fixture.
#
# AC-1's steps each match one catalogue phrase of the fixture's product
# document. AC-2's last then step matches none, and AC-3's given step
# matches only the `when` phrase, so the step-phrase check fails this
# Story and spares every model check.

story:
    id: doc-outline
    title: Document Outline On Demand
    as_a: Claude User
    i_want: Claude to list the headings of a shared Google Doc when I ask for its outline
    so_that: I can see how the document is organised before I read it
    status: PLANNED
    acceptance_criteria:
        - id: AC-1
          description: Claude must display every heading of a shared Google Doc, in document order, when the Claude User asks for its outline.
          steps:
            - given:
                - a Google Doc with 3 headings is shared with the Claude User
            - when:
                - the Claude User asks Claude to outline the document
            - then:
                - Claude displays an outline of 3 headings
        - id: AC-2
          description: Claude must display the message "This document has no headings" when the Claude User asks for the outline of a document without headings.
          steps:
            - given:
                - a Google Doc with no headings is shared with the Claude User
            - when:
                - the Claude User asks Claude to outline the document
            - then:
                - Claude displays the message "This document has no headings"
                - and: Claude offers to summarise the document instead
        - id: AC-3
          description: Claude must display the same outline again when the Claude User asks for the outline of a document a second time.
          steps:
            - given:
                - a Google Doc with 3 headings is shared with the Claude User
                - and: the Claude User asks Claude to outline the document
            - when:
                - the Claude User asks Claude to outline the document
            - then:
                - Claude displays an outline of 3 headings
