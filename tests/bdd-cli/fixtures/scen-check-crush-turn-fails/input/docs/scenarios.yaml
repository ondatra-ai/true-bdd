# Registry seed for `scen-check-crush-turn-fails`.
#
# One Scenario for the walk's first validation turn to be about. That
# turn never gets an answer: the tier it resolves to names a model id the
# crush CLI does not know, so the CLI exits non-zero and the run stops.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "One scenario whose validation turn fails"

scenarios:
  E2E-001:
    description: The greeter must greet the person whose name it is given
    service: greeter
    path: tests/greeter/greet_test.go
    user_stories: []
    merged_steps:
      given:
        - the greeting is configured
      when:
        - the Operator runs the greeter with a name
      then:
        - the greeter greets that person
