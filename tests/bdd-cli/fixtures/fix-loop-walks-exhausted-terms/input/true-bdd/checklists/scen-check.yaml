# Fixture checklist for `fix-loop-walks-exhausted-terms`.
#
# The step-phrase check alone, with a fix that proposes its catalogue entry
# straight away, under a budget of one walk: the fix is applied and the
# Scenario re-checked, but the re-walk that would confirm it is the second
# attempt, which the budget does not allow.

version: "1.0"
last_updated: "2026-10-22"

config:
  max_apply_attempts: 1

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every step of a Scenario a Story claims must match exactly one catalogue phrase."
    validation_prompts:
      - D: step-phrases
        rationale: "A step outside the catalogue has no stated meaning, so no step definition follows from the spec."
        docs:
          - product
        F: "Propose one catalogue entry (template, block, means, terms) for the failing step, without asking first. Write it to the product document, never to the Scenario."
