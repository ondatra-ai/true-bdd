# A registry that is valid YAML but the wrong SHAPE must be refused
# with the decoder's own complaint, not a generic parse failure.
#
# `scenarios:` is written as a sequence rather than a map keyed by
# scenario id. Nothing is syntactically wrong — the file loads as YAML
# and only fails when the decoder tries to put a list into a map. That
# is the mistake a host actually makes by hand, because every other list
# in the doc universe is a sequence and these entries carry their own
# `id:`.
#
# The refusal has to name the file AND the shape mismatch: "failed to
# parse" alone sends the reader back to a document that looks fine.
#
# Deliberately cheap: it exits before the first AI call.

cmd: build tests

input: input

expected:
  exit_code: 1

  stdout_regex:
    - 'BUILD TESTS'

    # LINE 1 of the refusal. It ends at the colon because the YAML
    # decoder starts its detail on the NEXT line — Go's `.` does not
    # match a newline, so a single pattern spanning both would never
    # match however correct the run.
    - 'Cannot start: .*failed to parse requirements registry .*docs/scenarios\.yaml: yaml: unmarshal errors:'

    # LINE 2: the shape mismatch itself, which is the actionable half.
    # Stops at `map[string]` so renaming the unexported DTO behind it
    # cannot break this fixture for a reason nobody cares about.
    - 'cannot unmarshal !!seq into map\[string\]'

    - 'level=ERROR msg="Refusing to start" command="build tests"'

  judge: |
    # Expectations for `true-bdd build tests` against a mis-shaped registry

    The fixture ships a `docs/scenarios.yaml` whose `scenarios:` block is
    a sequence rather than a map keyed by scenario id. It is well-formed
    YAML, so the failure surfaces only in the decoder. The run must
    refuse and say what shape it could not accept.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular `docs/scenarios.yaml` is unchanged — a parse failure
       must never rewrite, truncate or "repair" the document it could
       not read — and no test file was authored under `tests/` or
       `services/`.
    2. The run aborted **before any AI turn was dispatched**: zero
       records in `tmp/true-bdd.log.json` whose `msg` is
       `"Dispatching AI turn"`. A malformed registry is detectable
       without a model, so reaching one would mean the engine sent a
       prompt built from a document it had failed to parse.
    3. The failure is attributable from the log alone: a record names
       the registry path and carries the decoder's own error.

    ## What MUST NOT happen

    - The run MUST NOT skip the unreadable entries and walk the rest.
      A registry it cannot decode is a refusal, not a partial walk —
      silently covering some scenarios would report a coverage figure
      computed from a document nobody validated.

    Reply `PASS` if all three hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
