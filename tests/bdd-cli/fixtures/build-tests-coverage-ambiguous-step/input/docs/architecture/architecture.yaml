# Architectural spec for the fixture host project.
#
# It declares NO coverage command, and there is no such key to declare:
# the engine resolves which steps bind by reading tests/mcp/steps/
# itself. Narrowing here is what proves that.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/mcp/... -mode=record
      replay: go test -json -count=1 ./tests/mcp/... -mode=replay
      live: go test -json -count=1 ./tests/mcp/...
  services:
    - name: mcp-service
      path: services/mcp-service
      language: go
