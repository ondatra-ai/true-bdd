# Seed registry for the `build-tests-fix-default-write-roots` BDD fixture.
#
# One scenario (INT-900) whose three steps bind to nothing: the suite
# that owns it, `mcp`, rooted at `tests/mcp` per
# docs/architecture/architecture.yaml, has no `steps/` package at all.
#
# This fixture's true-bdd.yaml names no `paths.test_write_globs`, so the
# apply turn that authors the step definitions under `tests/mcp/steps/`
# may write only under the engine's default roots, `./tests/**` and
# `./services/**`.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-fix-default-write-roots fixture"

scenarios:
  INT-900:
    description: "MCP /mcp endpoint responds 200 to a valid initialize POST"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    last_updated: "2026-10-22"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running on its configured port"
      when:
        - "the Claude User posts a valid JSON-RPC initialize request to /mcp"
      then:
        - "the server returns HTTP 200"
