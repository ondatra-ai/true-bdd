# One Go service with one e2e layer. All three commands are identical
# and carry -json, so the layer-command pre-pass passes and the walk
# actually runs — unlike the build-code-* refusal fixtures, this one is
# meant to get all the way through.
#
# `path: services/calc` is also the applier's write root: the fix turn
# may edit production source there and nothing else. That is what makes
# "never modifies tests" enforceable by the spec rather than by asking.

architecture:
  services:
    - name: calc
      path: services/calc
      language: go

      quality_gate:
        tests:
          e2e:
            path: tests
            framework: go-test
            commands:
              record: "go test -json -count=1 ./tests/suite/..."
              replay: "go test -json -count=1 ./tests/suite/..."
              live: "go test -json -count=1 ./tests/suite/..."
