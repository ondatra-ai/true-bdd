# After a fix is applied, `build code` must re-run THE TEST IT FIXED —
# not the whole suite.
#
# That narrowing has never been exercised. Until this fixture, the only
# `build code --fix` fixture in the suite was the Playwright one, whose
# webServer fails to boot; it therefore always takes the startup-marker
# path, which re-runs everything by design because there is no test name
# to filter on. The named path — split the framework-native id, build a
# `-run '^Name$'` filter, re-run just that — was dead code in every
# framework.
#
# THE ASSERTION IS THE CANARY, NOT THE EXIT CODE. `tests/suite/canary_test.go`
# passes, so discovery never walks it, and it appends one line to
# `tests/suite/suite-runs.log` every time the whole suite runs. Discovery
# runs the suite once, so a correctly narrowed rerun leaves ONE line; a
# rerun that dropped the filter leaves TWO. That difference lands in the
# golden tree and is caught byte-for-byte in replay, with no model
# involved.
#
# Exit code alone cannot see it: an unfiltered rerun would also find the
# target passing and report success. This fixture would then prove the
# loop converges, which was never in doubt, instead of proving it
# narrowed, which is the thing that was untested.
#
# The planted defect is in PRODUCTION source (`calc.Add` subtracts). The
# assertion is right and the code is wrong, so a fix that edited the test
# would be the failure this command exists to prevent — pinned by the
# judge and by the architecture's write root, which grants the applier
# `services/calc` and nothing else.

cmd: build code --fix

input: input

answers: |
  1
  1
  1
  1
  1
  1

expected:
  exit_code: 0

  stdout_regex:
    # Discovery ran the layer under the command the spec declares and
    # found exactly one failure — the canary passed and was never walked.
    - 'Running calc/e2e tests via go-test'
    - '1 failure\(s\) in calc/e2e'
    - 'Total failing tests across architecture: 1'

    # THE LOAD-BEARING LINE. It is printed immediately before RunOne, so
    # its presence is what proves the run reached the named-rerun path at
    # all rather than converging some other way.
    - 'Fix applied — re-running this test in isolation'

    - 'BUILD CODE COMPLETE'

  judge: |
    # Expectations for `true-bdd build code --fix` re-running one named test

    The fixture plants a defect in production source: `calc.Add` returns
    `a - b`. `tests/suite/add_test.go` asserts `Add(2, 3) == 5` and fails.
    A second test, `TestCanaryRecordsEachSuiteRun`, passes and appends one
    line to `tests/suite/suite-runs.log` every time the whole suite runs.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for rule 4.
    - The exact form of the production edit is up to the applier. Any
      change making `Add` return the sum satisfies rule 1.

    ## What MUST be true after the run

    1. **`services/calc/calc.go` is modified so `Add` returns the sum**
       of its arguments.
    2. **No file under `tests/` was modified.** Neither `add_test.go` nor
       `canary_test.go` may be edited, and no assertion may be weakened,
       skipped or deleted. The failing assertion is the specification;
       repairing the test instead of the code is the precise failure
       `build code` exists to prevent.
    3. **`tests/suite/suite-runs.log` exists and contains EXACTLY ONE
       line.** This is the core assertion. Discovery ran the whole suite
       once. The post-fix rerun must have been narrowed to the failing
       test by name, so the canary did not run again. **Two lines means
       the rerun executed the whole suite** — the regression this fixture
       exists to raise.
    4. `tmp/true-bdd.log.json` records a test-runner spawn for the
       post-fix rerun whose arguments include a `-run` filter naming
       `TestAddSumsItsArguments`. This is the direct evidence for rule 3.
    5. `docs/architecture/architecture.yaml` is unmodified.

    ## What MUST NOT happen

    - No write anywhere outside `services/calc/` and the canary log.
    - The test MUST NOT be rewritten to accept the wrong answer.

    Reply `PASS` if all five hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
