# Fixture checklist for `scen-check-fix-records-phrase`.
#
# The step-phrase check alone, with the fix that closes it: a step no
# catalogue entry phrases gets one, asked about first and written to the
# product document, never to the Scenario.

version: "1.0"
last_updated: "2026-10-21"

sections:
  - id: term_closure
    name: "Term Closure"
    description: "Every step of a Scenario a Story claims must match exactly one catalogue phrase."
    validation_prompts:
      - D: step-phrases
        rationale: "A step outside the catalogue has no stated meaning, so no step definition follows from the spec."
        docs:
          - product
        F: "Propose one catalogue entry (template, block, means, terms) for the failing step, asking what it means first. Write it to the product document, never to the Scenario."
