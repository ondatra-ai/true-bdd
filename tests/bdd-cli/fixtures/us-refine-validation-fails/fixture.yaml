cmd: us refine 96.3
input: input

# Walks the whole us-refine checklist — 12 sequential validation turns
# at 20-40s each on the `high` tier — because it asserts the run
# reports failures at the END rather than aborting early. That is ~5m
# of unavoidable model time, past the suite's 5m default.
timeout: 10m

expected:
  exit_code: 0

  stdout_regex:
    - "Validation failed. Use --fix flag to enter interactive fix mode."
    - "REFINE COMPLETE"

  judge: |
    # Expectations for `us refine 96.3` (validation fails, no fix)

    The story seed at
    `docs/product/stories/96.3-summary-service-internals.yaml` is deliberately
    defective: it has only 2 acceptance criteria, AC-1 describes
    internal implementation (storage updates) rather than observable
    behavior, there are no error-scenario ACs, no measurable criteria,
    and AC-2 ("feel pleasant", "read smoothly") is subjective with no
    objective test oracle.

    Expected behavior: the non-fix walk evaluates every prompt, records
    the failures, prints the report and "Validation failed. Use --fix
    flag to enter interactive fix mode.", and exits 0 WITHOUT writing
    any story file.

    ## What MUST be true after the run

    1. NO file outside `tmp/` is created or modified. In particular
       `docs/product/stories/96.3-summary-service-internals.yaml` is unchanged.
    2. Stdout contains the checklist report with at least one FAIL row
       and an Overall status that is not PASS.
    3. Stdout contains "Validation failed. Use --fix flag to enter
       interactive fix mode."
    4. The AC-count check reports a count of 2 (outside the 3-7 range)
       as a failure.

    ## What MUST NOT happen

    - No "ALL CHECKS PASSED!" banner.
    - No "Story saved to:" line.
    - No interactive fix prompts (the command ran without --fix).

    ## Tolerances

    - The exact set of failing prompts beyond the AC-count check may
      vary with judge interpretation; do not fail the fixture over
      which specific rows failed as long as at least one FAIL row is
      present and nothing was written.
    - Files inside `tmp/` are scratch artifacts - ignore them.

    If all of the above hold, reply `PASS`. Otherwise reply
    `FAIL: <one-sentence reason>` describing the first violation you
    find.
