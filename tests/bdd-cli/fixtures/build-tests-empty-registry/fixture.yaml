# A registry that parses but holds no scenarios must be refused, never
# walked to a trivial success.
#
# This is the state every host is in before its first `us apply`: the
# seed file exists, `documents.scenarios_yaml` points at it, and
# `scenarios:` is empty. A walk over zero items converges immediately
# and reports that every scenario has an executable test — which is
# vacuously true and exactly the wrong answer to give someone who just
# asked whether their specs are covered.
#
# Distinct from `build-tests-unconfigured-registry`, which covers the
# registry PATH being unset and is refused a layer earlier, in the cmd
# document resolver. Here the path resolves and the file loads; it is
# the CONTENT that cannot be walked. Keeping `documents.scenarios_yaml`
# configured is what holds the two apart.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build tests` against an empty registry

    The fixture ships a configured, well-formed `docs/scenarios.yaml`
    whose `scenarios:` map is empty. The command walks scenarios, so
    there is nothing to walk. It must refuse rather than converge on
    zero items and report success.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.** In
       particular no test file was authored under `tests/` or
       `services/`, and `docs/scenarios.yaml` is unchanged.
    2. The run aborted **before any AI turn was dispatched**. Read
       `tmp/true-bdd.log.json` in the diff below: it MUST contain zero
       records whose `msg` is `"Dispatching AI turn"`. An empty output
       diff alone cannot tell "refused at startup" apart from "walked
       zero items and had nothing to write" — which is the precise
       failure this fixture exists to catch.
    3. The failure is attributable from the log alone: a record names
       the registry path and says it has no scenarios to walk.

    ## What MUST NOT happen

    - The run MUST NOT report success. A converged verdict over an empty
      registry is a false green: it answers "is every scenario covered?"
      with "yes" when the honest answer is "there are no scenarios".

    Reply `PASS` if all three hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
