# An architectural spec with an empty services list. Syntactically
# valid, semantically nothing: there is no service for a fix to write
# into, so `build code` has no scope at all.
#
# The failure mode this guards is the quiet one — a walk over zero
# services converges trivially and reports success, so an empty spec
# would read as "all tests pass" rather than "you declared nothing".
#
# The suite below is complete and would run: the services check has to
# come first, or a spec with tests and no source would walk a suite
# whose failures no fix could be pointed at.

architecture:
  testing:
    suites:
      - name: e2e
        service: calc
        path: tests
        framework: go-test
        commands:
          record: "go test -json -count=1 ./tests/suite/..."
          replay: "go test -json -count=1 ./tests/suite/..."
          live: "go test -json -count=1 ./tests/suite/..."

  services: []
