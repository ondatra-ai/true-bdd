# An architectural spec that declares no test suites must be refused,
# not walked to a trivial success.
#
# `architecture.testing:` is the whole of how a repository says its
# tests run. Absent, there is no command to execute — and a walk over
# zero suites discovers zero failing tests, converges, prints BUILD CODE
# COMPLETE and exits 0. "You declared no tests" would read as "every
# test passes", which is the one wrong answer that looks like the right
# one.
#
# Sibling of `build-code-no-services`: same emptiness, other half of the
# document.
#
# Deliberately cheap: it exits before the first AI call.

input: input

expected:
  judge: |
    # Expectations for `true-bdd build code` with no testing section

    The spec declares one service and no `architecture.testing.suites`.
    `build code` must refuse rather than converge trivially over nothing.

    ## How to read the diff

    The diff below is EXHAUSTIVE: a before/after comparison of the whole
    working tree, so a path absent from it was not touched. Absence is
    evidence.

    ## Tolerances

    - Files inside `tmp/` are scratch artifacts. Ignore their presence
      entirely — EXCEPT `tmp/true-bdd.log.json`, whose CONTENT is the
      evidence for the rules below.
    - The exact wording of the error message is not fixed.

    ## What MUST be true after the run

    1. **No file was created or modified anywhere outside `tmp/`.**
    2. The run aborted **before any test runner was spawned**. Read
       `tmp/true-bdd.log.json` in the diff below: it MUST contain zero
       records whose `msg` is `"Spawning test runner"`. The fixture
       plants a failing test at `tests/suite/`, so a run that invented
       an invocation of its own would have found it. A run that spawned
       nothing did not invent one.
    3. The run aborted **before any AI turn**: zero records whose `msg`
       is `"Dispatching AI turn"`.
    4. The failure is attributable from the log alone — it names what
       was wrong with the spec.

    Reply `PASS` if all four hold. Otherwise reply
    `FAIL: <one-sentence reason>` naming the first violation.
