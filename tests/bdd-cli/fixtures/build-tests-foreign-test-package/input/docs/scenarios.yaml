# Seed registry for the `build-tests-foreign-test-package` BDD fixture.
#
# One scenario rendered into tests/mcp/, a directory whose hand-written
# tests/mcp/support_test.go still declares `package mcpserver_test`,
# while the directory's name derives `mcp_test`.

metadata:
  title: "Test Requirements Registry (BDD fixture seed)"
  version: "2.0"
  last_updated: "2026-10-22"
  description: "Seed for build-tests-foreign-test-package fixture"

scenarios:
  INT-901:
    description: "A Claude User opening a session at the MCP server is granted a ticket"
    service: "mcp-service"
    path: "tests/mcp/mcp_test.go"
    user_stories: []
    merged_steps:
      given:
        - "the MCP server is running"
      when:
        - "the Claude User opens a session"
      then:
        - "the session is granted a ticket within 2 seconds"
