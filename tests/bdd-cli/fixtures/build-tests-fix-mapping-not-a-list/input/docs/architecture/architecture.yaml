# Architectural spec for `build-tests-fix-mapping-not-a-list`.
#
# `architecture.terms:` holds one string where a list of mappings
# belongs, so no word a phrase declares can be looked up in it.

architecture:
  testing:
    framework: go-test
    commands:
      record: go test -json -count=1 ./tests/mcp/... -mode=record
      replay: go test -json -count=1 ./tests/mcp/... -mode=replay
      live: go test -json -count=1 ./tests/mcp/...
  services:
    - name: mcp-service
      path: services/mcp-service
      language: go
  # DELIBERATELY WRONG: a string, not a list of mappings.
  terms: "MCP server, session, ticket, protocol version"
