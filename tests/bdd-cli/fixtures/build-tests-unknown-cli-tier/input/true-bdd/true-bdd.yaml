engine:
  # Three named tiers. A checklist asks for a tier by name; this table
  # decides which CLI runs it and with which model, so retargeting a
  # role at a different provider is a config edit, not a code change.
  #
  # Value format: "<cli>:<model>". Split on the FIRST colon only.
  #   cli   — claude | crush | codex (each must be on $PATH)
  #   model — passed through verbatim to that CLI's model flag
  models:
    xhigh: "claude:claude-fable-5"
    high: "claude:claude-opus-4-8"
    # DELIBERATELY BROKEN: `aider` is not a supported cli. The
    # engine must refuse to start rather than quietly running
    # this tier on some other model.
    coder: "aider:whatever"
  # Tier per AI role, used when neither a prompt nor its checklist names
  # one. A checklist overrides any of these in its own `engine:` block.
  default_prompt_model: high
  default_fix_model: high
  default_apply_model: coder

epics:
  path: "./docs/prd/epics"

