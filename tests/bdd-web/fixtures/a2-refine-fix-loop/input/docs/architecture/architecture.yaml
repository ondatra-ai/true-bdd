# Architectural spec for the A2 refine fixture. Only the PRD is read by
# the single filtered rule-based-description prompt; the rest keeps the
# host project complete for the inventory.

architecture:
  services:
    - name: mcp-service
      path: services/mcp
      language: go
      frameworks:
        - net/http
      quality_gate:
        tests:
          integration:
            path: tests/integration
            framework: jest
            config: tests/jest.config.ts
            helpers:
              - name: McpClient
                description: "Typed JSON-RPC client that posts requests to the MCP endpoint and returns parsed responses"
          e2e:
            path: tests/e2e
            framework: playwright
            config: tests/playwright.config.ts
            helpers:
              - name: chatPage
                description: "Playwright fixture that opens the Claude chat UI, submits a prompt, and reads the rendered reply"
      dependencies: []

vocabulary:
  actions:
    - name: "ask Claude"
      means: "write a prompt in Claude chat"
  forbidden_qualifiers:
    - properly
    - correctly
    - seamless
    - fast
  forbidden_actions:
    - name: "handle"
      reason: "Hides what the system observably does with the input."
      replacement: "Name the observable action: displays, returns, lists, rejects."
