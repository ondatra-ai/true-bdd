# Architecture for the A6 build-code fixture. ONE service `calculator`
# with an e2e test layer whose framework is `go-test` and whose path is
# the Go module root services/calculator. build-code runs
# `go test -C services/calculator ./...` to discover failing tests.
architecture:
  services:
    - name: calculator
      path: services/calculator
      language: go
      quality_gate:
        tests:
          e2e:
            path: services/calculator
            framework: go-test
