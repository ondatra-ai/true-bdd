# Config for markdownlint-cli, driven by scripts/lint-markdown.sh.
# The three rules below are off because this repository breaks them by
# design: they were 445 of the 493 findings a default sweep returned, and
# every one of the 445 is cosmetic. Everything else markdownlint ships is on.
default: true

# Long lines are the house style. CLAUDE.md is the one 80-column file and it
# has its own gate (scripts/lint-claude.md.sh), which is why it is excluded.
MD013: false

# Table pipe spacing: the corpus is 58 compact to 3 aligned. Reflowing a table
# that already reads fine is exactly the churn Surgical Changes forbids.
MD060: false

# Every hit was a Claude Code file whose frontmatter (`paths:`, `description:`)
# precedes the prose — the format's shape, not a missing heading.
MD041: false
