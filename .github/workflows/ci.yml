name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamale
        run: pip install yamale

      - name: Lint document schemas
        run: ./scripts/lint-schemas.sh

      - name: Lint CLAUDE.md
        run: ./scripts/lint-claude.md.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: mkdir -p ./bin && go build -o ./bin/true-bdd ./services/bdd-cli

      - name: Test
        run: go test ./...

      # `go vet ./...` and golangci-lint both skip the bdd-tagged tree, so
      # without this a generated `Testfoo` compiles, is never run by
      # `go test`, and still satisfies every coverage check.
      - name: Vet the BDD tree
        run: go vet -tags bdd ./tests/...

      - name: BDD fixtures (replay)
        run: go test -tags bdd -timeout=20m ./tests/bdd-cli/ -mode=replay

      # Web suite guard only (no node/browser/build; answers in ms) — the
      # suite itself stays manual. TestStepCoverage stays OUT: only 4 of
      # 244 scenarios' steps bind — adding it would make this job UNSATISFIABLE, not just fail it.
      #	~1680 unbound steps across those 243 would block EVERY PR, not just
      #	the port's. Land it here and in gates.sh's matching line: ClickUp 86cb6fjwy.
      - name: BDD web coverage guards
        run: go test -tags bdd -count=1 -run '^TestScenarioCoverage$' ./tests/bdd-web/
