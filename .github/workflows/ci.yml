name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamale
        run: pip install yamale

      - name: Validate document schemas
        run: ./scripts/validate-schemas.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: mkdir -p ./bin && go build -o ./bin/true-bdd ./services/bdd-cli

      - name: Test
        run: go test ./...
