name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamale
        run: pip install yamale

      # Pinned: brew swapped markdownlint-cli for cli2 under a running branch
      # and the gate broke silently. ubuntu-latest ships Node, so no setup step.
      - name: Install markdownlint-cli2
        run: npm i -g markdownlint-cli2@0.23.2

      - name: Install alint
        run: npm i -g @asamarts/alint@0.15.2

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      # eslint is a devDependency of the frontend, so the gate cannot reach it
      # until the tree is installed. Absent, `alint` would report the leaf
      # missing rather than the code clean.
      - name: Install the frontend
        run: npm --prefix services/bdd-web ci

      # ONE call, so the gate list lives in exactly one place —
      # scripts/gates/table.go. Adding a gate there reaches CI for free.
      - name: Gates
        run: go run ./scripts/cmd/gates run
