name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamale
        run: pip install yamale

      - name: Validate document schemas
        run: ./scripts/validate-schemas.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: mkdir -p ./bin && go build -o ./bin/true-bdd ./services/bdd-cli

      - name: Test
        run: go test ./...

      # The BDD fixtures, replayed from their committed cassettes. No
      # model is spawned and no agent CLI is needed, which is what makes
      # this runnable in CI at all — the live suite costs real money and
      # tens of minutes, and stays manual.
      #
      # This is the only CI step that watches the engine run end to end.
      # A stale-cassette failure (exit 86) means a prompt or template
      # changed without the fixtures being re-recorded; a golden mismatch
      # means the run produced different files than the recording.
      # `go vet ./...` and golangci-lint both skip the bdd-tagged tree,
      # so without this the suite shims, the TestMain bootstraps and
      # every generated test file go unchecked — including a generated
      # function named `Testfoo`, which compiles, never runs, and still
      # satisfies every coverage check.
      - name: Vet the BDD tree
        run: go vet -tags bdd ./tests/...

      - name: BDD fixtures (replay)
        run: go test -tags bdd -timeout=20m ./tests/bdd-cli/ -mode=replay

      # The web suite's guard, and only its guard: every bdd-web scenario
      # has a generated test. It needs no node, no build and no browser,
      # so it answers in milliseconds — the suite itself stays manual.
      #
      # TestStepCoverage is deliberately NOT here yet: tests/bdd-web/steps
      # registers four definitions against 244 scenarios, so it reports
      # ~1680 unbound steps and would make this job unsatisfiable rather
      # than failing — blocking every PR in the repo, not just the port's
      # own. Add it back here, and to the matching line in
      # .claude/skills/pr-commit/gates.sh, in the change that lands the
      # web step definitions: https://app.clickup.com/t/86cb6fjwy
      - name: BDD web coverage guards
        run: go test -tags bdd -count=1 -run '^TestScenarioCoverage$' ./tests/bdd-web/
