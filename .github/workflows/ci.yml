name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: mkdir -p ./bin && go build -o ./bin/true-bdd ./src

      - name: Test
        run: go test ./...

      - uses: actions/setup-node@v6
        with:
          node-version-file: harness/.nvmrc
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Harness install
        run: npm ci
        working-directory: harness

      - name: Harness lint
        run: npm run lint
        working-directory: harness

      - name: Harness typecheck
        run: npm run typecheck
        working-directory: harness

      - name: Harness unit tests
        run: npm run test:unit
        working-directory: harness

      - name: Harness production build
        run: npm run build
        working-directory: harness
