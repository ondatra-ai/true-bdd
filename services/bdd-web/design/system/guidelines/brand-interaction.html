<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--white-999)}.sw{display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:10px;font:var(--type-caption);font-size:11px;line-height:1.35}.sw b{font-weight:700;display:block}.row{display:grid;gap:0}</style></head><body><div style="display:flex;gap:0;font:var(--type-button);text-transform:uppercase;letter-spacing:var(--ls-button)">

<div style="border:1px solid var(--black-999);margin-left:-1px;background:#fff;color:var(--black-999);padding:20px 28px">Hover — inverted</div>
<div style="border:1px solid var(--black-999);margin-left:-1px;background:#fff;color:var(--black-999);padding:20px 28px;transform:translateY(1px)">Press — 1px down</div>
<div style="border:1px solid var(--black-999);margin-left:-1px;background:var(--black-999);color:#fff;padding:20px 28px;opacity:.35">Disabled 35%</div></div>
